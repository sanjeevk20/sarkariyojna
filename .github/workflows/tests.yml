name: Tests

# Runs on every pull request (and on main) so a change that breaks a checker, a guide, the map or a
# pilot tool shows a red check before it goes live. Locally:
#   python3 -m unittest discover tests
#   python3 docs/site/build_site.py && node tests/browser_test.js
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Data and tool tests
        run: python3 -m unittest discover tests -v

      - name: Build the site
        run: |
          pip install beautifulsoup4==4.12.3
          python3 docs/site/build_site.py

      - name: Browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/browser_test.js docs/site/dist/index.html
