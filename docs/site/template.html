<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --leaf: #82c48e; --leaf-soft: #1e3122; --on-leaf: #0f1a11;
  --you: #91b5f0; --you-soft: #1a2537; --gov: #bba4ea; --gov-soft: #251e35; --done: #82c48e; --done-soft: #1e3122;
  --haldi: #e6b65c; --haldi-soft: #2e2514; --stop: #f29b90; --stop-soft: #351b18; color-scheme: dark; } }
:root[data-theme="dark"] {

  --leaf: #82c48e; --leaf-soft: #1e3122; --on-leaf: #0f1a11;
  --you: #91b5f0; --you-soft: #1a2537; --gov: #bba4ea; --gov-soft: #251e35; --done: #82c48e; --done-soft: #1e3122;
  --haldi: #e6b65c; --haldi-soft: #2e2514; --stop: #f29b90; --stop-soft: #351b18; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }

:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; border-radius: 6px; }
.gutter { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--leaf); color: var(--on-leaf); padding: 10px 14px; border-radius: 8px; z-index: 20; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }
h1, h2 { font-family: var(--display); text-wrap: balance; line-height: 1.3; }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .gutter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand b { font-family: var(--display); font-size: 20px; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle { display: flex; gap: 4px; background: var(--raised); padding: 4px; border-radius: 999px; flex: none; }
.toggle button { font: 500 15px var(--body); min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }

/* Home */
.intro { padding-block: 28px 8px; }
.intro .eyebrow, .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); margin: 0; }
.intro h1 { font-size: clamp(28px, 5vw, 42px); margin: 6px 0 8px; max-width: 22ch; }
.intro p.lead { color: var(--muted); font-size: 18px; max-width: 62ch; margin: 0; }
.tools { display: grid; gap: 12px; padding-block: 18px 6px; }
.search { position: relative; max-width: 520px; }
.search input { width: 100%; font: 17px var(--body); min-height: 48px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }

.count { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
.filter { display: grid; gap: 6px; }
.flabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rhead { font-size: 15px; margin: 10px 0 6px; } .rhead:first-child { margin-top: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 16px 56px; }

.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
.card-link { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s; }
.card-link:hover { border-color: var(--leaf); transform: translateY(-2px); }
.card-link h2 { font-size: 19px; margin: 2px 0 0; }
.card-link .mrn { color: var(--muted); font-size: 15px; }
.card-link .for { font-size: 15px; margin-top: 6px; }
.card-link .meta { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.side { display: grid; gap: 16px; align-content: start; }
.side section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.side h2 { font-size: 17px; margin: 0 0 8px; }
.side ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 15px; }
.legend-list { list-style: none; padding: 0 !important; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.dot.you { background: var(--you); } .dot.gov { background: var(--gov); } .dot.done { background: var(--done); }

/* Post */
.post { max-width: 760px; padding-block: 20px 56px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 500; text-decoration: none; }
.post h1 { font-size: clamp(26px, 4.6vw, 38px); margin: 6px 0 4px; }
.post .mrn { color: var(--muted); margin: 0; font-size: 17px; }
.benefit { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--leaf-soft); font-size: 18px; font-weight: 500; }
.post-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); margin-top: 12px; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; padding: 0; list-style: none; }
.toc button { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.post h2 { font-size: 23px; margin: 36px 0 12px; scroll-margin-top: 80px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); margin-bottom: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.phase { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 0 0 52px; }
.step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start; }
.num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: var(--on-leaf); font-variant-numeric: tabular-nums; }
.you .num { background: var(--you); } .gov .num { background: var(--gov); } .done .num { background: var(--done); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.gov .scard { background: var(--gov-soft); } .done .scard { background: var(--done-soft); }
.who { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scard h3 { font-size: 19px; margin: 0 0 4px; line-height: 1.35; }
.sbody ul { margin: 4px 0 0; padding-left: 20px; }
.status { font-family: ui-monospace, monospace; font-size: 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.note { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 16px; }
.note.stuck { background: var(--stop-soft); } .note.stuck b.nl { color: var(--stop); }
.note.tip { background: var(--haldi-soft); } .note.tip b.nl { color: var(--haldi); }
.box { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.box h3 { margin: 0 0 4px; font-size: 18px; color: var(--stop); }
.box.help { background: var(--haldi-soft); }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.links li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.links .what { min-width: 0; flex: 1 1 240px; }
.links a { font-weight: 700; overflow-wrap: anywhere; }
.links .lbl { display: block; font-size: 15px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.tag.g { background: var(--leaf-soft); color: var(--leaf); } .tag.x { background: var(--haldi-soft); color: var(--haldi); }
.small { font-size: 14px; color: var(--muted); }
.diagram { overflow-x: auto; background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: #1c281e; }
.diagram svg { display: block; margin: 0 auto; height: auto; min-width: 560px; max-width: 100%; }
.diagram pre { white-space: pre; font-size: 13px; margin: 0; }
.sources { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 15px; }
.sources a { overflow-wrap: anywhere; }
.cta { display: grid; gap: 2px; margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: var(--leaf); color: var(--on-leaf); text-decoration: none; max-width: 560px; }
.cta.big { margin-top: 20px; padding: 14px 18px; } .cta.big b { font-size: 18px; } .cta span { font-size: 15px; opacity: .9; }
.check fieldset { border: 0; padding: 0; margin: 22px 0 0; min-width: 0; }
.check legend { font-family: var(--display); font-weight: 700; font-size: 19px; margin-bottom: 10px; padding: 0; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--leaf); flex: none; }
.opt span { display: grid; min-width: 0; } .opt small { color: var(--muted); font-size: 13px; }

.when input, .ck-fields input { font: 17px var(--body); min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); max-width: 100%; }
.verdict { margin: 24px 0 0; padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 18px; }
.verdict.ok { background: var(--done-soft); color: var(--done); } .verdict.info { background: var(--you-soft); color: var(--you); }
.verdict.warn { background: var(--haldi-soft); color: var(--haldi); } .verdict.bad { background: var(--stop-soft); color: var(--stop); }

.ck-complaint { margin-top: 20px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); }
.ck-complaint h2 { margin: 0 0 12px; font-size: 20px; }
.ck-fields { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 12px; }
.ck-fields label { display: grid; gap: 4px; font-size: 15px; font-weight: 500; min-width: 0; }

.ck-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }

.trust { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 10px 0 0; }
.feedback { margin-top: 36px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); }
.feedback h2 { margin: 0 0 10px; font-size: 19px; }
.vote { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.vote button { font: 500 16px var(--body); min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.vote button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.report { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.report.emph { background: var(--stop-soft); color: var(--stop); padding: 0 14px; border-radius: 10px; text-decoration: none; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
.pager a { display: block; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); }
.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.foot .gutter { padding-block: 18px 28px; }
@media (max-width: 520px) { .brand span { display: none; } .toggle { gap: 2px; } .toggle button { padding: 0 7px; font-size: 13px; } .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

const plang = p => state.lang === "en" ? "en" : p.local;
const guide = p => state.lang === "en" ? p.en : p.loc;
const title = p => state.lang === "en" ? p.title : p.local_name;
const altTitle = p => state.lang === "en" ? p.local_name : p.title;
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

const inState = p => state.st === "all" || p.state === state.st;
function matches(p) {
  if (!inState(p)) return false;
  if (state.cat !== "all" && p.cat !== state.cat) return false;
  if (!state.q) return true;
  const hay = [p.title, p.local_name, p.audience, p.en.h1, p.loc.h1, catName(p.cat), stateName(p.state)].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function cardHTML(p) {
  const u = UI[state.lang];
  return `<li><a class="card-link" href="#${p.slug}">
    <p class="eyebrow">${esc(stateName(p.state))} · ${esc(catName(p.cat))}</p>
    <h2 lang="${plang(p)}">${esc(title(p))}</h2>
    <span class="mrn" lang="${state.lang === "en" ? p.local : "en"}">${esc(altTitle(p))}</span>
    <span class="for"><b>${u.forw}:</b> ${esc(p.audience)}</span>
    <span class="meta"><span>${u.steps(p.en.steps.length)}</span><span>${u.links(p.links.length)}</span></span>
  </a></li>`;
}

function chipsHTML(kind, items, current) {
  return items.map(c => `<button type="button" class="chip" data-${kind}="${c.id}" aria-pressed="${c.id === current}">${esc(c.label)}<span class="n">${c.n}</span></button>`).join("");
}

function renderFilters() {
  const u = UI[state.lang];
  const states = [{ id: "all", label: u.allStates, n: POSTS.length },
    ...DATA.states.map(s => ({ id: s.id, label: s[state.lang], n: POSTS.filter(p => p.state === s.id).length }))];
  const pool = POSTS.filter(inState);
  const cats = [{ id: "all", label: u.all, n: pool.length },
    ...DATA.cats.map(c => ({ id: c.id, label: c[state.lang], n: pool.filter(p => p.cat === c.id).length })).filter(c => c.n)];
  if (!cats.some(c => c.id === state.cat)) state.cat = "all";
  $("#state-chips").innerHTML = chipsHTML("st", states, state.st);
  $("#cat-chips").innerHTML = chipsHTML("cat", cats, state.cat);
  document.querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", () => {
    state.st = b.dataset.st; save("sathi-state", state.st); renderFilters(); renderCards(); renderRouters();
  }));
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    state.cat = b.dataset.cat; renderFilters(); renderCards();
  }));
}

function renderCards() {
  const list = POSTS.filter(matches), u = UI[state.lang];
  $("#cards").innerHTML = list.length ? list.map(cardHTML).join("") : `<li class="empty">${u.none}</li>`;
  $("#count").textContent = u.shown(list.length);
}

function renderRouters() {
  const ids = state.st === "all" ? DATA.states.map(s => s.id) : [state.st];
  $("#routers").innerHTML = ids.map(id => `${ids.length > 1 ? `<h3 class="rhead">${esc(stateName(id))}</h3>` : ""}<ul>${DATA.routers[id].map(r => `<li>${r}</li>`).join("")}</ul>`).join("");
}

function stepsHTML(g) {
  return g.steps.map((s, i) => `${s.phase ? `<li class="phase" aria-hidden="true">${esc(s.phase)}</li>` : ""}
    <li class="step ${s.kind}"><span class="num" aria-hidden="true">${i + 1}</span><div class="scard">
      <span class="who">${esc(s.who)}</span><h3><span class="sr-only">${i + 1}. </span>${esc(s.title)}</h3>
      <div class="sbody">${s.body}</div>
      ${s.note ? `<p class="note ${s.note.kind}"><b class="nl">${esc(s.note.label)}</b> ${s.note.html}</p>` : ""}
    </div></li>`).join("");
}

function renderPost(p) {

  const links = p.links.map(l => `<li><span class="what">${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : `<b>${esc(l.label.split(":").slice(1).join(":").trim() || l.label)}</b>`}<span class="lbl">${esc(l.label)}</span></span>
      <span class="tag ${l.gov ? "g" : "x"}">${l.gov ? u.gov : u.third}</span></li>`).join("");

  $("#main").innerHTML = `
  <article class="gutter"><div class="post">
    <a class="back" href="#">← ${u.back}</a>

    <h1 id="post-title" tabindex="-1" lang="${L}">${esc(g.h1)}</h1>
    <p class="mrn" lang="${state.lang === "en" ? p.local : "en"}">${esc(altTitle(p))}</p>
    <p class="benefit" lang="${L}">${g.benefit}</p>
    <div class="post-meta"><span><b>${u.forw}:</b> ${esc(p.audience)}</span><span>${u.steps(g.steps.length)}</span>${p.verified ? `<span>${FB[state.lang].checkedOn(fmtDate(p.verified))}</span>` : ""}</div>
    ${TRK[p.slug] ? `<a class="cta" href="#check-${p.slug}"><b>${CK[state.lang].ctaPost} →</b></a>` : ""}
    <ul class="toc">${[["s-steps", u.tocSteps], ["s-links", u.tocLinks], ["s-flow", u.tocFlow], ["s-src", u.tocSrc]].map(([id, t]) => `<li><button type="button" data-go="${id}">${t}</button></li>`).join("")}</ul>

    <section lang="${L}">
      <h2 id="s-steps" tabindex="-1">${u.hSteps}</h2>
      <div class="legend">${["you", "gov", "done"].map((k, j) => `<span><i class="dot ${k}"></i>${u.lg[j]}</span>`).join("")}</div>
      <ol class="steps">${stepsHTML(g)}</ol>

    <section>
      <h2 id="s-links" tabindex="-1">${u.hLinks}</h2>
      <ul class="links">${links}</ul>
      <p class="trust"><span class="tag ${govN === p.links.length ? "g" : "x"}">${govN}/${p.links.length}</span> ${FB[state.lang].trust(govN, p.links.length)}</p>
      <p class="small">${u.linksNote}</p>
    </section>

    <section>
      <h2 id="s-flow" tabindex="-1">${u.hFlow}</h2>
      <p class="small">${u.flowNote}</p>
      <div class="diagram" id="diagram" role="img" aria-label="${esc(u.hFlow)}: ${esc(p.title)}"><p class="small">${u.flowLoading}</p></div>
    </section>

    <section>
      <h2 id="s-src" tabindex="-1">${u.hSrc}</h2>
      <ol class="sources">${sources}</ol>
      <p class="small">${u.srcNote}</p>
    </section>

    <section class="feedback" aria-labelledby="fb-title">
      <h2 id="fb-title">${FB[state.lang].fbTitle}</h2>
      <div class="vote" role="group" aria-label="${FB[state.lang].fbQ}">
        <span>${FB[state.lang].fbQ}</span>
        <button type="button" id="vote-yes" data-vote="yes" aria-pressed="false">${FB[state.lang].yes}</button>
        <button type="button" id="vote-no" data-vote="no" aria-pressed="false">${FB[state.lang].no}</button>
      </div>
      <p id="fb-msg" class="small" aria-live="polite"></p>
      <a id="fb-report" class="report" href="${esc(reportURL(p))}" target="_blank" rel="noopener">${FB[state.lang].report} ↗</a>
      <p class="small">${FB[state.lang].reportNote}</p>
    </section>

    <nav class="pager" aria-label="${u.prev} / ${u.next}">
      ${prev ? `<a class="prev" href="#${prev.slug}"><small>← ${u.prev}</small>${esc(title(prev))}</a>` : ""}
      ${next ? `<a class="next" href="#${next.slug}"><small>${u.next} →</small>${esc(title(next))}</a>` : ""}
    </nav>
  </div></article>`;
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.go); t.scrollIntoView({ block: "start" }); t.focus({ preventScroll: true });
  }));
  document.title = `${p.title} · Sathi Yojana Guides`;
  drawDiagram(p);
  wireFeedback(p);
}

const svgCache = {};
let mermaidReady = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (!mermaidReady) mermaidReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" }); res(window.mermaid); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return mermaidReady;
}
async function drawDiagram(p) {
  const show = html => { const b = document.getElementById("diagram"); if (b && location.hash.slice(1) === p.slug) b.innerHTML = html; };
  if (svgCache[p.slug]) return show(svgCache[p.slug]);
  try {
    const m = await loadMermaid();
    const { svg } = await m.render("flow-" + p.slug.replace(/[^a-z0-9]/g, ""), p.mermaid);
    svgCache[p.slug] = svg; show(svg);
  } catch (e) {
    show(`<p class="small">${UI[state.lang].flowFail}</p><pre>${esc(p.mermaid)}</pre>`);
  }
}

    mean: "ಇದರ ಅರ್ಥ", next: "ಈಗ ಏನು ಮಾಡಬೇಕು", vDone: "ಪೂರ್ಣ", vAct: "ನೀವು ಏನಾದರೂ ಮಾಡಬೇಕು", vStuck: "ನಿಮ್ಮ ಕೆಲಸ ಸಿಲುಕಿದೆ",
    vWait: d => `ಕಾಯುವುದು ಸಾಮಾನ್ಯ. ${d} ದಿನಗಳ ನಂತರ ಮತ್ತೆ ಪರಿಶೀಲಿಸಿ.`, vWaitAsk: n => `${n} ದಿನಗಳವರೆಗೆ ಕಾಯುವುದು ಸಾಮಾನ್ಯ. ತಡವಾಗಿದೆಯೇ ನೋಡಲು ಮೇಲೆ ದಿನಾಂಕ ನಮೂದಿಸಿ.`,
    vWaitPlain: "ಈ ಹಂತದಲ್ಲಿ ಕಾಯುವುದು ಸಾಮಾನ್ಯ.", vLate: (d, n) => `${d} ದಿನಗಳಾಗಿವೆ. ${n} ದಿನಗಳಿಗಿಂತ ಹೆಚ್ಚು ಎಂದರೆ ತುಂಬಾ ತಡ, ನೀವು ದೂರು ನೀಡಬಹುದು.`,
    cTitle: "ನಿಮ್ಮ ದೂರು, ಕಳುಹಿಸಲು ಸಿದ್ಧ", fName: "ನಿಮ್ಮ ಹೆಸರು", fApp: "ಅರ್ಜಿ / ನೋಂದಣಿ ಸಂಖ್ಯೆ", fMobile: "ಮೊಬೈಲ್ (ಐಚ್ಛಿಕ)",
    copy: "ದೂರು ನಕಲಿಸಿ", copied: "ನಕಲಿಸಲಾಗಿದೆ", copyFail: "ಇಲ್ಲಿ ನಕಲಿಸಲು ಆಗಲಿಲ್ಲ. ಪಠ್ಯ ಆಯ್ಕೆಯಾಗಿದೆ: ದೀರ್ಘವಾಗಿ ಒತ್ತಿ ನಕಲಿಸಿ.", where: "ಎಲ್ಲಿಗೆ ಕಳುಹಿಸಬೇಕು",
    privacy: "ನೀವು ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡುವುದು ನಿಮ್ಮ ಫೋನಿನಿಂದ ಹೊರಗೆ ಹೋಗುವುದಿಲ್ಲ. ಆಧಾರ್ ಅಥವಾ ಬ್ಯಾಂಕ್ ಸಂಖ್ಯೆಯನ್ನು ಸಾರ್ವಜನಿಕವಾಗಿ ಹಾಕಬೇಡಿ.", readGuide: "ಪೂರ್ಣ ಮಾರ್ಗದರ್ಶಿ ಓದಿ",
    ph: { app: "[ಅರ್ಜಿ ಸಂಖ್ಯೆ]", name: "[ನಿಮ್ಮ ಹೆಸರು]", mobile: "-", date: "[ದಿನಾಂಕ]", days: "[ಸಂಖ್ಯೆ]" } },
};
const TRK = Object.fromEntries(DATA.trackers.map(t => [t.guide, t]));
const ck = { slug: null, stage: null, date: "", name: "", app: "", mobile: "" };
// Switching scheme clears what belongs to the old application; name and mobile are kept.
const resetFor = slug => { if (ck.slug !== slug) Object.assign(ck, { slug, stage: null, date: "", app: "" }); };
const tl = t => state.lang === "en" ? "en" : "loc";          // tracker text key
const tLang = t => state.lang === "en" ? "en" : t.local;      // language code of tracker text
const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m);

function verdict(t, s) {
  const c = CK[state.lang], days = ck.date ? Math.floor((Date.now() - new Date(ck.date + "T00:00:00")) / 86400000) : null;
  const late = s.follow_up != null && days != null && days > s.follow_up;
  if (s.kind === "done") return { cls: "ok", text: c.vDone, complain: false, days };
  if (s.kind === "stuck") return { cls: "bad", text: c.vStuck, complain: true, days };
  if (late) return { cls: "bad", text: c.vLate(days, s.follow_up), complain: true, days };
  if (s.kind === "act") return { cls: "warn", text: c.vAct, complain: false, days };
  if (s.follow_up == null) return { cls: "info", text: c.vWaitPlain, complain: false, days };
  if (days == null) return { cls: "info", text: c.vWaitAsk(s.follow_up), complain: false, days };
  return { cls: "info", text: c.vWait(Math.max(1, s.follow_up - days)), complain: false, days };
}

function draft(t, s, v) {
  const c = CK[state.lang], k = tl(t), p = BY[t.guide];
  return fill(DATA.bodies[tLang(t)], {
    to: t.complaint.to[k], subject: t.complaint.subject[k], scheme: state.lang === "en" ? p.title : p.local_name,
    app: ck.app || c.ph.app, date: ck.date ? fmtDate(ck.date) : c.ph.date, days: v.days != null ? v.days : c.ph.days,
    status: s.status[k], ask: t.complaint.ask[k], name: ck.name || c.ph.name, mobile: ck.mobile || c.ph.mobile,
    today: new Date().toLocaleDateString(LOCALE[state.lang], { day: "numeric", month: "short", year: "numeric" }) });
}

function renderResult() {
  const box = $("#ck-result"), t = TRK[ck.slug];
  const s = t && t.stages.find(x => x.id === ck.stage);
  if (!s) { box.innerHTML = ""; return; }
  const c = CK[state.lang], k = tl(t), L = tLang(t), v = verdict(t, s);
  box.innerHTML = `
    <p class="verdict ${v.cls}" role="status">${esc(v.text)}</p>
    <div class="ck-card" lang="${L}"><h3>${c.mean}</h3><p>${esc(s.meaning[k])}</p><h3>${c.next}</h3><p>${esc(s.next[k])}</p></div>
    ${v.complain ? `<section class="ck-complaint" aria-labelledby="ck-c-title">
      <h2 id="ck-c-title">${c.cTitle}</h2>
      <div class="ck-fields">
        <label for="ck-name">${c.fName}<input id="ck-name" autocomplete="name" value="${esc(ck.name)}"></label>
        <label for="ck-app">${c.fApp}<input id="ck-app" autocomplete="off" value="${esc(ck.app)}"></label>
        <label for="ck-mobile">${c.fMobile}<input id="ck-mobile" inputmode="tel" autocomplete="tel" value="${esc(ck.mobile)}"></label>
      </div>
      <textarea id="ck-draft" lang="${L}" rows="14" readonly aria-label="${esc(c.cTitle)}"></textarea>
      <div class="ck-actions"><button type="button" id="ck-copy">${c.copy}</button><span id="ck-copied" class="small" aria-live="polite"></span></div>
      <h3>${c.where}</h3><p lang="${L}">${esc(t.complaint.where[k])}</p>
      <p class="small">${c.privacy}</p>
    </section>` : ""}
    <p><a href="#${t.guide}">${c.readGuide} →</a></p>`;
  if (!v.complain) return;
  const update = () => { $("#ck-draft").value = draft(t, s, v); };
  [["#ck-name", "name"], ["#ck-app", "app"], ["#ck-mobile", "mobile"]].forEach(([sel, key]) =>
    $(sel).addEventListener("input", e => { ck[key] = e.target.value.trim(); update(); }));
  update();
  $("#ck-copy").addEventListener("click", () => {
    const ta = $("#ck-draft"), done = m => { $("#ck-copied").textContent = m; };
    const fallback = () => { ta.focus(); ta.select(); done(c.copyFail); };
    try { navigator.clipboard.writeText(ta.value).then(() => done(c.copied), fallback); } catch (e) { fallback(); }
  });
}

function renderStages() {
  const box = $("#ck-stages"), t = TRK[ck.slug], c = CK[state.lang];
  if (!t) { box.innerHTML = `<p class="small">${c.pick}</p>`; $("#ck-when").hidden = true; renderResult(); return; }
  const k = tl(t);
  if (!t.stages.some(s => s.id === ck.stage)) ck.stage = null;
  box.innerHTML = `<fieldset><legend>${c.s2}</legend><div class="opts" lang="${tLang(t)}">${t.stages.map(s =>
    `<label class="opt"><input type="radio" name="ck-stage" value="${s.id}"${s.id === ck.stage ? " checked" : ""}><span>${esc(s.status[k])}</span></label>`).join("")}</div></fieldset>`;
  $("#ck-when").hidden = false;
  box.querySelectorAll("input[name=ck-stage]").forEach(r => r.addEventListener("change", () => { ck.stage = r.value; renderResult(); }));
  renderResult();
}

function renderCheck(slug) {
  const c = CK[state.lang];
  if (slug && TRK[slug]) resetFor(slug);
  const today = new Date().toISOString().slice(0, 10);
  $("#main").innerHTML = `
  <article class="gutter"><div class="post check">
    <a class="back" href="#">← ${UI[state.lang].back}</a>
    <h1 id="post-title" tabindex="-1">${c.h1}</h1>
    <p class="lead">${c.lead}</p>
    <fieldset><legend>${c.s1}</legend><div class="opts">${DATA.trackers.map(t => {
      const p = BY[t.guide];
      return `<label class="opt"><input type="radio" name="ck-scheme" value="${t.guide}"${t.guide === ck.slug ? " checked" : ""}><span><b>${esc(title(p))}</b><small>${esc(stateName(p.state))}</small></span></label>`;
    }).join("")}</div></fieldset>
    <div id="ck-stages"></div>
    <div id="ck-when" hidden><label class="when" for="ck-date">${c.s3}<input id="ck-date" type="date" max="${today}" value="${esc(ck.date)}"></label></div>
    <div id="ck-result" aria-live="polite"></div>
  </div></article>`;
  document.querySelectorAll("input[name=ck-scheme]").forEach(r => r.addEventListener("change", () => {
    resetFor(r.value); $("#ck-date").value = ""; history.replaceState(null, "", "#check-" + r.value); renderStages();
  }));
  $("#ck-date").addEventListener("change", e => { ck.date = e.target.value; renderResult(); });
  renderStages();
  document.title = `${c.h1} · Sathi Yojana Guides`;
}

function applyChrome() {
  const u = UI[state.lang];
  document.documentElement.lang = state.lang;
  $("#brand-sub").textContent = u.sub;
  $("#skip").textContent = u.skip;
  $("#foot").textContent = u.foot;
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function route(focus) {
  applyChrome();
  const h = location.hash.slice(1), p = BY[h];
  if (h === "check" || h.startsWith("check-")) { renderCheck(h.slice(6)); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else if (p) { renderPost(p); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else { renderHome(); if (focus) window.scrollTo(0, 0); }
}

document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; save("sathi-lang", state.lang);
  const y = window.scrollY; route(false); window.scrollTo(0, y);
}));
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
window.addEventListener("hashchange", () => { route(true); track(location.pathname + location.hash); });
route(false);
</script>
