.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
.card-link { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s; }

  }));
}

function renderCards() {
  const list = POSTS.filter(matches), u = UI[state.lang];
  $("#cards").innerHTML = list.length ? list.map(cardHTML).join("") : `<li class="empty">${u.none}</li>`;
  $("#count").textContent = u.shown(list.length);
}

function renderRouters() {
  const ids = state.st === "all" ? DATA.states.map(s => s.id) : [state.st];
  $("#routers").innerHTML = ids.map(id => `${ids.length > 1 ? `<h3 class="rhead">${esc(stateName(id))}</h3>` : ""}<ul>${DATA.routers[id].map(r => `<li>${r}</li>`).join("")}</ul>`).join("");
}

function renderHome() {
  const u = UI[state.lang];
  $("#main").innerHTML = `
  <div class="gutter">
    <section class="intro">
      <p class="eyebrow">${u.eyebrow}</p>
      <h1>${u.h1}</h1>
      <p class="lead">${u.lead(POSTS.length)}</p>
    </section>
    <div class="tools">
      <label class="search" for="q">${SEARCH_ICON}<span class="sr-only">${u.search}</span>
        <input id="q" type="search" placeholder="${esc(u.search)}" value="${esc(state.q)}" autocomplete="off"></label>
      <div class="filter"><span class="flabel" id="st-label">${u.stateLbl}</span><div class="chips" id="state-chips" role="group" aria-labelledby="st-label"></div></div>
      <div class="filter"><span class="flabel" id="cat-label">${u.catLbl}</span><div class="chips" id="cat-chips" role="group" aria-labelledby="cat-label"></div></div>
      <p class="count" id="count" aria-live="polite"></p>
      ${u.langNote ? `<p class="small">${u.langNote}</p>` : ""}
    </div>
    <div class="layout">
      <ul class="cards" id="cards"></ul>
      <aside class="side">
        <section><h2>${u.routes}</h2><div id="routers"></div></section>
        <section><h2>${u.legend}</h2><ul class="legend-list">${["you", "gov", "done"].map((k, i) => `<li><i class="dot ${k}"></i>${u.lg[i]}</li>`).join("")}</ul></section>
      </aside>
    </div>
  </div>`;
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderCards(); });
  renderFilters(); renderCards(); renderRouters();
  document.title = "Sathi Yojana Guides";
}

function stepsHTML(g) {
  return g.steps.map((s, i) => `${s.phase ? `<li class="phase" aria-hidden="true">${esc(s.phase)}</li>` : ""}
    <li class="step ${s.kind}"><span class="num" aria-hidden="true">${i + 1}</span><div class="scard">
      <span class="who">${esc(s.who)}</span><h3><span class="sr-only">${i + 1}. </span>${esc(s.title)}</h3>
      <div class="sbody">${s.body}</div>
      ${s.note ? `<p class="note ${s.note.kind}"><b class="nl">${esc(s.note.label)}</b> ${s.note.html}</p>` : ""}
    </div></li>`).join("");
}

function renderPost(p) {
  const u = UI[state.lang], g = guide(p), L = plang(p);
  const sib = POSTS.filter(x => x.state === p.state), i = sib.indexOf(p);
  const prev = sib[i - 1], next = sib[i + 1];
  const links = p.links.map(l => `<li><span class="what">${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : `<b>${esc(l.label.split(":").slice(1).join(":").trim() || l.label)}</b>`}<span class="lbl">${esc(l.label)}</span></span>
      <span class="tag ${l.gov ? "g" : "x"}">${l.gov ? u.gov : u.third}</span></li>`).join("");
  const govN = p.links.filter(l => l.gov).length;
  const sources = p.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("");
  $("#main").innerHTML = `
  <article class="gutter"><div class="post">
    <a class="back" href="#">← ${u.back}</a>
    <p class="eyebrow">${esc(stateName(p.state))} · ${esc(catName(p.cat))}</p>
    <h1 id="post-title" tabindex="-1" lang="${L}">${esc(g.h1)}</h1>
    <p class="mrn" lang="${state.lang === "en" ? p.local : "en"}">${esc(altTitle(p))}</p>
    <p class="benefit" lang="${L}">${g.benefit}</p>
    <div class="post-meta"><span><b>${u.forw}:</b> ${esc(p.audience)}</span><span>${u.steps(g.steps.length)}</span>${p.verified ? `<span>${FB[state.lang].checkedOn(fmtDate(p.verified))}</span>` : ""}</div>
    <ul class="toc">${[["s-steps", u.tocSteps], ["s-links", u.tocLinks], ["s-flow", u.tocFlow], ["s-src", u.tocSrc]].map(([id, t]) => `<li><button type="button" data-go="${id}">${t}</button></li>`).join("")}</ul>

    <section lang="${L}">
      <h2 id="s-steps" tabindex="-1">${u.hSteps}</h2>
      <div class="legend">${["you", "gov", "done"].map((k, j) => `<span><i class="dot ${k}"></i>${u.lg[j]}</span>`).join("")}</div>
      <ol class="steps">${stepsHTML(g)}</ol>
      ${g.rights ? `<aside class="box"><h3>${esc(g.rights_t)}</h3><div>${g.rights}</div></aside>` : ""}
      ${g.help ? `<aside class="box help"><div>${g.help}</div></aside>` : ""}
    </section>

    <section>
      <h2 id="s-links" tabindex="-1">${u.hLinks}</h2>
      <ul class="links">${links}</ul>
      <p class="trust"><span class="tag ${govN === p.links.length ? "g" : "x"}">${govN}/${p.links.length}</span> ${FB[state.lang].trust(govN, p.links.length)}</p>
      <p class="small">${u.linksNote}</p>
    </section>

    <section>
      <h2 id="s-flow" tabindex="-1">${u.hFlow}</h2>
      <p class="small">${u.flowNote}</p>
      <div class="diagram" id="diagram" role="img" aria-label="${esc(u.hFlow)}: ${esc(p.title)}"><p class="small">${u.flowLoading}</p></div>
    </section>

    <section>
      <h2 id="s-src" tabindex="-1">${u.hSrc}</h2>
      <ol class="sources">${sources}</ol>
      <p class="small">${u.srcNote}</p>
    </section>

    <section class="feedback" aria-labelledby="fb-title">
      <h2 id="fb-title">${FB[state.lang].fbTitle}</h2>
      <div class="vote" role="group" aria-label="${FB[state.lang].fbQ}">
        <span>${FB[state.lang].fbQ}</span>
        <button type="button" id="vote-yes" data-vote="yes" aria-pressed="false">${FB[state.lang].yes}</button>
        <button type="button" id="vote-no" data-vote="no" aria-pressed="false">${FB[state.lang].no}</button>
      </div>
      <p id="fb-msg" class="small" aria-live="polite"></p>
      <a id="fb-report" class="report" href="${esc(reportURL(p))}" target="_blank" rel="noopener">${FB[state.lang].report} ↗</a>
      <p class="small">${FB[state.lang].reportNote}</p>
    </section>

    <nav class="pager" aria-label="${u.prev} / ${u.next}">
      ${prev ? `<a class="prev" href="#${prev.slug}"><small>← ${u.prev}</small>${esc(title(prev))}</a>` : ""}
      ${next ? `<a class="next" href="#${next.slug}"><small>${u.next} →</small>${esc(title(next))}</a>` : ""}
    </nav>
  </div></article>`;
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.go); t.scrollIntoView({ block: "start" }); t.focus({ preventScroll: true });
  }));
  document.title = `${p.title} · Sathi Yojana Guides`;
  drawDiagram(p);
  wireFeedback(p);
}

const svgCache = {};
let mermaidReady = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (!mermaidReady) mermaidReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" }); res(window.mermaid); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return mermaidReady;
}
async function drawDiagram(p) {
  const show = html => { const b = document.getElementById("diagram"); if (b && location.hash.slice(1) === p.slug) b.innerHTML = html; };
  if (svgCache[p.slug]) return show(svgCache[p.slug]);
  try {
    const m = await loadMermaid();
    const { svg } = await m.render("flow-" + p.slug.replace(/[^a-z0-9]/g, ""), p.mermaid);
    svgCache[p.slug] = svg; show(svg);
  } catch (e) {
    show(`<p class="small">${UI[state.lang].flowFail}</p><pre>${esc(p.mermaid)}</pre>`);
  }
}

function applyChrome() {
  const u = UI[state.lang];
  document.documentElement.lang = state.lang;
  $("#brand-sub").textContent = u.sub;
  $("#skip").textContent = u.skip;
  $("#foot").textContent = u.foot;
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function route(focus) {
  applyChrome();
  const p = BY[location.hash.slice(1)];
  if (p) { renderPost(p); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else { renderHome(); if (focus) window.scrollTo(0, 0); }
}

document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; save("sathi-lang", state.lang);
  const y = window.scrollY; route(false); window.scrollTo(0, y);
}));
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
window.addEventListener("hashchange", () => { route(true); track(location.pathname + location.hash); });
route(false);
</script>
