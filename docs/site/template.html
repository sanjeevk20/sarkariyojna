* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--leaf); color: var(--on-leaf); padding: 10px 14px; border-radius: 8px; z-index: 20; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }
h1, h2 { font-family: var(--display); text-wrap: balance; line-height: 1.3; }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .gutter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand b { font-family: var(--display); font-size: 20px; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle { display: flex; gap: 4px; background: var(--raised); padding: 4px; border-radius: 999px; flex: none; }
.toggle button { font: 500 15px var(--body); min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }

/* Home */
.intro { padding-block: 28px 8px; }
.intro .eyebrow, .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); margin: 0; }
.intro h1 { font-size: clamp(28px, 5vw, 42px); margin: 6px 0 8px; max-width: 22ch; }
.intro p.lead { color: var(--muted); font-size: 18px; max-width: 62ch; margin: 0; }
.tools { display: grid; gap: 12px; padding-block: 18px 6px; }
.search { position: relative; max-width: 520px; }
.search input { width: 100%; font: 17px var(--body); min-height: 48px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }

.count { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
.filter { display: grid; gap: 6px; }
.flabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rhead { font-size: 15px; margin: 10px 0 6px; } .rhead:first-child { margin-top: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 16px 56px; }

.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
.card-link { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s; }
.card-link:hover { border-color: var(--leaf); transform: translateY(-2px); }
.card-link h2 { font-size: 19px; margin: 2px 0 0; }
.card-link .mrn { color: var(--muted); font-size: 15px; }
.card-link .for { font-size: 15px; margin-top: 6px; }
.card-link .meta { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.side { display: grid; gap: 16px; align-content: start; }
.side section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.side h2 { font-size: 17px; margin: 0 0 8px; }
.side ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 15px; }
.legend-list { list-style: none; padding: 0 !important; }

.small { font-size: 14px; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
.pager a { display: block; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.pager a.next { text-align: right; grid-column: 2; }

.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.foot .gutter { padding-block: 18px 28px; }
@media (max-width: 520px) { .brand span { display: none; } .toggle button { padding: 0 9px; font-size: 14px; } .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

    gov: "सरकारी पेज", third: "केवल अन्य साइटें", flowNote: "पीले बॉक्स: साथी कहां मदद करता है। लाल बॉक्स: काम अटकने के आम कारण। (आरेख अंग्रेज़ी में)",
    flowLoading: "आरेख बन रहा है…", flowFail: "यहां आरेख नहीं दिखाया जा सका। उसका पाठ नीचे है।",
    srcNote: "27 अक्टूबर 2026 को इन स्रोतों से जानकारी जांची गई। भरोसा करने से पहले वर्तमान शासनादेश देखें। (स्रोत अधिकतर अंग्रेज़ी में)",
    prev: "पिछला", next: "अगला", checked: "27 अक्टूबर 2026 को जांचा गया", langNote: "महाराष्ट्र की मार्गदर्शिकाएं मराठी में हैं।",
    foot: "साथी मार्गदर्शिकाएं नागरिकों की मदद के लिए हैं; यह आधिकारिक सरकारी वेबसाइट नहीं है। हर मार्गदर्शिका में दिए आधिकारिक लिंक ही इस्तेमाल करें और आवेदन के लिए किसी एजेंट को पैसे न दें। मराठी और हिंदी पाठ की मूल भाषियों से समीक्षा बाकी है।" },
};
const POSTS = DATA.posts, BY = Object.fromEntries(POSTS.map(p => [p.slug, p]));
const state = { lang: "en", st: "all", cat: "all", q: "" };
try {
  const l = localStorage.getItem("sathi-lang"); if (UI[l]) state.lang = l;
  const s = localStorage.getItem("sathi-state"); if (s === "all" || DATA.states.some(x => x.id === s)) state.st = s;
} catch (e) {}
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nameOf = (list, id) => { const c = list.find(c => c.id === id); return c ? c[state.lang] : ""; };
const catName = id => nameOf(DATA.cats, id);
const stateName = id => nameOf(DATA.states, id);
// A post is shown in English, or else in its own local language (Marathi for Maharashtra, Hindi for UP).
const plang = p => state.lang === "en" ? "en" : p.local;
const guide = p => state.lang === "en" ? p.en : p.loc;
const title = p => state.lang === "en" ? p.title : p.local_name;
const altTitle = p => state.lang === "en" ? p.local_name : p.title;
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

const inState = p => state.st === "all" || p.state === state.st;
function matches(p) {
  if (!inState(p)) return false;
  if (state.cat !== "all" && p.cat !== state.cat) return false;
  if (!state.q) return true;
  const hay = [p.title, p.local_name, p.audience, p.en.h1, p.loc.h1, catName(p.cat), stateName(p.state)].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function cardHTML(p) {
  const u = UI[state.lang];
  return `<li><a class="card-link" href="#${p.slug}">
    <p class="eyebrow">${esc(stateName(p.state))} · ${esc(catName(p.cat))}</p>
    <h2 lang="${plang(p)}">${esc(title(p))}</h2>
    <span class="mrn" lang="${state.lang === "en" ? p.local : "en"}">${esc(altTitle(p))}</span>
    <span class="for"><b>${u.forw}:</b> ${esc(p.audience)}</span>
    <span class="meta"><span>${u.steps(p.en.steps.length)}</span><span>${u.links(p.links.length)}</span></span>
  </a></li>`;
}

function chipsHTML(kind, items, current) {
  return items.map(c => `<button type="button" class="chip" data-${kind}="${c.id}" aria-pressed="${c.id === current}">${esc(c.label)}<span class="n">${c.n}</span></button>`).join("");
}

function renderFilters() {
  const u = UI[state.lang];
  const states = [{ id: "all", label: u.allStates, n: POSTS.length },
    ...DATA.states.map(s => ({ id: s.id, label: s[state.lang], n: POSTS.filter(p => p.state === s.id).length }))];
  const pool = POSTS.filter(inState);
  const cats = [{ id: "all", label: u.all, n: pool.length },
    ...DATA.cats.map(c => ({ id: c.id, label: c[state.lang], n: pool.filter(p => p.cat === c.id).length })).filter(c => c.n)];
  if (!cats.some(c => c.id === state.cat)) state.cat = "all";
  $("#state-chips").innerHTML = chipsHTML("st", states, state.st);
  $("#cat-chips").innerHTML = chipsHTML("cat", cats, state.cat);
  document.querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", () => {
    state.st = b.dataset.st; save("sathi-state", state.st); renderFilters(); renderCards(); renderRouters();
  }));
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    state.cat = b.dataset.cat; renderFilters(); renderCards();
  }));
}

function renderCards() {
  const list = POSTS.filter(matches), u = UI[state.lang];
  $("#cards").innerHTML = list.length ? list.map(cardHTML).join("") : `<li class="empty">${u.none}</li>`;
  $("#count").textContent = u.shown(list.length);
}

function renderRouters() {
  const ids = state.st === "all" ? DATA.states.map(s => s.id) : [state.st];
  $("#routers").innerHTML = ids.map(id => `${ids.length > 1 ? `<h3 class="rhead">${esc(stateName(id))}</h3>` : ""}<ul>${DATA.routers[id].map(r => `<li>${r}</li>`).join("")}</ul>`).join("");
}

function renderHome() {
  const u = UI[state.lang];
  $("#main").innerHTML = `
  <div class="gutter">
    <section class="intro">
      <p class="eyebrow">${u.eyebrow}</p>
      <h1>${u.h1}</h1>
      <p class="lead">${u.lead(POSTS.length)}</p>
    </section>
    <div class="tools">
      <label class="search" for="q">${SEARCH_ICON}<span class="sr-only">${u.search}</span>
        <input id="q" type="search" placeholder="${esc(u.search)}" value="${esc(state.q)}" autocomplete="off"></label>
      <div class="filter"><span class="flabel" id="st-label">${u.stateLbl}</span><div class="chips" id="state-chips" role="group" aria-labelledby="st-label"></div></div>
      <div class="filter"><span class="flabel" id="cat-label">${u.catLbl}</span><div class="chips" id="cat-chips" role="group" aria-labelledby="cat-label"></div></div>
      <p class="count" id="count" aria-live="polite"></p>
      ${u.langNote ? `<p class="small">${u.langNote}</p>` : ""}
    </div>
    <div class="layout">
      <ul class="cards" id="cards"></ul>
      <aside class="side">
        <section><h2>${u.routes}</h2><div id="routers"></div></section>
        <section><h2>${u.legend}</h2><ul class="legend-list">${["you", "gov", "done"].map((k, i) => `<li><i class="dot ${k}"></i>${u.lg[i]}</li>`).join("")}</ul></section>
      </aside>
    </div>
  </div>`;
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderCards(); });
  renderFilters(); renderCards(); renderRouters();
  document.title = "Sathi Yojana Guides";
}

function stepsHTML(g) {
  return g.steps.map((s, i) => `${s.phase ? `<li class="phase" aria-hidden="true">${esc(s.phase)}</li>` : ""}
    <li class="step ${s.kind}"><span class="num" aria-hidden="true">${i + 1}</span><div class="scard">
      <span class="who">${esc(s.who)}</span><h3><span class="sr-only">${i + 1}. </span>${esc(s.title)}</h3>
      <div class="sbody">${s.body}</div>
      ${s.note ? `<p class="note ${s.note.kind}"><b class="nl">${esc(s.note.label)}</b> ${s.note.html}</p>` : ""}
    </div></li>`).join("");
}

function renderPost(p) {
  const u = UI[state.lang], g = guide(p), L = plang(p);
  const sib = POSTS.filter(x => x.state === p.state), i = sib.indexOf(p);
  const prev = sib[i - 1], next = sib[i + 1];
  const links = p.links.map(l => `<li><span class="what">${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : `<b>${esc(l.label.split(":").slice(1).join(":").trim() || l.label)}</b>`}<span class="lbl">${esc(l.label)}</span></span>
      <span class="tag ${l.gov ? "g" : "x"}">${l.gov ? u.gov : u.third}</span></li>`).join("");
  const sources = p.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("");
  $("#main").innerHTML = `
  <article class="gutter"><div class="post">
    <a class="back" href="#">← ${u.back}</a>
    <p class="eyebrow">${esc(stateName(p.state))} · ${esc(catName(p.cat))}</p>
    <h1 id="post-title" tabindex="-1" lang="${L}">${esc(g.h1)}</h1>
    <p class="mrn" lang="${state.lang === "en" ? p.local : "en"}">${esc(altTitle(p))}</p>
    <p class="benefit" lang="${L}">${g.benefit}</p>
    <div class="post-meta"><span><b>${u.forw}:</b> ${esc(p.audience)}</span><span>${u.steps(g.steps.length)}</span><span>${u.checked}</span></div>
    <ul class="toc">${[["s-steps", u.tocSteps], ["s-links", u.tocLinks], ["s-flow", u.tocFlow], ["s-src", u.tocSrc]].map(([id, t]) => `<li><button type="button" data-go="${id}">${t}</button></li>`).join("")}</ul>

    <section lang="${L}">
      <h2 id="s-steps" tabindex="-1">${u.hSteps}</h2>
      <div class="legend">${["you", "gov", "done"].map((k, j) => `<span><i class="dot ${k}"></i>${u.lg[j]}</span>`).join("")}</div>
      <ol class="steps">${stepsHTML(g)}</ol>
      ${g.rights ? `<aside class="box"><h3>${esc(g.rights_t)}</h3><div>${g.rights}</div></aside>` : ""}
      ${g.help ? `<aside class="box help"><div>${g.help}</div></aside>` : ""}
    </section>

    <section>
      <h2 id="s-links" tabindex="-1">${u.hLinks}</h2>
      <ul class="links">${links}</ul>
      <p class="small">${u.linksNote}</p>
    </section>

    <section>
      <h2 id="s-flow" tabindex="-1">${u.hFlow}</h2>
      <p class="small">${u.flowNote}</p>
      <div class="diagram" id="diagram" role="img" aria-label="${esc(u.hFlow)}: ${esc(p.title)}"><p class="small">${u.flowLoading}</p></div>
    </section>

    <section>
      <h2 id="s-src" tabindex="-1">${u.hSrc}</h2>
      <ol class="sources">${sources}</ol>
      <p class="small">${u.srcNote}</p>
    </section>

    <nav class="pager" aria-label="${u.prev} / ${u.next}">
      ${prev ? `<a class="prev" href="#${prev.slug}"><small>← ${u.prev}</small>${esc(title(prev))}</a>` : ""}
      ${next ? `<a class="next" href="#${next.slug}"><small>${u.next} →</small>${esc(title(next))}</a>` : ""}
    </nav>
  </div></article>`;
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.go); t.scrollIntoView({ block: "start" }); t.focus({ preventScroll: true });
  }));
  document.title = `${p.title} · Sathi Yojana Guides`;
  drawDiagram(p);
}

const svgCache = {};
let mermaidReady = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (!mermaidReady) mermaidReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" }); res(window.mermaid); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return mermaidReady;
}
async function drawDiagram(p) {
  const show = html => { const b = document.getElementById("diagram"); if (b && location.hash.slice(1) === p.slug) b.innerHTML = html; };
  if (svgCache[p.slug]) return show(svgCache[p.slug]);
  try {
    const m = await loadMermaid();
    const { svg } = await m.render("flow-" + p.slug.replace(/[^a-z0-9]/g, ""), p.mermaid);
    svgCache[p.slug] = svg; show(svg);
  } catch (e) {
    show(`<p class="small">${UI[state.lang].flowFail}</p><pre>${esc(p.mermaid)}</pre>`);
  }
}

function applyChrome() {
  const u = UI[state.lang];
  document.documentElement.lang = state.lang;
  $("#brand-sub").textContent = u.sub;
  $("#skip").textContent = u.skip;
  $("#foot").textContent = u.foot;
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function route(focus) {
  applyChrome();
  const p = BY[location.hash.slice(1)];
  if (p) { renderPost(p); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else { renderHome(); if (focus) window.scrollTo(0, 0); }
}

document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; save("sathi-lang", state.lang);
  const y = window.scrollY; route(false); window.scrollTo(0, y);
}));
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
window.addEventListener("hashchange", () => route(true));
route(false);
</script>
