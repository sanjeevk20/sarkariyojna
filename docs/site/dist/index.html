 in instalments as you build, with <b>geo-tagged photos<\/b> at each stage<\/li><li><b>AHP<\/b>: flat allotted (often by lottery)<\/li><li><b>ISS<\/b>: subsidy credited to your <b>home loan account<\/b> in yearly instalments, reducing your EMI<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "BLC instalment stuck? Usually the stage photo was not uploaded or inspected. Ask the municipal PMAY cell."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Your home is ready", "body": "Your house is built, or you get possession of your flat, or your loan becomes cheaper with the subsidy.", "note": null}], "rights_t": "Stuck for long? Complain.", "rights": "Give a written complaint to your <b>municipal PMAY cell<\/b> with your application number and take an <b>acknowledgement (पोच)<\/b>. For ISS, complain to your <b>bank<\/b> first. You can also use <b>CPGRAMS<\/b>.", "help": "<b>Check status:<\/b> pmay-urban.gov.in → track application (application number)<br/><b>Use only .gov.in websites<\/b> · Never pay anyone to \"get selected\""}, "loc": {"h1": "प्रधानमंत्री आवास योजना (शहरी 2.0): शहरात घरासाठी मदत कशी मिळवायची", "benefit": "शहरात पक्के घर बांधणे, खरेदी करणे किंवा भाड्याने घेण्यासाठी मदत", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li>तुम्ही <b>शहरात<\/b> राहता (गावांसाठी: प्रधानमंत्री आवास योजना - ग्रामीण पाहा)<\/li><li>तुमच्या कुटुंबातील कोणाचेही <b>भारतात कुठेही पक्के घर<\/b> नाही<\/li><li>कौटुंबिक उत्पन्न: <b>EWS<\/b> ₹3 लाखांपर्यंत · <b>LIG<\/b> ₹3 ते 6 लाख · <b>MIG<\/b> ₹6 ते 9 लाख वार्षिक<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "घर सहसा <b>कुटुंबातील महिलेच्या नावावर<\/b> किंवा संयुक्त नावावर असते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "तुमच्यासाठी योग्य पर्याय निवडा", "body": "<ul><li><b>स्वतःची जागा आहे, घर बांधायचे<\/b> → BLC: स्वतःच्या जागेवर बांधकामासाठी मदत (EWS)<\/li><li>सरकारी / भागीदारी प्रकल्पात <b>फ्लॅट घ्यायचा<\/b> → AHP (EWS)<\/li><li>बँकेकडून <b>गृहकर्ज घेताय<\/b> → ISS: व्याज अनुदान (EWS / LIG / MIG)<\/li><li><b>भाड्याने घर हवे<\/b> (कामगार, स्थलांतरित) → ARH: परवडणारे भाडेघर<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "यापैकी <b>एकच<\/b> पर्याय वापरता येतो. ISS मध्ये ₹35 लाखांपर्यंतच्या घरासाठी ₹25 लाखांपर्यंतच्या कर्जावर <b>₹1.80 लाखांपर्यंत<\/b> व्याज अनुदान मिळते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>कुटुंबातील <b>सर्व सदस्यांचे<\/b> आधार<\/li><li>उत्पन्नाचा दाखला / ITR<\/li><li><b>आधारशी लिंक<\/b> असलेले बँक खाते<\/li><li>पक्के घर नसल्याचे स्वयंघोषणापत्र<\/li><li>BLC साठी: तुमच्या नावावरील <b>जागा / मालमत्ता पत्रक<\/b><\/li><li>लागू असल्यास जातीचा दाखला<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जागा तुमच्या नावावर नाही? आधी मालमत्ता पत्रक / फेरफार अद्ययावत करा. BLC साठी जागा कुटुंबाच्या नावावर असावी लागते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>pmay-urban.gov.in<\/b> (आधार OTP)<\/li><li>तुमच्या <b>महानगरपालिका / नगरपरिषदेतील<\/b> PMAY कक्ष<\/li><li>ISS साठी: तुमच्या <b>बँक / गृहवित्त कंपनीमार्फतही<\/b><\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>बनावट PMAY वेबसाइट आणि एजंटपासून<\/b> सावध राहा. अर्ज मोफत आहे. \"निवड करून देण्यासाठी\" कोणालाही पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार / बँक", "title": "अर्जाची तपासणी", "body": "<b>नागरी स्थानिक स्वराज्य संस्था<\/b> (महानगरपालिका / नगरपरिषद) तुमची माहिती तपासते. BLC साठी जागेचीही पाहणी होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? नेहमीची कारणे: कुटुंबातील कोणाचे आधीच पक्के घर आहे, किंवा उत्पन्न जुळत नाही. कारण वाचा, दुरुस्त करून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "gov", "who": "सरकार / बँक", "title": "मंजुरी आणि रक्कम", "body": "<ul><li><b>BLC<\/b>: बांधकामानुसार हप्त्यांमध्ये पैसे, प्रत्येक टप्प्यावर <b>जिओ-टॅग फोटो<\/b><\/li><li><b>AHP<\/b>: फ्लॅटचे वाटप (बहुतेक वेळा सोडतीने)<\/li><li><b>ISS<\/b>: अनुदान तुमच्या <b>गृहकर्ज खात्यात<\/b> वार्षिक हप्त्यांमध्ये जमा, त्यामुळे EMI कमी होतो<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "BLC हप्ता अडकला? बहुतेक वेळा टप्प्याचा फोटो अपलोड किंवा तपासणी झालेली नसते. महापालिकेच्या PMAY कक्षात विचारा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "तुमचे घर तयार", "body": "तुमचे घर बांधून पूर्ण होते, किंवा फ्लॅटचा ताबा मिळतो, किंवा अनुदानामुळे तुमचे कर्ज स्वस्त होते.", "note": null}], "rights_t": "खूप दिवस अडकले? तक्रार करा.", "rights": "अर्ज क्रमांकासह <b>महापालिकेच्या PMAY कक्षाकडे<\/b> लेखी तक्रार द्या आणि <b>पोच<\/b> घ्या. ISS साठी आधी तुमच्या <b>बँकेकडे<\/b> तक्रार करा. <b>CPGRAMS<\/b> चाही वापर करता येतो.", "help": "<b>स्थिती तपासा:<\/b> pmay-urban.gov.in → अर्ज ट्रॅक करा (अर्ज क्रमांक)<br/><b>फक्त .gov.in वेबसाइट वापरा<\/b> · \"निवड करून देण्यासाठी\" कोणालाही पैसे देऊ नका"}}, {"slug": "sanjay-gandhi", "title": "Sanjay Gandhi Niradhar Yojana", "local_name": "संजय गांधी निराधार अनुदान योजना", "audience": "Destitute below 65 (widows, disabled, ill)", "state": "mh", "local": "mr", "cat": "pension", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "Thane Collectorate: SGNY / Shravanbal page", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/", "gov": true}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([Destitute person needs support]) --> AG{Age below 65?}\n    AG -- No --> OA([Shravanbal / old-age pension: separate flow])\n    AG -- Yes --> E{1. Eligible category?<br/>widow, disabled 40+, serious illness,<br/>orphan, other destitute; low income}\n    E -- No --> X([Not eligible])\n    E -- Yes --> D[2. Documents<br/>Aadhaar, age + residence proof,<br/>income cert, category proof,<br/>seeded bank a/c]\n    D --> AP[3. Apply free<br/>Aaple Sarkar / Tahsil SGY branch<br/>application number + acknowledgement]\n    AP --> SC[4. Tahsil scrutiny<br/>Talathi local inquiry]\n    SC --> CM{5. Taluka SGY committee}\n    CM -- Rejected --> F1[Rejected: ask reason in writing]\n    CM -- Approved --> P[6. Monthly DBT payment]\n    P -- Bank not seeded --> F2[Payment failed]\n    P --> K[7. Keep running<br/>annual life certificate,<br/>report changes]\n    K -- Life certificate missed --> F3[Payment stopped]\n    K -- Turns 65 --> OA\n    SC -. pending long .-> T[Written application to Tahsildar SGY /<br/>Aaple Sarkar grievance]\n\n    S1[[Sathi: Category + scheme router<br/>SGNY vs Shravanbal]]:::sathi -.-> E\n    S2[[Sathi: Readiness check<br/>income cert, UDID, death cert, seeding]]:::sathi -.-> D\n    S3[[Sathi: Committee date + pending clock]]:::sathi -.-> T\n    S4[[Sathi: Life-certificate reminder]]:::sathi -.-> K\n    S5[[Sathi: Missed-payment tracker]]:::sathi -.-> F3\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Thane district: Sanjay Gandhi Niradhar Yojana", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/"}, {"label": "Gadchiroli district: Sanjay Gandhi Yojana", "url": "https://gadchiroli.gov.in/sanjay-gandhi-yojana/"}, {"label": "Vikaspedia: SGNY", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/sanjay-gandhi-niradhar-anudan-yojana-of-maharashtra-govt?lgn=en"}], "verified": "2026-10-27", "en": {"h1": "Sanjay Gandhi Niradhar Yojana: Monthly support for those without support", "benefit": "₹1,500 a month (₹2,500 for persons with disability) paid into your bank account", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You may be eligible if you are <b>below 65<\/b>, have lived in Maharashtra for many years, your family income is <b>up to ₹21,000 a year<\/b> (₹50,000 for persons with disability) or you are on the BPL list, and you are:<ul><li>A <b>widow<\/b>, divorced or abandoned woman<\/li><li>A person with <b>disability<\/b> (40% or more)<\/li><li>Suffering from a <b>serious illness<\/b> (e.g. TB, cancer, HIV, leprosy)<\/li><li>An <b>orphan child<\/b>, transgender person, or another destitute category<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Aged <b>65 or more<\/b>? Ask about the <b>Shravanbal<\/b> / old-age pension schemes instead."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, photo, ration card<\/li><li><b>Age proof<\/b> and <b>residence proof<\/b><\/li><li><b>Income certificate<\/b> from the Tahsildar<\/li><li>Category proof: husband's <b>death certificate<\/b> (widow), <b>disability certificate / UDID<\/b>, or <b>medical certificate<\/b> from a government hospital<\/li><li>Bank passbook, account <b>linked to Aadhaar<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No income certificate? Get it first on Aaple Sarkar. No disability certificate? Get it from the government (civil) hospital."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li><b>Aaple Sarkar<\/b> portal / Seva Kendra<\/li><li><b>Sanjay Gandhi Yojana branch<\/b> at your <b>Tahsil office<\/b>, or ask your Talathi for help<\/li><\/ul>Note your <b>application number<\/b> and keep the <b>acknowledgement<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never pay an agent to \"get it sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Papers are checked", "body": "The Tahsil office checks your papers. The <b>Talathi<\/b> may do a local inquiry about your situation and income.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked for more papers? Submit them quickly with your application number and take an acknowledgement."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Taluka committee approves", "body": "The <b>taluka-level Sanjay Gandhi Yojana committee<\/b> meets regularly and approves eligible applications.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Ask for the <b>reason in writing<\/b>. Fix the missing proof and apply again."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Money every month", "body": "The amount comes by <b>DBT<\/b> into your Aadhaar-linked bank account every month.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Check the bank account is <b>Aadhaar-seeded with DBT on<\/b> and active."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep it running", "body": "<ul><li>Submit your <b>life certificate (हयातीचा दाखला)<\/b> every year when asked<\/li><li>Tell the office about changes (address, bank, remarriage, etc.)<\/li><li>At <b>65<\/b>, ask to shift to the old-age pension scheme<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Money suddenly stopped? Usually the <b>life certificate<\/b> was not submitted or the bank link changed."}}], "rights_t": "Pending too long? Follow up.", "rights": "Give a <b>written application to the Tahsildar / Naib Tahsildar (Sanjay Gandhi Yojana)<\/b> with your application number and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>Aaple Sarkar<\/b>.", "help": "<b>Check status:<\/b> Aaple Sarkar (application number) or Tahsil office<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "संजय गांधी निराधार अनुदान योजना: निराधारांना दरमहा अनुदान", "benefit": "दरमहा ₹1,500 (दिव्यांगांना ₹2,500) थेट तुमच्या बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "तुमचे वय <b>65 पेक्षा कमी<\/b> असेल, अनेक वर्षांपासून महाराष्ट्रात राहत असाल, कौटुंबिक उत्पन्न <b>वर्षाला ₹21,000 पर्यंत<\/b> (दिव्यांगांसाठी ₹50,000) असेल किंवा BPL यादीत असाल, आणि तुम्ही:<ul><li><b>विधवा<\/b>, घटस्फोटित किंवा परित्यक्ता महिला<\/li><li><b>दिव्यांग<\/b> व्यक्ती (40% किंवा जास्त)<\/li><li><b>गंभीर आजाराने<\/b> ग्रस्त (उदा. क्षयरोग, कर्करोग, एचआयव्ही, कुष्ठरोग)<\/li><li><b>अनाथ मूल<\/b>, तृतीयपंथी, किंवा इतर निराधार प्रवर्ग<\/li><\/ul>असाल तर पात्र ठरू शकता.", "note": {"kind": "tip", "label": "सूचना:", "html": "वय <b>65 किंवा जास्त<\/b>? त्याऐवजी <b>श्रावणबाळ<\/b> / वृद्धापकाळ निवृत्तिवेतन योजनेबद्दल विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार, फोटो, रेशन कार्ड<\/li><li><b>वयाचा पुरावा<\/b> आणि <b>रहिवासाचा पुरावा<\/b><\/li><li>तहसीलदारांचा <b>उत्पन्नाचा दाखला<\/b><\/li><li>प्रवर्गाचा पुरावा: पतीचा <b>मृत्यू दाखला<\/b> (विधवा), <b>दिव्यांग प्रमाणपत्र / UDID<\/b>, किंवा सरकारी रुग्णालयाचे <b>वैद्यकीय प्रमाणपत्र<\/b><\/li><li><b>आधारशी लिंक<\/b> असलेल्या बँक खात्याचे पासबुक<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "उत्पन्नाचा दाखला नाही? आधी आपले सरकार वरून काढा. दिव्यांग प्रमाणपत्र नाही? सरकारी (जिल्हा) रुग्णालयातून मिळवा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>आपले सरकार<\/b> पोर्टल / सेवा केंद्र<\/li><li>तुमच्या <b>तहसील कार्यालयातील संजय गांधी योजना शाखा<\/b>, किंवा तलाठ्यांची मदत घ्या<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा आणि <b>पोच<\/b> जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज करणे <b>मोफत<\/b> आहे. \"मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील कार्यालय तुमची कागदपत्रे तपासते. तुमची परिस्थिती आणि उत्पन्नाबाबत <b>तलाठी<\/b> स्थानिक चौकशी करू शकतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "आणखी कागदपत्रे मागितली? अर्ज क्रमांकासह लवकर सादर करा आणि पोच घ्या."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "तालुका समितीची मंजुरी", "body": "<b>तालुकास्तरीय संजय गांधी योजना समिती<\/b> नियमितपणे बैठक घेऊन पात्र अर्ज मंजूर करते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? <b>कारण लेखी<\/b> मागा. राहिलेला पुरावा जोडून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दरमहा अनुदान जमा", "body": "रक्कम दर महिन्याला <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात येते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर पण पैसे आले नाहीत? बँक खाते <b>आधार-सीडेड, DBT सुरू<\/b> आणि चालू आहे का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अनुदान चालू ठेवा", "body": "<ul><li>दरवर्षी सांगितल्यावर <b>हयातीचा दाखला<\/b> सादर करा<\/li><li>बदल कळवा (पत्ता, बँक, पुनर्विवाह इ.)<\/li><li><b>65<\/b> वर्षे पूर्ण झाल्यावर वृद्धापकाळ निवृत्तिवेतन योजनेत बदलासाठी विचारा<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "पैसे अचानक बंद झाले? बहुतेक वेळा <b>हयातीचा दाखला<\/b> दिलेला नसतो किंवा बँक लिंक बदललेली असते."}}], "rights_t": "खूप दिवस प्रलंबित? पाठपुरावा करा.", "rights": "अर्ज क्रमांकासह <b>तहसीलदार / नायब तहसीलदार (संजय गांधी योजना)<\/b> यांना लेखी अर्ज द्या आणि <b>पोच<\/b> घ्या. <b>आपले सरकार<\/b> वर तक्रारही नोंदवता येते.", "help": "<b>स्थिती तपासा:<\/b> आपले सरकार (अर्ज क्रमांक) किंवा तहसील कार्यालय<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "shravanbal", "title": "Shravanbal Yojana", "local_name": "श्रावणबाळ योजना", "audience": "Seniors 65+", "state": "mh", "local": "mr", "cat": "pension", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "Thane Collectorate: SGNY / Shravanbal page", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/", "gov": true}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([Elderly person needs pension]) --> AG{Age 65 or more?}\n    AG -- No --> SG([Below 65: see Sanjay Gandhi Niradhar Yojana])\n    AG -- Yes --> E{1. Eligible?<br/>MH resident, very low income}\n    E -- No --> X([Not eligible])\n    E -- Yes --> G{BPL list?}\n    G -- Yes --> GB[Group B<br/>state + central IGNOAPS share]\n    G -- No --> GA[Group A<br/>state pension]\n    GA --> D[2. Documents<br/>age proof or govt doctor certificate,<br/>residence, income cert, BPL proof if any,<br/>Aadhaar, seeded bank a/c]\n    GB --> D\n    D --> AP[3. Apply free<br/>Aaple Sarkar / Tahsil SGY branch<br/>family can apply on behalf]\n    AP --> SC[4. Tahsil scrutiny<br/>Talathi local inquiry]\n    SC --> CM{5. Taluka SGY committee}\n    CM -- Rejected --> F1[Rejected: ask reason in writing]\n    CM -- Approved --> P[6. Monthly DBT pension]\n    P -- Bank not seeded / inactive --> F2[Payment failed]\n    P --> K[7. Keep running<br/>annual life certificate]\n    K -- Life certificate missed --> F3[Pension stopped]\n    SC -. pending long .-> T[Written application to Tahsildar SGY /<br/>Aaple Sarkar grievance]\n\n    S1[[Sathi: Age + scheme router<br/>Shravanbal vs SGNY, Group A vs B]]:::sathi -.-> G\n    S2[[Sathi: Readiness check<br/>age proof options, income cert, seeding]]:::sathi -.-> D\n    S3[[Sathi: Assisted mode<br/>family / e-Seva operator applies]]:::sathi -.-> AP\n    S4[[Sathi: Committee date + pending clock]]:::sathi -.-> T\n    S5[[Sathi: Life-certificate reminder<br/>to family members]]:::sathi -.-> K\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Thane district: Sanjay Gandhi / Shravanbal", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/"}, {"label": "Gadchiroli district: Sanjay Gandhi Yojana", "url": "https://gadchiroli.gov.in/sanjay-gandhi-yojana/"}, {"label": "Public Services Map: Maharashtra schemes", "url": "https://www.publicservicesmap.in/schemes/maharashtra"}], "verified": "2026-10-27", "en": {"h1": "Shravanbal Yojana: Monthly pension for senior citizens", "benefit": "₹1,500 monthly pension for elderly people aged 65+, paid into the bank", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You / family", "title": "Check if you can get it", "body": "<ul><li>Aged <b>65 or more<\/b><\/li><li>Living in <b>Maharashtra<\/b> for many years<\/li><li>Family income <b>up to ₹21,000 a year<\/b>, or on the BPL list<\/li><\/ul>There are two groups: families <b>on the BPL list<\/b> (state + central pension together) and families <b>not on the BPL list<\/b> (state pension).", "note": {"kind": "tip", "label": "Tip:", "html": "Below 65 and a widow, disabled or seriously ill? See <b>Sanjay Gandhi Niradhar Yojana<\/b> instead."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Keep these papers ready", "body": "<ul><li><b>Age proof<\/b>: school leaving certificate, birth certificate, voter ID, or age certificate from a government doctor<\/li><li><b>Residence proof<\/b><\/li><li><b>Income certificate<\/b> from the Tahsildar<\/li><li><b>BPL card / list extract<\/b>, if on the BPL list<\/li><li>Aadhaar, photo, bank passbook (account <b>linked to Aadhaar<\/b>)<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No birth or school record? A <b>government doctor's age certificate<\/b> is usually accepted."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Apply (it is free)", "body": "Choose any one:<ul><li><b>Aaple Sarkar<\/b> portal / Seva Kendra<\/li><li><b>Sanjay Gandhi Yojana branch<\/b> at your <b>Tahsil office<\/b>, or ask your Talathi for help<\/li><\/ul>A family member can apply on behalf of the elderly person. Note the <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never pay an agent to \"get it sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Papers are checked", "body": "The Tahsil office checks age, residence and income. The <b>Talathi<\/b> may do a local inquiry.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked for more papers? Submit them quickly with the application number and take an acknowledgement."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Taluka committee approves", "body": "The <b>taluka-level Sanjay Gandhi Yojana committee<\/b> also approves Shravanbal applications at its regular meetings.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Ask for the <b>reason in writing<\/b>. Fix the missing proof and apply again."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Pension every month", "body": "The pension comes by <b>DBT<\/b> into the Aadhaar-linked bank account every month.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Check the bank account is <b>Aadhaar-seeded with DBT on<\/b> and active."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Keep it running", "body": "<ul><li>Submit the <b>life certificate (हयातीचा दाखला)<\/b> every year when asked<\/li><li>Keep the bank account active<\/li><li>Tell the office about any change of address or bank<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pension suddenly stopped? Usually the <b>life certificate<\/b> was not submitted. Family members: set a yearly reminder."}}], "rights_t": "Pending too long? Follow up.", "rights": "Give a <b>written application to the Tahsildar / Naib Tahsildar (Sanjay Gandhi Yojana)<\/b> with the application number and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>Aaple Sarkar<\/b>.", "help": "<b>Check status:<\/b> Aaple Sarkar (application number) or Tahsil office<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "श्रावणबाळ योजना: ज्येष्ठ नागरिकांना दरमहा निवृत्तिवेतन", "benefit": "65 वर्षांवरील ज्येष्ठांना दरमहा ₹1,500 निवृत्तिवेतन, थेट बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "पात्रता तपासा", "body": "<ul><li>वय <b>65 किंवा जास्त<\/b><\/li><li>अनेक वर्षांपासून <b>महाराष्ट्रात<\/b> राहत असलेले<\/li><li>कौटुंबिक उत्पन्न <b>वर्षाला ₹21,000 पर्यंत<\/b>, किंवा BPL यादीत<\/li><\/ul>दोन गट आहेत: <b>दारिद्र्यरेषेखालील (BPL) यादीतील<\/b> कुटुंबे (राज्य + केंद्र निवृत्तिवेतन एकत्र) आणि <b>BPL यादीत नसलेली<\/b> कुटुंबे (राज्य निवृत्तिवेतन).", "note": {"kind": "tip", "label": "सूचना:", "html": "वय 65 पेक्षा कमी आणि विधवा, दिव्यांग किंवा गंभीर आजारी? त्याऐवजी <b>संजय गांधी निराधार अनुदान योजना<\/b> पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>वयाचा पुरावा<\/b>: शाळा सोडल्याचा दाखला, जन्म दाखला, मतदार ओळखपत्र, किंवा सरकारी डॉक्टरांचे वयाचे प्रमाणपत्र<\/li><li><b>रहिवासाचा पुरावा<\/b><\/li><li>तहसीलदारांचा <b>उत्पन्नाचा दाखला<\/b><\/li><li>BPL यादीत असल्यास <b>BPL कार्ड / यादीचा उतारा<\/b><\/li><li>आधार, फोटो, बँक पासबुक (खाते <b>आधारशी लिंक<\/b>)<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जन्म किंवा शाळेचा दाखला नाही? <b>सरकारी डॉक्टरांचे वयाचे प्रमाणपत्र<\/b> सहसा चालते."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>आपले सरकार<\/b> पोर्टल / सेवा केंद्र<\/li><li>तुमच्या <b>तहसील कार्यालयातील संजय गांधी योजना शाखा<\/b>, किंवा तलाठ्यांची मदत घ्या<\/li><\/ul>ज्येष्ठ व्यक्तीच्या वतीने कुटुंबीय अर्ज करू शकतात. <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज करणे <b>मोफत<\/b> आहे. \"मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील कार्यालय वय, रहिवास आणि उत्पन्न तपासते. <b>तलाठी<\/b> स्थानिक चौकशी करू शकतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "आणखी कागदपत्रे मागितली? अर्ज क्रमांकासह लवकर सादर करा आणि पोच घ्या."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "तालुका समितीची मंजुरी", "body": "<b>तालुकास्तरीय संजय गांधी योजना समिती<\/b> नियमित बैठकीत श्रावणबाळ अर्जही मंजूर करते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? <b>कारण लेखी<\/b> मागा. राहिलेला पुरावा जोडून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दरमहा निवृत्तिवेतन जमा", "body": "निवृत्तिवेतन दर महिन्याला <b>DBT<\/b> द्वारे आधार-लिंक बँक खात्यात येते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर पण पैसे आले नाहीत? बँक खाते <b>आधार-सीडेड, DBT सुरू<\/b> आणि चालू आहे का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "निवृत्तिवेतन चालू ठेवा", "body": "<ul><li>दरवर्षी सांगितल्यावर <b>हयातीचा दाखला<\/b> सादर करा<\/li><li>बँक खाते चालू ठेवा<\/li><li>पत्ता किंवा बँक बदलल्यास कार्यालयाला कळवा<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "निवृत्तिवेतन अचानक बंद झाले? बहुतेक वेळा <b>हयातीचा दाखला<\/b> दिलेला नसतो. कुटुंबीयांनो: दरवर्षीचे स्मरण ठेवा."}}], "rights_t": "खूप दिवस प्रलंबित? पाठपुरावा करा.", "rights": "अर्ज क्रमांकासह <b>तहसीलदार / नायब तहसीलदार (संजय गांधी योजना)<\/b> यांना लेखी अर्ज द्या आणि <b>पोच<\/b> घ्या. <b>आपले सरकार<\/b> वर तक्रारही नोंदवता येते.", "help": "<b>स्थिती तपासा:<\/b> आपले सरकार (अर्ज क्रमांक) किंवा तहसील कार्यालय<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "shiv-bhojan", "title": "Shiv Bhojan Thali", "local_name": "शिवभोजन थाळी", "audience": "Anyone (₹10 meal); centre operators", "state": "mh", "local": "mr", "cat": "pension", "links": [{"label": "Food & Civil Supplies Dept: Shiv Bhojan page", "url": "https://mahafood.gov.in/en/shivbhojan/", "gov": true}], "mermaid": "flowchart TD\n    subgraph DINER [Citizen: eating a thali]\n    A([Needs an affordable meal]) --> F[1. Find a Shiv Bhojan centre<br/>near hospital, bus stand, market]\n    F --> , "verified": "2026-10-27", "en": {"h1": "Shiv Bhojan Thali: A full meal for ₹10", "benefit": "Subsidised hot meal at government-approved centres across Maharashtra", "steps": [{"phase": "Before you go", "kind": "you", "who": "You", "title": "Know what you get", "body": "A thali with <b>chapatis, a vegetable, dal and rice<\/b> for about <b>₹10<\/b>.<br/><b>Anyone<\/b> can eat. <b>No ration card or document<\/b> is needed.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Find a Shiv Bhojan centre", "body": "Centres are usually near <b>hospitals, bus stands, markets and government offices<\/b> in towns and taluka places. Ask locally or at the <b>Tahsil / District Supply Office<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "The scheme is running, but individual centres can close. Check the centre is open before you travel."}}, {"phase": null, "kind": "you", "who": "You", "title": "Go at meal time", "body": "Centres serve mainly at <b>lunch time<\/b> (around midday). Each centre has a <b>limited number of plates<\/b> per day.", "note": {"kind": "tip", "label": "Tip:", "html": "<b>Go early.<\/b> Plates often run out."}}, {"phase": "At the centre", "kind": "gov", "who": "Centre", "title": "Pay ₹10, centre records you", "body": "Pay the fixed amount. The centre takes your <b>name and photo<\/b> in the Shiv Bhojan app. This is how the government counts plates and pays the centre.", "note": {"kind": "tip", "label": "Tip:", "html": "The photo is <b>normal and required<\/b>. It is not a charge and does not stop you from other schemes."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Enjoy your meal", "body": "Eat at the centre. Food should be <b>fresh, hot and clean<\/b>.", "note": null}], "rights_t": "Charged more, poor food or refused? Complain.", "rights": "Note the <b>centre name, date and time<\/b>. Complain to the <b>Tahsil / District Supply Officer<\/b> in writing, or on <b>Aaple Sarkar<\/b> grievances.", "help": "<b>Want to run a centre?<\/b> NGOs, self-help groups and mess owners can apply to the <b>District Supply Office<\/b><br/><b>Pay only the fixed price<\/b> · No document needed to eat"}, "loc": {"h1": "शिवभोजन थाळी: ₹10 मध्ये पूर्ण जेवण", "benefit": "महाराष्ट्रातील शासनमान्य केंद्रांवर सवलतीच्या दरात गरम जेवण", "steps": [{"phase": "जाण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "थाळीत काय मिळते", "body": "सुमारे <b>₹10<\/b> मध्ये <b>चपाती, भाजी, वरण आणि भात<\/b> असलेली थाळी.<br/><b>कोणीही<\/b> जेवू शकतो. <b>रेशन कार्ड किंवा कोणतेही कागदपत्र<\/b> लागत नाही.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "शिवभोजन केंद्र शोधा", "body": "केंद्रे सहसा शहरे व तालुक्याच्या ठिकाणी <b>रुग्णालये, बस स्थानके, बाजार आणि सरकारी कार्यालयांजवळ<\/b> असतात. स्थानिक लोकांना किंवा <b>तहसील / जिल्हा पुरवठा कार्यालयात<\/b> विचारा.", "note": {"kind": "tip", "label": "सूचना:", "html": "योजना सुरू आहे, पण एखादे केंद्र बंद होऊ शकते. जाण्यापूर्वी केंद्र सुरू आहे का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जेवणाच्या वेळी जा", "body": "केंद्रे मुख्यतः <b>दुपारच्या जेवणाच्या वेळी<\/b> जेवण देतात. प्रत्येक केंद्राला दररोज <b>ठराविक थाळ्या<\/b> असतात.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>लवकर जा.<\/b> थाळ्या अनेकदा संपतात."}}, {"phase": "केंद्रावर", "kind": "gov", "who": "केंद्र", "title": "₹10 द्या, केंद्र नोंद करते", "body": "ठरलेली रक्कम द्या. केंद्र शिवभोजन ॲपमध्ये तुमचे <b>नाव आणि फोटो<\/b> घेते. यावरूनच सरकार थाळ्या मोजून केंद्राला पैसे देते.", "note": {"kind": "tip", "label": "सूचना:", "html": "फोटो घेणे <b>सामान्य आणि आवश्यक<\/b> आहे. त्यासाठी पैसे लागत नाहीत आणि इतर योजनांवर परिणाम होत नाही."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "जेवणाचा आस्वाद घ्या", "body": "केंद्रावर जेवा. जेवण <b>ताजे, गरम आणि स्वच्छ<\/b> असले पाहिजे.", "note": null}], "rights_t": "जास्त पैसे, खराब जेवण किंवा नकार? तक्रार करा.", "rights": "<b>केंद्राचे नाव, तारीख आणि वेळ<\/b> नोंदवा. <b>तहसील / जिल्हा पुरवठा अधिकाऱ्यांकड tication<\/b> in the app, or update the mobile at an Aadhaar centre."}}, {"phase": null, "kind": "you", "who": "You", "title": "Make the card (it is free)", "body": "On the <b>Ayushman app<\/b>: log in with mobile → search your family → select a member → <b>Aadhaar eKYC<\/b> (OTP or face) → take photo → submit.<br/>Or get help at a <b>CSC / e-Seva Kendra<\/b>, the <b>Ayushman Mitra<\/b> desk at a network hospital, or your <b>ASHA<\/b> worker.", "note": {"kind": "tip", "label": "Tip:", "html": "Repeat for <b>every family member<\/b>. Each person gets their own card."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Card is approved", "body": "The <b>State Health Agency<\/b> checks the details and approves the card. This is usually quick.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status <b>pending<\/b> for long or <b>rejected<\/b>? Often the name on Aadhaar doesn't match the family list. Ask the Ayushman Mitra or CSC to correct it."}}, {"phase": null, "kind": "you", "who": "You", "title": "Download your card", "body": "Download the card (PDF) from the app or website. Keep it on your phone and print a copy.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Use it at any network hospital in India", "body": "At an empanelled hospital, show your card or Aadhaar at the <b>Ayushman Mitra<\/b> desk. Covered treatment is <b>cashless<\/b>, even in another state.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked to pay for covered treatment? Refuse politely, ask for it in writing, and call the <b>Ayushman helpline<\/b>."}}], "rights_t": "Card or treatment problem? Complain.", "rights": "Use the <b>grievance option on the Ayushman portal / app<\/b>, call the <b>Ayushman helpline<\/b>, or contact your district's <b>Ayushman / MJPJAY coordinator<\/b>.", "help": "<b>Card:<\/b> Ayushman app / beneficiary.nha.gov.in · <b>Hospitals:<\/b> hospitals.pmjay.gov.in<br/><b>The card is free<\/b>, never pay anyone वरील नाव कुटुंबाच्या यादीशी जुळत नाही. आयुष्मान मित्र किंवा CSC कडून दुरुस्त करून घ्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कार्ड डाउनलोड करा", "body": "ॲप किंवा वेबसाइटवरून कार्ड (PDF) डाउनलोड करा. फोनमध्ये ठेवा आणि एक प्रिंट काढा.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "भारतातील कोणत्याही नेटवर्क रुग्णालयात वापरा", "body": "अंगीकृत रुग्णालयात <b>आयुष्मान मित्र<\/b> कक्षात कार्ड किंवा आधार दाखवा. समाविष्ट उपचार <b>कॅशलेस<\/b> मिळतात, दुसऱ्या राज्यातही.", "note": {"kind": "stuck", "label": "अडचण?", "html": "समाविष्ट उपचारासाठी पैसे मागितले? नम्रपणे नकार द्या, लेखी मागा आणि <b>आयुष्मान हेल्पलाइनला<\/b> फोन करा."}}], "rights_t": "कार्ड किंवा उपचाराबाबत अडचण? तक्रार करा.", "rights": "<b>आयुष्मान पोर्टल / ॲपवरील तक्रार<\/b> सुविधा वापरा, <b>आयुष्मान हेल्पलाइनला<\/b> फोन करा, किंवा तुमच्या जिल्ह्याच्या <b>आयुष्मान / MJPJAY समन्वयकांशी<\/b> संपर्क साधा.", "help": "<b>कार्ड:<\/b> आयुष्मान ॲप / beneficiary.nha.gov.in · <b>रुग्णालये:<\/b> hospitals.pmjay.gov.in<br/><b>कार्ड मोफत आहे<\/b>, ते काढण्यासाठी कोणालाही पैसे देऊ नका · <b>फक्त .gov.in वेबसाइट व अधिकृत ॲप वापरा<\/b>"}}, {"slug": "mjpjay", "title": "MJPJAY", "local_name": "महात्मा ज्योतिराव फुले जन आरोग्य योजना", "audience": "Maharashtra families (cashless treatment)", "state": "mh", "local": "mr", "cat": "health", "links": [{"label": "MJPJAY (Jeevandayee): hospitals, packages", "url": "https://www.jeevandayee.gov.in", "gov": true}, {"label": "MJPJAY contact page", "url": "https://www.jeevandayee.gov.in/MJPJAY/marathi/ContactUs.html", "gov": true}, {"label": "Short code 155388 (DoT allotment)", "url": "https://dot.gov.in/node/4256", "gov": true}], "mermaid": "flowchart TD\n    A([Family in Maharashtra]) --> E{1. Covered?<br/>MH resident with ration card<br/>or domicile proof}\n    E -- No --> X([Check road-accident cover / other schemes])\n    E -- Yes --> C[2. Make Ayushman / MJPJAY e-card<br/>Ayushman app, CSC or hospital desk<br/>Aadhaar eKYC, every member]\n    C --> NEED([Treatment needed])\n    NEED --> H{3. Network hospital?}\n    H -- No --> F0[Not cashless: find nearest<br/>network hospital via Aarogyamitra / helpline]\n    H -- Yes --> AM[Aarogyamitra desk<br/>identity + card check]\n    AM --> DX[Doctor diagnosis]\n    DX --> EM{Emergency?}\n    EM -- Yes --> TR\n    EM -- No --> PA[4. Pre-authorization request<br/>to scheme with reports]\n    PA -- Reports missing --> F1[Approval delayed]\n    PA -- Approved --> TR[5. Cashless treatment<br/>procedure, medicines, tests, stay]\n    TR -- Asked to pay --> F2[Illegal charge]\n    TR --> DS([6. Discharge + follow-up])\n    F2 -.-> T[Helpline / district coordinator /<br/>written complaint]\n\n    S1[[Sathi: Coverage check<br/>is my treatment included?]]:::sathi -.-> E\n    S2[[Sathi: Family e-card drive<br/>card for every member in advance]]:::sathi -.-> C\n    S3[[Sathi: Nearest network hospital<br/>for this procedure, on map]]:::sathi -.-> H\n    S4[[Sathi: Know your rights<br/>no deposit, no charges for covered items]]:::sathi -.-> F2\n    S5[[Sathi: Store discharge summary<br/>in family vault]]:::sathi -.-> DS\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "India TV: ₹5 lakh coverage for all from July", "url": "https://www.indiatvnews.com/maharashtra/maharashtra-upgraded-health-scheme-july-launch-premium-hike-mahatma-jyotirao-phule-jan-arogya-abhiyan-mjpjay-shas-ayushman-bharat-2024-06-18-937505"}, {"label": "Business Today: govt to directly pay MJPJAY claims", "url": "https://www.businesstoday.in/personal-finance/insurance/story/maharashtra-govt-to-directly-pay-cashless-claims-under-mjpjay-scheme-check-details-446631-2024-09-19"}, {"label": "Policybazaar: MJPJAY", "url": "https://www.policybazaar.com/health-insurance/govt-scheme/mahatma-jyotirao-phule-jan-arogya/"}], "verified": "2026-10-27", "en": {"h1": "Mahatma Jyotiba Phule Jan Arogya Yojana: Free hospital treatment", "benefit": "Cashless treatment up to about ₹5 lakh per family per year at network hospitals", "steps": [{"phase": "Before you need treatment", "kind": "you", "who": "You / family", "title": "Check you are covered", "body": "Families living in <b>Maharashtra<\/b> with a <b>ration card<\/b> (any colour) or domicile proof are covered. Many <b>surgeries and treatments<\/b> (heart, cancer, kidney, accidents, etc.) are included. The scheme works together with <b>Ayushman Bharat (PM-JAY)<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Road accident in Maharashtra? Treatment may be covered even if you are not a resident. Ask at the hospital."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Get your health card", "body": "Make your <b>Ayushman / MJPJAY e-card<\/b> (free) using Aadhaar:<ul><li>On the <b>Ayushman app<\/b> with Aadhaar OTP / face authentication<\/li><li>At a <b>CSC / e-Seva Kendra<\/b> or the hospital's help desk<\/li><\/ul>Keep <b>Aadhaar<\/b> and <b>ration card<\/b> ready.", "note": {"kind": "tip", "label": "Tip:", "html": "Make cards for <b>every family member now<\/b>, not during an emergency."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Go to a network hospital", "body": "Only <b>empanelled (network) hospitals<\/b> give cashless treatment. Find them on <b>jeevandayee.gov.in<\/b> or the app. At the hospital, go to the <b>Aarogyamitra (आरोग्यमित्र) desk<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Hospital is not in the network? Ask the Aarogyamitra or helpline for the <b>nearest network hospital<\/b> for your treatment."}}, {"phase": "At the hospital", "kind": "gov", "who": "Hospital / Scheme", "title": "Hospital asks for approval", "body": "The doctor diagnoses you. The Aarogyamitra sends a <b>pre-authorization<\/b> request to the scheme with your reports.<br/>In an <b>emergency<\/b>, treatment should start immediately; approval is sought alongside.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approval delayed? Ask the Aarogyamitra for the <b>status<\/b>. Missing reports are the usual reason."}}, {"phase": null, "kind": "gov", "who": "Hospital / Scheme", "title": "Cashless treatment", "body": "Your treatment, <b>medicines, tests, stay and food<\/b> for the covered procedure are paid by the scheme. You should <b>not pay<\/b> for them.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked to pay a deposit or for covered items? <b>Refuse politely<\/b>, ask for it in writing, and call the <b>scheme helpline<\/b>."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Discharge and follow-up", "body": "Sign the discharge papers and keep a copy of all reports. <b>Follow-up<\/b> visits and medicines for the covered procedure are also included for a period.", "note": {"kind": "tip", "label": "Tip:", "html": "Keep the <b>discharge summary<\/b> safe. You will need it for future treatment."}}], "rights_t": "Asked to pay? Cashless treatment is your right.", "rights": "Call the <b>MJPJAY / Ayushman helpline<\/b> or contact the <b>district coordinator<\/b> of the scheme. Note the hospital name, date and amount demanded. You can also file a written complaint with the hospital and the district office.", "help": "<b>Find hospitals and procedures:<\/b> jeevandayee.gov.in · <b>Card:<\/b> Ayushman app / beneficiary.nha.gov.in<br/><b>Card and treatment are free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "महात्मा ज्योतिराव फुले जन आरोग्य योजना: मोफत रुग्णालय उपचार", "benefit": "नेटवर्क रुग्णालयांमध्ये प्रति कुटुंब दरवर्षी सुमारे ₹5 लाखांपर्यंत कॅशलेस उपचार", "steps": [{"phase": "उपचाराची गरज पडण्यापूर्वी", "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "तुम्ही पात्र आहात का ते तपासा", "body": "<b>महाराष्ट्रात<\/b> राहणारी आणि <b>रेशन कार्ड<\/b> (कोणत्याही रंगाचे) किंवा अधिवास पुरावा असलेली कुटुंबे पात्र आहेत. अनेक <b>शस्त्रक्रिया आणि उपचार<\/b> (हृदय, कर्करोग, मूत्रपिंड, अपघात इ.) समाविष्ट आहेत. ही योजना <b>आयुष्मान भारत (PM-JAY)<\/b> सोबत एकत्रितपणे चालते.", "note": {"kind": "tip", "label": "सूचना:", "html": "महाराष्ट्रात रस्ते अपघात? तुम्ही इथले रहिवासी नसलात तरी उपचार समाविष्ट असू शकतात. रुग्णालयात विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "आरोग्य कार्ड मिळवा", "body": "आधार वापरून तुमचे <b>आयुष्मान / MJPJAY ई-कार्ड<\/b> (मोफत) काढा:<ul><li><b>आयुष्मान ॲपवर<\/b> आधार OTP / चेहरा प्रमाणीकरणाने<\/li><li><b>CSC / ई-सेवा केंद्र<\/b> किंवा रुग्णालयाच्या मदत कक्षात<\/li><\/ul><b>आधार<\/b> आणि <b>रेशन कार्ड<\/b> तयार ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "आपत्कालीन वेळी नाही, तर <b>आत्ताच कुटुंबातील प्रत्येकाचे<\/b> कार्ड काढून ठेवा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "नेटवर्क रुग्णालयात जा", "body": "फक्त <b>अंगीकृत (नेटवर्क) रुग्णालयांमध्ये<\/b> कॅशलेस उपचार मिळतात. ती <b>jeevandayee.gov.in<\/b> किंवा ॲपवर शोधा. रुग्णालयात <b>आरोग्यमित्र कक्षात<\/b> जा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "रुग्णालय नेटवर्कमध्ये नाही? तुमच्या उपचारासाठी <b>जवळचे नेटवर्क रुग्णालय<\/b> आरोग्यमित्र किंवा हेल्पलाइनला विचारा."}}, {"phase": "रुग्णालयात", "kind": "gov", "who": "रुग्णालय / योजना", "title": "रुग्णालय मंजुरी मागते", "body": "डॉक्टर निदान करतात. आरोग्यमित्र तुमच्या अहवालांसह योजनेकडे <b>पूर्व-मंजुरीची<\/b> विनंती पाठवतात.<br/><b>आपत्कालीन<\/b> स्थितीत उपचार लगेच सुरू व्हायला हवेत; मंजुरी सोबतच मागितली जाते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजुरीला उशीर? आरोग्यमित्रांकडे <b>स्थिती<\/b> विचारा. बहुतेक वेळा अहवाल अपूर्ण असतात."}}, {"phase": null, "kind": "gov", "who": "रुग्णालय / योजना", "title": "कॅशलेस उपचार", "body": "समाविष्ट उपचारासाठी तुमचे उपचार, <b>औषधे, तपासण्या, राहणे आणि जेवण<\/b> यांचा खर्च योजना करते. तुम्ही त्यासाठी <b>पैसे देऊ नयेत<\/b>.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अनामत रक्कम किंवा समाविष्ट गोष्टींसाठी पैसे मागितले? <b>नम्रपणे नकार द्या<\/b>, लेखी मागा आणि <b>योजनेच्या हेल्पलाइनला<\/b> फोन करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "डिस्चार्ज व पाठपुरावा", "body": "डिस्चार्जच्या कागदांवर सही करा आणि सर्व अहवालांची प्रत ठेवा. समाविष्ट उपचारासाठी काही काळ <b>पाठपुरावा<\/b> तपासण्या आणि औषधेही मिळतात.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>डिस्चार्ज सारांश<\/b> जपून ठेवा. पुढील उपचारासाठी तो लागतो."}}], "rights_t": "पैसे मागितले? कॅशलेस उपचार हा तुमचा हक्क आहे.", "rights": "<b>MJPJAY / आयुष्मान हेल्पलाइनवर<\/b> फोन करा किंवा योजनेच्या <b>जिल्हा समन्वयकांशी<\/b> संपर्क साधा. रुग्णालयाचे नाव, तारीख आणि मागितलेली रक्कम नोंदवून ठेवा. रुग्णालय व जिल्हा कार्यालयाकडे लेखी तक्रारही देता येते.", "help": "<b>रुग्णालये व उपचार शोधा:<\/b> jeevandayee.gov.in · <b>कार्ड:<\/b> आयुष्मान ॲप / beneficiary.nha.gov.in<br/><b>कार्ड आणि उपचार मोफत आहेत<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "annasaheb-patil", "title": "Annasaheb Patil loan scheme", "local_name": "अण्णासाहेब पाटील कर्ज योजना", "audience": "Open-category communities (interest refund)", "state": "mh", "local": "mr", "cat": "loan", "links": [{"label": "Annasaheb Patil Mahamandal portal: apply, LOI, interest claim", "url": "https://udyog.mahaswayam.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Wants to start / expand a business]) --> E{1. Eligible?<br/>MH resident, community without other corporation,<br/>economically backward, age + income limit}\n    E -- No --> X([Check other corporations / schemes])\n    E -- Yes --> PL[2. Plan business + project report]\n    PL --> D[3. Documents<br/>Aadhaar, income cert / ITR, domicile,<br/>age + community proof, bank details]\n    D --> R[4. Register on udyog.mahaswayam.gov.in<br/>apply for LOI]\n    R --> LOI{5. Corporation scrutiny}\n    LOI -- Doc issue --> F1[Sent back: re-upload]\n    LOI -- OK --> L[LOI / eligibility certificate issued]\n    L --> B{6. Bank appraisal}\n    B -- Refused --> F2[Bank refusal:<br/>another bank / better report / credit score]\n    B -- Sanctioned --> S[Loan disbursed<br/>upload sanction letter]\n    S --> EMI[7. Pay EMIs on time<br/>upload loan statement]\n    EMI -- Late / missed EMI --> F3[No refund for that period]\n    EMI -- Regular --> IR([8. Interest refunded<br/>up to cap, for set years])\n    F2 -. still stuck .-> T[District coordinator /<br/>bank grievance / Lead Bank Manager]\n\n    S1[[Sathi: Eligibility + corporation router]]:::sathi -.-> E\n    S2[[Sathi: Project report template<br/>EMI affordability check]]:::sathi -.-> PL\n    S3[[Sathi: Bank-readiness check<br/>credit score, documents, which banks lend]]:::sathi -.-> B\n    S4[[Sathi: EMI reminders +<br/>monthly refund-claim tracker]]:::sathi -.-> EMI\n    S5[[Sathi: Escalation draft]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Surajya Consultancy: APAMVM", "url": "https://www.surajyaconsultancy.com/scheme/apamvm"}, {"label": "GovCSC: Annasaheb Patil loan scheme", "url": "https://govcsc.com/annasaheb-patil-loan-scheme/"}, {"label": "Pune People's Co-op Bank", "url": "https://www.punepeoples.bank.in/annasaheb-patil-mahamandal-karj-yojana"}, {"label": "SKOCH: Loan Interest Reimbursement Scheme", "url": "https://exhibition.skoch.in/beacon-of-hope/annasaheb-patil-arthik-magas-vikas-mahamandal-maryadit-mumbai/"}], "verified": "2026-10-27", "en": {"h1": "Annasaheb Patil Loan Scheme: Interest-free business loan", "benefit": "Take a bank loan for your business; the corporation refunds the interest if you pay EMIs on time", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Resident of <b>Maharashtra<\/b><\/li><li>From an <b>economically backward<\/b> family of a community <b>not covered by another state corporation<\/b> (e.g. Maratha and other open-category communities)<\/li><li>Within the <b>age limit<\/b> (adult, working age)<\/li><li>Family income <b>up to about ₹8 lakh a year<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Individual loans and <b>group loans<\/b> (for farmer groups / SHGs) are both available."}}, {"phase": null, "kind": "you", "who": "You", "title": "Plan your business", "body": "Decide the business (farm-related, manufacturing, service or trade) and how much loan you need. Prepare a simple <b>project report<\/b>: cost, income, EMI you can pay.", "note": {"kind": "tip", "label": "Tip:", "html": "A clear project report is what <b>convinces the bank<\/b>. Ask a CA or the district office for a format."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, photo, mobile linked to Aadhaar<\/li><li><b>Income certificate<\/b> or ITR<\/li><li><b>Domicile<\/b> / residence proof, age proof<\/li><li>Community proof (e.g. school leaving certificate / caste certificate)<\/li><li>Project report, bank details<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No income or domicile certificate? Get them first on Aaple Sarkar."}}, {"phase": null, "kind": "you", "who": "You", "title": "Register and get the Letter of Intent", "body": "Register on the corporation's portal (<b>udyog.mahaswayam.gov.in<\/b>), fill your details, upload documents and apply for the <b>Letter of Intent (LOI)<\/b> / eligibility certificate.", "note": {"kind": "tip", "label": "Tip:", "html": "Registration is <b>free<\/b>. Never pay an agent to \"get the loan sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Corporation / Bank", "title": "Corporation issues LOI", "body": "The corporation checks your documents and issues the <b>LOI<\/b>, which tells the bank you are eligible for interest refund.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Application sent back? Usually a document is unclear or income proof is missing. Re-upload and resubmit."}}, {"phase": null, "kind": "gov", "who": "Corporation / Bank", "title": "Bank sanctions the loan", "body": "Take the LOI and project report to a bank. The <b>bank decides<\/b> and sanctions the loan. Upload the sanction letter on the portal.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Bank refused? The corporation does not force banks. Try <b>another bank<\/b>, improve the project report, check your credit score, or ask the <b>district coordinator<\/b> for help."}}, {"phase": null, "kind": "you", "who": "You", "title": "Pay every EMI on time", "body": "Pay EMIs <b>regularly<\/b>. Upload your <b>loan account statement<\/b> on the portal to claim the interest refund.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missed or late EMIs can <b>stop the interest refund<\/b> for that period."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Interest refunded", "body": "The corporation refunds the <b>interest<\/b> (up to a set limit, for a set number of years) for EMIs paid on time. Your loan becomes almost <b>interest-free<\/b>.", "note": null}], "rights_t": "Stuck with corporation or bank? Escalate.", "rights": "For LOI or refund delays, contact the corporation's <b>district coordinator / office<\/b> in writing. For unfair bank refusal, use the <b>bank's grievance channel<\/b> or the district <b>Lead Bank Manager<\/b>.", "help": "<b>Portal:<\/b> udyog.mahaswayam.gov.in · Keep EMI receipts and statements safe<br/><b>Registration is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "अण्णासाहेब पाटील कर्ज योजना: व्यवसायासाठी बिनव्याजी कर्ज", "benefit": "व्यवसायासाठी बँक कर्ज घ्या; हप्ते वेळेवर भरल्यास महामंडळ व्याज परत करते", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>महाराष्ट्राचे<\/b> रहिवासी<\/li><li>ज्या समाजासाठी <b>इतर राज्य महामंडळ नाही<\/b> अशा समाजातील (उदा. मराठा व इतर खुल्या प्रवर्गातील) <b>आर्थिकदृष्ट्या मागास<\/b> कुटुंब<\/li><li><b>वयोमर्यादेत<\/b> (प्रौढ, कार्यक्षम वय)<\/li><li>कौटुंबिक उत्पन्न <b>वर्षाला सुमारे ₹8 लाखांपर्यंत<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "वैयक्तिक कर्ज आणि <b>गट कर्ज<\/b> (शेतकरी गट / बचत गटांसाठी) दोन्ही उपलब्ध आहेत."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "व्यवसायाची योजना करा", "body": "व्यवसाय ठरवा (शेतीपूरक, उत्पादन, सेवा किंवा व्यापार) आणि किती कर्ज हवे ते ठरवा. सोपा <b>प्रकल्प अहवाल<\/b> तयार करा: खर्च, उत्पन्न, तुम्ही भरू शकाल असा हप्ता.", "note": {"kind": "tip", "label": "सूचना:", "html": "स्पष्ट प्रकल्प अहवालामुळेच <b>बँकेचा विश्वास<\/b> बसतो. नमुन्यासाठी CA किंवा जिल्हा कार्यालयाला विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार, फोटो, आधारशी लिंक मोबाईल<\/li><li><b>उत्पन्नाचा दाखला<\/b> किंवा ITR<\/li><li><b>अधिवास<\/b> / रहिवास पुरावा, वयाचा पुरावा<\/li><li>समाजाचा पुरावा (उदा. शाळा सोडल्याचा दाखला / जातीचा दाखला)<\/li><li>प्रकल्प अहवाल, बँक तपशील<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "उत्पन्नाचा किंवा अधिवास दाखला नाही? आधी आपले सरकार वरून काढा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "नोंदणी करून LOI मिळवा", "body": "महामंडळाच्या पोर्टलवर (<b>udyog.mahaswayam.gov.in<\/b>) नोंदणी करा, माहिती भरा, कागदपत्रे अपलोड करा आणि <b>हेतूपत्र (LOI)<\/b> / पात्रता प्रमाणपत्रासाठी अर्ज करा.", "note": {"kind": "tip", "label": "सूचना:", "html": "नोंदणी <b>मोफत<\/b> आहे. \"कर्ज मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महामंडळ / बँक", "title": "महामंडळाकडून LOI", "body": "महामंडळ कागदपत्रे तपासून <b>LOI<\/b> देते. यावरून बँकेला कळते की तुम्ही व्याज परताव्यासाठी पात्र आहात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज परत पाठवला? बहुतेक वेळा एखादे कागदपत्र अस्पष्ट असते किंवा उत्पन्नाचा पुरावा नसतो. पुन्हा अपलोड करून सादर करा."}}, {"phase": null, "kind": "gov", "who": "महामंडळ / बँक", "title": "बँकेकडून कर्ज मंजूर", "body": "LOI आणि प्रकल्प अहवाल घेऊन बँकेत जा. <b>निर्णय बँक घेते<\/b> आणि कर्ज मंजूर करते. मंजुरी पत्र पोर्टलवर अपलोड करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "बँकेने नकार दिला? महामंडळ बँकांवर सक्ती करत नाही. <b>दुसऱ्या बँकेत<\/b> प्रयत्न करा, प्रकल्प अहवाल सुधारा, क्रेडिट स्कोअर तपासा, किंवा <b>जिल्हा समन्वयकांची<\/b> मदत घ्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "प्रत्येक हप्ता वेळेवर भरा", "body": "हप्ते <b>नियमितपणे<\/b> भरा. व्याज परतावा मागण्यासाठी तुमचे <b>कर्ज खाते विवरण<\/b> पोर्टलवर अपलोड करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "हप्ता चुकला किंवा उशिरा भरला तर त्या कालावधीचा <b>व्याज परतावा थांबू<\/b> शकतो."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "व्याज परतावा मिळतो", "body": "वेळेवर भरलेल्या हप्त्यांचे <b>व्याज<\/b> महामंडळ परत करते (ठराविक मर्यादेपर्यंत, ठराविक वर्षांसाठी). तुमचे कर्ज जवळजवळ <b>बिनव्याजी<\/b> होते.", "note": null}], "rights_t": "महामंडळ किंवा बँकेकडे अडकले? पाठपुरावा करा.", "rights": "LOI किंवा परताव्याला उशीर झाल्यास महामंडळाच्या <b>जिल्हा समन्वयक / कार्यालयाकडे<\/b> लेखी संपर्क करा. बँकेने अन्यायाने नकार दिल्यास <b>बँकेची तक्रार यंत्रणा<\/b> किंवा जिल्ह्याचे <b>अग्रणी बँक व्यवस्थापक<\/b> यांच्याकडे जा.", "help": "<b>पोर्टल:<\/b> udyog.mahaswayam.gov.in · हप्त्यांच्या पावत्या आणि विवरणे जपून ठेवा<br/><b>नोंदणी मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "mahatma-phule-mahamandal", "title": "Mahatma Phule Mahamandal loans", "local_name": "महात्मा फुले महामंडळ", "audience": "SC / Nav-Bauddha families", "state": "mh", "local": "mr", "cat": "loan", "links": [{"label": "Mahatma Phule Mahamandal (MPBCDC)", "url": "https://mpbcdc.maharashtra.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([SC / Nav-Bauddha family wants a business]) --> E{1. Eligible?<br/>MH resident, age + income limit,<br/>no earlier default}\n    E -- No --> X([Check other schemes])\n    E -- Yes --> SCH{2. Project size}\n    SCH -- Small --> S1A[Subsidy scheme<br/>subsidy + bank loan]\n    SCH -- Medium --> S2A[Seed capital<br/>corporation share + bank loan]\n    SCH -- Larger --> S3A[NSFDC term loan<br/>via corporation]\n    S1A --> P[3. Business plan + quotations]\n    S2A --> P\n    S3A --> P\n    P --> D[4. Documents<br/>caste + income cert, domicile, Aadhaar,<br/>project report, place proof, no-dues]\n    D --> AP[5. Apply at district office<br/>acknowledgement]\n    AP --> SC[6. Scrutiny + site visit]\n    SC -- Missing quotation / place proof --> F1[Pending: fix and resubmit]\n    SC --> CM{Sanction committee}\n    CM -- Rejected --> F2[Rejected with reason]\n    CM -- Sanctioned --> BK{Bank part needed?}\n    BK -- Yes --> BANK[Bank sanctions its loan]\n    BANK -- Delay --> F3[Bank delay:<br/>corporation follows up]\n    BK -- No --> REL\n    BANK --> REL[7. Release to supplier<br/>asset verification]\n    REL --> RUN([8. Run business, repay EMIs])\n    RUN -- Missed EMIs --> F4[Defaulter: future loans blocked]\n    F1 -. stuck long .-> T[District manager / regional office /<br/>Lead Bank Manager]\n\n    X1[[Sathi: Eligibility + scheme-size router]]:::sathi -.-> SCH\n    X2[[Sathi: Project report + quotation checklist]]:::sathi -.-> P\n    X3[[Sathi: Readiness: caste + income certs]]:::sathi -.-> D\n    X4[[Sathi: Pending clock + escalation draft]]:::sathi -.-> T\n    X5[[Sathi: EMI reminders]]:::sathi -.-> RUN\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3,F4 blocked", "sources": [{"label": "MahaBharti: Anudan Yojana for Backward Class (mpbcdc)", "url": "https://mahabharti.in/yojana/anudan-yojana-for-backward-class"}], "verified": "2026-10-27", "en": {"h1": "Mahatma Phule Mahamandal: Business loan and subsidy for SC families", "benefit": "Subsidy, low-interest margin money and loans to start a small business", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>From a <b>Scheduled Caste or Nav-Bauddha<\/b> family, living in <b>Maharashtra<\/b><\/li><li>Within the <b>age limit<\/b> (adult, working age)<\/li><li>Family income <b>below the scheme limit<\/b><\/li><li>Not a defaulter on any earlier government / corporation loan<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Pick the right scheme", "body": "<ul><li><b>Small project<\/b> → <b>subsidy scheme<\/b>: part subsidy, rest bank loan<\/li><li><b>Medium project<\/b> → <b>seed capital (margin money)<\/b>: corporation gives a low-interest share, bank gives the main loan<\/li><li><b>Larger project<\/b> → <b>NSFDC term loan<\/b> through the corporation at low interest<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Ask the <b>district office<\/b> which scheme fits your project amount. Limits change by GR."}}, {"phase": null, "kind": "you", "who": "You", "title": "Plan the business, get quotations", "body": "Decide the business (shop, dairy, auto-rickshaw, tailoring, workshop, etc.). Get <b>quotations<\/b> for machines / goods and make a simple <b>project report<\/b>.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Caste certificate<\/b><\/li><li><b>Income certificate<\/b>, domicile, age proof<\/li><li>Aadhaar, ration card, photo, bank passbook<\/li><li>Project report and quotations<\/li><li>Shop / place proof (rent agreement or ownership), if needed<\/li><li><b>No-dues certificate<\/b> from banks, if asked<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No caste or income certificate? Get them first on Aaple Sarkar."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply at the district office", "body": "Submit the form with documents at the corporation's <b>district office<\/b> (or online where available). Take an <b>acknowledgement<\/b> with the application number.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never pay an agent to \"get the loan sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Corporation / Bank", "title": "Scrutiny, site visit and sanction", "body": "The district office checks your papers and may <b>visit your proposed business place<\/b>. The application is placed before the <b>sanction committee<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pending for long? Ask the <b>district manager<\/b> for the status in writing. Missing quotations or place proof are common reasons."}}, {"phase": null, "kind": "gov", "who": "Corporation / Bank", "title": "Money is released", "body": "For subsidy / seed-capital schemes the file goes to the <b>bank<\/b>, which sanctions its loan. Money is usually paid <b>to the supplier<\/b> for the asset. The office may verify the asset was bought.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Bank delaying its share? Contact the corporation's district office; they follow up with the bank."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Run the business, repay on time", "body": "Start your business. Pay every <b>EMI on time<\/b> to the bank / corporation. Good repayment makes you eligible for <b>bigger loans later<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missed EMIs make you a <b>defaulter<\/b> and block future loans and schemes."}}], "rights_t": "Stuck for long? Escalate.", "rights": "Give a written application to the corporation's <b>district manager<\/b> with your application number and take an <b>acknowledgement (पोच)<\/b>. If not solved, write to the <b>regional / head office<\/b>. For bank delays, contact the district <b>Lead Bank Manager<\/b>.", "help": "<b>Apply at:<\/b> Mahatma Phule Mahamandal district office · <b>Website:<\/b> mpbcdc.maharashtra.gov.in · Keep all receipts and EMI records<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "महात्मा फुले महामंडळ: अनुसूचित जातीतील कुटुंबांसाठी व्यवसाय कर्ज व अनुदान", "benefit": "छोटा व्यवसाय सुरू करण्यासाठी अनुदान, कमी व्याजाचे बीज भांडवल आणि कर्ज", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>अनुसूचित जाती किंवा नवबौद्ध<\/b> कुटुंबातील, <b>महाराष्ट्राचे<\/b> रहिवासी<\/li><li><b>वयोमर्यादेत<\/b> (प्रौढ, कार्यक्षम वय)<\/li><li>कौटुंबिक उत्पन्न <b>योजनेच्या मर्यादेपेक्षा कमी<\/b><\/li><li>पूर्वीच्या कोणत्याही सरकारी / महामंडळ कर्जाचे थकबाकीदार नसावे<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "योग्य योजना निवडा", "body": "<ul><li><b>छोटा प्रकल्प<\/b> → <b>अनुदान योजना<\/b>: काही अनुदान, उरलेले बँक कर्ज<\/li><li><b>मध्यम प्रकल्प<\/b> → <b>बीज भांडवल योजना<\/b>: महामंडळाचा कमी व्याजाचा हिस्सा, मुख्य कर्ज बँकेचे<\/li><li><b>मोठा प्रकल्प<\/b> → महामंडळामार्फत कमी व्याजाचे <b>NSFDC मुदत कर्ज<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमच्या प्रकल्प रकमेसाठी कोणती योजना योग्य ते <b>जिल्हा कार्यालयात<\/b> विचारा. मर्यादा शासन निर्णयानुसार बदलतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "व्यवसायाची योजना, कोटेशन घ्या", "body": "व्यवसाय ठरवा (दुकान, दुग्धव्यवसाय, ऑटो-रिक्षा, शिवणकाम, कार्यशाळा इ.). यंत्रे / मालासाठी <b>कोटेशन<\/b> घ्या आणि सोपा <b>प्रकल्प अहवाल<\/b> तयार करा.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>जातीचा दाखला<\/b><\/li><li><b>उत्पन्नाचा दाखला<\/b>, अधिवास, वयाचा पुरावा<\/li><li>आधार, रेशन कार्ड, फोटो, बँक पासबुक<\/li><li>प्रकल्प अहवाल आणि कोटेशन<\/li><li>लागल्यास दुकान / जागेचा पुरावा (भाडेकरार किंवा मालकी)<\/li><li>मागितल्यास बँकांचे <b>थकबाकी नसल्याचे प्रमाणपत्र<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जातीचा किंवा उत्पन्नाचा दाखला नाही? आधी आपले सरकार वरून काढा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जिल्हा कार्यालयात अर्ज करा", "body": "कागदपत्रांसह अर्ज महामंडळाच्या <b>जिल्हा कार्यालयात<\/b> (किंवा उपलब्ध असल्यास ऑनलाइन) सादर करा. अर्ज क्रमांकासह <b>पोच<\/b> घ्या.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज करणे <b>मोफत<\/b> आहे. \"कर्ज मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महामंडळ / बँक", "title": "छाननी, स्थळ पाहणी व मंजुरी", "body": "जिल्हा कार्यालय कागदपत्रे तपासते आणि <b>प्रस्तावित व्यवसायाच्या जागेची पाहणी<\/b> करू शकते. अर्ज <b>मंजुरी समितीसमोर<\/b> ठेवला जातो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "खूप दिवस प्रलंबित? <b>जिल्हा व्यवस्थापकांकडे<\/b> लेखी स्थिती विचारा. कोटेशन किंवा जागेचा पुरावा नसणे ही नेहमीची कारणे असतात."}}, {"phase": null, "kind": "gov", "who": "महामंडळ / बँक", "title": "रक्कम वितरित होते", "body": "अनुदान / बीज भांडवल योजनांमध्ये प्रकरण <b>बँकेकडे<\/b> जाते आणि बँक कर्ज मंजूर करते. रक्कम सहसा मालमत्तेसाठी <b>पुरवठादाराला<\/b> दिली जाते. मालमत्ता खरेदी झाल्याची तपासणी होऊ शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "बँक आपला हिस्सा देण्यास उशीर करते? महामंडळाच्या जिल्हा कार्यालयाशी संपर्क करा; ते बँकेकडे पाठपुरावा करतात."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "व्यवसाय चालवा, हप्ते वेळेवर भरा", "body": "व्यवसाय सुरू करा. बँक / महामंडळाचा प्रत्येक <b>हप्ता वेळेवर<\/b> भरा. चांगली परतफेड केल्यास पुढे <b>मोठे कर्ज<\/b> मिळू शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "हप्ते चुकल्यास तुम्ही <b>थकबाकीदार<\/b> ठरता आणि पुढील कर्जे व योजना बंद होतात."}}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "अर्ज क्रमांकासह महामंडळाच्या <b>जिल्हा व्यवस्थापकांना<\/b> लेखी अर्ज द्या आणि <b>पोच<\/b> घ्या. निराकरण न झाल्यास <b>प्रादेशिक / मुख्य कार्यालयाला<\/b> लिहा. बँकेच्या उशिरासाठी जिल्ह्याच्या <b>अग्रणी बँक व्यवस्थापकांशी<\/b> संपर्क करा.", "help": "<b>अर्ज कुठे:<\/b> महात्मा फुले महामंडळ जिल्हा कार्यालय · <b>वेबसाइट:<\/b> mpbcdc.maharashtra.gov.in · सर्व पावत्या व हप्त्यांच्या नोंदी जपून ठेवा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "up-pm-kisan", "title": "PM-KISAN (Uttar Pradesh)", "local_name": "पीएम-किसान (उत्तर प्रदेश)", "audience": "Landholding farmers in UP", "state": "up", "local": "hi", "cat": "farm", "links": [{"label": "PM-KISAN: register, eKYC, Know Your Status", "url": "https://pmkisan.gov.in", "gov": true}, {"label": "PM-KISAN helpline: 155261 / 011-24300606", "url": null, "gov": true}, {"label": "News on AIR: UP Farmer Registry campaign", "url": "https://www.newsonair.gov.in/uttar-pradesh-govt-launches-special-campaign-to-prepare-farmer-registry", "gov": true}], "mermaid": "flowchart TD\n    A([UP farmer]) --> K{Name in khatauni and not excluded?}\n    K -- Land in parent's name --> F0[Varasat or dakhil-kharij first]\n    K -- Yes --> FR[Farmer ID at Gram Sachivalaya camp]\n    FR --> REG[Register on PM-KISAN portal or Jan Seva Kendra]\n    REG --> LV{Lekhpal and tehsil land verification}\n    LV -- Name mismatch --> F1[Correct spelling, request re-verification]\n    LV -- OK --> EK[eKYC: OTP, face app or fingerprint]\n    EK --> RFT[State signs RFT, FTO generated]\n    RFT --> PAY([Rs 2,000 by DBT every four months])\n    PAY -. Instalment missing .-> F2[Check eKYC, land seeding, Aadhaar-bank link]\n\n    S1[[Sathi: Farmer Registry camp finder]]:::sathi -.-> FR\n    S2[[Sathi: status explainer for RFT and FTO]]:::sathi -.-> RFT\n    S3[[Sathi: missing-instalment diagnosis]]:::sathi -.-> F2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "News on AIR: UP Farmer Registry campaign", "url": "https://www.newsonair.gov.in/uttar-pradesh-govt-launches-special-campaign-to-prepare-farmer-registry"}, {"label": "pmkisan.gov.in", "url": "https://pmkisan.gov.in/"}, {"label": "Housing.com: farmers yet to complete PM-KISAN KYC", "url": "https://housing.com/news/over-2-14-cr-farmers-yet-to-complete-pm-kisan-kyc-govt"}, {"label": "Tractor For Everyone: PM-KISAN 23rd instalment 2026", "url": "https://www.tractorforeveryone.com/knowledge-center/pm-kisan-23rd-installment-2026-eligibility-status-check-beneficiary-list-guide"}], "verified": "2026-10-27", "en": {"h1": "PM-KISAN in UP: How to get ₹6,000 a year", "benefit": "₹2,000 into your bank account, three times a year", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "Your name must be in the <b>khatauni<\/b> as a landholder. You <b>cannot<\/b> get it if someone in the family pays income tax, holds a government job, or is a practising doctor, lawyer, CA or engineer.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get <b>varasat<\/b> or <b>dakhil-kharij<\/b> done first. See the <b>Dakhil-kharij (UP)<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Get your Farmer ID", "body": "UP is enrolling farmers in the <b>Farmer Registry<\/b> through camps at the <b>Gram Sachivalaya<\/b>, with the Lekhpal and Panchayat Sachiv. Take Aadhaar, khatauni and your mobile.", "note": {"kind": "tip", "label": "Tip:", "html": "Without a Farmer ID, future instalments and other farm schemes can stop."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Khatauni<\/li><li>Aadhaar<\/li><li>Bank passbook (account <b>linked to Aadhaar<\/b>)<\/li><li>Mobile number linked to Aadhaar<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Register", "body": "Register on <b>pmkisan.gov.in<\/b> (New Farmer Registration) or at a Jan Seva Kendra. Note your <b>registration number<\/b>.", "note": null}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Land verification", "body": "The Lekhpal / tehsil checks your name against the khatauni and the state approves you.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Name spelling differs between Aadhaar, khatauni and bank? Correct it, then ask the Lekhpal to re-verify."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do eKYC", "body": "Complete eKYC by OTP on pmkisan.gov.in, face authentication in the PM-KISAN app, or fingerprint at a Jan Seva Kendra.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Without eKYC, payments <b>stop<\/b>."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Payment processed", "body": "Status shows <span class=\"status\">RFT signed by State Govt<\/span>, then <span class=\"status\">FTO generated<\/span>. Just wait.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "₹2,000 in your account", "body": "You get an SMS. This repeats every four months while eKYC, land seeding and bank linking stay correct.", "note": null}], "rights_t": "Instalment missing? Complain.", "rights": "Check status on pmkisan.gov.in, then contact the <b>district agriculture office<\/b> or the PM-KISAN helpline <b>155261 / 011-24300606<\/b>. You can also use <b>IGRS Jansunwai<\/b>.", "help": "<b>Register / status:<\/b> pmkisan.gov.in · <b>Helpline:<\/b> 155261 / 011-24300606 · Farmer ID camps at Gram Sachivalaya<br/><b>Use only official websites<\/b> · <b>Never pay an agent<\/b>"}, "loc": {"h1": "उत्तर प्रदेश में पीएम-किसान: वर्ष में ₹6,000 कैसे पाएं", "benefit": "साल में तीन बार ₹2,000 सीधे बैंक खाते में", "steps": [{"phase": "आवेदन से पहले", "kind": "you", "who": "आप", "title": "पात्रता जांचें", "body": "<b>खतौनी<\/b> में भूमिधर के रूप में आपका नाम होना चाहिए। परिवार में कोई आयकर देता हो, सरकारी नौकरी में हो, या प्रैक्टिस करने वाला डॉक्टर, वकील, सीए या इंजीनियर हो तो लाभ <b>नहीं<\/b> मिलेगा।", "note": {"kind": "stuck", "label": "अटक गए?", "html": "ज़मीन अभी माता-पिता के नाम? पहले <b>वरासत<\/b> या <b>दाखिल-खारिज<\/b> कराएं। <b>दाखिल-खारिज (यूपी)<\/b> मार्गदर्शिका देखें।"}}, {"phase": null, "kind": "you", "who": "आप", "title": "फार्मर आईडी बनवाएं", "body": "उत्तर प्रदेश में <b>ग्राम सचिवालय<\/b> पर शिविर लगाकर लेखपाल और पंचायत सचिव के साथ <b>फार्मर रजिस्ट्री<\/b> हो रही है। आधार, खतौनी और मोबाइल साथ ले जाएं।", "note": {"kind": "tip", "label": "सुझाव:", "html": "फार्मर आईडी के बिना ]]:::sathi -.-> CN\n    S2[[Sathi: objection hearing checklist]]:::sathi -.-> H\n    S3[[Sathi: IGRS complaint draft after 45 days]]:::sathi -.-> O\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class H,AP blocked", "sources": [{"label": "The420: UP enforces 45-day mutation deadline", "url": "https://the420.in/up-land-mutation-45-day-deadline-dakhil-kharij-disposal-dm-accountability/"}, {"label": "Realty Hunting: property mutation after purchase", "url": "https://realtyhunting.com/property-mutation-after-purchase/"}, {"label": "1acre: dakhil kharij Uttar Pradesh", "url": "https://1acre.in/guides/uttar-pradesh/dakhil-kharij-mutation-uttar-pradesh"}, {"label": "Landeed: UP property mutation", "url": "https://web.landeed.com/products/uttar-pradesh/mutation"}, {"label": "RTI wiki: mutation status", "url": "https://righttoinformation.wiki/check-status/property-mutation-status"}], "verified": "2026-10-27", "en": {"h1": "Dakhil-Kharij (UP): Get your name into the khatauni", "benefit": "Your name in the land record, needed for loans, PM-KISAN, sale and compensation", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Know when you need it", "body": "After you <b>buy<\/b> land or receive it as a <b>gift<\/b>. Until mutation, the <b>khatauni<\/b> still shows the old owner.", "note": {"kind": "tip", "label": "Tip:", "html": "Land passed on after a death is recorded through <b>varasat<\/b> (succession). Ask your Lekhpal for that separate entry."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Registered <b>sale or gift deed<\/b><\/li><li>Current <b>khatauni<\/b> copy (from upbhulekh.gov.in)<\/li><li>Aadhaar of buyer and seller<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Start the mutation case", "body": "Apply at the <b>tehsil<\/b> or on the Board of Revenue <b>vaad portal<\/b> (v
