    privacy: "ನೀವು ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡುವುದು ನಿಮ್ಮ ಫೋನಿನಿಂದ ಹೊರಗೆ ಹೋಗುವುದಿಲ್ಲ. ಆಧಾರ್ ಅಥವಾ ಬ್ಯಾಂಕ್ ಸಂಖ್ಯೆಯನ್ನು ಸಾರ್ವಜನಿಕವಾಗಿ ಹಾಕಬೇಡಿ.", readGuide: "ಪೂರ್ಣ ಮಾರ್ಗದರ್ಶಿ ಓದಿ",
    pLbl: "ನಿಮ್ಮ ಸ್ಥಿತಿಯನ್ನು ಅಂಟಿಸಿ (ಐಚ್ಛಿಕ)", pHint: "ಪೋರ್ಟಲ್‌ನ ಸ್ಥಿತಿ ಸಾಲುಗಳನ್ನು ಅಥವಾ ಬಂದ SMS ಅನ್ನು ನಕಲಿಸಿ ಇಲ್ಲಿ ಅಂಟಿಸಿ. ಇದು ನಿಮ್ಮ ಫೋನಿನಲ್ಲೇ ಉಳಿಯುತ್ತದೆ.", pBtn: "ನನ್ನ ಹಂತ ಹುಡುಕಿ", pFound: x => `ಇದು ಹೀಗಿದೆ ಎನಿಸುತ್ತದೆ: “${x}”. ಕೆಳಗೆ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ತಪ್ಪಾಗಿದ್ದರೆ ಬದಲಿಸಿ.`, pNone: "ಇದನ್ನು ಗುರುತಿಸಲು ಆಗಲಿಲ್ಲ. ಕೆಳಗಿನ ಹತ್ತಿರದ ಆಯ್ಕೆ ಆರಿಸಿ.", pDate: d => `ದಿನಾಂಕ ಸಿಕ್ಕಿದೆ: ${d}. ಈ ಸ್ಥಿತಿ ಬೇರೆ ದಿನ ಆರಂಭವಾಗಿದ್ದರೆ ಕೆಳಗೆ ಬದಲಿಸಿ.`,
    ph: { app: "[ಅರ್ಜಿ ಸಂಖ್ಯೆ]", name: "[ನಿಮ್ಮ ಹೆಸರು]", mobile: "-", date: "[ದಿನಾಂಕ]", days: "[ಸಂಖ್ಯೆ]" } },
};
const TRK = Object.fromEntries(DATA.trackers.map(t => [t.guide, t]));
const ck = { slug: null, stage: null, date: "", name: "", app: "", mobile: "", paste: "", pasteMsg: "" };
// Switching scheme clears what belongs to the old application; name and mobile are kept.
const resetFor = slug => { if (ck.slug !== slug) Object.assign(ck, { slug, stage: null, date: "", app: "", paste: "", pasteMsg: "" }); };
const tl = t => state.lang === "en" ? "en" : "loc";          // tracker text key
const tLang = t => state.lang === "en" ? "en" : t.local;      // language code of tracker text
const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m);

// Match pasted portal / SMS text to a stage: each phrase found scores its length (x3 for act / stuck stages); ties go to the later stage.
const norm = x => " " + String(x).toLowerCase().replace(/[:|_\-–—/,.()\[\]"']+/g, " ").replace(/\s+/g, " ").trim() + " ";
function matchStage(t, text) {
  const hay = norm(text); let best = null, bestScore = 0;
  t.stages.forEach(s => {
    const w = s.kind === "act" || s.kind === "stuck" ? 3 : 1;   // a blocker on the page outranks routine lines
    const score = w * s.match.reduce((n, ph) => { const k = norm(ph); return hay.includes(k) ? n + k.trim().length : n; }, 0);
    if (score > 0 && score >= bestScore) { best = s; bestScore = score; }
  });
  return best;
}
// Latest date in the text that is not in the future (dd/mm/yyyy, dd-mm-yyyy, dd.mm.yyyy or yyyy-mm-dd).
function findDate(text) {
  const today = new Date().toISOString().slice(0, 10), out = [];
  for (const m of text.matchAll(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\b/g)) out.push(`${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`);
  for (const m of text.matchAll(/\b(\d{4})-(\d{2})-(\d{2})\b/g)) out.push(m[0]);
  return out.filter(d => !isNaN(new Date(d)) && d <= today).sort().pop() || "";
}

function verdict(t, s) {
  const c = CK[state.lang], days = ck.date ? Math.floor((Date.now() - new Date(ck.date + "T00:00:00")) / 86400000) : null;
  const late = s.follow_up != null && days != null && days > s.follow_up;
  if (s.kind === "done") return { cls: "ok", text: c.vDone, complain: false, days };
  if (s.kind === "stuck") return { cls: "bad", text: c.vStuck, complain: true, days };
  if (late) return { cls: "bad", text: c.vLate(days, s.follow_up), complain: true, days };
  if (s.kind === "act") return { cls: "warn", text: c.vAct, complain: false, days };
  if (s.follow_up == null) return { cls: "info", text: c.vWaitPlain, complain: false, days };
  if (days == null) return { cls: "info", text: c.vWaitAsk(s.follow_up), complain: false, days };
  return { cls: "info", text: c.vWait(Math.max(1, s.follow_up - days)), complain: false, days };
}

function draft(t, s, v) {
  const c = CK[state.lang], k = tl(t), p = BY[t.guide];
  return fill(DATA.bodies[tLang(t)], {
    to: t.complaint.to[k], subject: t.complaint.subject[k], scheme: state.lang === "en" ? p.title : p.local_name,
    app: ck.app || c.ph.app, date: ck.date ? fmtDate(ck.date) : c.ph.date, days: v.days != null ? v.days : c.ph.days,
    status: s.status[k], ask: t.complaint.ask[k], name: ck.name || c.ph.name, mobile: ck.mobile || c.ph.mobile,
    today: new Date().toLocaleDateString(LOCALE[state.lang], { day: "numeric", month: "short", year: "numeric" }) });
}

function renderResult() {
  const box = $("#ck-result"), t = TRK[ck.slug];
  const s = t && t.stages.find(x => x.id === ck.stage);
  if (!s) { box.innerHTML = ""; return; }
  const c = CK[state.lang], k = tl(t), L = tLang(t), v = verdict(t, s);
  box.innerHTML = `
    <p class="verdict ${v.cls}" role="status">${esc(v.text)}</p>
    <div class="ck-card" lang="${L}"><h3>${c.mean}</h3><p>${esc(s.meaning[k])}</p><h3>${c.next}</h3><p>${esc(s.next[k])}</p></div>
    ${v.complain ? `<section class="ck-complaint" aria-labelledby="ck-c-title">
      <h2 id="ck-c-title">${c.cTitle}</h2>
      <div class="ck-fields">
        <label for="ck-name">${c.fName}<input id="ck-name" autocomplete="name" value="${esc(ck.name)}"></label>
        <label for="ck-app">${c.fApp}<input id="ck-app" autocomplete="off" value="${esc(ck.app)}"></label>
        <label for="ck-mobile">${c.fMobile}<input id="ck-mobile" inputmode="tel" autocomplete="tel" value="${esc(ck.mobile)}"></label>
      </div>
      <textarea id="ck-draft" lang="${L}" rows="14" readonly aria-label="${esc(c.cTitle)}"></textarea>
      <div class="ck-actions"><button type="button" id="ck-copy">${c.copy}</button><span id="ck-copied" class="small" aria-live="polite"></span></div>
      <h3>${c.where}</h3><p lang="${L}">${esc(t.complaint.where[k])}</p>
      <p class="small">${c.privacy}</p>
    </section>` : ""}
    ${s.kind !== "done" ? shareHTML(t, s, v) : ""}
    <p><a href="#${t.guide}">${c.readGuide} →</a></p>`;
  if (s.kind !== "done") wireShare(t, s, v);
  if (!v.complain) return;
  const update = () => { $("#ck-draft").value = draft(t, s, v); };
  [["#ck-name", "name"], ["#ck-app", "app"], ["#ck-mobile", "mobile"]].forEach(([sel, key]) =>
    $(sel).addEventListener("input", e => { ck[key] = e.target.value.trim(); update(); }));
  update();
  $("#ck-copy").addEventListener("click", () => {
    const ta = $("#ck-draft"), done = m => { $("#ck-copied").textContent = m; };
    const fallback = () => { ta.focus(); ta.select(); done(c.copyFail); };
    try { navigator.clipboard.writeText(ta.value).then(() => done(c.copied), fallback); } catch (e) { fallback(); }
  });
}

function renderStages() {
  const box = $("#ck-stages"), t = TRK[ck.slug], c = CK[state.lang];
  if (!t) { box.innerHTML = `<p class="small">${c.pick}</p>`; $("#ck-when").hidden = true; renderResult(); return; }
  const k = tl(t);
  if (!t.stages.some(s => s.id === ck.stage)) ck.stage = null;
  box.innerHTML = `<div class="paste">
      <label for="ck-paste">${c.pLbl}</label>
      <p class="small">${c.pHint}</p>
      <textarea id="ck-paste" rows="3">${esc(ck.paste)}</textarea>
      <button type="button" id="ck-find">${c.pBtn}</button>
      <p id="ck-paste-msg" class="small" aria-live="polite">${esc(ck.pasteMsg)}</p>
    </div>
    <fieldset><legend>${c.s2}</legend><div class="opts" lang="${tLang(t)}">${t.stages.map(s =>
    `<label class="opt"><input type="radio" name="ck-stage" value="${s.id}"${s.id === ck.stage ? " checked" : ""}><span>${esc(s.status[k])}</span></label>`).join("")}</div></fieldset>`;
  $("#ck-when").hidden = false;
  box.querySelectorAll("input[name=ck-stage]").forEach(r => r.addEventListener("change", () => { ck.stage = r.value; renderResult(); }));
  $("#ck-paste").addEventListener("input", e => { ck.paste = e.target.value; });
  $("#ck-find").addEventListener("click", () => {
    const s = matchStage(t, ck.paste), d = findDate(ck.paste), msgs = [];
    if (s) { ck.stage = s.id; msgs.push(c.pFound(s.status[k])); } else { ck.stage = null; msgs.push(c.pNone); }
    if (d && s) { ck.date = d; $("#ck-date").value = d; msgs.push(c.pDate(fmtDate(d))); }
    ck.pasteMsg = msgs.join(" ");
    renderStages();
  });
  renderResult();
}

function renderCheck(slug) {

  document.querySelectorAll("input[name=ck-scheme]").forEach(r => r.addEventListener("change", () => {

  renderStages();
  document.title = `${c.h1} · Sathi Yojana Guides`;
}

    send: "रिपोर्ट भेजें", sendNote: "आपके जवाब भरा छोटा GitHub फ़ॉर्म खुलता है। मुफ़्त GitHub खाता चाहिए, और आपका GitHub नाम रिपोर्ट पर दिखता है।" },
  kn: { cta: "ಜನರು ಎಲ್ಲಿ ಸಿಲುಕಿದ್ದಾರೆ? ನಕ್ಷೆ ನೋಡಿ", h1: "ಜನರು ಎಲ್ಲಿ ಸಿಲುಕಿದ್ದಾರೆ?",
    lead: "ಲಂಚದ ಬಂಧನ ಮತ್ತು ಬಾಕಿ ಪಾವತಿಯ ಸುದ್ದಿಗಳು, ಮತ್ತು 'ಕೆಲಸ ಸಿಲುಕಿದೆಯೇ?' ಮೂಲಕ ಅನಾಮಧೇಯವಾಗಿ ಹಂಚಿದ ವರದಿಗಳು, ಜಿಲ್ಲಾವಾರು. ವಿವರಕ್ಕೆ ಜಿಲ್ಲೆಯ ಮೇಲೆ ಟ್ಯಾಪ್ ಮಾಡಿ.",
    lSig: "ಸುದ್ದಿ ಸಂಕೇತಗಳು", lRep: "ನಾಗರಿಕ ವರದಿಗಳು", none: "ಸಂಕೇತವಿಲ್ಲ", delay: "ವಿಳಂಬದ ಸುದ್ದಿಗಳು", bribe: "ಲಂಚದ ಬಂಧನದ ಸುದ್ದಿ",
    few: k => `${k} ಕ್ಕಿಂತ ಕಡಿಮೆ ವರದಿಗಳು`, overdue: "ತಡವಾದವುಗಳ ಪ್ರಮಾಣ", pick: "ಅಲ್ಲಿ ಏನು ವರದಿಯಾಗಿದೆ ಎಂದು ನೋಡಲು ಜಿಲ್ಲೆ ಆಯ್ಕೆಮಾಡಿ.",
    statewide: "ರಾಜ್ಯಮಟ್ಟದ ಸಂಕೇತಗಳು", noRep: k => `ಇನ್ನೂ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲೂ ${k} ಅಥವಾ ಹೆಚ್ಚು ವರದಿಗಳಿಲ್ಲ. 'ಕೆಲಸ ಸಿಲುಕಿದೆಯೇ?' ಮೂಲಕ ನಿಮ್ಮದನ್ನು ಹಂಚಿ.`,
    nRep: n => `${n} ನಾಗರಿಕ ವರದಿಗಳು`, pctOver: p => `${p}% ತಡ`, pctMoney: p => `${p}% ಹಣ ಕೇಳಲಾಯಿತು ಎನ್ನುತ್ತಾರೆ`,
    srcs: "ಮೂಲ", caveat: "ಇವು ಸಂಕೇತಗಳು, ಪುರಾವೆಯಲ್ಲ. ನ್ಯಾಯಾಲಯ ತೀರ್ಮಾನಿಸುವವರೆಗೆ ಬಂಧನ ಒಂದು ಆರೋಪ; ವಿಳಂಬದ ಸುದ್ದಿ ಎಣಿಕೆಯಲ್ಲ. ಇಲ್ಲಿ ಯಾವ ಅಧಿಕಾರಿಯ ಹೆಸರೂ ಇಲ್ಲ.",
    attrib: "ಜಿಲ್ಲಾ ಗಡಿಗಳು: ಜನಗಣತಿ 2011, DataMeet India community (CC BY 4.0). ಹೊಸ ಜಿಲ್ಲೆಗಳು (ಉದಾ. ವಿಜಯನಗರ) 2011ರ ಮೂಲ ಜಿಲ್ಲೆಯೊಳಗೆ ಕಾಣುತ್ತವೆ.",
    list: "ನಕ್ಷೆಯ ಎಲ್ಲಾ ಸಂಕೇತಗಳು", district: "ಜಿಲ್ಲೆ", noneHere: "ಈ ಜಿಲ್ಲೆಗೆ ಇನ್ನೂ ಏನೂ ವರದಿಯಾಗಿಲ್ಲ.",
    shareT: "ಇತರರಿಗೆ ಸಹಾಯ ಮಾಡಿ: ಅನಾಮಧೇಯವಾಗಿ ಹಂಚಿ", shareL: "ನಿಮ್ಮ ಪ್ರಕರಣವನ್ನು ಜಿಲ್ಲಾ ನಕ್ಷೆಗೆ ಸೇರಿಸಿ. ಹೆಸರು, ಸಂಖ್ಯೆ ಅಥವಾ ಅರ್ಜಿ ವಿವರ ಹೋಗುವುದಿಲ್ಲ.",
    sDistrict: "ನಿಮ್ಮ ಜಿಲ್ಲೆ", sOffice: "ಕೆಲಸ ಎಲ್ಲಿ ಸಿಲುಕಿದೆ?", sMoney: "ಯಾರಾದರೂ ಹಣ ಅಥವಾ ಉಪಕಾರ ಕೇಳಿದರೇ?",
    offices: ["ತಾಲೂಕು ಕಚೇರಿ", "ಪಂಚಾಯಿತಿ ಕಚೇರಿ", "ಬ್ಯಾಂಕ್", "ಸೇವಾ ಕೇಂದ್ರ (ಗ್ರಾಮ ಒನ್ / ಕರ್ನಾಟಕ ಒನ್)", "ಆನ್‌ಲೈನ್ ಪೋರ್ಟಲ್", "ಇತರೆ"],
    money: ["ಇಲ್ಲ", "ಹೌದು, ಏಜೆಂಟ್", "ಹೌದು, ಅಧಿಕಾರಿ", "ಹೇಳಲು ಇಷ್ಟವಿಲ್ಲ"], choose: "ಆಯ್ಕೆಮಾಡಿ…",
    send: "ವರದಿ ಕಳುಹಿಸಿ", sendNote: "ನಿಮ್ಮ ಉತ್ತರಗಳು ತುಂಬಿದ ಸಣ್ಣ GitHub ಫಾರ್ಮ್ ತೆರೆಯುತ್ತದೆ. ಉಚಿತ GitHub ಖಾತೆ ಬೇಕು, ಮತ್ತು ನಿಮ್ಮ GitHub ಹೆಸರು ವರದಿಯಲ್ಲಿ ಕಾಣುತ್ತದೆ." },
};
// English office / money labels go into the report so totals do not depend on the reader's language.
const MONEY_EN = MP.en.money, OFFICE_EN = MP.en.offices;
const GEO = DATA.geo, dkey = d => `${d.state}:${d.name}`;
const dName = n => DATA.aliases[n] ? `${DATA.aliases[n]} (${n})` : n;
const mp = { st: null, layer: "sig", sel: null };

function sigsFor(st, name) { return DATA.signals.filter(s => s.state === st && s.district === name); }
function sigClass(list) { return !list.length ? "s0" : list.some(s => s.kind === "bribe-arrest") ? (list.length > 1 ? "s3" : "s2") : "s1"; }
function repClass(r) {
  if (!r) return "r0";
  if (r.n == null) return "rf";
  const p = r.overdue / r.n; return p >= 0.6 ? "r3" : p >= 0.3 ? "r2" : "r1";
}

function project(st) {
  const ds = GEO.filter(d => d.state === st);
  let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
  ds.forEach(d => d.rings.forEach(r => r.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); })));
  const k = Math.cos(((y0 + y1) / 2) * Math.PI / 180), W = 1000, s = W / ((x1 - x0) * k), H = Math.round((y1 - y0) * s);
  const P = ([x, y]) => `${((x - x0) * k * s).toFixed(1)},${((y1 - y) * s).toFixed(1)}`;
  return { ds, W, H, path: d => d.rings.map(r => "M" + r.map(P).join("L") + "Z").join("") };
}

function renderMapPanel() {
  const c = MP[state.lang], box = $("#map-panel");
  if (!mp.sel) { box.innerHTML = `<p class="small">${c.pick}</p>`; return; }
  const [st, name] = mp.sel.split(":"), list = sigsFor(st, name), r = DATA.reports.districts[mp.sel];
  box.innerHTML = `<h2>${esc(dName(name))}</h2>
    ${r && r.n != null ? `<p class="rep-stats"><b>${c.nRep(r.n)}</b> · ${c.pctOver(Math.round(100 * r.overdue / r.n))} · ${c.pctMoney(Math.round(100 * r.money / r.n))}</p>` : r ? `<p class="small">${c.few(DATA.reports.k)}</p>` : ""}
    ${list.length ? `<ul class="sig-list">${list.map(sigItem).join("")}</ul>` : `<p class="small">${c.noneHere}</p>`}`;
}
function sigItem(s) {
  const c = MP[state.lang];
  return `<li class="${s.kind}"><span class="tag ${s.kind === "bribe-arrest" ? "bad" : "warn"}">${s.kind === "bribe-arrest" ? c.bribe : c.delay}</span>
    <b>${esc(s.service)}</b> · ${esc(s.month)}<br>${esc(s.summary)} <a href="${esc(s.url)}" target="_blank" rel="noopener">${c.srcs}: ${esc(s.source)} ↗</a></li>`;
}

function renderMap() {
  const c = MP[state.lang];
  if (!mp.st) mp.st = state.st !== "all" ? state.st : "mh";
  const pr = project(mp.st), reps = DATA.reports.districts;
  const shown = Object.keys(reps).some(k => k.startsWith(mp.st + ":") && reps[k].n != null);
  const stateWide = DATA.signals.filter(s => s.state === mp.st && !s.district);
  const mapped = DATA.signals.filter(s => s.state === mp.st && s.district);
  $("#main").innerHTML = `
  <article class="gutter"><div class="mapwrap">
    <a class="back" href="#">← ${UI[state.lang].back}</a>
    <h1 id="post-title" tabindex="-1">${c.h1}</h1>
    <p class="lead">${c.lead}</p>
    <div class="map-tools">
      <div class="chips" role="group" aria-label="${UI[state.lang].stateLbl}">${DATA.states.map(s => `<button type="button" class="chip" data-mst="${s.id}" aria-pressed="${s.id === mp.st}">${esc(s[state.lang])}</button>`).join("")}</div>
      <div class="chips" role="group">${[["sig", c.lSig], ["rep", c.lRep]].map(([id, t]) => `<button type="button" class="chip" data-layer="${id}" aria-pressed="${id === mp.layer}">${t}</button>`).join("")}</div>
    </div>
    <div class="map-grid">
      <figure class="map ${mp.layer}">
        <svg viewBox="0 0 ${pr.W} ${pr.H}" role="group" aria-label="${esc(c.h1)}">${pr.ds.map(d => {
          const key = dkey(d), cls = mp.layer === "sig" ? sigClass(sigsFor(d.state, d.name)) : repClass(reps[key]);
          return `<path d="${pr.path(d)}" class="${cls}${key === mp.sel ? " sel" : ""}" data-key="${esc(key)}" tabindex="0" role="button" aria-label="${esc(dName(d.name))}"><title>${esc(dName(d.name))}</title></path>`;
        }).join("")}</svg>
        <figcaption class="legend-map">${mp.layer === "sig"
          ? `<span><i class="sw s0"></i>${c.none}</span><span><i class="sw s1"></i>${c.delay}</span><span><i class="sw s2"></i>${c.bribe}</span>`
          : `<span><i class="sw r0"></i>${c.none}</span><span><i class="sw rf"></i>${c.few(DATA.reports.k)}</span><span><i class="sw r1"></i>&lt;30%</span><span><i class="sw r2"></i>30–60%</span><span><i class="sw r3"></i>≥60% ${c.overdue}</span>`}</figcaption>
        ${mp.layer === "rep" && !shown ? `<p class="small">${c.noRep(DATA.reports.k)}</p>` : ""}
      </figure>
      <aside id="map-panel" class="map-panel" aria-live="polite"></aside>
    </div>
    ${stateWide.length ? `<h2>${c.statewide}</h2><ul class="sig-list">${stateWide.map(sigItem).join("")}</ul>` : ""}
    <details class="all-sigs"><summary>${c.list} (${mapped.length})</summary>
      <ul class="sig-list">${mapped.map(s => `<li><b>${esc(dName(s.district))}</b>: ${sigItem(s).replace(/^<li[^>]*>|<\/li>$/g, "")}</li>`).join("")}</ul></details>
    <p class="small">${c.caveat}</p>
    <p class="small">${c.attrib}</p>
  </div></article>`;
  document.querySelectorAll("[data-mst]").forEach(b => b.addEventListener("click", () => { mp.st = b.dataset.mst; mp.sel = null; renderMap(); }));
  document.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => { mp.layer = b.dataset.layer; renderMap(); }));
  document.querySelectorAll(".map path").forEach(el => {
    const pick = () => { mp.sel = el.dataset.key; document.querySelectorAll(".map path.sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); renderMapPanel(); };
    el.addEventListener("click", pick);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  renderMapPanel();
  document.title = `${c.h1} · Sathi Yojana Guides`;
}

// Share step shown under a checker result: builds a prefilled status-report issue, nothing is stored.
function shareHTML(t, s, v) {
  const c = MP[state.lang], p = BY[t.guide];
  const ds = GEO.filter(d => d.state === p.state).map(d => d.name).sort();
  const opt = (arr, id) => `<select id="${id}"><option value="">${c.choose}</option>${arr.map((x, i) => `<option value="${i}">${esc(x)}</option>`).join("")}</select>`;
  return `<section class="share" aria-labelledby="sh-t">
    <h2 id="sh-t">${c.shareT}</h2><p class="small">${c.shareL}</p>
    <div class="ck-fields">
      <label for="sh-d">${c.sDistrict}<select id="sh-d"><option value="">${c.choose}</option>${ds.map(n => `<option value="${esc(n)}">${esc(dName(n))}</option>`).join("")}</select></label>
      <label for="sh-o">${c.sOffice}${opt(c.offices, "sh-o")}</label>
      <label for="sh-m">${c.sMoney}${opt(c.money, "sh-m")}</label>
    </div>
    <a id="sh-send" class="report" target="_blank" rel="noopener" aria-disabled="true">${c.send} ↗</a>
    <p class="small">${c.sendNote}</p>
  </section>`;
}
function wireShare(t, s, v) {
  const p = BY[t.guide], link = $("#sh-send");
  const update = () => {
    const d = $("#sh-d").value, o = $("#sh-o").value, m = $("#sh-m").value;
    if (!d) { link.removeAttribute("href"); link.setAttribute("aria-disabled", "true"); return; }
    const q = new URLSearchParams({ template: "status-report.yml", title: `[status] ${p.title} · ${d}`,
      state: p.state, district: d, scheme: t.guide, stage: s.id, days: v.days != null ? String(v.days) : "",
      overdue: v.cls === "bad" ? "yes" : "no", office: o ? OFFICE_EN[o] : "", money: m ? MONEY_EN[m] : "" });
    link.href = `https://github.com/${DATA.repo}/issues/new?${q}`; link.removeAttribute("aria-disabled");
  };
  ["#sh-d", "#sh-o", "#sh-m"].forEach(sel => $(sel).addEventListener("change", update));
}

// Theme button: Light -> Dark -> Black & white -> Phone setting. Light is the default.
const THEMES = ["light", "dark", "contrast", "auto"];
const TH = { en: { t: "Theme", light: "Light", dark: "Dark", contrast: "Black & white", auto: "Phone setting" },
  mr: { t: "थीम", light: "उजळ", dark: "गडद", contrast: "काळा-पांढरा", auto: "फोनप्रमाणे" },
  hi: { t: "थीम", light: "हल्का", dark: "गहरा", contrast: "काला-सफ़ेद", auto: "फ़ोन के अनुसार" },
  kn: { t: "ಥೀಮ್", light: "ತಿಳಿ", dark: "ಗಾಢ", contrast: "ಕಪ್ಪು-ಬಿಳುಪು", auto: "ಫೋನ್ ಪ್ರಕಾರ" } };
const THEME_ICON = {
  light: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>',
  dark: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>',
  contrast: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  auto: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>' };
let theme = "light";
try { const t = localStorage.getItem("sathi-theme"); if (THEMES.includes(t)) theme = t; } catch (e) {}
function applyTheme() {
  const root = document.documentElement, l = TH[state.lang], next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  if (theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  const b = $("#theme-btn");
  b.innerHTML = THEME_ICON[theme];
  b.setAttribute("aria-label", `${l.t}: ${l[theme]}. → ${l[next]}`);
  b.title = `${l.t}: ${l[theme]}`;
}

function applyChrome() {
  applyTheme();
  const u = UI[state.lang];
  document.documentElement.lang = state.lang;
  $("#brand-sub").textContent = u.sub;
  $("#skip").textContent = u.skip;
  $("#foot").textContent = u.foot;
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function route(focus) {
  applyChrome();
  const h = location.hash.slice(1), p = BY[h];
  if (h === "map") { renderMap(); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else if (h === "check" || h.startsWith("check-")) { renderCheck(h.slice(6)); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else if (p) { renderPost(p); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else { renderHome(); if (focus) window.scrollTo(0, 0); }
}

$("#theme-btn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("sathi-theme", theme); } catch (e) {}
  applyTheme();
});
document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; save("sathi-lang", state.lang);
  const y = window.scrollY; route(false); window.scrollTo(0, y);
}));
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
window.addEventListener("hashchange", () => { route(true); track(location.pathname + location.hash); });
route(false);
</script>
