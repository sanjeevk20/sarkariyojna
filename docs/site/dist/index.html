<style>
/* Layout: a field-notebook blog. Sticky masthead, filterable card index, and long-form guide posts with a numbered step rail. */
:root {
  --bg: #f5f7f2; --surface: #ffffff; --raised: #eef2ea; --fg: #1c281e; --muted: #56675a; --line: #d3dccf;
  --leaf: #2d6a39; --leaf-soft: #e1eee0; --on-leaf: #ffffff;
  --you: #2357a6; --you-soft: #e7eef9; --gov: #67479f; --gov-soft: #efe9f8; --done: #2d6a39; --done-soft: #e1eee0;
  --haldi: #9a6512; --haldi-soft: #faf0dc; --stop: #b42318; --stop-soft: #fcebe9;
  --display: "Martel", "Noto Serif Devanagari", Georgia, serif;
  --body: "Mukta", "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111712; --surface: #19211a; --raised: #202a21; --fg: #e3eae2; --muted: #9db09f; --line: #2d3a2f;
  --leaf: #82c48e; --leaf-soft: #1e3122; --on-leaf: #0f1a11;
  --you: #91b5f0; --you-soft: #1a2537; --gov: #bba4ea; --gov-soft: #251e35; --done: #82c48e; --done-soft: #1e3122;
  --haldi: #e6b65c; --haldi-soft: #2e2514; --stop: #f29b90; --stop-soft: #351b18; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111712; --surface: #19211a; --raised: #202a21; --fg: #e3eae2; --muted: #9db09f; --line: #2d3a2f;
  --leaf: #82c48e; --leaf-soft: #1e3122; --on-leaf: #0f1a11;
  --you: #91b5f0; --you-soft: #1a2537; --gov: #bba4ea; --gov-soft: #251e35; --done: #82c48e; --done-soft: #1e3122;
  --haldi: #e6b65c; --haldi-soft: #2e2514; --stop: #f29b90; --stop-soft: #351b18; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--leaf); }
:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; border-radius: 6px; }
.gutter { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--leaf); color: var(--on-leaf); padding: 10px 14px; border-radius: 8px; z-index: 20; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }
h1, h2 { font-family: var(--display); text-wrap: balance; line-height: 1.3; }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .gutter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand b { font-family: var(--display); font-size: 20px; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle { display: flex; gap: 4px; background: var(--raised); padding: 4px; border-radius: 999px; flex: none; }
.toggle button { font: 500 15px var(--body); min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }

/* Home */
.intro { padding-block: 28px 8px; }
.intro .eyebrow, .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); margin: 0; }
.intro h1 { font-size: clamp(28px, 5vw, 42px); margin: 6px 0 8px; max-width: 22ch; }
.intro p.lead { color: var(--muted); font-size: 18px; max-width: 62ch; margin: 0; }
.tools { display: grid; gap: 12px; padding-block: 18px 6px; }
.search { position: relative; max-width: 520px; }
.search input { width: 100%; font: 17px var(--body); min-height: 48px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { color: inherit; opacity: .7; font-variant-numeric: tabular-nums; margin-left: 4px; }
.count { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 16px 56px; }
@media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; } }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
.card-link { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s; }
.card-link:hover { border-color: var(--leaf); transform: translateY(-2px); }
.card-link h2 { font-size: 19px; margin: 2px 0 0; }
.card-link .mrn { color: var(--muted); font-size: 15px; }
.card-link .for { font-size: 15px; margin-top: 6px; }
.card-link .meta { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.side { display: grid; gap: 16px; align-content: start; }
.side section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.side h2 { font-size: 17px; margin: 0 0 8px; }
.side ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 15px; }
.legend-list { list-style: none; padding: 0 !important; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.dot.you { background: var(--you); } .dot.gov { background: var(--gov); } .dot.done { background: var(--done); }

/* Post */
.post { max-width: 760px; padding-block: 20px 56px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 500; text-decoration: none; }
.post h1 { font-size: clamp(26px, 4.6vw, 38px); margin: 6px 0 4px; }
.post .mrn { color: var(--muted); margin: 0; font-size: 17px; }
.benefit { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--leaf-soft); font-size: 18px; font-weight: 500; }
.post-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); margin-top: 12px; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; padding: 0; list-style: none; }
.toc button { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.post h2 { font-size: 23px; margin: 36px 0 12px; scroll-margin-top: 80px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); margin-bottom: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.phase { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 0 0 52px; }
.step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start; }
.num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: var(--on-leaf); font-variant-numeric: tabular-nums; }
.you .num { background: var(--you); } .gov .num { background: var(--gov); } .done .num { background: var(--done); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.gov .scard { background: var(--gov-soft); } .done .scard { background: var(--done-soft); }
.who { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scard h3 { font-size: 19px; margin: 0 0 4px; line-height: 1.35; }
.sbody ul { margin: 4px 0 0; padding-left: 20px; }
.status { font-family: ui-monospace, monospace; font-size: 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.note { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 16px; }
.note.stuck { background: var(--stop-soft); } .note.stuck b.nl { color: var(--stop); }
.note.tip { background: var(--haldi-soft); } .note.tip b.nl { color: var(--haldi); }
.box { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.box h3 { margin: 0 0 4px; font-size: 18px; color: var(--stop); }
.box.help { background: var(--haldi-soft); }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.links li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.links .what { min-width: 0; flex: 1 1 240px; }
.links a { font-weight: 700; overflow-wrap: anywhere; }
.links .lbl { display: block; font-size: 15px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.tag.g { background: var(--leaf-soft); color: var(--leaf); } .tag.x { background: var(--haldi-soft); color: var(--haldi); }
.small { font-size: 14px; color: var(--muted); }
.diagram { overflow-x: auto; background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: #1c281e; }
.diagram svg { display: block; margin: 0 auto; height: auto; min-width: 560px; max-width: 100%; }
.diagram pre { white-space: pre; font-size: 13px; margin: 0; }
.sources { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 15px; }
.sources a { overflow-wrap: anywhere; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
.pager a { display: block; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); }
.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.foot .gutter { padding-block: 18px 28px; }
@media (max-width: 520px) { .brand span { display: none; } .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* Reset normally supplied by the artifact host. */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>

 3 per year])\n    K --> L{Next instalment cycle}\n    L -- eKYC / land / bank still valid --> I\n    L -- Something changed --> F4\n\n    S1[[Sathi: Eligibility + document readiness check]]:::sathi -.-> B\n    S2[[Sathi: Ferfar Predictor + 7/12 Health Report]]:::sathi -.-> F1\n    S3[[Sathi: Plain Marathi status decoder<br/>what RFT / FTO means + next action]]:::sathi -.-> I\n    S4[[Sathi: Rights clock + grievance draft<br/>pmkisan helpdesk / CPGRAMS]]:::sathi -.-> J\n    S5[[Sathi: eKYC and bank-seeding alerts<br/>before each instalment]]:::sathi -.-> L\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3,F4 blocked", "sources": [{"label": "AgriFarming: FTO processed but money not received", "url": "https://www.agrifarming.in/pm-kisan-fto-processed-but-money-not-received"}, {"label": "BiharHelp: RFT signed by state", "url": "https://biharhelp.in/pm-kisan-rft-signed-by-state/"}, {"label": "GovtSchemes: temporary hold", "url": "https://www.govtschemes.in/pm-kissan-temporary-hold"}], "en": {"h1": "PM-KISAN: How to get ₹6,000 a year", "benefit": "₹2,000 straight into your bank account, 3 times a year", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You can apply if <b>farmland is in your name<\/b> on the 7/12.<br/>You <b>cannot<\/b> apply if anyone in your family pays income tax, is a government employee, is a doctor / lawyer / CA / engineer in practice, or gets a pension of ₹10,000+ a month.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul>\n<li>Aadhaar card, with your mobile number linked<\/li>\n<li>7/12 extract showing <b>your<\/b> name<\/li>\n<li>Bank passbook (account must be <b>linked to Aadhaar<\/b>)<\/li>\n<\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in your father's name? Get the <b>ferfar (mutation)<\/b> done at the Talathi office first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:\n      <ul><li>Website <b>pmkisan.gov.in<\/b> → \"New Farmer Registration\"<\/li>\n<li>PM-KISAN mobile app<\/li>\n<li>Nearest CSC / e-Seva Kendra, or ask your Talathi / Krushi Sahayak<\/li><\/ul>\n      Note down your <b>registration number<\/b>.", "note": null}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your land is checked", "body": "Revenue officials match your name with the 7/12 record.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Name or Gat number does not match → visit the Talathi with your 7/12 and Aadhaar."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Your Aadhaar and bank are checked", "body": "Your name must be spelled the same on Aadhaar, 7/12 and bank account.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Spelling differs → correct it. Bank not linked → go to your bank and ask for <b>\"Aadhaar seeding and DBT on\"<\/b>."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do eKYC", "body": "On pmkisan.gov.in (OTP on your Aadhaar mobile) or face scan in the app. Takes 2 minutes.", "note": {"kind": "stuck", "label": "Important:", "html": "Without eKYC, your money <b>stops<\/b>."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "State approves you", "body": "Your status shows <span class=\"status\">RFT signed by State Govt<\/span><br/>This means: <b>Maharashtra has approved you.<\/b> Just wait.", "note": null}, {"phase": null, "kind": "gov", "who": "Government", "title": "Money is being sent", "body": "Your status shows <span class=\"status\">FTO generated, payment confirmation pending<\/span><br/>This means: <b>payment order has gone to your bank.<\/b>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Money not received → bank account closed or not linked. Fix at bank (see step 5)."}}, {"phase": null, "kind": "done", "who": "Done", "title": "₹2,000 in your account", "body": "You get an SMS. This repeats every 4 months, as long as your <b>eKYC, bank link and land record<\/b> stay correct.", "note": null}], "rights_t": "", "rights": "", "help": "<b>Check your status anytime:<\/b> pmkisan.gov.in → \"Know Your Status\" (registration number or Aadhaar)<br/>\n<b>Helpline:<\/b> 155261 / 011-24300606  ·  <b>Use only .gov.in websites<\/b>, never pay an agent for this."}, "mr": {"h1": "पीएम-किसान: वर्षाला ₹6,000 कसे मिळवायचे", "benefit": "वर्षातून 3 वेळा ₹2,000 थेट तुमच्या बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "7/12 वर <b>शेतजमीन तुमच्या नावावर<\/b> असेल तर तुम्ही अर्ज करू शकता.<br/>तुमच्या कुटुंबातील कोणी आयकर भरत असेल, सरकारी कर्मचारी असेल, डॉक्टर / वकील / सीए / अभियंता म्हणून व्यवसाय करत असेल, किंवा दरमहा ₹10,000 पेक्षा जास्त पेन्शन घेत असेल, तर तुम्ही <b>अर्ज करू शकत नाही<\/b>.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul>\n<li>आधार कार्ड, तुमचा मोबाईल नंबर लिंक असलेले<\/li>\n<li><b>तुमच्या<\/b> नावाचा 7/12 उतारा<\/li>\n<li>बँक पासबुक (खाते <b>आधारशी लिंक<\/b> असणे आवश्यक)<\/li>\n<\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून वडिलांच्या नावावर आहे? आधी तलाठी कार्यालयात <b>फेरफार<\/b> करून घ्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:\n      <ul><li>वेबसाइट <b>pmkisan.gov.in<\/b> → \"New Farmer Registration\"<\/li>\n<li>पीएम-किसान मोबाईल ॲप<\/li>\n<li>जवळचे CSC / ई-सेवा केंद्र, किंवा तुमचे तलाठी / कृषी सहायक<\/li><\/ul>\n      तुमचा <b>नोंदणी क्रमांक<\/b> (Registration Number) लिहून ठेवा.", "note": null}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "जमिनीची तपासणी", "body": "महसूल अधिकारी तुमचे नाव 7/12 च्या नोंदीशी जुळवतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "नाव किंवा गट नंबर जुळत नाही → 7/12 आणि आधार घेऊन तलाठ्यांना भेटा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "आधार व बँक तपासणी", "body": "आधार, 7/12 आणि बँक खात्यावर तुमचे नाव <b>एकसारखे<\/b> असले पाहिजे.", "note": {"kind": "stuck", "label": "अडचण?", "html": "नावात फरक आहे → दुरुस्त करा. बँक खाते लिंक नाही → बँकेत जाऊन <b>\"आधार सीडिंग करा आणि DBT सुरू करा\"<\/b> असे सांगा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-केवायसी करा", "body": "pmkisan.gov.in वर (आधारशी लिंक मोबाईलवर OTP) किंवा ॲपमध्ये चेहरा स्कॅन करून. फक्त 2 मिनिटे लागतात.", "note": {"kind": "stuck", "label": "महत्त्वाचे:", "html": "ई-केवायसी केली नाही तर तुमचे पैसे <b>थांबतात<\/b>."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "राज्य सरकारची मंजुरी", "body": "स्थितीमध्ये दिसेल: <span class=\"status\">RFT signed by State Govt<\/span><br/>याचा अर्थ: <b>महाराष्ट्र सरकारने तुम्हाला मंजुरी दिली आहे.<\/b> फक्त वाट पाहा.", "note": null}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "पैसे पाठवले जात आहेत", "body": "स्थितीमध्ये दिसेल: <span class=\"status\">FTO generated, payment confirmation pending<\/span><br/>याचा अर्थ: <b>पैसे पाठवण्याचा आदेश तुमच्या बँकेकडे गेला आहे.<\/b>", "note": {"kind": "stuck", "label": "अडचण?", "html": "पैसे मिळाले नाहीत → बँक खाते बंद आहे किंवा आधारशी लिंक नाही. बँकेत दुरुस्त करा (पायरी 5 पाहा)."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "₹2,000 तुमच्या खात्यात जमा", "body": "तुम्हाला SMS येईल. तुमचे <b>ई-केवायसी, बँक लिंक आणि जमिनीची नोंद<\/b> बरोबर असेपर्यंत हे दर 4 महिन्यांनी मिळत राहील.", "note": null}], "rights_t": "", "rights": "", "help": "<b>तुमची स्थिती कधीही तपासा:<\/b> pmkisan.gov.in → \"Know Your Status\" (नोंदणी क्रमांक किंवा आधार नंबर)<br/>\n<b>हेल्पलाइन:<\/b> 155261 / 011-24300606  ·  <b>फक्त .gov.in वेबसाइट वापरा<\/b>, यासाठी कोणत्याही एजंटला पैसे देऊ नका."}}, {"slug": "namo-shetkari", "title": "Namo Shetkari Mahasanman Nidhi", "mr_name": "नमो शेतकरी महासन्मान निधी", "audience": "PM-KISAN farmers in Maharashtra (automatic top-up)", "cat": "farm", "links": [{"label": "Namo Shetkari (NSMNY) beneficiary status", "url": "https://nsmny.mahait.org", "gov": false}, {"label": "PM-KISAN: eKYC, Know Your Status", "url": "https://pmkisan.gov.in", "gov": true}, {"label": "Vikaspedia: scheme summary", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/namo-shetkari-maha-samman-nidhi-yojana", "gov": true}], "mermaid": "flowchart TD\n    A([Maharashtra farmer]) --> PK{1. Approved PM-KISAN beneficiary?}\n    PK -- No --> REG[Register in PM-KISAN first<br/>see PM-KISAN workflow]\n    PK -- Yes --> AUTO[Added to Namo Shetkari automatically<br/>no separate form]\n    AUTO --> CK{2. Checks}\n    CK -- eKYC pending --> F1[Both payments stop:<br/>complete eKYC]\n    CK -- Bank not Aadhaar-seeded --> F2[Payment fails:<br/>seed Aadhaar, DBT on]\n    CK -- Land seeding No --> F3[Fix land record with<br/>Talathi / Krushi Sahayak, ferfar]\n    CK -- All OK --> L[3. State prepares instalment list<br/>from PM-KISAN data]\n    L --> P([4. Rs 2,000 by DBT, 3 times a year<br/>Rs 12,000 a year with PM-KISAN])\n    P -. PM-KISAN received but Namo missing .-> T[Check NSMNY portal status,<br/>then Taluka Agriculture Officer]\n\n    S1[[Sathi: One status view for<br/>PM-KISAN + Namo Shetkari]]:::sathi -.-> CK\n    S2[[Sathi: eKYC, bank and land-seeding<br/>readiness before each instalment]]:::sathi -.-> L\n    S3[[Sathi: Missing-instalment tracker<br/>+ complaint draft]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "sarkariyojana.com: Namo Shetkari 2026", "url": "https://sarkariyojana.com/namo-shetkari-maha-samman-nidhi-yojana/"}, {"label": "schemesinindia.in: Namo Shetkari 2026", "url": "https://schemesinindia.in/schemes/maharashtra/namo-shetkari-yojana"}, {"label": "MACS College: 8th instalment update", "url": "https://macscollege.com/nsmny-8th-installment-date/"}, {"label": "Anantam IAS: Namo Shetkari", "url": "https://anantamias.com/namo-shetkari-yojana/"}, {"label": "Sarkari Yojana Tracker: Namo Shetkari 2025-26", "url": "https://sarkariyojanatracker.com/namo-shetkari-yojana-maharashtra/"}, {"label": "govtschemes.in: Namo Shetkari", "url": "https://translate.google.com/translate?u=https%3A%2F%2Fwww.govtschemes.in%2Fmaharashtra-namo-shetkari-maha-samman-nidhi-yojana&hl=hi&sl=en&tl=hi&client=srp"}, {"label": "Wikipedia: PM-KISAN", "url": "https://en.wikipedia.org/wiki/Pradhan_Mantri_Kisan_Samman_Nidhi"}], "en": {"h1": "Namo Shetkari Mahasanman Nidhi: Extra ₹6,000 a year on top of PM-KISAN", "benefit": "₹2,000 three times a year from Maharashtra, so ₹12,000 a year with PM-KISAN", "steps": [{"phase": "Make sure you qualify", "kind": "you", "who": "You", "title": "No separate form needed", "body": "If you are an <b>approved PM-KISAN beneficiary in Maharashtra<\/b>, you are added to Namo Shetkari <b>automatically<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Anyone asking money to \"register\" you for Namo Shetkari is cheating you."}}, {"phase": null, "kind": "you", "who": "You", "title": "Be active in PM-KISAN", "body": "Your PM-KISAN registration must be <b>approved and active<\/b>, with land in your name. See the <b>PM-KISAN<\/b> guide if you are not registered.", "note": {"kind": "stuck", "label": "Stuck?", "html": "PM-KISAN stopped? Namo Shetkari stops too. Fix PM-KISAN first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep eKYC done", "body": "Complete <b>eKYC<\/b> on pmkisan.gov.in (OTP) or by face authentication in the app.", "note": {"kind": "stuck", "label": "Stuck?", "html": "eKYC pending is the most common reason both payments stop."}}, {"phase": null, "kind": "you", "who": "You", "title": "Link Aadhaar to your bank", "body": "Your bank account must be <b>Aadhaar-seeded with DBT on<\/b>. Ask your bank to confirm.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check land seeding", "body": "Your <b>7/12 land details<\/b> must be verified and linked to your record. Check \"land seeding\" in your status.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land seeding shows <b>No<\/b>? Contact the <b>Talathi / Krushi Sahayak<\/b> with your 7/12. Land still in a parent's name? See the <b>Ferfar<\/b> guide."}}, {"phase": "Payment", "kind": "gov", "who": "Government", "title": "State releases the instalment", "body": "The state prepares the list from PM-KISAN data (after eKYC, land and bank checks) and releases each instalment by DBT.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "₹2,000 in your account", "body": "You get an SMS. Together with PM-KISAN you receive <b>₹12,000 a year<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Getting PM-KISAN but <b>not<\/b> Namo Shetkari? Check your status on the <b>Namo Shetkari portal<\/b>, then contact the <b>Taluka Agriculture Officer<\/b>."}}], "rights_t": "Instalment missing? Follow up.", "rights": "Check status on the official <b>Namo Shetkari (NSMNY) portal<\/b> and pmkisan.gov.in. Then write to the <b>Taluka Agriculture Officer<\/b> with your PM-KISAN registration number and take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Status:<\/b> NSMNY portal (Maharashtra) and pmkisan.gov.in · Fix eKYC, bank and land seeding in PM-KISAN; Namo follows automatically<br/><b>No registration fee<\/b> · <b>Use only official websites<\/b>"}, "mr": {"h1": "नमो शेतकरी महासन्मान निधी: पीएम-किसानसोबत वर्षाला अतिरिक्त ₹6,000", "benefit": "महाराष्ट्राकडून वर्षातून 3 वेळा ₹2,000, म्हणजे पीएम-किसानसह वर्षाला ₹12,000", "steps": [{"phase": "पात्र असल्याची खात्री करा", "kind": "you", "who": "तुम्ही", "title": "वेगळा अर्ज लागत नाही", "body": "तुम्ही <b>महाराष्ट्रातील मंजूर पीएम-किसान लाभार्थी<\/b> असाल, तर तुमचा नमो शेतकरी योजनेत <b>आपोआप<\/b> समावेश होतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "नमो शेतकरीसाठी \"नोंदणी करून देण्यासाठी\" पैसे मागणारा तुमची फसवणूक करत आहे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "पीएम-किसानमध्ये सक्रिय राहा", "body": "तुमची पीएम-किसान नोंदणी <b>मंजूर व सक्रिय<\/b> असावी आणि जमीन तुमच्या नावावर असावी. नोंदणी नसल्यास <b>पीएम-किसान<\/b> मार्गदर्शक पाहा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पीएम-किसान बंद झाले? मग नमो शेतकरीही बंद होते. आधी पीएम-किसान दुरुस्त करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-केवायसी पूर्ण ठेवा", "body": "pmkisan.gov.in वर (OTP) किंवा ॲपमध्ये चेहरा प्रमाणीकरणाने <b>ई-केवायसी<\/b> पूर्ण करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "ई-केवायसी बाकी असणे हे दोन्ही हप्ते थांबण्याचे सर्वात सामान्य कारण आहे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "आधार बँकेशी लिंक करा", "body": "तुमचे बँक खाते <b>आधार-सीडेड आणि DBT सुरू<\/b> असले पाहिजे. बँकेकडून खात्री करा.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जमीन नोंद (लँड सीडिंग) तपासा", "body": "तुमच्या <b>7/12 जमिनीची माहिती<\/b> पडताळून तुमच्या नोंदीशी जोडलेली असावी. स्थितीमध्ये \"land seeding\" तपासा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "लँड सीडिंग <b>No<\/b> दाखवते? 7/12 घेऊन <b>तलाठी / कृषी सहायक<\/b> यांच्याशी संपर्क करा. जमीन अजून पालकांच्या नावावर? <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": "हप्ता", "kind": "gov", "who": "सरकार", "title": "राज्य हप्ता वितरित करते", "body": "राज्य पीएम-किसान माहितीवरून (ई-केवायसी, जमीन व बँक तपासणीनंतर) यादी तयार करून प्रत्येक हप्ता DBT द्वारे वितरित करते.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "₹2,000 खात्यात जमा", "body": "तुम्हाला SMS येतो. पीएम-किसानसह तुम्हाला <b>वर्षाला ₹12,000<\/b> मिळतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पीएम-किसान मिळते पण नमो शेतकरी <b>नाही<\/b>? <b>नमो शेतकरी पोर्टलवर<\/b> स्थिती तपासा, नंतर <b>तालुका कृषी अधिकाऱ्यांशी<\/b> संपर्क करा."}}], "rights_t": "हप्ता मिळाला नाही? पाठपुरावा करा.", "rights": "अधिकृत <b>नमो शेतकरी (NSMNY) पोर्टल<\/b> आणि pmkisan.gov.in वर स्थिती तपासा. नंतर पीएम-किसान नोंदणी क्रमांकासह <b>तालुका कृषी अधिकाऱ्यांना<\/b> लिहा आणि <b>पोच<\/b> घ्या.", "help": "<b>स्थिती:<\/b> NSMNY पोर्टल (महाराष्ट्र) आणि pmkisan.gov.in · पीएम-किसानमध्ये ई-केवायसी, बँक व लँड सीडिंग दुरुस्त करा; नमो आपोआप मिळते<br/><b>नोंदणी शुल्क नाही<\/b> · <b>फक्त अधिकृत वेबसाइट वापरा<\/b>"}}, {"slug": "pik-vima", "title": "Crop insurance (PM Fasal Bima)", "mr_name": "पीक विमा", "audience": "Farmers growing notified crops (AgriStack ID + e-Pik Pahani)", "cat": "farm", "links": [{"label": "PMFBY: enrol, policy, claim status", "url": "https://pmfby.gov.in", "gov": true}, {"label": "AgriStack Farmer ID (Maharashtra)", "url": "https://mhfr.agristack.gov.in", "gov": false}, {"label": "PIB: PMFBY press release", "url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2304549&reg=48&lang=2", "gov": true}], "mermaid": "flowchart TD\n    A([Farmer growing a notified crop]) --> ID{1. AgriStack Farmer ID?}\n    ID -- No --> RID[Register on mhfr.agristack.gov.in / CSC]\n    RID --> EP\n    ID -- Yes --> EP[2. e-Pik Pahani: record sown crop<br/>on survey / Gat number]\n    EP --> D[3. Documents<br/>7/12, 8A or tenancy agreement,<br/>Aadhaar, seeded bank, sowing declaration]\n    D --> EN[4. Enrol before deadline<br/>pmfby.gov.in / app / CSC / bank<br/>pay premium: Kharif 2, Rabi 1.5,<br/>commercial 5 percent of sum insured]\n    EN -- Missed deadline --> X([Not insured this season])\n    EN --> PC[5. Check policy on pmfby.gov.in<br/>crop, area, survey no., bank]\n    PC -- Mismatch with e-Pik Pahani --> F1[Policy cancelled, premium lost]\n    PC -- Wrong details --> FX[Correct before correction deadline]\n    FX --> PC\n    PC -- OK --> SE[Season: crop-cutting experiments<br/>in revenue circle]\n    SE --> Y{Average yield below<br/>threshold yield?}\n    Y -- No --> NC([No claim this season])\n    Y -- Yes --> CL[6. Claim calculated by insurer]\n    CL --> P([7. Claim paid to Aadhaar-linked bank])\n    CL -. delayed / wrong .-> T[Complaint: pmfby.gov.in / helpline,<br/>Taluka Agriculture Officer]\n\n    S1[[Sathi: Farmer ID + e-Pik Pahani readiness]]:::sathi -.-> ID\n    S2[[Sathi GIS: crop on e-Pik Pahani vs<br/>policy crop vs satellite crop map]]:::sathi -.-> PC\n    S3[[Sathi: Season deadline countdown]]:::sathi -.-> EN\n    S4[[Sathi: Revenue-circle yield + claim tracker]]:::sathi -.-> Y\n    S5[[Sathi: Complaint draft with policy no.]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1 blocked", "sources": [{"label": "Free Press Journal: PMFBY Kharif-Rabi 2025 open, e-survey and AgriStack mandatory", "url": "https://www.freepressjournal.in/mumbai/raigad-pmfby-kharif-rabi-2025-crop-insurance-now-open-e-survey-agristack-id-mandatory"}, {"label": "PIB press release", "url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2304549&reg=48&lang=2"}, {"label": "MahaBharti: Maharashtra revised crop insurance scheme", "url": "https://mahabharti.in/maharashtra-sudharit-pik-vima-yojana/"}, {"label": "Kshema: PMFBY 2026", "url": "https://kshema.co/blogs/pmfby-crop-insurance-india-2026/"}, {"label": "AgriStack Farmer ID registration", "url": "https://www.egovtschemes.com/agristack-registration/"}, {"label": "Agrijob: PMFBY benefits 2016-2025", "url": "https://www.agrijob.in/pmfby-farmer-benefits-claims-data-2016-2025/"}, {"label": "Zee News: crop insurance fraud report", "url": "https://zeenews.india.com/marathi/video/fraud-in-peek-vima-yojna/899329"}], "en": {"h1": "Crop Insurance (PM Fasal Bima): How to insure your crop", "benefit": "Compensation when natural calamity, pests or disease cut your crop yield", "steps": [{"phase": "Before the deadline", "kind": "you", "who": "You", "title": "Know what has changed", "body": "<ul><li>The <b>₹1 crop insurance ended in 2025<\/b>. You now pay a small premium: about <b>2%<\/b> of sum insured for <b>Kharif<\/b>, <b>1.5%<\/b> for <b>Rabi<\/b>, <b>5%<\/b> for commercial / horticulture crops<\/li><li>Owner, tenant and sharecropper farmers growing a <b>notified crop<\/b> in a <b>notified area<\/b> can join<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Get your AgriStack Farmer ID", "body": "A <b>Farmer ID<\/b> is <b>mandatory<\/b>. Register on <b>mhfr.agristack.gov.in<\/b> or at a CSC with Aadhaar and your 7/12.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No Farmer ID? You cannot enrol. Do this <b>weeks before<\/b> the deadline."}}, {"phase": null, "kind": "you", "who": "You", "title": "Record your crop in e-Pik Pahani", "body": "Register the crop you sowed on the <b>e-Pik Pahani<\/b> app for your survey / Gat number.", "note": {"kind": "stuck", "label": "Stuck?", "html": "If the crop in your insurance form <b>does not match<\/b> e-Pik Pahani, the policy can be <b>cancelled<\/b> and the premium lost."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>7/12 and 8A<\/b> (tenants: lease / sharecropping agreement)<\/li><li>Aadhaar, <b>bank passbook<\/b> (account linked to Aadhaar)<\/li><li>Sowing declaration (crop, area)<\/li><li>Farmer ID<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Enrol and pay premium before the deadline", "body": "Enrol on <b>pmfby.gov.in<\/b> (Farmer Corner), the <b>Crop Insurance app<\/b>, at a <b>CSC<\/b> or at your <b>bank<\/b>. Pay your premium share. Keep the <b>policy / receipt number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Kharif enrolment usually closes around <b>end of July<\/b>. Check the current season's date. Loanee farmers: ask your bank whether you are enrolled."}}, {"phase": "After you enrol", "kind": "you", "who": "You", "title": "Check your policy", "body": "Check the policy on <b>pmfby.gov.in<\/b> with your receipt number: <b>crop, area, survey number and bank<\/b> must be correct.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Wrong crop or area? Ask the CSC / bank / insurer to correct it <b>before the correction deadline<\/b>."}}, {"phase": null, "kind": "gov", "who": "Govt / Insurer", "title": "Crop loss is assessed", "body": "Under the revised scheme, compensation is mainly based on <b>crop-cutting experiments<\/b> in your <b>revenue circle<\/b>: if the average yield is below the threshold yield, insured farmers get a claim.", "note": {"kind": "tip", "label": "Tip:", "html": "Damage on your own field? Inform the <b>insurer / agriculture office quickly<\/b> with photos and ask if an individual claim is allowed this season."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Claim paid to your bank", "body": "Approved claims are paid directly into your <b>Aadhaar-linked bank account<\/b>. Check claim status on pmfby.gov.in.", "note": null}], "rights_t": "Claim missing or wrong? Complain.", "rights": "Raise a complaint on <b>pmfby.gov.in<\/b> or the official helpline listed there, and write to the <b>Taluka Agriculture Officer<\/b> / district agriculture office with your policy number. Take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Enrol / status:<\/b> pmfby.gov.in · <b>Farmer ID:<\/b> mhfr.agristack.gov.in · Rates and dates change by season; check the current notification<br/><b>Use only official websites and apps<\/b>"}, "mr": {"h1": "पीक विमा (प्रधानमंत्री पीक विमा योजना): तुमच्या पिकाचा विमा कसा काढायचा", "benefit": "नैसर्गिक आपत्ती, कीड किंवा रोगामुळे उत्पादन घटल्यास नुकसान भरपाई", "steps": [{"phase": "मुदतीपूर्वी", "kind": "you", "who": "तुम्ही", "title": "काय बदलले ते जाणा", "body": "<ul><li><b>₹1 पीक विमा 2025 मध्ये बंद झाला<\/b>. आता थोडा हप्ता भरावा लागतो: विमा संरक्षित रकमेच्या सुमारे <b>खरीपसाठी 2%<\/b>, <b>रब्बीसाठी 1.5%<\/b>, नगदी / फळपिकांसाठी <b>5%<\/b><\/li><li><b>अधिसूचित क्षेत्रात अधिसूचित पीक<\/b> घेणारे मालक, कुळ आणि बटाईदार शेतकरी सहभागी होऊ शकतात<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ॲग्रीस्टॅक शेतकरी ओळखपत्र मिळवा", "body": "<b>शेतकरी ओळखपत्र (Farmer ID) बंधनकारक<\/b> आहे. आधार व 7/12 सह <b>mhfr.agristack.gov.in<\/b> वर किंवा CSC मध्ये नोंदणी करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "Farmer ID नाही? मग नोंदणी करता येत नाही. हे मुदतीच्या <b>काही आठवडे आधीच<\/b> करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-पीक पाहणीत पिकाची नोंद करा", "body": "तुमच्या सर्वे / गट क्रमांकावर पेरलेल्या पिकाची <b>ई-पीक पाहणी<\/b> ॲपवर नोंद करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "विमा अर्जातील पीक ई-पीक पाहणीशी <b>जुळले नाही<\/b> तर पॉलिसी <b>रद्द<\/b> होऊन हप्ता बुडू शकतो."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>7/12 व 8-अ<\/b> (कुळांसाठी: भाडेपट्टा / बटाई करार)<\/li><li>आधार, <b>बँक पासबुक<\/b> (खाते आधारशी लिंक)<\/li><li>पेरणी घोषणापत्र (पीक, क्षेत्र)<\/li><li>शेतकरी ओळखपत्र (Farmer ID)<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "मुदतीपूर्वी नोंदणी करून हप्ता भरा", "body": "<b>pmfby.gov.in<\/b> (Farmer Corner), <b>Crop Insurance ॲप<\/b>, <b>CSC<\/b> किंवा तुमच्या <b>बँकेत<\/b> नोंदणी करा. तुमचा हप्ता भरा. <b>पॉलिसी / पावती क्रमांक<\/b> जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "खरीप नोंदणी सहसा <b>जुलैअखेर<\/b> बंद होते. चालू हंगामाची तारीख तपासा. कर्जदार शेतकऱ्यांनी आपली नोंदणी झाली आहे का ते बँकेत विचारावे."}}, {"phase": "नोंदणीनंतर", "kind": "you", "who": "तुम्ही", "title": "पॉलिसी तपासा", "body": "पावती क्रमांकाने <b>pmfby.gov.in<\/b> वर पॉलिसी तपासा: <b>पीक, क्षेत्र, सर्वे क्रमांक आणि बँक<\/b> बरोबर असले पाहिजे.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पीक किंवा क्षेत्र चुकीचे? <b>दुरुस्तीच्या मुदतीपूर्वी<\/b> CSC / बँक / विमा कंपनीकडून दुरुस्त करून घ्या."}}, {"phase": null, "kind": "gov", "who": "सरकार / विमा कंपनी", "title": "पीक नुकसानीचे मूल्यमापन", "body": "सुधारित योजनेत नुकसान भरपाई मुख्यतः तुमच्या <b>महसूल मंडळातील पीक कापणी प्रयोगांवर<\/b> आधारित असते: सरासरी उत्पादन उंबरठा उत्पादनापेक्षा कमी आल्यास विमाधारक शेतकऱ्यांना दावा मिळतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमच्या शेतात नुकसान झाले? फोटोसह <b>विमा कंपनी / कृषी कार्यालयाला लवकर कळवा<\/b> आणि या हंगामात वैयक्तिक दावा चालतो का ते विचारा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दावा रक्कम बँक खात्यात", "body": "मंजूर दावा थेट तुमच्या <b>आधार-लिंक बँक खात्यात<\/b> जमा होतो. दाव्याची स्थिती pmfby.gov.in वर तपासा.", "note": null}], "rights_t": "दावा मिळाला नाही किंवा चुकीचा? तक्रार करा.", "rights": "<b>pmfby.gov.in<\/b> वर किंवा तिथे दिलेल्या अधिकृत हेल्पलाइनवर तक्रार नोंदवा, आणि पॉलिसी क्रमांकासह <b>तालुका कृषी अधिकारी<\/b> / जिल्हा कृषी कार्यालयाला लिहा. <b>पोच<\/b> घ्या.", "help": "<b>नोंदणी / स्थिती:<\/b> pmfby.gov.in · <b>Farmer ID:<\/b> mhfr.agristack.gov.in · दर व तारखा हंगामानुसार बदलतात; चालू अधिसूचना तपासा<br/><b>फक्त अधिकृत वेबसाइट व ॲप वापरा<\/b>"}}, {"slug": "krushi-swavalamban", "title": "Krushi Swavalamban Yojana", "mr_name": "डॉ. बाबासाहेब आंबेडकर कृषी स्वावलंबन योजना", "audience": "SC / Nav-Bauddha farmers (wells, irrigation)", "cat": "farm", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}, {"label": "ZP Palghar: scheme page", "url": "https://www.zppalghar.gov.in/en/dr-babasaheb-ambedkar-krishi-swalamban-yojana/", "gov": true}], "mermaid": "flowchart TD\n    A([SC / Nav-Bauddha farmer]) --> E{1. Eligible?<br/>MH, land 0.40 to 6 ha in own name}\n    E -- Land not in name --> F0[Blocked: get ferfar done first]\n    E -- Yes --> C{2. Component}\n    C -- New well --> W{Public drinking well<br/>within 500 m?}\n    W -- Yes --> X([New well not allowed])\n    W -- No --> D\n    C -- Repair / boring / pump / power /<br/>pond lining / drip / sprinkler --> D\n    D[3. Documents<br/>caste cert, 7/12, 8A, Aadhaar, seeded bank,<br/>affidavit; for well: Talathi cert,<br/>GSDA groundwater cert, Gram Sabha resolution]\n    D --> AP[4. Apply on MahaDBT farmer login<br/>application ID]\n    AP --> SEL{Selected?}\n    SEL -- Not this round --> RE[Wait / reapply next round]\n    SEL -- Yes --> PA[5. Document check + pre-approval<br/>Panchayat Samiti agriculture office]\n    PA --> WK[6. Do the work after pre-approval<br/>bills, photos, upload]\n    WK -- Started before pre-approval --> F1[Not payable]\n    WK --> IN[7. Inspection + measurement<br/>Agriculture Officer]\n    IN -- Delay --> F2[Inspection pending]\n    IN --> P([8. Grant by DBT<br/>well paid in stages])\n    F2 -.-> T[Escalate: Agriculture Officer PS,<br/>then Agri Development Officer ZP,<br/>MahaDBT grievance]\n\n    S1[[Sathi: Eligibility + land readiness<br/>7/12 Health Report + Ferfar]]:::sathi -.-> E\n    S2[[Sathi GIS check: distance to public wells,<br/>groundwater zone, parcel boundary]]:::sathi -.-> W\n    S3[[Sathi: Document checklist per component]]:::sathi -.-> D\n    S4[[Sathi: Window alert + selection tracker]]:::sathi -.-> SEL\n    S5[[Sathi: No-work-before-approval alert,<br/>geo-tagged stage photos]]:::sathi -.-> WK\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "ZP Palghar: Dr. Babasaheb Ambedkar Krishi Swalamban Yojana", "url": "https://www.zppalghar.gov.in/en/dr-babasaheb-ambedkar-krishi-swalamban-yojana/"}, {"label": "ZP Satara: scheme 2024-25", "url": "https://www.zpsatara.gov.in/scheme/%E0%A4%A1%E0%A5%89-%E0%A4%AC%E0%A4%BE%E0%A4%AC%E0%A4%BE%E0%A4%B8%E0%A4%BE%E0%A4%B9%E0%A5%87%E0%A4%AC-%E0%A4%86%E0%A4%82%E0%A4%AC%E0%A5%87%E0%A4%A1%E0%A4%95%E0%A4%B0-%E0%A4%95%E0%A5%83%E0%A4%B7/"}, {"label": "Mahasamvad: financial criteria increased", "url": "https://mahasamvad.in/146716/"}, {"label": "Agrowon: ₹4 lakh for new wells", "url": "https://agrowon.esakal.com/agro-special/state-government-will-provide-rs-4-lakh-subsidy-for-new-wells-state-governments-scheme-for-farmers-rat16"}, {"label": "Lokmat: new well documents", "url": "https://www.lokmat.com/agriculture/smart-farming/latest-news-vihir-yojana-what-documents-are-required-for-new-well-scheme-see-list-of-documents-a-a993/"}, {"label": "Saam TV: ₹4 lakh well subsidy", "url": "https://saamtv.esakal.com/image-story/maharashtra-government-schemes-offer-financial-aid-for-wells-drip-irrigation-and-pumps-beed-farmers-can-get-subsidies-up-to-rs-4-lakh-bbj88"}, {"label": "Krushi Kranti: document list", "url": "https://www.krushikranti.com/blogs/babasaheb-krushi-swavalamban-yojana-navin-vihir-kagdptra"}, {"label": "Mahiti A1: changes and GR", "url": "https://mahitia1.in/babasaheb-ambedkar-khrushi-swavlamban-yojna-big-changes/"}], "en": {"h1": "Krushi Swavalamban Yojana: Grants for wells and irrigation for SC farmers", "benefit": "Up to ₹4 lakh for a new well, plus grants for pumps, drip / sprinkler and farm-pond lining", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer from a <b>Scheduled Caste or Nav-Bauddha<\/b> family in Maharashtra<\/li><li><b>Farmland in your name<\/b>: about <b>0.40 to 6 hectares<\/b> (7/12 and 8A)<\/li><li>The old ₹1.5 lakh income limit has been <b>removed<\/b> under the 2024 GR<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "ST farmers: ask about the separate <b>Birsa Munda Krushi Kranti Yojana<\/b>."}}, {"phase": null, "kind": "you", "who": "You", "title": "Choose what you need", "body": "<ul><li><b>New well<\/b>: up to ₹4 lakh<\/li><li><b>Old well repair<\/b>: up to ₹1 lakh<\/li><li><b>In-well boring<\/b>: ₹40,000 · <b>Pump set<\/b>: ₹40,000 · <b>Electric connection<\/b>: ₹20,000<\/li><li><b>Farm-pond plastic lining<\/b>: 90% of cost, up to ₹2 lakh<\/li><li><b>Drip<\/b>: up to ₹97,000 · <b>Sprinkler<\/b>: up to ₹47,000<\/li><li>Solar pump, farm machinery: about ₹50,000<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>New well<\/b> is not allowed within <b>500 metres of a village public drinking-water well<\/b>. Check before you apply."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Caste certificate<\/b><\/li><li><b>7/12 and 8A<\/b> extracts in your name<\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b><\/li><li>Self-declaration / affidavit<\/li><li><b>For a new well<\/b>: Talathi certificate (no existing well), <b>groundwater (GSDA) certificate<\/b>, <b>Gram Sabha resolution<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the <b>ferfar<\/b> done first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on MahaDBT", "body": "Log in on <b>mahadbt.maharashtra.gov.in<\/b> as a <b>Farmer<\/b> (Aadhaar-based), fill your profile, choose this scheme and the component, upload documents and submit. Note your <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Apply <b>early<\/b> when the window opens. Selection is limited and may be first-come or by draw. Applying is <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Agriculture office", "title": "Selection and pre-approval", "body": "If selected, the Panchayat Samiti agriculture office checks your documents and gives <b>pre-approval (पूर्वसंमती)<\/b> for the work.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Do not start work before pre-approval.<\/b> Work done earlier is usually not paid."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do the work, keep proof", "body": "Complete the work within the time given. Keep <b>bills, quotations and photos<\/b> of each stage (geo-tagged where asked). Upload them on MahaDBT.", "note": null}, {"phase": null, "kind": "gov", "who": "Agriculture office", "title": "Inspection", "body": "The <b>Agriculture Officer<\/b> inspects and measures the completed work.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Inspection delayed? Ask the Panchayat Samiti agriculture office in writing with your application ID."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Grant paid to your bank", "body": "The grant is paid by <b>DBT<\/b> into your Aadhaar-linked bank account. For a new well it may come in <b>stages<\/b> as work progresses.", "note": null}], "rights_t": "Stuck for long? Escalate.", "rights": "Write to the <b>Agriculture Officer, Panchayat Samiti<\/b>, then the <b>Agriculture Development Officer, Zilla Parishad<\/b>, with your MahaDBT application ID, and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>MahaDBT<\/b>.", "help": "<b>Apply:<\/b> mahadbt.maharashtra.gov.in → Farmer login · Amounts as per the 2024 GR; check the current notice<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "कृषी स्वावलंबन योजना: अनुसूचित जातीतील शेतकऱ्यांना विहीर व सिंचनासाठी अनुदान", "benefit": "नवीन विहिरीसाठी ₹4 लाखांपर्यंत, शिवाय पंप, ठिबक / तुषार आणि शेततळे अस्तरीकरणासाठी अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li>महाराष्ट्रातील <b>अनुसूचित जाती किंवा नवबौद्ध<\/b> कुटुंबातील शेतकरी<\/li><li><b>तुमच्या नावावर शेतजमीन<\/b>: सुमारे <b>0.40 ते 6 हेक्टर<\/b> (7/12 व 8-अ)<\/li><li>2024 च्या शासन निर्णयानुसार जुनी ₹1.5 लाख उत्पन्न मर्यादा <b>रद्द<\/b> झाली आहे<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "अनुसूचित जमातीतील शेतकऱ्यांनी स्वतंत्र <b>बिरसा मुंडा कृषी क्रांती योजनेबद्दल<\/b> विचारावे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काय हवे ते निवडा", "body": "<ul><li><b>नवीन विहीर<\/b>: ₹4 लाखांपर्यंत<\/li><li><b>जुनी विहीर दुरुस्ती<\/b>: ₹1 लाखापर्यंत<\/li><li><b>इनवेल बोअरिंग<\/b>: ₹40,000 · <b>पंप संच<\/b>: ₹40,000 · <b>वीज जोडणी<\/b>: ₹20,000<\/li><li><b>शेततळे प्लास्टिक अस्तरीकरण<\/b>: खर्चाच्या 90%, ₹2 लाखांपर्यंत<\/li><li><b>ठिबक<\/b>: ₹97,000 पर्यंत · <b>तुषार<\/b>: ₹47,000 पर्यंत<\/li><li>सौर पंप, शेती अवजारे: सुमारे ₹50,000<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "गावाच्या <b>सार्वजनिक पिण्याच्या पाण्याच्या विहिरीपासून 500 मीटरच्या आत<\/b> <b>नवीन विहीर<\/b> मंजूर होत नाही. अर्ज करण्यापूर्वी तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>जातीचा दाखला<\/b><\/li><li>तुमच्या नावाचे <b>7/12 व 8-अ<\/b> उतारे<\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b><\/li><li>स्वयंघोषणापत्र / प्रतिज्ञापत्र<\/li><li><b>नवीन विहिरीसाठी<\/b>: तलाठी दाखला (विहीर नसल्याचा), <b>भूजल (GSDA) दाखला<\/b>, <b>ग्रामसभा ठराव<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून पालकांच्या नावावर? आधी <b>फेरफार<\/b> करून घ्या. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महाडीबीटीवर अर्ज करा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> वर <b>शेतकरी<\/b> म्हणून (आधार आधारित) लॉगिन करा, प्रोफाइल भरा, ही योजना व घटक निवडा, कागदपत्रे अपलोड करून अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज खिडकी उघडताच <b>लवकर<\/b> अर्ज करा. निवड मर्यादित असते आणि प्रथम येणाऱ्यास प्राधान्य किंवा सोडतीने होऊ शकते. अर्ज <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "कृषी कार्यालय", "title": "निवड व पूर्वसंमती", "body": "निवड झाल्यास पंचायत समितीचे कृषी कार्यालय कागदपत्रे तपासून कामासाठी <b>पूर्वसंमती<\/b> देते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>पूर्वसंमतीपूर्वी काम सुरू करू नका.<\/b> आधी केलेल्या कामाचे अनुदान सहसा मिळत नाही."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काम करा, पुरावे ठेवा", "body": "दिलेल्या मुदतीत काम पूर्ण करा. प्रत्येक टप्प्याची <b>बिले, कोटेशन आणि फोटो<\/b> (सांगितल्यास जिओ-टॅग) ठेवा. ते महाडीबीटीवर अपलोड करा.", "note": null}, {"phase": null, "kind": "gov", "who": "कृषी कार्यालय", "title": "तपासणी", "body": "<b>कृषी अधिकारी<\/b> पूर्ण झालेल्या कामाची तपासणी व मोजमाप करतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "तपासणीला उशीर? अर्ज क्रमांकासह पंचायत समिती कृषी कार्यालयाकडे लेखी विचारणा करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अनुदान बँक खात्यात", "body": "अनुदान <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते. नवीन विहिरीसाठी कामाच्या प्रगतीनुसार <b>टप्प्याटप्प्याने<\/b> मिळू शकते.", "note": null}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "महाडीबीटी अर्ज क्रमांकासह आधी <b>कृषी अधिकारी, पंचायत समिती<\/b>, नंतर <b>कृषी विकास अधिकारी, जिल्हा परिषद<\/b> यांना लिहा आणि <b>पोच<\/b> घ्या. <b>महाडीबीटीवर<\/b> तक्रारही नोंदवता येते.", "help": "<b>अर्ज:<\/b> mahadbt.maharashtra.gov.in → शेतकरी लॉगिन · रक्कम 2024 च्या शासन निर्णयानुसार; चालू सूचना तपासा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "birsa-munda", "title": "Birsa Munda Krushi Kranti Yojana", "mr_name": "बिरसा मुंडा कृषी क्रांती योजना", "audience": "ST farmers incl. forest-rights holders (wells, irrigation)", "cat": "farm", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}, {"label": "ZP Satara: scheme page 2024-25", "url": "https://www.zpsatara.gov.in/en/scheme/birsa-munda-agricultural-revolution-scheme-for-the-year-2024-25/", "gov": true}], "mermaid": "flowchart TD\n    A([Scheduled Tribe farmer]) --> E{1. Eligible?<br/>MH, land 0.20 to 6 ha in own name<br/>or forest-rights title}\n    E -- Land not in name --> F0[Blocked: get ferfar done first]\n    E -- Yes --> C{2. Component}\n    C -- New well --> L{Own land 0.40 ha or more?}\n    L -- No --> J[Joint application with<br/>neighbouring tribal farmers]\n    L -- Yes --> D\n    J --> D\n    C -- Borewell --> FR{Forest-rights holder?}\n    FR -- No --> X([Borewell not available])\n    FR -- Yes --> D\n    C -- Repair / boring / pump / power /<br/>pond lining / drip / sprinkler --> D\n    D[3. Documents<br/>ST caste cert, 7/12 + 8A or forest title,<br/>Aadhaar, seeded bank, affidavit;<br/>for well: Talathi cert, GSDA cert, Gram Sabha resolution]\n    D --> AP[4. Apply on MahaDBT farmer login<br/>application ID]\n    AP --> LOT{Lottery<br/>priority: BPL, primitive tribal groups}\n    LOT -- Not selected --> RE[Reapply next round]\n    LOT -- Selected --> PA[5. Document check + pre-approval<br/>Panchayat Samiti agriculture office]\n    PA --> WK[6. Work after pre-approval<br/>bills, photos, upload]\n    WK -- Started before pre-approval --> F1[Not payable]\n    WK --> IN[7. Inspection + measurement]\n    IN -- Delay --> F2[Inspection pending]\n    IN --> P([8. Grant by DBT<br/>well paid in stages])\n    F2 -.-> T[Escalate: Agriculture Officer PS,<br/>then Agri Development Officer ZP,<br/>MahaDBT grievance]\n\n    S1[[Sathi: Scheme router<br/>ST to Birsa Munda, SC to Krushi Swavalamban]]:::sathi -.-> E\n    S2[[Sathi GIS: parcel or forest-rights plot,<br/>groundwater zone, joint-holding match]]:::sathi -.-> L\n    S3[[Sathi: Document checklist per component]]:::sathi -.-> D\n    S4[[Sathi: Lottery result tracker]]:::sathi -.-> LOT\n    S5[[Sathi: No-work-before-approval alert,<br/>geo-tagged stage photos]]:::sathi -.-> WK\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "Mahasamvad: Birsa Munda criteria revised", "url": "https://mahasamvad.in/144994/"}, {"label": "Mahasamvad: Agriculture Minister's appeal on both schemes", "url": "https://www.mahasamvad.in/146971/"}, {"label": "Agrowon: subsidy increase under Birsa Munda", "url": "https://agrowon.esakal.com/agro-special/increase-in-the-subsidy-under-the-birsa-munda-kranti-scheme"}, {"label": "Agrowon: up to ₹4 lakh for wells", "url": "https://agrowon.esakal.com/agro-special/subsidy-up-to-rs-4-lakh-will-now-be-available-for-wells-start-the-application-process"}, {"label": "ZP Satara: Birsa Munda 2024-25", "url": "https://www.zpsatara.gov.in/en/scheme/birsa-munda-agricultural-revolution-scheme-for-the-year-2024-25/"}, {"label": "MahaDBT: scheme data", "url": "https://mahadbt.maharashtra.gov.in/Farmer/SchemeData/SchemeData?str=E9DDFA703C38E51ACA98B76653871714"}, {"label": "MS Dhulap: criteria update", "url": "https://www.msdhulap.com/birsa-munda-krishi-kranti-yojana-update/"}, {"label": "Bayer FarmRise: Birsa Munda", "url": "https://farmrise.bayer.com/en/govt-scheme/birsa-munda-krushi-kranti-yojana"}], "en": {"h1": "Birsa Munda Krushi Kranti Yojana: Grants for wells and irrigation for tribal farmers", "benefit": "Up to ₹4 lakh for a new well, plus grants for pumps, drip / sprinkler and farm-pond lining", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer from a <b>Scheduled Tribe<\/b> family in Maharashtra, inside or outside tribal areas<\/li><li>Farmland in your name: <b>0.20 to 6 hectares<\/b> (at least <b>0.40 ha for a new well<\/b>)<\/li><li><b>Forest-rights (वनपट्टा) holders<\/b> can also apply<\/li><li>The old ₹1.5 lakh income limit has been <b>removed<\/b> under the 2024 GR<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Land below 0.40 ha? Neighbouring tribal farmers can <b>apply jointly<\/b> for a new well. BPL families are not limited by the 6 ha cap. SC farmers: see the <b>Krushi Swavalamban<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Choose what you need", "body": "<ul><li><b>New well<\/b>: up to ₹4 lakh<\/li><li><b>Old well repair<\/b>: up to ₹1 lakh<\/li><li><b>Borewell<\/b> (forest-rights holders only): up to ₹50,000<\/li><li><b>In-well boring<\/b>, <b>pump set<\/b>, <b>electric connection<\/b><\/li><li><b>Farm-pond plastic lining<\/b><\/li><li><b>Drip / sprinkler<\/b> irrigation<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "The 12-metre depth condition for new wells has been <b>removed<\/b>. Check the current notice for each component's limit."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Scheduled Tribe caste certificate<\/b><\/li><li><b>7/12 and 8A<\/b> in your name, or <b>forest-rights title (वनपट्टा)<\/b><\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b><\/li><li>Self-declaration / affidavit<\/li><li><b>For a new well<\/b>: Talathi certificate, <b>groundwater (GSDA) certificate<\/b>, <b>Gram Sabha resolution<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the <b>ferfar<\/b> done first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on MahaDBT", "body": "Log in on <b>mahadbt.maharashtra.gov.in<\/b> as a <b>Farmer<\/b> (Aadhaar-based), choose <b>Birsa Munda Krushi Kranti Yojana<\/b> and the component, upload documents and submit. Note your <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Selection is by <b>lottery<\/b>, with priority for BPL and primitive tribal group families. Applying is <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Agriculture office", "title": "Selection and pre-approval", "body": "If selected in the lottery, the Panchayat Samiti agriculture office checks your documents and gives <b>pre-approval (पूर्वसंमती)<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Do not start work before pre-approval.<\/b> Work done earlier is usually not paid."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do the work, keep proof", "body": "Complete the work within the time given. Keep <b>bills and photos<\/b> of each stage (geo-tagged where asked) and upload them on MahaDBT.", "note": null}, {"phase": null, "kind": "gov", "who": "Agriculture office", "title": "Inspection", "body": "The <b>Agriculture Officer<\/b> inspects and measures the completed work.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Inspection delayed? Ask the Panchayat Samiti agriculture office in writing with your application ID."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Grant paid to your bank", "body": "The grant is paid by <b>DBT<\/b> into your Aadhaar-linked bank account. For a new well it may come in <b>stages<\/b>.", "note": null}], "rights_t": "Stuck for long? Escalate.", "rights": "Write to the <b>Agriculture Officer, Panchayat Samiti<\/b>, then the <b>Agriculture Development Officer, Zilla Parishad<\/b>, with your MahaDBT application ID, and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>MahaDBT<\/b>.", "help": "<b>Apply:<\/b> mahadbt.maharashtra.gov.in → Farmer login · Amounts as per the 1 Oct 2024 GR; check the current notice<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "बिरसा मुंडा कृषी क्रांती योजना: आदिवासी शेतकऱ्यांना विहीर व सिंचनासाठी अनुदान", "benefit": "नवीन विहिरीसाठी ₹4 लाखांपर्यंत, शिवाय पंप, ठिबक / तुषार आणि शेततळे अस्तरीकरणासाठी अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li>महाराष्ट्रातील <b>अनुसूचित जमाती<\/b> कुटुंबातील शेतकरी, आदिवासी क्षेत्रांतर्गत किंवा क्षेत्राबाहेरील<\/li><li>तुमच्या नावावर शेतजमीन: <b>0.20 ते 6 हेक्टर<\/b> (<b>नवीन विहिरीसाठी किमान 0.40 हेक्टर<\/b>)<\/li><li><b>वनपट्टेधारक<\/b> शेतकरीही अर्ज करू शकतात<\/li><li>2024 च्या शासन निर्णयानुसार जुनी ₹1.5 लाख उत्पन्न मर्यादा <b>रद्द<\/b> झाली आहे<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "जमीन 0.40 हेक्टरपेक्षा कमी? शेजारील आदिवासी शेतकरी नवीन विहिरीसाठी <b>एकत्रित अर्ज<\/b> करू शकतात. दारिद्र्यरेषेखालील कुटुंबांना 6 हेक्टरची मर्यादा लागू नाही. अनुसूचित जातीतील शेतकऱ्यांनी <b>कृषी स्वावलंबन<\/b> मार्गदर्शक पाहावे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काय हवे ते निवडा", "body": "<ul><li><b>नवीन विहीर<\/b>: ₹4 लाखांपर्यंत<\/li><li><b>जुनी विहीर दुरुस्ती<\/b>: ₹1 लाखापर्यंत<\/li><li><b>विंधन विहीर<\/b> (फक्त वनपट्टेधारकांसाठी): ₹50,000 पर्यंत<\/li><li><b>इनवेल बोअरिंग<\/b>, <b>पंप संच<\/b>, <b>वीज जोडणी<\/b><\/li><li><b>शेततळे प्लास्टिक अस्तरीकरण<\/b><\/li><li><b>ठिबक / तुषार<\/b> सिंचन<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "नवीन विहिरीसाठी 12 मीटर खोलीची अट <b>रद्द<\/b> झाली आहे. प्रत्येक घटकाची मर्यादा चालू सूचनेत तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>अनुसूचित जमातीचा जातीचा दाखला<\/b><\/li><li>तुमच्या नावाचे <b>7/12 व 8-अ<\/b>, किंवा <b>वनपट्टा<\/b><\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b><\/li><li>स्वयंघोषणापत्र / प्रतिज्ञापत्र<\/li><li><b>नवीन विहिरीसाठी<\/b>: तलाठी दाखला, <b>भूजल (GSDA) दाखला<\/b>, <b>ग्रामसभा ठराव<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून पालकांच्या नावावर? आधी <b>फेरफार<\/b> करून घ्या. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महाडीबीटीवर अर्ज करा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> वर <b>शेतकरी<\/b> म्हणून (आधार आधारित) लॉगिन करा, <b>बिरसा मुंडा कृषी क्रांती योजना<\/b> व घटक निवडा, कागदपत्रे अपलोड करून अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "निवड <b>सोडतीने<\/b> होते; दारिद्र्यरेषेखालील आणि आदिम जमाती कुटुंबांना प्राधान्य. अर्ज <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "कृषी कार्यालय", "title": "निवड व पूर्वसंमती", "body": "सोडतीत निवड झाल्यास पंचायत समितीचे कृषी कार्यालय कागदपत्रे तपासून <b>पूर्वसंमती<\/b> देते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>पूर्वसंमतीपूर्वी काम सुरू करू नका.<\/b> आधी केलेल्या कामाचे अनुदान सहसा मिळत नाही."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काम करा, पुरावे ठेवा", "body": "दिलेल्या मुदतीत काम पूर्ण करा. प्रत्येक टप्प्याची <b>बिले आणि फोटो<\/b> (सांगितल्यास जिओ-टॅग) ठेवा आणि महाडीबीटीवर अपलोड करा.", "note": null}, {"phase": null, "kind": "gov", "who": "कृषी कार्यालय", "title": "तपासणी", "body": "<b>कृषी अधिकारी<\/b> पूर्ण झालेल्या कामाची तपासणी व मोजमाप करतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "तपासणीला उशीर? अर्ज क्रमांकासह पंचायत समिती कृषी कार्यालयाकडे लेखी विचारणा करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अनुदान बँक खात्यात", "body": "अनुदान <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते. नवीन विहिरीसाठी <b>टप्प्याटप्प्याने<\/b> मिळू शकते.", "note": null}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "महाडीबीटी अर्ज क्रमांकासह आधी <b>कृषी अधिकारी, पंचायत समिती<\/b>, नंतर <b>कृषी विकास अधिकारी, जिल्हा परिषद<\/b> यांना लिहा आणि <b>पोच<\/b> घ्या. <b>महाडीबीटीवर<\/b> तक्रारही नोंदवता येते.", "help": "<b>अर्ज:<\/b> mahadbt.maharashtra.gov.in → शेतकरी लॉगिन · रक्कम 1 ऑक्टोबर 2024 च्या शासन निर्णयानुसार; चालू सूचना तपासा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "magel-tyala-shettale", "title": "Magel Tyala Shettale", "mr_name": "मागेल त्याला शेततळे", "audience": "All farmers with 0.60 ha+ (farm pond)", "cat": "farm", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}, {"label": "Agriculture Department, Maharashtra", "url": "https://krishi.maharashtra.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Farmer wants a farm pond]) --> E{1. Eligible?<br/>0.60 ha or more in own name,<br/>no earlier farm-pond grant}\n    E -- Land not in name --> F0[Blocked: get ferfar done first]\n    E -- Earlier grant taken --> X([Not eligible])\n    E -- Yes --> S[2. Choose pond size<br/>about 15x15 m to 34x34 m, 3 m deep<br/>grant about Rs 14,000 to Rs 75,000]\n    S --> D[3. Documents<br/>7/12, 8A, Aadhaar, seeded bank,<br/>no-earlier-grant declaration]\n    D --> AP[4. Apply on MahaDBT farmer login<br/>Mukhyamantri Shashwat Krushi Sinchan Yojana<br/>first come, first served]\n    AP --> SEL{Selected?}\n    SEL -- No --> RE[Reapply next window]\n    SEL -- Yes --> PA[5. Pre-approval + site marking<br/>by Krushi Sahayak]\n    PA --> DG[6. Dig to approved size<br/>geo-tagged photos before / during / after]\n    DG -- Dug before approval --> F1[Not payable]\n    DG -- Smaller than approved --> F2[Grant reduced to actual size]\n    DG --> M[7. Measurement + photo check]\n    M --> P([8. Grant by DBT])\n    P --> LN[Optional: plastic lining via<br/>Krushi Swavalamban / Birsa Munda / horticulture scheme]\n    M -. delay .-> T[Escalate: Taluka Agriculture Officer,<br/>MahaDBT grievance]\n\n    S1[[Sathi: Eligibility + land readiness<br/>7/12 Health Report]]:::sathi -.-> E\n    S2[[Sathi GIS: best low-lying spot on the parcel<br/>from slope / flow accumulation]]:::sathi -.-> S\n    S3[[Sathi: Window alert, apply on day one]]:::sathi -.-> AP\n    S4[[Sathi: Photo check - pond inside parcel,<br/>size from image vs approved size]]:::sathi -.-> DG\n    S5[[Sathi: Lining scheme router]]:::sathi -.-> LN\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "MS Dhulap: farm pond subsidy under MahaDBT", "url": "https://www.msdhulap.com/shettale-subsidy-scheme-under-mahadbt/"}, {"label": "Krushi Davandi: farm pond schemes 2026", "url": "https://krushidavandi.in/shet-tale-anudan-yojana-maharashtra-mahiti/"}, {"label": "MH Shasan: Magel Tyala Shettale 2026", "url": "https://mhshasan.com/magel-tyala-shettale/"}, {"label": "Yojana Parichay: Magel Tyala Shettale 2025", "url": "https://yojanaparichay.com/magel-tyala-shettale-yojana/"}, {"label": "Maha Portal Yojna: Magel Tyala Shettale", "url": "https://mahaportalyojna.in/magel-tyala-shettale-yojana/"}, {"label": "Kisan Suvidha: MahaDBT farmer schemes 2025", "url": "https://kisansuvidha.in/mahadbt-farmer-scheme-2025/"}, {"label": "Sarkari Yojnaye: farm pond scheme", "url": "https://sarkariyojnaye.com/magel-tyala-shettale-farm-pond-subsidy-scheme-online-application/"}], "en": {"h1": "Magel Tyala Shettale: Grant to dig a farm pond", "benefit": "Up to ₹75,000 (by pond size) to store rainwater for protective irrigation", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer in Maharashtra with at least <b>0.60 hectare<\/b> of land <b>in your own name<\/b><\/li><li>You have <b>not received a farm-pond grant before<\/b> under any scheme (including group farm ponds)<\/li><li>Open to farmers of all categories<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "It now runs as the farm-pond part of the <b>Mukhyamantri Shashwat Krushi Sinchan Yojana<\/b> on MahaDBT."}}, {"phase": null, "kind": "you", "who": "You", "title": "Choose the pond size", "body": "Pond sizes range from about <b>15 × 15 m<\/b> to <b>34 × 34 m<\/b>, around <b>3 m deep<\/b>, with or without inlet / outlet. The grant depends on the size: from about <b>₹14,000<\/b> up to <b>₹75,000<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Choose a <b>low-lying spot<\/b> where rainwater collects. The Krushi Sahayak checks if the site is suitable."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>7/12 and 8A<\/b> extracts in your name<\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b><\/li><li>Self-declaration that you have not taken a farm-pond grant before<\/li><li>Caste certificate, if applying in a reserved category<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the <b>ferfar<\/b> done first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on MahaDBT", "body": "Log in on <b>mahadbt.maharashtra.gov.in<\/b> as a <b>Farmer<\/b>, choose <b>farm pond (शेततळे)<\/b> under the agriculture schemes, select the size, upload documents and submit. Note your <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "From 2025-26 selection is <b>first come, first served<\/b>. Apply as soon as the window opens. Applying is <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Agriculture office", "title": "Pre-approval and site marking", "body": "If selected, you get <b>pre-approval (पूर्वसंमती)<\/b>. The <b>Krushi Sahayak<\/b> checks the site and marks the pond layout.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Do not start digging before pre-approval and marking.<\/b> Ponds dug earlier are usually not paid."}}, {"phase": null, "kind": "you", "who": "You", "title": "Dig the pond, keep proof", "body": "Dig to the <b>approved size<\/b> within the time given. Take <b>geo-tagged photos<\/b> before, during and after digging and upload them on MahaDBT.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pond smaller than approved? The grant is cut to the size actually dug. Measure before you finish."}}, {"phase": null, "kind": "gov", "who": "Agriculture office", "title": "Measurement and inspection", "body": "The agriculture office <b>measures the pond<\/b> and checks the photos.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Grant paid to your bank", "body": "The grant is paid by <b>DBT<\/b> into your Aadhaar-linked bank account.", "note": {"kind": "tip", "label": "Tip:", "html": "Want <b>plastic lining<\/b> for the pond? It is a separate grant. SC / ST farmers: see <b>Krushi Swavalamban<\/b> / <b>Birsa Munda<\/b>; others ask about the horticulture / lining scheme."}}], "rights_t": "Stuck for long? Escalate.", "rights": "Write to the <b>Taluka Agriculture Officer<\/b> with your MahaDBT application ID and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>MahaDBT<\/b>.", "help": "<b>Apply:<\/b> mahadbt.maharashtra.gov.in → Farmer login → farm pond · Amounts by pond size; check the current notice<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "मागेल त्याला शेततळे: शेततळे खोदण्यासाठी अनुदान", "benefit": "संरक्षित सिंचनासाठी पावसाचे पाणी साठवण्याकरिता ₹75,000 पर्यंत (आकारानुसार) अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>स्वतःच्या नावावर<\/b> किमान <b>0.60 हेक्टर<\/b> जमीन असलेला महाराष्ट्रातील शेतकरी<\/li><li>यापूर्वी कोणत्याही योजनेतून (सामूहिक शेततळ्यासह) <b>शेततळे अनुदान घेतलेले नसावे<\/b><\/li><li>सर्व प्रवर्गांतील शेतकऱ्यांसाठी खुली<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "ही योजना आता महाडीबीटीवरील <b>मुख्यमंत्री शाश्वत कृषी सिंचन योजनेचा<\/b> शेततळे घटक म्हणून चालते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "शेततळ्याचा आकार निवडा", "body": "शेततळ्याचे आकार सुमारे <b>15 × 15 मीटर<\/b> ते <b>34 × 34 मीटर<\/b>, सुमारे <b>3 मीटर खोल<\/b>, इनलेट / आउटलेटसह किंवा शिवाय. अनुदान आकारानुसार: सुमारे <b>₹14,000<\/b> ते <b>₹75,000<\/b>.", "note": {"kind": "tip", "label": "सूचना:", "html": "पावसाचे पाणी जमा होईल अशी <b>सखल जागा<\/b> निवडा. जागा योग्य आहे का हे कृषी सहायक तपासतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमच्या नावाचे <b>7/12 व 8-अ<\/b> उतारे<\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b><\/li><li>यापूर्वी शेततळे अनुदान घेतले नसल्याचे स्वयंघोषणापत्र<\/li><li>राखीव प्रवर्गातून अर्ज करत असल्यास जातीचा दाखला<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून पालकांच्या नावावर? आधी <b>फेरफार<\/b> करून घ्या. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महाडीबीटीवर अर्ज करा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> वर <b>शेतकरी<\/b> म्हणून लॉगिन करा, कृषी योजनांमध्ये <b>शेततळे<\/b> निवडा, आकार निवडा, कागदपत्रे अपलोड करून अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "2025-26 पासून निवड <b>प्रथम येणाऱ्यास प्रथम प्राधान्य<\/b> पद्धतीने. खिडकी उघडताच अर्ज करा. अर्ज <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "कृषी कार्यालय", "title": "पूर्वसंमती व आखणी", "body": "निवड झाल्यास <b>पूर्वसंमती<\/b> मिळते. <b>कृषी सहायक<\/b> जागा तपासून शेततळ्याची आखणी करून देतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>पूर्वसंमती व आखणीपूर्वी खोदकाम सुरू करू नका.<\/b> आधी खोदलेल्या शेततळ्याचे अनुदान सहसा मिळत नाही."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "शेततळे खोदा, पुरावे ठेवा", "body": "दिलेल्या मुदतीत <b>मंजूर आकाराचे<\/b> शेततळे खोदा. खोदकामापूर्वी, दरम्यान आणि नंतर <b>जिओ-टॅग फोटो<\/b> काढून महाडीबीटीवर अपलोड करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "शेततळे मंजूर आकारापेक्षा लहान? प्रत्यक्ष खोदलेल्या आकारानुसार अनुदान कमी होते. काम संपवण्यापूर्वी मोजमाप करा."}}, {"phase": null, "kind": "gov", "who": "कृषी कार्यालय", "title": "मोजमाप व तपासणी", "body": "कृषी कार्यालय <b>शेततळ्याचे मोजमाप<\/b> करून फोटो तपासते.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अनुदान बँक खात्यात", "body": "अनुदान <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते.", "note": {"kind": "tip", "label": "सूचना:", "html": "शेततळ्यासाठी <b>प्लास्टिक अस्तरीकरण<\/b> हवे? ते स्वतंत्र अनुदान आहे. अनुसूचित जाती / जमाती शेतकऱ्यांनी <b>कृषी स्वावलंबन<\/b> / <b>बिरसा मुंडा<\/b> पाहावे; इतरांनी फलोत्पादन / अस्तरीकरण योजनेबद्दल विचारावे."}}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "महाडीबीटी अर्ज क्रमांकासह <b>तालुका कृषी अधिकाऱ्यांना<\/b> लिहा आणि <b>पोच<\/b> घ्या. <b>महाडीबीटीवर<\/b> तक्रारही नोंदवता येते.", "help": "<b>अर्ज:<\/b> mahadbt.maharashtra.gov.in → शेतकरी लॉगिन → शेततळे · रक्कम आकारानुसार; चालू सूचना तपासा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "saur-krushi-pump", "title": "Magel Tyala Saur Krushi Pump", "mr_name": "मागेल त्याला सौर कृषी पंप", "audience": "Farmers with a water source, no farm power connection (solar pump)", "cat": "farm", "links": [{"label": "MSEDCL solar pump portal: apply, pay, complain", "url": "https://www.mahadiscom.in/solar_MTSKPY/", "gov": true}, {"label": "MSEDCL: FAQ", "url": "https://www.mahadiscom.in/solar_MTSKPY/faq.php", "gov": true}], "mermaid": "flowchart TD\n    A([Farmer wants a solar pump]) --> E{1. Eligible?<br/>land in own name, reliable water source,<br/>no farm power connection,<br/>no earlier solar pump subsidy}\n    E -- No water source --> WS[Get a source first:<br/>Magel Tyala Shettale / well schemes]\n    E -- Already has pump subsidy / connection --> X([Not eligible])\n    E -- Yes --> SZ{2. Pump size by land}\n    SZ -- up to 2.5 acres --> P3[3 HP]\n    SZ -- 2.51 to 5 acres --> P5[5 HP]\n    SZ -- above 5 acres --> P7[7.5 HP]\n    P3 --> D\n    P5 --> D\n    P7 --> D\n    D[3. Documents<br/>7/12 with water source, Aadhaar, bank,<br/>caste cert for SC/ST, co-owner consent]\n    D --> AP[4. Apply on MSEDCL portal<br/>beneficiary ID]\n    AP --> SC{5. MSEDCL scrutiny}\n    SC -- Land / source mismatch --> F1[Rejected: correct 7/12, reapply]\n    SC -- OK --> DM[Pay share: about 10 percent,<br/>5 percent for SC/ST]\n    DM --> PAY[6. Pay online on portal only<br/>choose / confirm empanelled supplier]\n    PAY -- Cash to agent --> F2[Fraud risk: not counted]\n    PAY --> INS[7. Supplier survey + installation<br/>about 60 days from work order<br/>joint inspection]\n    INS -- Delay --> F3[Installation pending]\n    INS --> RUN([8. Daytime irrigation, no power bill<br/>5-year warranty with repair])\n    F3 -.-> T[Complaint on MSEDCL portal /<br/>sub-division office]\n\n    S1[[Sathi: Eligibility + water-source check<br/>7/12 Health Report]]:::sathi -.-> E\n    S2[[Sathi: Pump-size calculator<br/>from land area]]:::sathi -.-> SZ\n    S3[[Sathi: Fake-portal and agent warning]]:::sathi -.-> PAY\n    S4[[Sathi: Installation tracker + complaint draft]]:::sathi -.-> T\n    S5[[Sathi: Warranty tracker, 5-year expiry alert]]:::sathi -.-> RUN\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "MSEDCL: Magel Tyala Saur Krushi Pump FAQ", "url": "https://www.mahadiscom.in/solar_MTSKPY/faq.php"}, {"label": "MSEDCL: off-grid solar pump guidelines", "url": "https://mahadiscom.in/solar_MTSKPY/media/Guidelines%20and%20Clarifications%20for%20offgrid%20Solar%20Pump%20Installations.pdf"}, {"label": "Vikaspedia: Magel Tyala Saur Krushi Pump Yojana", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/magel-tyala-saur-krushi-pump-yojana?lgn=en"}, {"label": "PV Magazine: KLK Ventures tender", "url": "https://www.pv-magazine-india.com/press-releases/klk-ventures-secures-tender-for-solar-water-pumping-systems-under-magel-tyala-saur-krushi-pump-scheme-in-maharashtra"}, {"label": "Renewable Watch: Shakti and Oswal orders", "url": "https://renewablewatch.in/2026/07/07/shakti-pumps-and-oswal-pumps-secure-solar-pump-orders-from-msedcl/"}, {"label": "The Machine Maker: Shakti Pumps order", "url": "https://themachinemaker.com/news/shakti-pumps-secures-order-for-6580-off-grid-solar-water-pumping-systems-in-maharashtra/"}, {"label": "Powerline: Jupiter International LoE", "url": "https://powerline.net.in/2026/01/20/jupiter-international-secures-loe-for-rs-650-million-solar-pump-project-from-msedcl/"}, {"label": "sarkariyojana.com: Magel Tyala Solar Pump", "url": "https://sarkariyojana.com/magel-tyala-solar-pump-yojana/"}, {"label": "govtschemes.in: Magel Tyala Saur Krushi Pump", "url": "https://www.govtschemes.in/maharashtra-magel-tyala-saur-krushi-pump-yojana"}], "en": {"h1": "Magel Tyala Saur Krushi Pump: Solar pump for daytime irrigation", "benefit": "Off-grid solar pump for just 10% of the cost (5% for SC / ST), with a 5-year warranty", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer in Maharashtra with land <b>in your name<\/b><\/li><li>A <b>reliable water source<\/b>: well, borewell, farm pond, or perennial river / stream (own or shared)<\/li><li><b>No existing farm electricity connection<\/b><\/li><li>Have <b>not<\/b> received a solar pump under Atal / Mukhyamantri Saur Krushi Pump or KUSUM before<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "No water source yet? See the <b>Magel Tyala Shettale<\/b> (farm pond) or well schemes first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Know your pump size", "body": "<ul><li>Land up to <b>2.5 acres<\/b> → <b>3 HP<\/b><\/li><li><b>2.51 to 5 acres<\/b> → <b>5 HP<\/b><\/li><li>Above <b>5 acres<\/b> → <b>7.5 HP<\/b><\/li><\/ul>You may ask for a <b>smaller<\/b> pump than your tier.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>7/12<\/b> showing your land and the <b>water source<\/b><\/li><li>Aadhaar, bank details<\/li><li><b>Caste certificate<\/b>, if SC / ST (for the 5% share)<\/li><li><b>Consent of co-owners<\/b>, if the land or water source is joint<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Water source not recorded on 7/12, or land not in your name? Fix it at the Talathi office first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on the MSEDCL portal", "body": "Apply online on <b>Mahavitaran (MSEDCL)<\/b>'s Magel Tyala Saur Krushi Pump portal (<b>portal.mahadiscom.in/solar_MTSKPY<\/b>). Note your <b>beneficiary / application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Beware of fake websites and agents asking for money to \"register\" you."}}, {"phase": "After you apply", "kind": "gov", "who": "MSEDCL / Supplier", "title": "Scrutiny and payment demand", "body": "MSEDCL checks your application and documents, then asks you to pay your <b>share<\/b>: about <b>10%<\/b> of the pump cost (<b>5%<\/b> for SC / ST).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Application rejected? Usually the water source or land record does not match. Correct the 7/12 and reapply."}}, {"phase": null, "kind": "you", "who": "You", "title": "Pay your share", "body": "Pa
