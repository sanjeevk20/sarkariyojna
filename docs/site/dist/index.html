at government-approved centres across Maharashtra", "steps": [{"phase": "Before you go", "kind": "you", "who": "You", "title": "Know what you get", "body": "A thali with <b>chapatis, a vegetable, dal and rice<\/b> for about <b>₹10<\/b>.<br/><b>Anyone<\/b> can eat. <b>No ration card or document<\/b> is needed.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Find a Shiv Bhojan centre", "body": "Centres are usually near <b>hospitals, bus stands, markets and government offices<\/b> in towns and taluka places. Ask locally or at the <b>Tahsil / District Supply Office<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "The scheme is running, but individual centres can close. Check the centre is open before you travel."}}, {"phase": null, "kind": "you", "who": "You", "title": "Go at meal time", "body": "Centres serve mainly at <b>lunch time<\/b> (around midday). Each centre has a <b>limited number of plates<\/b> per day.", "note": {"kind": "tip", "label": "Tip:", "html": "<b>Go early.<\/b> Plates often run out."}}, {"phase": "At the centre", "kind": "gov", "who": "Centre", "title": "Pay ₹10, centre records you", "body": "Pay the fixed amount. The centre takes your <b>name and photo<\/b> in the Shiv Bhojan app. This is how the government counts plates and pays the centre.", "note": {"kind": "tip", "label": "Tip:", "html": "The photo is <b>normal and required<\/b>. It is not a charge and does not stop you from other schemes."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Enjoy your meal", "body": "Eat at the centre. Food should be <b>fresh, hot and clean<\/b>.", "note": null}], "rights_t": "Charged more, poor food or refused? Complain.", "rights": "Note the <b>centre name, date and time<\/b>. Complain to the <b>Tahsil / District Supply Officer<\/b> in writing, or on <b>Aaple Sarkar<\/b> grievances.", "help": "<b>Want to run a centre?<\/b> NGOs, self-help groups and mess owners can apply to the <b>District Supply Office<\/b><br/><b>Pay only the fixed price<\/b> · No document needed to eat"}, "mr": {"h1": "शिवभोजन थाळी: ₹10 मध्ये पूर्ण जेवण", "benefit": "महाराष्ट्रातील शासनमान्य केंद्रांवर सवलतीच्या दरात गरम जेवण", "steps": [{"phase": "जाण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "थाळीत काय मिळते", "body": "सुमारे <b>₹10<\/b> मध्ये <b>चपाती, भाजी, वरण आणि भात<\/b> असलेली थाळी.<br/><b>कोणीही<\/b> जेवू शकतो. <b>रेशन कार्ड किंवा कोणतेही कागदपत्र<\/b> लागत नाही.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "शिवभोजन केंद्र शोधा", "body": "केंद्रे सहसा शहरे व तालुक्याच्या ठिकाणी <b>रुग्णालये, बस स्थानके, बाजार आणि सरकारी कार्यालयांजवळ<\/b> असतात. स्थानिक लोकांना किंवा <b>तहसील / जिल्हा पुरवठा कार्यालयात<\/b> विचारा.", "note": {"kind": "tip", "label": "सूचना:", "html": "योजना सुरू आहे, पण एखादे केंद्र बंद होऊ शकते. जाण्यापूर्वी केंद्र सुरू आहे का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जेवणाच्या वेळी जा", "body": "केंद्रे मुख्यतः <b>दुपारच्या जेवणाच्या वेळी<\/b> जेवण देतात. प्रत्येक केंद्राला दररोज <b>ठराविक थाळ्या<\/b> असतात.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>लवकर जा.<\/b> थाळ्या अनेकदा संपतात."}}, {"phase": "केंद्रावर", "kind": "gov", "who": "केंद्र", "title": "₹10 द्या, केंद्र नोंद करते", "body": "ठरलेली रक्कम द्या. केंद्र शिवभोजन ॲपमध्ये तुमचे <b>नाव आणि फोटो<\/b> घेते. यावरूनच सरकार थाळ्या मोजून केंद्राला पैसे देते.", "note": {"kind": "tip", "label": "सूचना:", "html": "फोटो घेणे <b>सामान्य आणि आवश्यक<\/b> आहे. त्यासाठी पैसे लागत नाहीत आणि इतर योजनांवर परिणाम होत नाही."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "जेवणाचा आस्वाद घ्या", "body": "केंद्रावर जेवा. जेवण <b>ताजे, गरम आणि स्वच्छ<\/b> असले पाहिजे.", "note": null}], "rights_t": "जास्त पैसे, खराब जेवण किंवा नकार? तक्रार करा.", "rights": "<b>केंद्राचे नाव, तारीख आणि वेळ<\/b> नोंदवा. <b>तहसील / जिल्हा पुरवठा अधिकाऱ्यांकडे<\/b> लेखी तक्रार द्या, किंवा <b>आपले सरकार<\/b> तक्रार पोर्टल वापरा.", "help": "<b>केंद्र चालवायचे आहे?<\/b> स्वयंसेवी संस्था, बचत गट आणि खानावळ चालक <b>जिल्हा पुरवठा कार्यालयाकडे<\/b> अर्ज करू शकतात<br/><b>फक्त ठरलेली किंमत द्या<\/b> · जेवण्यासाठी कोणतेही कागदपत्र लागत नाही"}}, {"slug": "ayushman-card", "title": "Ayushman Bharat card", "mr_name": "आयुष्मान भारत कार्ड", "audience": "Eligible families; everyone 70+", "cat": "health", "links": [{"label": "Ayushman card: create / download", "url": "https://beneficiary.nha.gov.in", "gov": false}, {"label": "PM-JAY: scheme and hospitals", "url": "https://pmjay.gov.in", "gov": false}, {"label": "Helpline: 14555", "url": null, "gov": false}], "mermaid": "flowchart TD\n    A([Family wants Ayushman card]) --> E{1. Eligible?<br/>check beneficiary.nha.gov.in / app}\n    E -- Aged 70+ --> VV[Ayushman Vay Vandana card<br/>any income]\n    E -- In family list / MJPJAY --> D[2. Keep ready<br/>Aadhaar each member,<br/>Aadhaar-linked mobile, ration card]\n    E -- Not found --> F0[Not in list:<br/>check ration card / family ID,<br/>ask CSC or Ayushman Mitra]\n    VV --> D\n    D --> M[3. Make card free<br/>Ayushman app / CSC / hospital / ASHA]\n    M --> K{Aadhaar eKYC<br/>OTP or face}\n    K -- Fails / name mismatch --> F1[eKYC failed:<br/>update Aadhaar mobile or name]\n    K -- OK --> P[Photo + submit]\n    P --> SHA{4. State Health Agency approval}\n    SHA -- Rejected / pending --> F2[Fix details via CSC / Ayushman Mitra]\n    SHA -- Approved --> DL[5. Download card PDF]\n    DL --> U([6. Cashless at any empanelled<br/>hospital in India])\n    U -- Asked to pay --> F3[Illegal charge]\n    F3 -.-> T[Ayushman helpline / portal grievance /<br/>district coordinator]\n\n    S1[[Sathi: Eligibility check<br/>incl. 70+ Vay Vandana]]:::sathi -.-> E\n    S2[[Sathi: Family card drive<br/>track which members have cards]]:::sathi -.-> M\n    S3[[Sathi: eKYC failure explainer]]:::sathi -.-> F1\n    S4[[Sathi: Nearest empanelled hospital<br/>across states, on map]]:::sathi -.-> U\n    S5[[Sathi: Know your rights + complaint draft]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2,F3 blocked", "sources": [{"label": "Business Today: Ayushman Vaya Vandana card", "url": "https://www.businesstoday.in/amp/personal-finance/insurance/story/ayushman-vaya-vandana-card-2024-how-to-apply-for-the-card-online-offline-check-eligibility-documents-needed-452296-2024-11-02"}, {"label": "Outlook Money: get your Ayushman card", "url": "https://www.outlookmoney.com/personal-finance/get-your-ayushman-card-in-15-minutes-how-to-apply"}, {"label": "Angel One: Vaya Vandana eligibility", "url": "https://www.angelone.in/news/ayushman-vaya-vandana-yojana-check-eligibility-how-to-download-and-more"}], "en": {"h1": "Ayushman Bharat Card: How to make it for free", "benefit": "Free health card for cashless treatment up to ₹5 lakh per family per year, anywhere in India", "steps": [{"phase": "Make the card", "kind": "you", "who": "You", "title": "Check if your family is eligible", "body": "Check on <b>beneficiary.nha.gov.in<\/b> or the <b>Ayushman app<\/b> (\"Am I eligible\") using your mobile number, ration card or Aadhaar.<ul><li>Eligible poor and vulnerable families<\/li><li>In Maharashtra, families covered under <b>MJPJAY<\/b><\/li><li>Everyone aged <b>70 or more<\/b>, whatever their income (Ayushman Vay Vandana card, up to ₹5 lakh a year for the senior)<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these ready", "body": "<ul><li><b>Aadhaar<\/b> of each family member<\/li><li><b>Mobile number linked to Aadhaar<\/b> (for OTP)<\/li><li><b>Ration card<\/b><\/li><li>A smartphone, or go to a CSC / hospital help desk<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Mobile not linked to Aadhaar? Use <b>face authentication<\/b> in the app, or update the mobile at an Aadhaar centre."}}, {"phase": null, "kind": "you", "who": "You", "title": "Make the card (it is free)", "body": "On the <b>Ayushman app<\/b>: log in with mobile → search your family → select a member → <b>Aadhaar eKYC<\/b> (OTP or face) → take photo → submit.<br/>Or get help at a <b>CSC / e-Seva Kendra<\/b>, the <b>Ayushman Mitra<\/b> desk at a network hospital, or your <b>ASHA<\/b> worker.", "note": {"kind": "tip", "label": "Tip:", "html": "Repeat for <b>every family member<\/b>. Each person gets their own card."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Card is approved", "body": "The <b>State Health Agency<\/b> checks the details and approves the card. This is usually quick.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status <b>pending<\/b> for long or <b>rejected<\/b>? Often the name on Aadhaar doesn't match the family list. Ask the Ayushman Mitra or CSC to correct it."}}, {"phase": null, "kind": "you", "who": "You", "title": "Download your card", "body": "Download the card (PDF) from the app or website. Keep it on your phone and print a copy.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Use it at any network hospital in India", "body": "At an empanelled hospital, show your card or Aadhaar at the <b>Ayushman Mitra<\/b> desk. Covered treatment is <b>cashless<\/b>, even in another state.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked to pay for covered treatment? Refuse politely, ask for it in writing, and call the <b>Ayushman helpline<\/b>."}}], "rights_t": "Card or treatment problem? Complain.", "rights": "Use the <b>grievance option on the Ayushman portal / app<\/b>, call the <b>Ayushman helpline<\/b>, or contact your district's <b>Ayushman / MJPJAY coordinator<\/b>.", "help": "<b>Card:<\/b> Ayushman app / beneficiary.nha.gov.in · <b>Hospitals:<\/b> hospitals.pmjay.gov.in<br/><b>The card is free<\/b>, never pay anyone to make it · <b>Use only .gov.in websites and official apps<\/b>"}, "mr": {"h1": "आयुष्मान भारत कार्ड: मोफत कसे काढायचे", "benefit": "भारतात कुठेही, प्रति कुटुंब दरवर्षी ₹5 लाखांपर्यंत कॅशलेस उपचारासाठी मोफत आरोग्य कार्ड", "steps": [{"phase": "कार्ड काढा", "kind": "you", "who": "तुम्ही", "title": "कुटुंब पात्र आहे का ते तपासा", "body": "<b>beneficiary.nha.gov.in<\/b> किंवा <b>आयुष्मान ॲपवर<\/b> (\"Am I eligible\") मोबाईल नंबर, रेशन कार्ड किंवा आधार वापरून तपासा.<ul><li>पात्र गरीब व वंचित कुटुंबे<\/li><li>महाराष्ट्रात <b>महात्मा ज्योतिराव फुले जन आरोग्य योजनेत<\/b> समाविष्ट कुटुंबे<\/li><li><b>70 वर्षे किंवा जास्त<\/b> वयाचे सर्वजण, उत्पन्न कितीही असो (आयुष्मान वय वंदना कार्ड, ज्येष्ठ व्यक्तीसाठी वर्षाला ₹5 लाखांपर्यंत)<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "हे तयार ठेवा", "body": "<ul><li>कुटुंबातील प्रत्येकाचे <b>आधार<\/b><\/li><li><b>आधारशी लिंक मोबाईल नंबर<\/b> (OTP साठी)<\/li><li><b>रेशन कार्ड<\/b><\/li><li>स्मार्टफोन, किंवा CSC / रुग्णालयाच्या मदत कक्षात जा<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "मोबाईल आधारशी लिंक नाही? ॲपमध्ये <b>चेहरा प्रमाणीकरण<\/b> वापरा, किंवा आधार केंद्रात मोबाईल अद्ययावत करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कार्ड काढा (मोफत)", "body": "<b>आयुष्मान ॲपवर<\/b>: मोबाईलने लॉगिन → तुमचे कुटुंब शोधा → सदस्य निवडा → <b>आधार ई-केवायसी<\/b> (OTP किंवा चेहरा) → फोटो काढा → सादर करा.<br/>किंवा <b>CSC / ई-सेवा केंद्र<\/b>, नेटवर्क रुग्णालयातील <b>आयुष्मान मित्र<\/b> कक्ष, किंवा तुमच्या <b>आशा<\/b> सेविकेची मदत घ्या.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>कुटुंबातील प्रत्येकासाठी<\/b> हे करा. प्रत्येकाला स्वतंत्र कार्ड मिळते."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कार्ड मंजूर होते", "body": "<b>राज्य आरोग्य संस्था<\/b> माहिती तपासून कार्ड मंजूर करते. हे सहसा लवकर होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "स्थिती खूप दिवस <b>प्रलंबित<\/b> किंवा <b>नामंजूर<\/b>? बहुतेक वेळा आधारवरील नाव कुटुंबाच्या यादीशी जुळत नाही. आयुष्मान मित्र किंवा CSC कडून दुरुस्त करून घ्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कार्ड डाउनलोड करा", "body": "ॲप किंवा वेबसाइटवरून कार्ड (PDF) डाउनलोड करा. फोनमध्ये ठेवा आणि एक प्रिंट काढा.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "भारतातील कोणत्याही नेटवर्क रुग्णालयात वापरा", "body": "अंगीकृत रुग्णालयात <b>आयुष्मान मित्र<\/b> कक्षात कार्ड किंवा आधार दाखवा. समाविष्ट उपचार <b>कॅशलेस<\/b> मिळतात, दुसऱ्या राज्यातही.", "note": {"kind": "stuck", "label": "अडचण?", "html": "समाविष्ट उपचारासाठी पैसे मागितले? नम्रपणे नकार द्या, लेखी मागा आणि <b>आयुष्मान हेल्पलाइनला<\/b> फोन करा."}}], "rights_t": "कार्ड किंवा उपचाराबाबत अडचण? तक्रार करा.", "rights": "<b>आयुष्मान पोर्टल / ॲपवरील तक्रार<\/b> सुविधा वापरा, <b>आयुष्मान हेल्पलाइनला<\/b> फोन करा, किंवा तुमच्या जिल्ह्याच्या <b>आयुष्मान / MJPJAY समन्वयकांशी<\/b> संपर्क साधा.", "help": "<b>कार्ड:<\/b> आयुष्मान ॲप / beneficiary.nha.gov.in · <b>रुग्णालये:<\/b> hospitals.pmjay.gov.in<br/><b>कार्ड मोफत आहे<\/b>, ते काढण्यासाठी कोणालाही पैसे देऊ नका · <b>फक्त .gov.in वेबसाइट व अधिकृत ॲप वापरा<\/b>"}}, {"slug": "mjpjay", "title": "MJPJAY", "mr_name": "महात्मा ज्योतिराव फुले जन आरोग्य योजना", "audience": "Maharashtra families (cashless treatment)", "cat": "health", "links": [{"label": "MJPJAY (Jeevandayee): hospitals, packages", "url": "https://www.jeevandayee.gov.in", "gov": true}, {"label": "MJPJAY contact page", "url": "https://www.jeevandayee.gov.in/MJPJAY/marathi/ContactUs.html", "gov": true}, {"label": "Short code 155388 (DoT allotment)", "url": "https://dot.gov.in/node/4256", "gov": true}], "mermaid": "flowchart TD\n    A([Family in Maharashtra]) --> E{1. Covered?<br/>MH resident with ration card<br/>or domicile proof}\n    E -- No --> X([Check road-accident cover / other schemes])\n    E -- Yes --> C[2. Make Ayushman / MJPJAY e-card<br/>Ayushman app, CSC or hospital desk<br/>Aadhaar eKYC, every member]\n    C --> NEED([Treatment needed])\n    NEED --> H{3. Network hospital?}\n    H -- No --> F0[Not cashless: find nearest<br/>network hospital via Aarogyamitra / helpline]\n    H -- Yes --> AM[Aarogyamitra desk<br/>identity + card check]\n    AM --> DX[Doctor diagnosis]\n    DX --> EM{Emergency?}\n    EM -- Yes --> TR\n    EM -- No --> PA[4. Pre-authorization request<br/>to scheme with reports]\n    PA -- Reports missing --> F1[Approval delayed]\n    PA -- Approved --> TR[5. Cashless treatment<br/>procedure, medicines, tests, stay]\n    TR -- Asked to pay --> F2[Illegal charge]\n    TR --> DS([6. Discharge + follow-up])\n    F2 -.-> T[Helpline / district coordinator /<br/>written complaint]\n\n    S1[[Sathi: Coverage check<br/>is my treatment included?]]:::sathi -.-> E\n    S2[[Sathi: Family e-card drive<br/>card for every member in advance]]:::sathi -.-> C\n    S3[[Sathi: Nearest network hospital<br/>for this procedure, on map]]:::sathi -.-> H\n    S4[[Sathi: Know your rights<br/>no deposit, no charges for covered items]]:::sathi -.-> F2\n    S5[[Sathi: Store discharge summary<br/>in family vault]]:::sathi -.-> DS\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "India TV: ₹5 lakh coverage for all from July", "url": "https://www.indiatvnews.com/maharashtra/maharashtra-upgraded-health-scheme-july-launch-premium-hike-mahatma-jyotirao-phule-jan-arogya-abhiyan-mjpjay-shas-ayushman-bharat-2024-06-18-937505"}, {"label": "Business Today: govt to directly pay MJPJAY claims", "url": "https://www.businesstoday.in/personal-finance/insurance/story/maharashtra-govt-to-directly-pay-cashless-claims-under-mjpjay-scheme-check-details-446631-2024-09-19"}, {"label": "Policybazaar: MJPJAY", "url": "https://www.policybazaar.com/health-insurance/govt-scheme/mahatma-jyotirao-phule-jan-arogya/"}], "en": {"h1": "Mahatma Jyotiba Phule Jan Arogya Yojana: Free hospital treatment", "benefit": "Cashless treatment up to about ₹5 lakh per family per year at network hospitals", "steps": [{"phase": "Before you need treatment", "kind": "you", "who": "You / family", "title": "Check you are covered", "body": "Families living in <b>Maharashtra<\/b> with a <b>ration card<\/b> (any colour) or domicile proof are covered. Many <b>surgeries and treatments<\/b> (heart, cancer, kidney, accidents, etc.) are included. The scheme works together with <b>Ayushman Bharat (PM-JAY)<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Road accident in Maharashtra? Treatment may be covered even if you are not a resident. Ask at the hospital."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Get your health card", "body": "Make your <b>Ayushman / MJPJAY e-card<\/b> (free) using Aadhaar:<ul><li>On the <b>Ayushman app<\/b> with Aadhaar OTP / face authentication<\/li><li>At a <b>CSC / e-Seva Kendra<\/b> or the hospital's help desk<\/li><\/ul>Keep <b>Aadhaar<\/b> and <b>ration card<\/b> ready.", "note": {"kind": "tip", "label": "Tip:", "html": "Make cards for <b>every family member now<\/b>, not during an emergency."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Go to a network hospital", "body": "Only <b>empanelled (network) hospitals<\/b> give cashless treatment. Find them on <b>jeevandayee.gov.in<\/b> or the app. At the hospital, go to the <b>Aarogyamitra (आरोग्यमित्र) desk<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Hospital is not in the network? Ask the Aarogyamitra or helpline for the <b>nearest network hospital<\/b> for your treatment."}}, {"phase": "At the hospital", "kind": "gov", "who": "Hospital / Scheme", "title": "Hospital asks for approval", "body": "The doctor diagnoses you. The Aarogyamitra sends a <b>pre-authorization<\/b> request to the scheme with your reports.<br/>In an <b>emergency<\/b>, treatment should start immediately; approval is sought alongside.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approval delayed? Ask the Aarogyamitra for the <b>status<\/b>. Missing reports are the usual reason."}}, {"phase": null, "kind": "gov", "who": "Hospital / Scheme", "title": "Cashless treatment", "body": "Your treatment, <b>medicines, tests, stay and food<\/b> for the covered procedure are paid by the scheme. You should <b>not pay<\/b> for them.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked to pay a deposit or for covered items? <b>Refuse politely<\/b>, ask for it in writing, and call the <b>scheme helpline<\/b>."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Discharge and follow-up", "body": "Sign the discharge papers and keep a copy of all reports. <b>Follow-up<\/b> visits and medicines for the covered procedure are also included for a period.", "note": {"kind": "tip", "label": "Tip:", "html": "Keep the <b>discharge summary<\/b> safe. You will need it for future treatment."}}], "rights_t": "Asked to pay? Cashless treatment is your right.", "rights": "Call the <b>MJPJAY / Ayushman helpline<\/b> or contact the <b>district coordinator<\/b> of the scheme. Note the hospital name, date and amount demanded. You can also file a written complaint with the hospital and the district office.", "help": "<b>Find hospitals and procedures:<\/b> jeevandayee.gov.in · <b>Card:<\/b> Ayushman app / beneficiary.nha.gov.in<br/><b>Card and treatment are free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "महात्मा ज्योतिराव फुले जन आरोग्य योजना: मोफत रुग्णालय उपचार", "benefit": "नेटवर्क रुग्णालयांमध्ये प्रति कुटुंब दरवर्षी सुमारे ₹5 लाखांपर्यंत कॅशलेस उपचार", "steps": [{"phase": "उपचाराची गरज पडण्यापूर्वी", "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "तुम्ही पात्र आहात का ते तपासा", "body": "<b>महाराष्ट्रात<\/b> राहणारी आणि <b>रेशन कार्ड<\/b> (कोणत्याही रंगाचे) किंवा अधिवास पुरावा असलेली कुटुंबे पात्र आहेत. अनेक <b>शस्त्रक्रिया आणि उपचार<\/b> (हृदय, कर्करोग, मूत्रपिंड, अपघात इ.) समाविष्ट आहेत. ही योजना <b>आयुष्मान भारत (PM-JAY)<\/b> सोबत एकत्रितपणे चालते.", "note": {"kind": "tip", "label": "सूचना:", "html": "महाराष्ट्रात रस्ते अपघात? तुम्ही इथले रहिवासी नसलात तरी उपचार समाविष्ट असू शकतात. रुग्णालयात विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "आरोग्य कार्ड मिळवा", "body": "आधार वापरून तुमचे <b>आयुष्मान / MJPJAY ई-कार्ड<\/b> (मोफत) काढा:<ul><li><b>आयुष्मान ॲपवर<\/b> आधार OTP / चेहरा प्रमाणीकरणाने<\/li><li><b>CSC / ई-सेवा केंद्र<\/b> किंवा रुग्णालयाच्या मदत कक्षात<\/li><\/ul><b>आधार<\/b> आणि <b>रेशन कार्ड<\/b> तयार ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "आपत्कालीन वेळी नाही, तर <b>आत्ताच कुटुंबातील प्रत्येकाचे<\/b> कार्ड काढून ठेवा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "नेटवर्क रुग्णालयात जा", "body": "फक्त <b>अंगीकृत (नेटवर्क) रुग्णालयांमध्ये<\/b> कॅशलेस उपचार मिळतात. ती <b>jeevandayee.gov.in<\/b> किंवा ॲपवर शोधा. रुग्णालयात <b>आरोग्यमित्र कक्षात<\/b> जा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "रुग्णालय नेटवर्कमध्ये नाही? तुमच्या उपचारासाठी <b>जवळचे नेटवर्क रुग्णालय<\/b> आरोग्यमित्र किंवा हेल्पलाइनला विचारा."}}, {"phase": "रुग्णालयात", "kind": "gov", "who": "रुग्णालय / योजना", "title": "रुग्णालय मंजुरी मागते", "body": "डॉक्टर निदान करतात. आरोग्यमित्र तुमच्या अहवालांसह योजनेकडे <b>पूर्व-मंजुरीची<\/b> विनंती पाठवतात.<br/><b>आपत्कालीन<\/b> स्थितीत उपचार लगेच सुरू व्हायला हवेत; मंजुरी सोबतच मागितली जाते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजुरीला उशीर? आरोग्यमित्रांकडे <b>स्थिती<\/b> विचारा. बहुतेक वेळा अहवाल अपूर्ण असतात."}}, {"phase": null, "kind": "gov", "who": "रुग्णालय / योजना", "title": "कॅशलेस उपचार", "body": "समाविष्ट उपचारासाठी तुमचे उपचार, <b>औषधे, तपासण्या, राहणे आणि जेवण<\/b> यांचा खर्च योजना करते. तुम्ही त्यासाठी <b>पैसे देऊ नयेत<\/b>.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अनामत रक्कम किंवा समाविष्ट गोष्टींसाठी पैसे मागितले? <b>नम्रपणे नकार द्या<\/b>, लेखी मागा आणि <b>योजनेच्या हेल्पलाइनला<\/b> फोन करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "डिस्चार्ज व पाठपुरावा", "body": "डिस्चार्जच्या कागदांवर सही करा आणि सर्व अहवालांची प्रत ठेवा. समाविष्ट उपचारासाठी काही काळ <b>पाठपुरावा<\/b> तपासण्या आणि औषधेही मिळतात.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>डिस्चार्ज सारांश<\/b> जपून ठेवा. पुढील उपचारासाठी तो लागतो."}}], "rights_t": "पैसे मागितले? कॅशलेस उपचार हा तुमचा हक्क आहे.", "rights": "<b>MJPJAY / आयुष्मान हेल्पलाइनवर<\/b> फोन करा किंवा योजनेच्या <b>जिल्हा समन्वयकांशी<\/b> संपर्क साधा. रुग्णालयाचे नाव, तारीख आणि मागितलेली रक्कम नोंदवून ठेवा. रुग्णालय व जिल्हा कार्यालयाकडे लेखी तक्रारही देता येते.", "help": "<b>रुग्णालये व उपचार शोधा:<\/b> jeevandayee.gov.in · <b>कार्ड:<\/b> आयुष्मान ॲप / beneficiary.nha.gov.in<br/><b>कार्ड आणि उपचार मोफत आहेत<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "annasaheb-patil", "title": "Annasaheb Patil loan scheme", "mr_name": "अण्णासाहेब पाटील कर्ज योजना", "audience": "Open-category communities (interest refund)", "cat": "loan", "links": [{"label": "Annasaheb Patil Mahamandal portal: apply, LOI, interest claim", "url": "https://udyog.mahaswayam.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Wants to start / expand a business]) --> E{1. Eligible?<br/>MH resident, community without other corporation,<br/>economically backward, age + income limit}\n    E -- No --> X([Check other corporations / schemes])\n    E -- Yes --> PL[2. Plan business + project report]\n    PL --> D[3. Documents<br/>Aadhaar, income cert / ITR, domicile,<br/>age + community proof, bank details]\n    D --> R[4. Register on udyog.mahaswayam.gov.in<br/>apply for LOI]\n    R --> LOI{5. Corporation scrutiny}\n    LOI -- Doc issue --> F1[Sent back: re-upload]\n    LOI -- OK --> L[LOI / eligibility certificate issued]\n    L --> B{6. Bank appraisal}\n    B -- Refused --> F2[Bank refusal:<br/>another bank / better report / credit score]\n    B -- Sanctioned --> S[Loan disbursed<br/>upload sanction letter]\n    S --> EMI[7. Pay EMIs on time<br/>upload loan statement]\n    EMI -- Late / missed EMI --> F3[No refund for that period]\n    EMI -- Regular --> IR([8. Interest refunded<br/>up to cap, for set years])\n    F2 -. still stuck .-> T[District coordinator /<br/>bank grievance / Lead Bank Manager]\n\n    S1[[Sathi: Eligibility + corporation router]]:::sathi -.-> E\n    S2[[Sathi: Project report template<br/>EMI affordability check]]:::sathi -.-> PL\n    S3[[Sathi: Bank-readiness check<br/>credit score, documents, which banks lend]]:::sathi -.-> B\n    S4[[Sathi: EMI reminders +<br/>monthly refund-claim tracker]]:::sathi -.-> EMI\n    S5[[Sathi: Escalation draft]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Surajya Consultancy: APAMVM", "url": "https://www.surajyaconsultancy.com/scheme/apamvm"}, {"label": "GovCSC: Annasaheb Patil loan scheme", "url": "https://govcsc.com/annasaheb-patil-loan-scheme/"}, {"label": "Pune People's Co-op Bank", "url": "https://www.punepeoples.bank.in/annasaheb-patil-mahamandal-karj-yojana"}, {"label": "SKOCH: Loan Interest Reimbursement Scheme", "url": "https://exhibition.skoch.in/beacon-of-hope/annasaheb-patil-arthik-magas-vikas-mahamandal-maryadit-mumbai/"}], "en": {"h1": "Annasaheb Patil Loan Scheme: Interest-free business loan", "benefit": "Take a bank loan for your business; the corporation refunds the interest if you pay EMIs on time", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Resident of <b>Maharashtra<\/b><\/li><li>From an <b>economically backward<\/b> family of a community <b>not covered by another state corporation<\/b> (e.g. Maratha and other open-category communities)<\/li><li>Within the <b>age limit<\/b> (adult, working age)<\/li><li>Family income <b>up to about ₹8 lakh a year<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Individual loans and <b>group loans<\/b> (for farmer groups / SHGs) are both available."}}, {"phase": null, "kind": "you", "who": "You", "title": "Plan your business", "body": "Decide the business (farm-related, manufacturing, service or trade) and how much loan you need. Prepare a simple <b>project report<\/b>: cost, income, EMI you can pay.", "note": {"kind": "tip", "label": "Tip:", "html": "A clear project report is what <b>convinces the bank<\/b>. Ask a CA or the district office for a format."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, photo, mobile linked to Aadhaar<\/li><li><b>Income certificate<\/b> or ITR<\/li><li><b>Domicile<\/b> / residence proof, age proof<\/li><li>Community proof (e.g. school leaving certificate / caste certificate)<\/li><li>Project report, bank details<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No income or domicile certificate? Get them first on Aaple Sarkar."}}, {"phase": null, "kind": "you", "who": "You", "title": "Register and get the Letter of Intent", "body": "Register on the corporation's portal (<b>udyog.mahaswayam.gov.in<\/b>), fill your details, upload documents and apply for the <b>Letter of Intent (LOI)<\/b> / eligibility certificate.", "note": {"kind": "tip", "label": "Tip:", "html": "Registration is <b>free<\/b>. Never pay an agent to \"get the loan sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Corporation / Bank", "title": "Corporation issues LOI", "body": "The corporation checks your documents and issues the <b>LOI<\/b>, which tells the bank you are eligible for interest refund.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Application sent back? Usually a document is unclear or income proof is missing. Re-upload and resubmit."}}, {"phase": null, "kind": "gov", "who": "Corporation / Bank", "title": "Bank sanctions the loan", "body": "Take the LOI and project report to a bank. The <b>bank decides<\/b> and sanctions the loan. Upload the sanction letter on the portal.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Bank refused? The corporation does not force banks. Try <b>another bank<\/b>, improve the project report, check your credit score, or ask the <b>district coordinator<\/b> for help."}}, {"phase": null, "kind": "you", "who": "You", "title": "Pay every EMI on time", "body": "Pay EMIs <b>regularly<\/b>. Upload your <b>loan account statement<\/b> on the portal to claim the interest refund.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missed or late EMIs can <b>stop the interest refund<\/b> for that period."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Interest refunded", "body": "The corporation refunds the <b>interest<\/b> (up to a set limit, for a set number of years) for EMIs paid on time. Your loan becomes almost <b>interest-free<\/b>.", "note": null}], "rights_t": "Stuck with corporation or bank? Escalate.", "rights": "For LOI or refund delays, contact the corporation's <b>district coordinator / office<\/b> in writing. For unfair bank refusal, use the <b>bank's grievance channel<\/b> or the district <b>Lead Bank Manager<\/b>.", "help": "<b>Portal:<\/b> udyog.mahaswayam.gov.in · Keep EMI receipts and statements safe<br/><b>Registration is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "अण्णासाहेब पाटील कर्ज योजना: व्यवसायासाठी बिनव्याजी कर्ज", "benefit": "व्यवसायासाठी बँक कर्ज घ्या; हप्ते वेळेवर भरल्यास महामंडळ व्याज परत करते", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>महाराष्ट्राचे<\/b> रहिवासी<\/li><li>ज्या समाजासाठी <b>इतर राज्य महामंडळ नाही<\/b> अशा समाजातील (उदा. मराठा व इतर खुल्या प्रवर्गातील) <b>आर्थिकदृष्ट्या मागास<\/b> कुटुंब<\/li><li><b>वयोमर्यादेत<\/b> (प्रौढ, कार्यक्षम वय)<\/li><li>कौटुंबिक उत्पन्न <b>वर्षाला सुमारे ₹8 लाखांपर्यंत<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "वैयक्तिक कर्ज आणि <b>गट कर्ज<\/b> (शेतकरी गट / बचत गटांसाठी) दोन्ही उपलब्ध आहेत."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "व्यवसायाची योजना करा", "body": "व्यवसाय ठरवा (शेतीपूरक, उत्पादन, सेवा किंवा व्यापार) आणि किती कर्ज हवे ते ठरवा. सोपा <b>प्रकल्प अहवाल<\/b> तयार करा: खर्च, उत्पन्न, तुम्ही भरू शकाल असा हप्ता.", "note": {"kind": "tip", "label": "सूचना:", "html": "स्पष्ट प्रकल्प अहवालामुळेच <b>बँकेचा विश्वास<\/b> बसतो. नमुन्यासाठी CA किंवा जिल्हा कार्यालयाला विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार, फोटो, आधारशी लिंक मोबाईल<\/li><li><b>उत्पन्नाचा दाखला<\/b> किंवा ITR<\/li><li><b>अधिवास<\/b> / रहिवास पुरावा, वयाचा पुरावा<\/li><li>समाजाचा पुरावा (उदा. शाळा सोडल्याचा दाखला / जातीचा दाखला)<\/li><li>प्रकल्प अहवाल, बँक तपशील<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "उत्पन्नाचा किंवा अधिवास दाखला नाही? आधी आपले सरकार वरून काढा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "नोंदणी करून LOI मिळवा", "body": "महामंडळाच्या पोर्टलवर (<b>udyog.mahaswayam.gov.in<\/b>) नोंदणी करा, माहिती भरा, कागदपत्रे अपलोड करा आणि <b>हेतूपत्र (LOI)<\/b> / पात्रता प्रमाणपत्रासाठी अर्ज करा.", "note": {"kind": "tip", "label": "सूचना:", "html": "नोंदणी <b>मोफत<\/b> आहे. \"कर्ज मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महामंडळ / बँक", "title": "महामंडळाकडून LOI", "body": "महामंडळ कागदपत्रे तपासून <b>LOI<\/b> देते. यावरून बँकेला कळते की तुम्ही व्याज परताव्यासाठी पात्र आहात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज परत पाठवला? बहुतेक वेळा एखादे कागदपत्र अस्पष्ट असते किंवा उत्पन्नाचा पुरावा नसतो. पुन्हा अपलोड करून सादर करा."}}, {"phase": null, "kind": "gov", "who": "महामंडळ / बँक", "title": "बँकेकडून कर्ज मंजूर", "body": "LOI आणि प्रकल्प अहवाल घेऊन बँकेत जा. <b>निर्णय बँक घेते<\/b> आणि कर्ज मंजूर करते. मंजुरी पत्र पोर्टलवर अपलोड करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "बँकेने नकार दिला? महामंडळ बँकांवर सक्ती करत नाही. <b>दुसऱ्या बँकेत<\/b> प्रयत्न करा, प्रकल्प अहवाल सुधारा, क्रेडिट स्कोअर तपासा, किंवा <b>जिल्हा समन्वयकांची<\/b> मदत घ्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "प्रत्येक हप्ता वेळेवर भरा", "body": "हप्ते <b>नियमितपणे<\/b> भरा. व्याज परतावा मागण्यासाठी तुमचे <b>कर्ज खाते विवरण<\/b> पोर्टलवर अपलोड करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "हप्ता चुकला किंवा उशिरा भरला तर त्या कालावधीचा <b>व्याज परतावा थांबू<\/b> शकतो."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "व्याज परतावा मिळतो", "body": "वेळेवर भरलेल्या हप्त्यांचे <b>व्याज<\/b> महामंडळ परत करते (ठराविक मर्यादेपर्यंत, ठराविक वर्षांसाठी). तुमचे कर्ज जवळजवळ <b>बिनव्याजी<\/b> होते.", "note": null}], "rights_t": "महामंडळ किंवा बँकेकडे अडकले? पाठपुरावा करा.", "rights": "LOI किंवा परताव्याला उशीर झाल्यास महामंडळाच्या <b>जिल्हा समन्वयक / कार्यालयाकडे<\/b> लेखी संपर्क करा. बँकेने अन्यायाने नकार दिल्यास <b>बँकेची तक्रार यंत्रणा<\/b> किंवा जिल्ह्याचे <b>अग्रणी बँक व्यवस्थापक<\/b> यांच्याकडे जा.", "help": "<b>पोर्टल:<\/b> udyog.mahaswayam.gov.in · हप्त्यांच्या पावत्या आणि विवरणे जपून ठेवा<br/><b>नोंदणी मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "mahatma-phule-mahamandal", "title": "Mahatma Phule Mahamandal loans", "mr_name": "महात्मा फुले महामंडळ", "audience": "SC / Nav-Bauddha families", "cat": "loan", "links": [{"label": "Mahatma Phule Mahamandal (MPBCDC)", "url": "https://mpbcdc.maharashtra.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([SC / Nav-Bauddha family wants a business]) --> E{1. Eligible?<br/>MH resident, age + income limit,<br/>no earlier default}\n    E -- No --> X([Check other schemes])\n    E -- Yes --> SCH{2. Project size}\n    SCH -- Small --> S1A[Subsidy scheme<br/>subsidy + bank loan]\n    SCH -- Medium --> S2A[Seed capital<br/>corporation share + bank loan]\n    SCH -- Larger --> S3A[NSFDC term loan<br/>via corporation]\n    S1A --> P[3. Business plan + quotations]\n    S2A --> P\n    S3A --> P\n    P --> D[4. Documents<br/>caste + income cert, domicile, Aadhaar,<br/>project report, place proof, no-dues]\n    D --> AP[5. Apply at district office<br/>acknowledgement]\n    AP --> SC[6. Scrutiny + site visit]\n    SC -- Missing quotation / place proof --> F1[Pending: fix and resubmit]\n    SC --> CM{Sanction committee}\n    CM -- Rejected --> F2[Rejected with reason]\n    CM -- Sanctioned --> BK{Bank part needed?}\n    BK -- Yes --> BANK[Bank sanctions its loan]\n    BANK -- Delay --> F3[Bank delay:<br/>corporation follows up]\n    BK -- No --> REL\n    BANK --> REL[7. Release to supplier<br/>asset verification]\n    REL --> RUN([8. Run business, repay EMIs])\n    RUN -- Missed EMIs --> F4[Defaulter: future loans blocked]\n    F1 -. stuck long .-> T[District manager / regional office /<br/>Lead Bank Manager]\n\n    X1[[Sathi: Eligibility + scheme-size router]]:::sathi -.-> SCH\n    X2[[Sathi: Project report + quotation checklist]]:::sathi -.-> P\n    X3[[Sathi: Readiness: caste + income certs]]:::sathi -.-> D\n    X4[[Sathi: Pending clock + escalation draft]]:::sathi -.-> T\n    X5[[Sathi: EMI reminders]]:::sathi -.-> RUN\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3,F4 blocked", "sources": [{"label": "MahaBharti: Anudan Yojana for Backward Class (mpbcdc)", "url": "https://mahabharti.in/yojana/anudan-yojana-for-backward-class"}], "en": {"h1": "Mahatma Phule Mahamandal: Business loan and subsidy for SC families", "benefit": "Subsidy, low-interest margin money and loans to start a small business", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>From a <b>Scheduled Caste or Nav-Bauddha<\/b> family, living in <b>Maharashtra<\/b><\/li><li>Within the <b>age limit<\/b> (adult, working age)<\/li><li>Family income <b>below the scheme limit<\/b><\/li><li>Not a defaulter on any earlier government / corporation loan<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Pick the right scheme", "body": "<ul><li><b>Small project<\/b> → <b>subsidy scheme<\/b>: part subsidy, rest bank loan<\/li><li><b>Medium project<\/b> → <b>seed capital (margin money)<\/b>: corporation gives a low-interest share, bank gives the main loan<\/li><li><b>Larger project<\/b> → <b>NSFDC term loan<\/b> through the corporation at low interest<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Ask the <b>district office<\/b> which scheme fits your project amount. Limits change by GR."}}, {"phase": null, "kind": "you", "who": "You", "title": "Plan the business, get quotations", "body": "Decide the business (shop, dairy, auto-rickshaw, tailoring, workshop, etc.). Get <b>quotations<\/b> for machines / goods and make a simple <b>project report<\/b>.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Caste certificate<\/b><\/li><li><b>Income certificate<\/b>, domicile, age proof<\/li><li>Aadhaar, ration card, photo, bank passbook<\/li><li>Project report and quotations<\/li><li>Shop / place proof (rent agreement or ownership), if needed<\/li><li><b>No-dues certificate<\/b> from banks, if asked<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No caste or income certificate? Get them first on Aaple Sarkar."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply at the district office", "body": "Submit the form with documents at the corporation's <b>district office<\/b> (or online where available). Take an <b>acknowledgement<\/b> with the application number.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never pay an agent to \"get the loan sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Corporation / Bank", "title": "Scrutiny, site visit and sanction", "body": "The district office checks your papers and may <b>visit your proposed business place<\/b>. The application is placed before the <b>sanction committee<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pending for long? Ask the <b>district manager<\/b> for the status in writing. Missing quotations or place proof are common reasons."}}, {"phase": null, "kind": "gov", "who": "Corporation / Bank", "title": "Money is released", "body": "For subsidy / seed-capital schemes the file goes to the <b>bank<\/b>, which sanctions its loan. Money is usually paid <b>to the supplier<\/b> for the asset. The office may verify the asset was bought.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Bank delaying its share? Contact the corporation's district office; they follow up with the bank."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Run the business, repay on time", "body": "Start your business. Pay every <b>EMI on time<\/b> to the bank / corporation. Good repayment makes you eligible for <b>bigger loans later<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missed EMIs make you a <b>defaulter<\/b> and block future loans and schemes."}}], "rights_t": "Stuck for long? Escalate.", "rights": "Give a written application to the corporation's <b>district manager<\/b> with your application number and take an <b>acknowledgement (पोच)<\/b>. If not solved, write to the <b>regional / head office<\/b>. For bank delays, contact the district <b>Lead Bank Manager<\/b>.", "help": "<b>Apply at:<\/b> Mahatma Phule Mahamandal district office · <b>Website:<\/b> mpbcdc.maharashtra.gov.in · Keep all receipts and EMI records<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "महात्मा फुले महामंडळ: अनुसूचित जातीतील कुटुंबांसाठी व्यवसाय कर्ज व अनुदान", "benefit": "छोटा व्यवसाय सुरू करण्यासाठी अनुदान, कमी व्याजाचे बीज भांडवल आणि कर्ज", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>अनुसूचित जाती किंवा नवबौद्ध<\/b> कुटुंबातील, <b>महाराष्ट्राचे<\/b> रहिवासी<\/li><li><b>वयोमर्यादेत<\/b> (प्रौढ, कार्यक्षम वय)<\/li><li>कौटुंबिक उत्पन्न <b>योजनेच्या मर्यादेपेक्षा कमी<\/b><\/li><li>पूर्वीच्या कोणत्याही सरकारी / महाम const POSTS = DATA.posts, BY = Object.fromEntries(POSTS.map(p => [p.slug, p]));
const state = { lang: "en", cat: "all", q: "" };
try { const l = localStorage.getItem("sathi-lang"); if (l === "en" || l === "mr") state.lang = l; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const catName = id => { const c = DATA.cats.find(c => c.id === id); return c ? c[state.lang] : ""; };
const title = p => state.lang === "mr" ? p.mr_name : p.title;
const search = SEARCH_ICON();
function SEARCH_ICON() { return '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>'; }

function matches(p) {
  if (state.cat !== "all" && p.cat !== state.cat) return false;
  if (!state.q) return true;
  const hay = [p.title, p.mr_name, p.audience, p.en.h1, p.mr.h1, catName(p.cat)].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function cardHTML(p) {
  const u = UI[state.lang];
  return `<li><a class="card-link" href="#${p.slug}">
    <p class="eyebrow">${esc(catName(p.cat))}</p>
    <h2 lang="${state.lang}">${esc(title(p))}</h2>
    <span class="mrn" lang="${state.lang === "mr" ? "en" : "mr"}">${esc(state.lang === "mr" ? p.title : p.mr_name)}</span>
    <span class="for"><b>${u.forw}:</b> ${esc(p.audience)}</span>
    <span class="meta"><span>${u.steps(p.en.steps.length)}</span><span>${u.links(p.links.length)}</span></span>
  </a></li>`;
}

function renderCards() {
  const list = POSTS.filter(matches), u = UI[state.lang];
  $("#cards").innerHTML = list.length ? list.map(cardHTML).join("") : `<li class="empty">${u.none}</li>`;
  $("#count").textContent = u.shown(list.length);
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === state.cat)));
}

function renderHome() {
  const u = UI[state.lang];
  const count = id => id === "all" ? POSTS.length : POSTS.filter(p => p.cat === id).length;

  <div class="gutter">
    <section class="intro">
      <p class="eyebrow">${u.eyebrow}</p>
      <h1>${u.h1}</h1>
      <p class="lead">${u.lead}</p>
    </section>
    <div class="tools">
      <label class="search" for="q">${search}<span class="sr-only">${u.search}</span>
        <input id="q" type="search" placeholder="${esc(u.search)}" value="${esc(state.q)}" autocomplete="off"></label>
      <div class="chips" role="group" aria-label="${u.all}">${chips}</div>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
    <div class="layout">
      <ul class="cards" id="cards"></ul>
      <aside class="side">
        <section><h2>${u.routes}</h2><ul>${DATA.routers.map(r => `<li>${r}</li>`).join("")}</ul></section>
        <section><h2>${u.legend}</h2><ul class="legend-list">${["you", "gov", "done"].map((k, i) => `<li><i class="dot ${k}"></i>${u.lg[i]}</li>`).join("")}</ul></section>
      </aside>
    </div>
  </div>`;
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderCards(); });
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { state.cat = b.dataset.cat; renderCards(); }));
  renderCards();
  document.title = "Sathi Yojana Guides";
}

function stepsHTML(g) {
  return g.steps.map((s, i) => `${s.phase ? `<li class="phase" aria-hidden="true">${esc(s.phase)}</li>` : ""}
    <li class="step ${s.kind}"><span class="num" aria-hidden="true">${i + 1}</span><div class="scard">
      <span class="who">${esc(s.who)}</span><h3><span class="sr-only">${i + 1}. </span>${esc(s.title)}</h3>
      <div class="sbody">${s.body}</div>
      ${s.note ? `<p class="note ${s.note.kind}"><b class="nl">${esc(s.note.label)}</b> ${s.note.html}</p>` : ""}
    </div></li>`).join("");
}

function renderPost(p) {
  const u = UI[state.lang], g = p[state.lang], i = POSTS.indexOf(p);
  const prev = POSTS[i - 1], next = POSTS[i + 1];
  const links = p.links.map(l => `<li><span class="what">${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : `<b>${esc(l.label.split(":").slice(1).join(":").trim() || l.label)}</b>`}<span class="lbl">${esc(l.label)}</span></span>
      <span class="tag ${l.gov ? "g" : "x"}">${l.gov ? u.gov : u.third}</span></li>`).join("");
  const sources = p.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("");
  $("#main").innerHTML = `
  <article class="gutter"><div class="post">
    <a class="back" href="#">← ${u.back}</a>
    <p class="eyebrow">${esc(catName(p.cat))}</p>
    <h1 id="post-title" tabindex="-1" lang="${state.lang}">${esc(g.h1)}</h1>
    <p class="mrn" lang="${state.lang === "mr" ? "en" : "mr"}">${esc(state.lang === "mr" ? p.title : p.mr_name)}</p>
    <p class="benefit" lang="${state.lang}">${g.benefit}</p>
    <div class="post-meta"><span><b>${u.forw}:</b> ${esc(p.audience)}</span><span>${u.steps(g.steps.length)}</span><span>${u.checked}</span></div>
    <ul class="toc">${[["s-steps", u.tocSteps], ["s-links", u.tocLinks], ["s-flow", u.tocFlow], ["s-src", u.tocSrc]].map(([id, t]) => `<li><button type="button" data-go="${id}">${t}</button></li>`).join("")}</ul>

    <section lang="${state.lang}">
      <h2 id="s-steps" tabindex="-1">${u.hSteps}</h2>
      <div class="legend">${["you", "gov", "done"].map((k, j) => `<span><i class="dot ${k}"></i>${u.lg[j]}</span>`).join("")}</div>
      <ol class="steps">${stepsHTML(g)}</ol>
      ${g.rights ? `<aside class="box"><h3>${esc(g.rights_t)}</h3><div>${g.rights}</div></aside>` : ""}
      ${g.help ? `<aside class="box help"><div>${g.help}</div></aside>` : ""}
    </section>

    <section>
      <h2 id="s-links" tabindex="-1">${u.hLinks}</h2>
      <ul class="links">${links}</ul>
      <p class="small">${u.linksNote}</p>
    </section>

    <section>
      <h2 id="s-flow" tabindex="-1">${u.hFlow}</h2>
      <p class="small">${u.flowNote}</p>
      <div class="diagram" id="diagram" role="img" aria-label="${esc(u.hFlow)}: ${esc(p.title)}"><p class="small">${u.flowLoading}</p></div>
    </section>

    <section>
      <h2 id="s-src" tabindex="-1">${u.hSrc}</h2>
      <ol class="sources">${sources}</ol>
      <p class="small">${u.srcNote}</p>
    </section>

    <nav class="pager" aria-label="${u.prev} / ${u.next}">
      ${prev ? `<a class="prev" href="#${prev.slug}"><small>← ${u.prev}</small>${esc(title(prev))}</a>` : ""}
      ${next ? `<a class="next" href="#${next.slug}"><small>${u.next} →</small>${esc(title(next))}</a>` : ""}
    </nav>
  </div></article>`;
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.go); t.scrollIntoView({ block: "start" }); t.focus({ preventScroll: true });
  }));
  document.title = `${p.title} · Sathi Yojana Guides`;
  drawDiagram(p);
}

const svgCache = {};
let mermaidReady = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (!mermaidReady) mermaidReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" }); res(window.mermaid); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return mermaidReady;
}
async function drawDiagram(p) {
  const box = () => document.getElementById("diagram");
  const show = html => { const b = box(); if (b && location.hash.slice(1) === p.slug) b.innerHTML = html; };
  if (svgCache[p.slug]) return show(svgCache[p.slug]);
  try {
    const m = await loadMermaid();
    const { svg } = await m.render("flow-" + p.slug.replace(/[^a-z0-9]/g, ""), p.mermaid);
    svgCache[p.slug] = svg; show(svg);
  } catch (e) {
    show(`<p class="small">${UI[state.lang].flowFail}</p><pre>${esc(p.mermaid)}</pre>`);
  }
}

function applyChrome() {
  const u = UI[state.lang];
  document.documentElement.lang = state.lang;
  $("#brand-sub").textContent = u.sub;
  $("#skip").textContent = u.skip;
  $("#foot").textContent = u.foot;
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
}

function route(focus) {
  applyChrome();
  const p = BY[location.hash.slice(1)];
  if (p) { renderPost(p); if (focus) { window.scrollTo(0, 0); $("#post-title").focus({ preventScroll: true }); } }
  else { renderHome(); if (focus) window.scrollTo(0, 0); }
}

document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang;
  try { localStorage.setItem("sathi-lang", state.lang); } catch (e) {}
  const y = window.scrollY; route(false); window.scrollTo(0, y);
}));
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
window.addEventListener("hashchange", () => route(true));
route(false);
</script>
</body>
</html>
