y <b>online through the portal only<\/b> and keep the receipt. Choose or confirm the <b>empanelled supplier<\/b> as shown on the portal.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Never pay a supplier or agent in cash. Only payments on the official portal count."}}, {"phase": null, "kind": "gov", "who": "MSEDCL / Supplier", "title": "Survey and installation", "body": "The supplier surveys your site and installs the <b>solar panels and pump<\/b>, usually within about two months of the work order. A joint inspection confirms it works.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Installation delayed? Raise a complaint on the MSEDCL portal with your beneficiary ID."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Free daytime irrigation", "body": "Irrigate in the <b>daytime<\/b> with <b>no electricity bill<\/b>. The supplier gives a <b>5-year warranty<\/b> with repair and maintenance.", "note": {"kind": "tip", "label": "Tip:", "html": "Pump not working? Contact the <b>supplier<\/b> first (under warranty), then MSEDCL. Keep panels clean and the site secure."}}], "rights_t": "Stuck for long? Complain.", "rights": "Use the <b>complaint option on the MSEDCL solar pump portal<\/b> with your beneficiary ID, or write to your <b>MSEDCL sub-division office<\/b> and take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Apply:<\/b> portal.mahadiscom.in/solar_MTSKPY · Share and pump sizes as per MSEDCL FAQ; check the current notice<br/><b>Pay only on the official portal<\/b> · <b>Use only official websites<\/b>"}, "mr": {"h1": "मागेल त्याला सौर कृषी पंप: दिवसा सिंचनासाठी सौर पंप", "benefit": "फक्त 10% (अनुसूचित जाती / जमातीसाठी 5%) खर्चात ऑफ-ग्रिड सौर पंप, 5 वर्षांच्या हमीसह", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>स्वतःच्या नावावर<\/b> जमीन असलेला महाराष्ट्रातील शेतकरी<\/li><li><b>खात्रीशीर पाण्याचा स्रोत<\/b>: विहीर, बोअरवेल, शेततळे, किंवा बारमाही नदी / ओढा (स्वतःचा किंवा सामायिक)<\/li><li><b>सध्या शेतीसाठी वीज जोडणी नसावी<\/b><\/li><li>यापूर्वी अटल / मुख्यमंत्री सौर कृषी पंप किंवा कुसुम योजनेतून सौर पंप <b>घेतलेला नसावा<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "अजून पाण्याचा स्रोत नाही? आधी <b>मागेल त्याला शेततळे<\/b> किंवा विहीर योजना पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "पंपाची क्षमता ओळखा", "body": "<ul><li><b>2.5 एकरपर्यंत<\/b> जमीन → <b>3 HP<\/b><\/li><li><b>2.51 ते 5 एकर<\/b> → <b>5 HP<\/b><\/li><li><b>5 एकरपेक्षा जास्त<\/b> → <b>7.5 HP<\/b><\/li><\/ul>तुमच्या गटापेक्षा <b>कमी<\/b> क्षमतेचा पंप मागता येतो.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमची जमीन आणि <b>पाण्याचा स्रोत<\/b> दाखवणारा <b>7/12<\/b><\/li><li>आधार, बँक तपशील<\/li><li>अनुसूचित जाती / जमाती असल्यास <b>जातीचा दाखला<\/b> (5% हिश्श्यासाठी)<\/li><li>जमीन किंवा पाण्याचा स्रोत सामायिक असल्यास <b>सहहिस्सेदारांची संमती<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "7/12 वर पाण्याच्या स्रोताची नोंद नाही, किंवा जमीन तुमच्या नावावर नाही? आधी तलाठी कार्यालयात दुरुस्त करा. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महावितरण पोर्टलवर अर्ज करा", "body": "<b>महावितरणच्या<\/b> मागेल त्याला सौर कृषी पंप पोर्टलवर (<b>portal.mahadiscom.in/solar_MTSKPY<\/b>) ऑनलाइन अर्ज करा. तुमचा <b>लाभार्थी / अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज <b>मोफत<\/b> आहे. \"नोंदणी करून देण्यासाठी\" पैसे मागणाऱ्या बनावट वेबसाइट व एजंटपासून सावध राहा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महावितरण / पुरवठादार", "title": "छाननी व हिस्सा भरणा सूचना", "body": "महावितरण अर्ज व कागदपत्रे तपासून तुमचा <b>हिस्सा<\/b> भरण्यास सांगते: पंपाच्या किमतीच्या सुमारे <b>10%<\/b> (अनुसूचित जाती / जमातीसाठी <b>5%<\/b>).", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? बहुतेक वेळा पाण्याचा स्रोत किंवा जमिनीची नोंद जुळत नाही. 7/12 दुरुस्त करून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "तुमचा हिस्सा भरा", "body": "<b>फक्त पोर्टलवरूनच ऑनलाइन<\/b> भरा आणि पावती जपून ठेवा. पोर्टलवर दाखवलेला <b>अधिकृत पुरवठादार<\/b> निवडा किंवा निश्चित करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पुरवठादार किंवा एजंटला कधीही रोख पैसे देऊ नका. फक्त अधिकृत पोर्टलवरील भरणाच ग्राह्य."}}, {"phase": null, "kind": "gov", "who": "महावितरण / पुरवठादार", "title": "सर्वेक्षण व बसवणी", "body": "पुरवठादार जागेचे सर्वेक्षण करून <b>सौर पॅनेल व पंप<\/b> बसवतो, साधारण कार्यादेशानंतर दोन महिन्यांत. संयुक्त तपासणीत पंप चालतो याची खात्री होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "बसवणीला उशीर? लाभार्थी क्रमांकासह महावितरण पोर्टलवर तक्रार नोंदवा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दिवसा मोफत सिंचन", "body": "<b>दिवसा<\/b> सिंचन करा, <b>वीज बिल नाही<\/b>. पुरवठादार दुरुस्ती व देखभालीसह <b>5 वर्षांची हमी<\/b> देतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "पंप बंद? आधी <b>पुरवठादाराशी<\/b> (हमीअंतर्गत), नंतर महावितरणशी संपर्क करा. पॅनेल स्वच्छ ठेवा आणि जागा सुरक्षित ठेवा."}}], "rights_t": "खूप दिवस अडकले? तक्रार करा.", "rights": "लाभार्थी क्रमांकासह <b>महावितरण सौर पंप पोर्टलवरील तक्रार<\/b> सुविधा वापरा, किंवा <b>महावितरण उपविभागीय कार्यालयाला<\/b> लिहा आणि <b>पोच<\/b> घ्या.", "help": "<b>अर्ज:<\/b> portal.mahadiscom.in/solar_MTSKPY · हिस्सा व पंप क्षमता महावितरण FAQ नुसार; चालू सूचना तपासा<br/><b>फक्त अधिकृत पोर्टलवरच पैसे भरा<\/b> · <b>फक्त अधिकृत वेबसाइट वापरा<\/b>"}}, {"slug": "income-certificate", "title": "Income certificate", "mr_name": "उत्पन्नाचा दाखला", "audience": "Everyone applying to income-based schemes", "cat": "docs", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "India.gov.in: Maharashtra income certificate service", "url": "https://services.india.gov.in/service/detail/maharashtra-income-certificate-with-affidavit", "gov": true}], "mermaid": "flowchart TD\n    A([Citizen needs income certificate]) --> B[1. Identify need<br/>Which year, whose name, which scheme]\n    B --> C[2. Gather documents<br/>ID, address, income proof, self-declaration, photo]\n    C --> D[3. Apply on Aaple Sarkar<br/>Portal or Seva Kendra, pay fee<br/>Get Application ID + RTS time limit]\n    D --> E[4. Scrutiny at Tahsil office]\n    E -- Document missing / wrong --> F1[Sent back to applicant<br/>with remark]\n    F1 -- Upload + resubmit --> E\n    E -- Farm / business income --> G[5. Talathi / Circle field report]\n    G -- Pending long --> F2[Blocked at Talathi]\n    G --> H\n    E -- OK --> H[6. Tahsildar / Naib Tahsildar<br/>approves + digital signature]\n    H -- Rejected --> F3[Rejected with reason]\n    H --> I([7. Download digitally signed certificate])\n    I --> L[Next financial year:<br/>renew from step 1]\n    F2 --> T{RTS time limit crossed?}\n    E -. any delay .-> T\n    T -- Yes --> J[First Appeal on Aaple Sarkar<br/>MH Right to Public Services Act 2015]\n    J --> K[Second Appeal / State RTS Commission]\n\n    S1[[Sathi: Which certificate + document readiness check]]:::sathi -.-> B\n    S2[[Sathi: Decode sent-back remark in Marathi<br/>what to upload, no visit needed]]:::sathi -.-> F1\n    S3[[Sathi: Rights clock countdown<br/>auto-draft First Appeal]]:::sathi -.-> T\n    S4[[Sathi: Expiry alert before scheme deadlines]]:::sathi -.-> L\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Chanda district: notified services list", "url": "https://chanda.nic.in/?p=30380"}, {"label": "India.gov.in: Maharashtra income certificate with affidavit", "url": "https://services.india.gov.in/service/detail/maharashtra-income-certificate-with-affidavit"}, {"label": "Wikiprocedure: Maharashtra income certificate", "url": "https://wikiprocedure.com/index.php/Maharashtra_-_Apply_for_Income_Certificate"}], "en": {"h1": "Income Certificate: How to get it on Aaple Sarkar", "benefit": "Needed for scholarships, fee concession, EWS and many schemes", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check which certificate you need", "body": "Ask the scheme or office: <b>which year's income<\/b> (1 year or 3 years) and <b>in whose name<\/b> (yours or your parent's). Most schemes want a certificate from the <b>current financial year<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Have last year's certificate? Most schemes reject it. Apply fresh, early."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Identity:<\/b> Aadhaar / PAN / Voter ID<\/li><li><b>Address:<\/b> Ration card / Electricity bill<\/li><li><b>Income:<\/b> Job → Form 16 or salary slip · Farmer → 7/12 and 8A · Others → self-declaration<\/li><li>Passport-size photo<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Ask at the Seva Kendra whether a signed <b>self-declaration<\/b> is accepted, so you can avoid paying for a stamp-paper affidavit."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li>Website <b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Income Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b> / Maha e-Seva Kendra<\/li><\/ul>Pay the small fee. Note down your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "At a Seva Kendra pay only the fixed fee and take a receipt. Never pay an agent extra."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil office checks your form and documents.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Read the remark, upload the missing paper and resubmit online. <b>No visit needed.<\/b>"}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Income is verified (if needed)", "body": "For farm or business income, the Talathi may be asked for a report.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pending at Talathi for long? Visit the Talathi office with your Application ID."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Tahsildar approves", "body": "Tahsildar / Naib Tahsildar approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and download it. It is <b>digitally signed<\/b>, so it is valid <b>without any stamp<\/b>.", "note": null}], "rights_t": "Late? It's your right.", "rights": "If the time limit has passed, you can file a <b>First Appeal<\/b> on Aaple Sarkar with your Application ID, under the <b>Maharashtra Right to Public Services Act, 2015<\/b>.", "help": "<b>Check status anytime:<\/b> Aaple Sarkar → Track your application (Application ID)<br/><b>Renew every year<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "उत्पन्नाचा दाखला: आपले सरकार वरून कसा मिळवायचा", "benefit": "शिष्यवृत्ती, फी सवलत, EWS आणि अनेक योजनांसाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कोणता दाखला हवा ते तपासा", "body": "ज्या योजनेसाठी किंवा कार्यालयासाठी दाखला हवा आहे तिथे विचारा: <b>किती वर्षांचे उत्पन्न<\/b> (1 वर्ष की 3 वर्षे) आणि <b>कोणाच्या नावाने<\/b> (तुमच्या की पालकांच्या). बहुतेक योजनांना <b>चालू आर्थिक वर्षाचा<\/b> दाखला लागतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मागील वर्षाचा दाखला आहे? बहुतेक योजना तो स्वीकारत नाहीत. लवकर नवीन अर्ज करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>ओळखीचा पुरावा:<\/b> आधार / पॅन / मतदार ओळखपत्र<\/li><li><b>पत्त्याचा पुरावा:<\/b> रेशन कार्ड / वीज बिल<\/li><li><b>उत्पन्नाचा पुरावा:<\/b> नोकरी → फॉर्म 16 किंवा पगार पत्रक · शेतकरी → 7/12 व 8-अ उतारा · इतर → स्वयंघोषणापत्र<\/li><li>पासपोर्ट आकाराचा फोटो<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "स्टॅम्प पेपरवरील प्रतिज्ञापत्राचा खर्च टाळण्यासाठी सही केलेले <b>स्वयंघोषणापत्र<\/b> चालते का ते सेवा केंद्रात विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>aaplesarkar.mahaonline.gov.in<\/b> → महसूल विभाग → उत्पन्नाचा दाखला<\/li><li>जवळचे <b>आपले सरकार सेवा केंद्र<\/b> / महा ई-सेवा केंद्र<\/li><\/ul>थोडी फी भरा. तुमचा <b>अर्ज क्रमांक<\/b> (Application ID) आणि दाखवलेली <b>कालमर्यादा (दिवस)<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "सेवा केंद्रात फक्त ठरलेली फी भरा आणि पावती घ्या. एजंटला जास्त पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील कार्यालय तुमचा अर्ज आणि कागदपत्रे तपासते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? शेरा वाचा, राहिलेले कागदपत्र अपलोड करून ऑनलाइन पुन्हा सादर करा. <b>कार्यालयात जाण्याची गरज नाही.<\/b>"}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "उत्पन्नाची पडताळणी (गरज असल्यास)", "body": "शेती किंवा व्यवसायाच्या उत्पन्नासाठी तलाठ्यांकडून अहवाल मागवला जाऊ शकतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "तलाठ्यांकडे बराच काळ प्रलंबित? अर्ज क्रमांक घेऊन तलाठी कार्यालयात भेटा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "तहसीलदारांची मंजुरी", "body": "तहसीलदार / नायब तहसीलदार मंजुरी देऊन <b>डिजिटल सही<\/b> करतात.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दाखला डाउनलोड करा", "body": "आपले सरकार वर लॉगिन करून दाखला डाउनलोड करा. त्यावर <b>डिजिटल सही<\/b> असल्याने तो <b>कोणत्याही शिक्क्याशिवाय वैध<\/b> आहे.", "note": null}], "rights_t": "उशीर झाला? हा तुमचा हक्क आहे.", "rights": "कालमर्यादा संपली असेल तर <b>महाराष्ट्र लोकसेवा हक्क अधिनियम, 2015<\/b> नुसार अर्ज क्रमांक वापरून आपले सरकार वर <b>प्रथम अपील<\/b> करता येते.", ass F0,F1,F2 blocked", "sources": [{"label": "ClearTax: Domicile certificate Maharashtra", "url": "https://cleartax.in/s/domicile-certificate-maharashtra"}, {"label": "TaxBuddy: Domicile certificate Maharashtra", "url": "https://www.taxbuddy.com/blog/domicile-certificate-maharashtra"}, {"label": "Corpseed: Domicile certificate Maharashtra", "url": "https://www.corpseed.com/knowledge-centre/domicile-certificate-maharashtra"}, {"label": "Advocate Gandhi: Maharashtra domicile guide", "url": "https://advocategandhi.com/understanding-the-maharashtra-domicile-certificate-a-complete-legal-guide-for-residents-and-students/"}], "en": {"h1": "Domicile Certificate: How to get it on Aaple Sarkar", "benefit": "Needed for state-quota college admission, state jobs and scholarships", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "The official name is <b>Age, Nationality and Domicile Certificate<\/b>. You can apply if you have been <b>living in Maharashtra for at least 15 years<\/b>. Other routes: a parent who is a long-term resident, or marriage to a Maharashtra resident.", "note": {"kind": "tip", "label": "Tip:", "html": "Admission seasons (CET, NEET, JEE) bring a rush. Apply <b>before<\/b> admission forms open."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Age proof:<\/b> birth certificate or school leaving certificate<\/li><li><b>Identity:<\/b> Aadhaar / PAN / Voter ID<\/li><li><b>15 years of residence:<\/b> any mix of ration card, electricity bills, property tax receipts, school bonafide certificates, 7/12<\/li><li>Self-declaration, photo<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missing some years? Combine documents: school bonafide certificates for each school, old electricity bills, rent agreement or property tax receipts together can cover 15 years."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Age, Nationality and Domicile Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b> / Maha e-Seva Kendra<\/li><\/ul>Pay the small fee. Note your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "Pay only the fixed fee and take a receipt. Never pay an agent extra."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil office checks your age proof and that your residence documents cover 15 years.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Usually a gap in residence years or an unclear scan. Upload the missing year's proof and resubmit. <b>No visit needed.<\/b>"}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Tahsildar approves", "body": "The Tahsildar approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and download it. It is <b>digitally signed<\/b>, valid without any stamp, and usually <b>does not expire<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Keep a few printouts and a PDF on your phone. Colleges ask for it at every admission round."}}], "rights_t": "Late? It's your right.", "rights": "If the time limit has passed, you can file a <b>First Appeal<\/b> on Aaple Sarkar with your Application ID, under the <b>Maharashtra Right to Public Services Act, 2015<\/b>.", "help": "<b>Check status anytime:<\/b> Aaple Sarkar → Track your application (Application ID)<br/><b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "अधिवास प्रमाणपत्र: आपले सरकार वरून कसे मिळवायचे", "benefit": "राज्य कोट्यातील महाविद्यालय प्रवेश, राज्य सरकारी नोकरी आणि शिष्यवृत्तीसाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "याचे अधिकृत नाव <b>वय, राष्ट्रीयत्व व अधिवास प्रमाणपत्र<\/b> आहे. तुम्ही <b>किमान 15 वर्षे महाराष्ट्रात राहत<\/b> असाल तर अर्ज करू शकता. इतर मार्ग: पालक दीर्घकाळ रहिवासी असणे, किंवा महाराष्ट्रातील रहिवाशाशी विवाह.", "note": {"kind": "tip", "label": "सूचना:", "html": "प्रवेशाच्या काळात (CET, NEET, JEE) खूप गर्दी असते. प्रवेश अर्ज सुरू होण्या<b>पूर्वीच<\/b> अर्ज करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>वयाचा पुरावा:<\/b> जन्म दाखला किंवा शाळा सोडल्याचा दाखला<\/li><li><b>ओळखीचा पुरावा:<\/b> आधार / पॅन / मतदार ओळखपत्र<\/li><li><b>15 वर्षांच्या रहिवासाचा पुरावा:<\/b> रेशन कार्ड, वीज बिले, मालमत्ता कर पावत्या, शाळेचे बोनाफाईड प्रमाणपत्र, 7/12 यापैकी कोणतेही<\/li><li>स्वयंघोषणापत्र, फोटो<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "काही वर्षांचा पुरावा नाही? कागदपत्रे एकत्र करा: प्रत्येक शाळेचे बोनाफाईड, जुनी वीज बिले, भाडेकरार किंवा मालमत्ता कर पावत्या मिळून 15 वर्षे पूर्ण होऊ शकतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → महसूल विभाग → वय, राष्ट्रीयत्व व अधिवास प्रमाणपत्र<\/li><li>जवळचे <b>आपले सरकार सेवा केंद्र<\/b> / महा ई-सेवा केंद्र<\/li><\/ul>थोडी फी भरा. तुमचा <b>अर्ज क्रमांक<\/b> आणि दाखवलेली <b>कालमर्यादा (दिवस)<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "फक्त ठरलेली फी भरा आणि पावती घ्या. एजंटला जास्त पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील कार्यालय तुमचा वयाचा पुरावा आणि रहिवासाचे कागद 15 वर्षे पूर्ण करतात का ते तपासते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? बहुतेक वेळा रहिवासाच्या वर्षांत खंड असतो किंवा स्कॅन अस्पष्ट असतो. राहिलेल्या वर्षाचा पुरावा अपलोड करून पुन्हा सादर करा. <b>कार्यालयात जाण्याची गरज नाही.<\/b>"}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "तहसीलदारांची मंजुरी", "body": "तहसीलदार मंजुरी देऊन <b>डिजिटल सही<\/b> करतात.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "प्रमाणपत्र डाउनलोड करा", "body": "आपले सरकार वर लॉगिन करून डाउनलोड करा. त्यावर <b>डिजिटल सही<\/b> असल्याने ते शिक्क्याशिवाय वैध आहे आणि सहसा त्याची <b>मुदत संपत नाही<\/b>.", "note": {"kind": "tip", "label": "सूचना:", "html": "काही प्रिंट आणि फोनमध्ये PDF ठेवा. प्रत्येक प्रवेश फेरीत महाविद्यालये ते मागतात."}}], "rights_t": "उशीर झाला? हा तुमचा हक्क आहे.", "rights": "कालमर्यादा संपली असेल तर <b>महाराष्ट्र लोकसेवा हक्क अधिनियम, 2015<\/b> नुसार अर्ज क्रमांक वापरून आपले सरकार वर <b>प्रथम अपील<\/b> करता येते.", "help": "<b>स्थिती कधीही तपासा:<\/b> आपले सरकार → Track your application (अर्ज क्रमांक)<br/><b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "caste-certificate", "title": "Caste certificate", "mr_name": "जातीचा दाखला", "audience": "Reserved-category citizens", "cat": "docs", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "BARTI: caste certificate verification", "url": "https://www.barti.in/department/cast-certificate-verification", "gov": true}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([Citizen needs caste certificate]) --> B[1. Identify need<br/>Caste cert vs Non-Creamy Layer vs Caste Validity]\n    B --> C[2. Find pre-cut-off proof<br/>self / father / grandfather, paternal side<br/>SC 1950, ST 1950, VJNT 1961, OBC/SBC 1967]\n    C -- No document found --> F0[Blocked: no old proof]\n    F0 -- Search relatives, school + GP registers --> C\n    C --> D[3. Supporting papers<br/>Aadhaar, own LC, family tree, affidavit, photo]\n    D --> E[4. Apply on Aaple Sarkar<br/>Portal / Seva Kendra / school camp<br/>Application ID + RTS time limit]\n    E --> S[5. Scrutiny at Tahsil / SDO office<br/>local inquiry if needed]\n    S -- Proof or family tree unclear --> F1[Sent back with remark]\n    F1 -- Upload clearer proof --> S\n    S --> H[6. SDO approves + digital signature]\n    H -- Rejected --> F2[Rejected with reason]\n    F2 --> AP[Appeal]\n    H --> I([7. Download certificate<br/>lifetime validity])\n    I --> V[Next: Caste Validity<br/>District Caste Scrutiny Committee]\n    I --> N[Next: Non-Creamy Layer<br/>for OBC / VJNT / SBC]\n    S -. time limit crossed .-> T[First Appeal on Aaple Sarkar<br/>MH Right to Public Services Act 2015]\n\n    S1[[Sathi: Which certificate do I need?]]:::sathi -.-> B\n    S2[[Sathi: Old-proof finder<br/>cut-off date by category, where to search]]:::sathi -.-> C\n    S3[[Sathi: Family tree builder<br/>links applicant to old proof]]:::sathi -.-> D\n    S4[[Sathi: Rights clock + draft First Appeal]]:::sathi -.-> T\n    S5[[Sathi: Validity + NCL reminders]]:::sathi -.-> V\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "Indian Kanoon: Caste Certificate Act, 2000", "url": "https://indiankanoon.org/doc/95388956/"}, {"label": "SJSA Maharashtra: Acts & Rules", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/"}, {"label": "BARTI: Caste Certificate Verification", "url": "https://www.barti.in/department/cast-certificate-verification"}, {"label": "mahadocguide: caste certificate documents", "url": "https://mahadocguide.in/documents-required-caste-certificate-maharashtra/"}], "en": {"h1": "Caste Certificate: How to get it on Aaple Sarkar", "benefit": "Needed for reservation in education, jobs, scholarships and elections", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Know which certificate you need", "body": "<ul><li><b>Caste certificate<\/b>: issued by the SDO. This guide.<\/li><li><b>Non-Creamy Layer<\/b>: also needed for OBC / VJNT / SBC benefits, renewed regularly.<\/li><li><b>Caste validity<\/b>: needed for professional courses, many jobs and elections. Apply after you get the caste certificate.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Find an old proof of caste", "body": "This is the <b>most important step<\/b>. You need a document of <b>you, your father or grandfather (father's side)<\/b> showing the caste and living in Maharashtra <b>before<\/b>:<ul><li>SC: 10 Aug 1950 · ST: 6 Sep 1950<\/li><li>VJ / NT: 21 Nov 1961 · OBC / SBC: 13 Oct 1967<\/li><\/ul>Examples: father's or grandfather's <b>school leaving certificate<\/b>, birth / death register extract, old land record.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No old document at home? Ask relatives: an uncle's (father's brother's) school record also works. Check the old village school register and Gram Panchayat birth register."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep other papers ready", "body": "<ul><li>Aadhaar and address proof<\/li><li>Your school leaving certificate showing caste<\/li><li><b>Family tree (वंशावळ)<\/b> showing how you are related to the person in the old document<\/li><li>Self-declaration / affidavit, photo<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Documents from your mother's side usually do not count. Caste follows the father's side."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Caste Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b>, or a special camp at your school / college<\/li><\/ul>Note your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "Pay only the fixed fee and take a receipt. Never pay an agent to \"arrange\" old documents."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil / SDO office checks your old proof and family tree. A local inquiry may be done.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Usually the old proof or family tree is unclear. Upload a clearer copy or an extra document and resubmit."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "SDO approves", "body": "The <b>Sub-Divisional Officer (SDO)<\/b>, or the competent officer in your taluka, approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and download it. It is <b>digitally signed<\/b> and does <b>not expire<\/b>. Keep it safe.", "note": {"kind": "tip", "label": "Tip:", "html": "Your certificate later helps your <b>brothers, sisters and children<\/b> prove their caste."}}], "rights_t": "Late? It's your right.", "rights": "If the time limit has passed, you can file a <b>First Appeal<\/b> on Aaple Sarkar with your Application ID, under the <b>Maharashtra Right to Public Services Act, 2015<\/b>.", "help": "<b>Next:<\/b> apply for <b>Caste Validity<\/b> if your course or job needs it, early, as it takes time<br/><b>Check status:<\/b> Aaple Sarkar → Track your application · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "जातीचा दाखला: आपले सरकार वरून कसा मिळवायचा", "benefit": "शिक्षण, नोकरी, शिष्यवृत्ती आणि निवडणुकीतील आरक्षणासाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कोणते प्रमाणपत्र हवे ते ओळखा", "body": "<ul><li><b>जातीचा दाखला<\/b>: उपविभागीय अधिकारी देतात. हे मार्गदर्शक त्यासाठी आहे.<\/li><li><b>नॉन-क्रिमीलेयर प्रमाणपत्र<\/b>: इ.मा.व. / वि.जा.-भ.ज. / वि.मा.प्र. लाभांसाठी हेही लागते, ठराविक काळाने नूतनीकरण.<\/li><li><b>जात वैधता प्रमाणपत्र<\/b>: व्यावसायिक अभ्यासक्रम, अनेक नोकऱ्या आणि निवडणुकीसाठी लागते. जातीचा दाखला मिळाल्यानंतर अर्ज करा.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जुना जातीचा पुरावा शोधा", "body": "ही <b>सर्वात महत्त्वाची पायरी<\/b> आहे. <b>तुमचा, वडिलांचा किंवा आजोबांचा (वडिलांकडील)<\/b> असा कागद हवा ज्यावर जात लिहिलेली आहे आणि महाराष्ट्रात राहत असल्याचा पुरावा आहे, खालील तारखेच्या <b>आधीचा<\/b>:<ul><li>अनुसूचित जाती: 10 ऑगस्ट 1950 · अनुसूचित जमाती: 6 सप्टेंबर 1950<\/li><li>वि.जा. / भ.ज.: 21 नोव्हेंबर 1961 · इ.मा.व. / वि.मा.प्र.: 13 ऑक्टोबर 1967<\/li><\/ul>उदा. वडिलांचा किंवा आजोबांचा <b>शाळा सोडल्याचा दाखला<\/b>, जन्म / मृत्यू नोंद उतारा, जुना जमीन अभिलेख.", "note": {"kind": "stuck", "label": "अडचण?", "html": "घरी जुना कागद नाही? नातेवाईकांकडे विचारा: काकांचा (वडिलांच्या भावाचा) शाळेचा दाखलाही चालतो. गावातील जुन्या शाळेचे रजिस्टर आणि ग्रामपंचायतीचे जन्म रजिस्टर तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "इतर कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार आणि पत्त्याचा पुरावा<\/li><li>जात नमूद असलेला तुमचा शाळा सोडल्याचा दाखला<\/li><li>जुन्या कागदातील व्यक्तीशी तुमचे नाते दाखवणारी <b>वंशावळ<\/b><\/li><li>स्वयंघोषणापत्र / प्रतिज्ञापत्र, फोटो<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "आईकडील कागदपत्रे सहसा ग्राह्य धरली जात नाहीत. जात वडिलांकडून ठरते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → महसूल विभाग → जातीचा दाखला<\/li><li>जवळचे <b>आपले सरकार सेवा केंद्र<\/b>, किंवा शाळा / महाविद्यालयातील विशेष शिबिर<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> आणि दाखवलेली <b>कालमर्यादा (दिवस)<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "फक्त ठरलेली फी भरा आणि पावती घ्या. जुने कागद \"जुळवून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील / उपविभागीय कार्यालय तुमचा जुना पुरावा आणि वंशावळ तपासते. स्थानिक चौकशी होऊ शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? बहुतेक वेळा जुना पुरावा किंवा वंशावळ स्पष्ट नसते. स्पष्ट प्रत किंवा अधिक कागदपत्र अपलोड करून पुन्हा सादर करा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "उपविभागीय अधिकाऱ्यांची मंजुरी", "body": "<b>उपविभागीय अधिकारी (SDO)<\/b> किंवा तुमच्या तालुक्यातील सक्षम अधिकारी मंजुरी देऊन <b>डिजिटल सही<\/b> करतात.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दाखला डाउनलोड करा", "body": "आपले सरकार वर लॉगिन करून दाखला डाउनलोड करा. त्यावर <b>डिजिटल सही<\/b> असते आणि त्याची <b>मुदत संपत नाही<\/b>. तो जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमचा दाखला पुढे तुमच्या <b>भाऊ, बहिणी आणि मुलांना<\/b> जात सिद्ध करण्यासाठी उपयोगी पडतो."}}], "rights_t": "उशीर झाला? हा तुमचा हक्क आहे.", "rights": "कालमर्यादा संपली असेल तर <b>महाराष्ट्र लोकसेवा हक्क अधिनियम, 2015<\/b> नुसार अर्ज क्रमांक वापरून आपले सरकार वर <b>प्रथम अपील<\/b> करता येते.", "help": "<b>पुढे:<\/b> अभ्यासक्रम किंवा नोकरीसाठी लागत असल्यास <b>जात वैधता प्रमाणपत्रासाठी<\/b> लवकर अर्ज करा, त्याला वेळ लागतो<br/><b>स्थिती तपासा:<\/b> आपले सरकार → Track your application · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "ncl-certificate", "title": "Non-Creamy Layer certificate", "mr_name": "नॉन-क्रिमीलेयर प्रमाणपत्र", "audience": "OBC / VJ-NT / SBC", "cat": "docs", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([OBC / VJNT / SBC citizen needs NCL]) --> B{1. Eligible?<br/>family income below 8 lakh,<br/>parents not in high posts}\n    B -- No --> X([Creamy layer: not eligible])\n    B -- Yes --> CC{2. Has caste certificate?}\n    CC -- No --> CG[Get caste certificate first<br/>see caste certificate workflow]\n    CG --> CC\n    CC -- Yes --> C[3. Gather documents<br/>caste cert, 3 years parents income proof,<br/>occupation details, ID, self-declaration]\n    C --> D[4. Apply on Aaple Sarkar<br/>state or central format<br/>Application ID + RTS time limit]\n    D --> E[5. Scrutiny at Tahsil / SDO office]\n    E -- Income year missing / unclear --> F1[Sent back with remark]\n    F1 -- Upload + resubmit --> E\n    E --> H[6. SDO approves + digital signature]\n    H -- Rejected --> F2[Rejected with reason]\n    H --> I([7. Download certificate<br/>has validity date])\n    I --> R[Expiry: renew before<br/>admission / job forms]\n    E -. time limit crossed .-> T[First Appeal on Aaple Sarkar<br/>MH Right to Public Services Act 2015]\n\n    S1[[Sathi: Creamy-layer calculator<br/>which income counts]]:::sathi -.-> B\n    S2[[Sathi: Dependency check<br/>caste cert + income certs ready]]:::sathi -.-> CC\n    S3[[Sathi: State vs central format advisor]]:::sathi -.-> D\n    S4[[Sathi: Rights clock + draft First Appeal]]:::sathi -.-> T\n    S5[[Sathi: Expiry alert before deadlines]]:::sathi -.-> R\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "mahadocguide: NCL Maharashtra", "url": "https://mahadocguide.in/non-creamy-layer-certificate-maharashtra/"}, {"label": "navimumbai.com: NCL", "url": "https://navimumbai.com/non-creamy-layer-certificate-maharashtra/"}, {"label": "LegalRaasta: NCL Maharashtra", "url": "https://www.legalraasta.com/blog/maharashtra-non-creamy-layer-certificate/"}, {"label": "IndiaFilings: NCL Maharashtra", "url": "https://www.indiafilings.com/learn/maharashtra-non-creamy-layer-certificate"}], "en": {"h1": "Non-Creamy Layer Certificate: How to get it on Aaple Sarkar", "benefit": "Needed by OBC, VJ / NT and SBC students and job seekers to use reservation", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You can apply if:<ul><li>You belong to <b>OBC, VJ / NT or SBC<\/b><\/li><li>Your <b>family income is below ₹8 lakh a year<\/b><\/li><li>Your parents do not hold high posts (e.g. Class-I officers)<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Check which income counts. Rules may exclude salary or farm income. Ask before you assume you are not eligible."}}, {"phase": null, "kind": "you", "who": "You", "title": "Get your caste certificate first", "body": "The NCL certificate is issued <b>only if you already have a caste certificate<\/b>. If you don't have one, get it first.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No caste certificate yet? See the <b>Caste Certificate guide<\/b>. Finding old proof takes time, so start early."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Your <b>caste certificate<\/b><\/li><li>Parents' <b>income proof for the last 3 years<\/b>: income certificate / ITR / Form 16<\/li><li>Parents' job or occupation details<\/li><li>Aadhaar, ration card / address proof<\/li><li>Self-declaration, photo<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Non-Creamy Layer Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b>, or a camp at your college<\/li><\/ul>Note your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "For <b>central<\/b> government jobs or admissions you need the <b>central-format<\/b> NCL. Tell the office which one you need."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil / SDO office checks your caste certificate and 3 years of family income.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Usually one year's income proof is missing or unclear. Upload it and resubmit. <b>No visit needed.<\/b>"}}, {"phase": null, "kind": "gov", "who": "Government", "title": "SDO approves", "body": "The <b>Sub-Divisional Officer (SDO)<\/b>, or the competent officer in your taluka, approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and download it. Check the <b>validity date<\/b> printed on it.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Unlike the caste certificate, NCL <b>expires<\/b>. Note the date and renew <b>before<\/b> admission or job forms."}}], "rights_t": "Late? It's your right.", "rights": "If the time limit has passed, you can file a <b>First Appeal<\/b> on Aaple Sarkar with your Application ID, under the <b>Maharashtra Right to Public Services Act, 2015<\/b>.", "help": "<b>Renew before it expires<\/b> · State and central formats are different<br/><b>Check status:<\/b> Aaple Sarkar → Track your application · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "नॉन-क्रिमीलेयर प्रमाणपत्र: आपले सरकार वरून कसे मिळवायचे", "benefit": "इ.मा.व., वि.जा. / भ.ज. आणि वि.मा.प्र. विद्यार्थी व उमेदवारांना आरक्षणासाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "तुम्ही अर्ज करू शकता जर:<ul><li>तुम्ही <b>इ.मा.व., वि.जा. / भ.ज. किंवा वि.मा.प्र.<\/b> प्रवर्गातील असाल<\/li><li>तुमचे <b>कौटुंबिक उत्पन्न वर्षाला ₹8 लाखांपेक्षा कमी<\/b> असेल<\/li><li>तुमचे पालक उच्च पदावर नसतील (उदा. वर्ग-1 अधिकारी)<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "कोणते उत्पन्न मोजले जाते ते तपासा. नियमांनुसार पगार किंवा शेती उत्पन्न वगळले जाऊ शकते. आपण अपात्र आहोत असे स्वतःच ठरवू नका."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "आधी जातीचा दाखला मिळवा", "body": "<b>जातीचा दाखला असेल तरच<\/b> नॉन-क्रिमीलेयर प्रमाणपत्र मिळते. तो नसेल तर आधी तो काढा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अजून जातीचा दाखला नाही? <b>जातीचा दाखला मार्गदर्शक<\/b> पाहा. जुना पुरावा शोधायला वेळ लागतो, म्हणून लवकर सुरुवात करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमचा <b>जातीचा दाखला<\/b><\/li><li>पालकांचा <b>मागील 3 वर्षांचा उत्पन्नाचा पुरावा<\/b>: उत्पन्नाचा दाखला / ITR / फॉर्म 16<\/li><li>पालकांच्या नोकरी किंवा व्यवसायाची माहिती<\/li><li>आधार, रेशन कार्ड / पत्त्याचा पुरावा<\/li><li>स्वयंघोषणापत्र, फोटो<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → महसूल विभाग → नॉन-क्रिमीलेयर प्रमाणपत्र<\/li><li>जवळचे <b>आपले सरकार सेवा केंद्र<\/b>, किंवा महाविद्यालयातील शिबिर<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> आणि दाखवलेली <b>कालमर्यादा (दिवस)<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>केंद्र<\/b> सरकारी नोकरी किंवा प्रवेशासाठी <b>केंद्राच्या नमुन्यातील<\/b> प्रमाणपत्र लागते. तुम्हाला कोणते हवे ते कार्यालयाला सांगा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील / उपविभागीय कार्यालय तुमचा जातीचा दाखला आणि 3 वर्षांचे कौटुंबिक उत्पन्न तपासते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? बहुतेक वेळा एखाद्या वर्षाचा उत्पन्नाचा पुरावा नसतो किंवा अस्पष्ट असतो. तो अपलोड करून पुन्हा सादर करा. <b>कार्यालयात जाण्याची गरज नाही.<\/b>"}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "उपविभागीय अधिकाऱ्यांची मंजुरी", "body": "<b>उपविभागीय अधिकारी (SDO)<\/b> किंवा तुमच्या तालुक्यातील सक्षम अधिकारी मंजुरी देऊन <b>डिजिटल सही<\/b> करतात.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "प्रमाणपत्र डाउनलोड करा", "body": "आपले सरकार वर लॉगिन करून डाउनलोड करा. त्यावर छापलेली <b>वैधता तारीख<\/b> तपासा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "जातीच्या दाखल्याप्रमाणे नाही, नॉन-क्रिमीलेयरची <b>मुदत संपते<\/b>. तारीख लिहून ठेवा आणि प्रवेश किंवा नोकरीच्या अर्जा<b>पूर्वी<\/b> नूतनीकरण करा."}}], "rights_t": "उशीर झाला? हा तुमचा हक्क आहे.", "rights": "कालमर्यादा संपली असेल तर <b>महाराष्ट्र लोकसेवा हक्क अधिनियम, 2015<\/b> नुसार अर्ज क्रमांक वापरून आपले सरकार वर <b>प्रथम अपील<\/b> करता येते.", "help": "<b>मुदत संपण्यापूर्वी नूतनीकरण करा<\/b> · राज्य आणि केंद्राचे नमुने वेगळे आहेत<br/><b>स्थिती तपासा:<\/b> आपले सरकार → Track your application · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "caste-validity", "title": "Caste validity certificate", "mr_name": "जात वैधता प्रमाणपत्र", "audience": "Professional admissions, reserved jobs, elections", "cat": "docs", "links": [{"label": "CCVIS (BARTI): SC / OBC / VJNT / SBC validity", "url": "https://ccvis.barti.in/home_menu.php", "gov": true}, {"label": "e-Tribe Validity (TRTI): ST validity", "url": "https://etribevalidity.trti-maha.in/", "gov": true}, {"label": "BARTI: caste certificate verification", "url": "https://www.barti.in/department/cast-certificate-verification", "gov": true}], "mermaid": "flowchart TD\n    A([Needs caste validity<br/>admission / reserved job / election]) --> CC{1. Has caste certificate?}\n    CC -- No --> CG[Get caste certificate first<br/>see caste certificate workflow,<br/>then continue]\n    CG -.-> C\n    CC -- Yes --> C[2. Gather documents<br/>caste cert, LC, pre-cut-off proof,<br/>family tree, prescribed affidavit, college form]\n    C --> BR{Blood relative already has validity?}\n    BR -- Yes --> BRY[Attach relative's validity<br/>strongest proof, fast track]\n    BR -- No --> D\n    BRY --> D[3. Apply online: cvc.barti.in for SC, VJNT, OBC, SBC, SEBC<br/>or eTribe Validity for ST, then submit to<br/>District Caste Certificate Scrutiny Committee]\n    D --> K[Acknowledgement / token<br/>used for provisional admission]\n    K --> E[4. Committee scrutiny]\n    E -- Proof weak --> V[Vigilance cell inquiry<br/>local / village visit]\n    E -- Needs clarification --> HN[Hearing notice<br/>attend with originals]\n    V --> DEC\n    HN --> DEC\n    E -- Proof clear --> DEC{5. Committee decision}\n    DEC -- Valid --> I([6. Caste validity certificate<br/>lifetime, proof for family])\n    DEC -- Invalid --> F1[Claim invalidated]\n    F1 --> HC[Challenge in High Court]\n    E -. pending long .-> T[Written reminder to Member Secretary<br/>with token no. + deadline]\n\n    S1[[Sathi: Start-early alert<br/>11th / 12th students]]:::sathi -.-> A\n    S2[[Sathi: Family validity finder<br/>does any blood relative have one?]]:::sathi -.-> BR\n    S3[[Sathi: Hearing reminder<br/>originals checklist]]:::sathi -.-> HN\n    S4[[Sathi: Pending clock + draft reminder]]:::sathi -.-> T\n    S5[[Sathi: Family vault<br/>reuse validity for siblings, children]]:::sathi -.-> I\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1 blocked", "sources": [{"label": "CCVIS (BARTI) home with new-portal notice", "url": "https://ccvis.barti.in/home_menu.php"}, {"label": "CVC BARTI: About", "url": "https://cvc.barti.in/home/pages/about"}, {"label": "e-Tribe Validity Portal (TRTI)", "url": "https://etribevalidity.trti-maha.in/"}, {"label": "BARTI: Caste Certificate Verification", "url": "https://www.barti.in/department/cast-certificate-verification"}], "en": {"h1": "Caste Validity Certificate: How to get it", "benefit": "Needed for reserved seats in professional courses, reserved government jobs and elections", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Know when you need it", "body": "<ul><li><b>Admission<\/b> on a reserved seat in engineering, medical, pharmacy and other professional courses<\/li><li><b>Government job<\/b> on a reserved post<\/li><li><b>Election<\/b> from a reserved seat<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Students: apply in <b>11th or 12th<\/b>, not after the CET result. It can take months."}}, {"phase": null, "kind": "you", "who": "You", "title": "Have your caste certificate first", "body": "The committee checks whether your <b>caste certificate<\/b> is genuine. You must already have it.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No caste certificate yet? See the <b>Caste Certificate guide<\/b> first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Your caste certificate and school leaving certificate<\/li><li>The <b>old proof of caste<\/b> before the cut-off date (same as for the caste certificate)<\/li><li><b>Family tree (वंशावळ)<\/b> and affidavit in the prescribed format<\/li><li>College bonafide / form (for students)<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Does your <b>father, brother, sister or uncle (father's side)<\/b> already have a caste validity? Attach it. It is the <b>strongest proof<\/b> and makes the process much faster."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply and submit", "body": "Apply online: <b>SC, VJ/NT, OBC, SBC, SEBC<\/b> on BARTI's <b>cvc.barti.in<\/b> (new portal, replaces CCVIS); <b>ST<\/b> on the <b>eTribe Validity<\/b> portal. Print and submit it with your documents to the <b>District Caste Certificate Scrutiny Committee<\/b> (students often submit through their college).<br/>Keep the <b>acknowledgement / token number<\/b> safe.", "note": {"kind": "tip", "label": "Tip:", "html": "For admissions, colleges usually accept the <b>acknowledgement of your validity application<\/b> for provisional admission. Ask your college."}}, {"phase": "After you apply", "kind": "gov", "who": "Scrutiny Committee", "title": "Committee checks your case", "body": "The committee examines your documents. If the old proof is weak, it may send a <b>vigilance team (दक्षता पथक)<\/b> to inquire locally, or call you for a <b>hearing<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Got a <b>hearing notice<\/b>? Attend on the date with all <b>original documents<\/b>. Missing a hearing delays your case."}}, {"phase": null, "kind": "gov", "who": "Scrutiny Committee", "title": "Committee decides", "body": "If satisfied, the committee issues the <b>caste validity certificate<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Caste claim <b>invalidated<\/b>? This decision can be challenged in the <b>High Court<\/b>. Get legal advice quickly."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Collect your validity certificate", "body": "Download or collect it. It is valid <b>for life<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Your validity becomes the <b>strongest proof<\/b> for your brothers, sisters and children when they apply."}}], "rights_t": "Pending too long? Escalate.", "rights": "Give a <b>written reminder to the Member Secretary<\/b> of the District Caste Certificate Scrutiny Committee with your token number and take an <b>acknowledgement (पोच)<\/b>. The committee should normally decide within <b>about 3 months<\/b>. If an admission or job deadline is near, mention it in writing.", "help": "<b>Start early<\/b>, this is the slowest certificate in the chain: caste certificate → caste validity → admission / job<br/><b>Use only official government websites<\/b> · Never pay anyone to \"manage\" the committee"}, "mr": {"h1": "जात वैधता प्रमाणपत्र: कसे मिळवायचे", "benefit": "व्यावसायिक अभ्यासक्रमातील राखीव जागा, राखीव सरकारी नोकरी आणि निवडणुकीसाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कधी लागते ते ओळखा", "body": "<ul><li>अभियांत्रिकी, वैद्यकीय, औषधनिर्माणशास्त्र व इतर व्यावसायिक अभ्यासक्रमात राखीव जागेवर <b>प्रवेश<\/b><\/li><li>राखीव पदावर <b>सरकारी नोकरी<\/b><\/li><li>राखीव जागेवरून <b>निवडणूक<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "विद्यार्थ्यांनो: <b>11 वी किंवा 12 वीत<\/b> असतानाच अर्ज करा, CET निकालानंतर नाही. याला काही महिने लागू शकतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "आधी जातीचा दाखला हवा", "body": "तुमचा <b>जातीचा दाखला<\/b> खरा आहे का हे समिती तपासते. तो आधी तुमच्याकडे असला पाहिजे.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अजून जातीचा दाखला नाही? आधी <b>जातीचा दाखला मार्गदर्शक<\/b> पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमचा जातीचा दाखला आणि शाळा सोडल्याचा दाखला<\/li><li>मानीव दिनांकापूर्वीचा <b>जुना जातीचा पुरावा<\/b> (जातीच्या दाखल्यासाठी वापरलेलाच)<\/li><li><b>वंशावळ<\/b> आणि विहित नमुन्यातील प्रतिज्ञापत्र<\/li><li>महाविद्यालयाचे बोनाफाईड / अर्ज (विद्यार्थ्यांसाठी)<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमच्या <b>वडिलांकडे, भावाकडे, बहिणीकडे किंवा काकांकडे<\/b> आधीच जात वैधता प्रमाणपत्र आहे का? ते जोडा. हा <b>सर्वात भक्कम पुरावा<\/b> आहे आणि प्रक्रिया खूप लवकर होते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा आणि सादर करा", "body": "ऑनलाइन अर्ज करा: <b>अनुसूचित जाती, वि.जा./भ.ज., इ.मा.व., वि.मा.प्र., SEBC<\/b> साठी BARTI चे <b>cvc.barti.in<\/b> (नवीन पोर्टल, CCVIS ऐवजी); <b>अनुसूचित जमाती<\/b> साठी <b>ई-ट्राइब व्हॅलिडिटी<\/b> पोर्टल. त्याची प्रिंट काढा आणि कागदपत्रांसह <b>जिल्हा जात प्रमाणपत्र पडताळणी समितीकडे<\/b> सादर करा (विद्यार्थी बहुतेक वेळा महाविद्यालयामार्फत सादर करतात).<br/><b>पोच पावती / टोकन क्रमांक<\/b> जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "प्रवेशासाठी महाविद्यालये सहसा <b>वैधता अर्जाची पोच पावती<\/b> पाहून तात्पुरता प्रवेश देतात. तुमच्या महाविद्यालयात विचारा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "पडताळणी समिती", "title": "समितीकडून तपासणी", "body": "समिती तुमची कागदपत्रे तपासते. जुना पुरावा कमकुवत असेल तर स्थानिक चौकशीसाठी <b>दक्षता पथक<\/b> पाठवू शकते, किंवा <b>सुनावणीसाठी<\/b> बोलावू शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>सुनावणीची नोटीस<\/b> आली? ठरलेल्या तारखेला सर्व <b>मूळ कागदपत्रांसह<\/b> हजर राहा. सुनावणी चुकल्यास प्रकरण लांबते."}}, {"phase": null, "kind": "gov", "who": "पडताळणी समिती", "title": "समितीचा निर्णय", "body": "समितीचे समाधान झाल्यास ती <b>जात वैधता प्रमाणपत्र<\/b> देते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "जातीचा दावा <b>अवैध<\/b> ठरला? या निर्णयाला <b>उच्च न्यायालयात<\/b> आव्हान देता येते. लवकर कायदेशीर सल्ला घ्या."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "वैधता प्रमाणपत्र मिळवा", "body": "ते डाउनलोड करा किंवा घ्या. ते <b>आयुष्यभर<\/b> वैध असते.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमचे वैधता प्रमाणपत्र पुढे तुमच्या भाऊ, बहिणी आणि मुलांना अर्ज करताना <b>सर्वात भक्कम पुरावा<\/b> ठरते."}}], "rights_t": "खूप दिवस प्रलंबित? पाठपुरावा करा.", "rights": "टोकन क्रमांकासह जिल्हा जात प्रमाणपत्र पडताळणी समितीच्या <b>सदस्य सचिवांना लेखी स्मरणपत्र<\/b> द्या आणि <b>पोच<\/b> घ्या. समितीने साधारण <b>3 महिन्यांत<\/b> निर्णय घ्यायला हवा. प्रवेश किंवा नोकरीची अंतिम तारीख जवळ असेल तर ते लेखी नमूद करा.", "help": "<b>लवकर सुरुवात करा<\/b>, साखळीतील हे सर्वात वेळखाऊ प्रमाणपत्र आहे: जातीचा दाखला → जात वैधता → प्रवेश / नोकरी<br/><b>फक्त अधिकृत सरकारी वेबसाइट वापरा<\/b> · समिती \"मॅनेज\" करण्यासाठी कोणालाही पैसे देऊ नका"}}, {"slug": "ferfar", "title": "7/12 Ferfar (mutation)", "mr_name": "७/१२ फेरफार", "audience": "Land buyers, heirs", "cat": "docs", "links": [{"label": "Mahabhumi: land records home", "url": "https://mahabhumi.gov.in", "gov": false}, {"label": "Mahabhulekh: view 7/12 and 8A", "url": "https://bhulekh.mahabhumi.gov.in", "gov": false}, {"label": "Digital 7/12 and Aapli Chawadi notices", "url": "https://digitalsatbara.mahabhumi.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Land changes hands]) --> B{1. Ferfar type?}\n    B -- Sale --> R[Sale deed registered<br/>at Sub-Registrar - IGR]\n    R -- Auto data transfer --> E\n    B -- Inheritance / gift / partition --> C[2. Apply with documents<br/>e-Hakk online or Talathi office<br/>death cert, all heirs, 7/12, 8A, declaration]\n    C --> E[3. Talathi creates ferfar entry<br/>ferfar number assigned]\n    E -- Entry not created --> F1[Blocked: no entry]\n    E --> N[4. Notice to all interested parties<br/>seller, heirs, bank]\n    N --> W{15-day objection window}\n    W -- Objection --> D[Dispute case<br/>Circle Officer hearing]\n    D -- Decision --> P{Approved?}\n    W -- No objection --> P\n    P -- No --> F2[Rejected with reason]\n    F2 --> AP[Appeal to SDO / reapply]\n    P -- Yes --> H[5. Circle Officer certifies ferfar]\n    H --> I([6. 7/12 updated with new name<br/>Digital signed 7/12 download])\n    W -. window over, still pending .-> T[Written application to Tahsildar<br/>with ferfar no., take acknowledgement]\n\n    S1[[Sathi: Ferfar Predictor<br/>auto-entry check after registration]]:::sathi -.-> R\n    S2[[Sathi: Heir checklist<br/>no missing heir]]:::sathi -.-> C\n    S3[[Sathi: 15-day countdown<br/>+ draft application to Tahsildar]]:::sathi -.-> T\n    S4[[Sathi: 7/12 Health Report<br/>verify name, loan, stay]]:::sathi -.-> I\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,D blocked", "sources": [{"label": "bhume.in: Ferfar status", "url": "https://www.bhume.in/maharashtra/ferfar"}, {"label": "bhume.in: Aapli Chawadi", "url": "https://www.bhume.in/maharashtra/e-chawadi"}, {"label": "1acre: Mutation Ferfar Maharashtra", "url": "https://1acre.in/guides/maharashtra/mutation-ferfar-maharashtra"}, {"label": "Landeed: Ferfar Maharashtra", "url": "https://web.landeed.com/maharashtra/ferfar"}, {"label": "RTI wiki: 7/12 and ferfar correction", "url": "https://righttoinformation.wiki/practical-guides/maharashtra-712-extract-ferfar-mutation-correction-talathi"}], "en": {"h1": "7/12 Ferfar: How to get your name on the land record", "benefit": "Needed after you buy, inherit or get land as a gift", "steps": [{"phase": "Start", "kind": "you", "who": "You", "title": "Know your ferfar type", "body": "<ul><li><b>Bought land<\/b> with a registered sale deed → ferfar starts <b>automatically<\/b>. Go to step 3.<\/li><li><b>Inherited<\/b> (वारस), <b>gift<\/b> or <b>family partition<\/b> → <b>you must apply<\/b>. Go to step 2.<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Buying land? The ferfar is linked to your registration. You do not need to pay anyone to \"start\" it."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply with papers (inheritance / gift)", "body": "<ul><li>Death certificate (for inheritance)<\/li><li>List of <b>all<\/b> legal heirs with their Aadhaar<\/li><li>Current 7/12 and 8A extract<\/li><li>Self-declaration / affidavit about the heirs<\/li><\/ul>Apply at the <b>Talathi office<\/b>, or online where the state's e-Hakk service is available.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Every heir's name must be included. A missing heir can object later and stop the ferfar."}}, {"phase": "Government process", "kind": "gov", "who": "Government", "title": "Ferfar entry is created", "body": "The Talathi creates a <b>ferfar entry with a number<\/b>. For a sale, the details come automatically from the Sub-Registrar's office.<br/>Note down your <b>ferfar number<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No entry after a few weeks? Visit the Talathi with your registered document number."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Notice to everyone concerned", "body": "A notice goes to the seller / all heirs / bank. They get <b>15 days<\/b> to raise an objection (हरकत).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Someone objected? It becomes a dispute case. The Circle Officer hears both sides. Keep your papers ready. You can appeal the decision to the SDO."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Circle Officer approves", "body": "After the notice period, if there is no objection, the <b>Circle Officer (मंडळ अधिकारी)<\/b> certifies the ferfar.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Read the reason, fix the papers and apply again, or appeal."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Your name is on the 7/12", "body": "The 7/12 now shows your name with the ferfar number. Download the <b>digitally signed 7/12<\/b> from <b>digitalsatbara.mahabhumi.gov.in<\/b>. It is valid <b>without a Talathi stamp<\/b>.", "note": null}], "rights_t": "Notice period over? No reason to wait.", "rights": "If 15 days have passed with no objection and the ferfar is still not certified, give a <b>written application to the Tahsildar<\/b> with your ferfar number and take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Check notice and status:<\/b> <b>Aapli Chawadi<\/b> / pending ferfar on bhulekh.mahabhumi.gov.in (ferfar number, objection last date)<br/><b>Never pay to \"speed up\"<\/b>, the 15-day notice is the law · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "७/१२ फेरफार: जमिनीच्या उताऱ्यावर तुमचे नाव कसे लावायचे", "benefit": "जमीन खरेदी, वारसा किंवा बक्षीसपत्रानंतर आवश्यक", "steps": [{"phase": "सुरुवात", "kind": "you", "who": "तुम्ही", "title": "फेरफाराचा प्रकार ओळखा", "body": "<ul><li>नोंदणीकृत खरेदीखताने <b>जमीन खरेदी केली<\/b> → फेरफार <b>आपोआप<\/b> सुरू होतो. पायरी 3 वर जा.<\/li><li><b>वारसा<\/b>, <b>बक्षीसपत्र<\/b> किंवा <b>कौटुंबिक वाटणी<\/b> → <b>तुम्हाला अर्ज करावा लागेल<\/b>. पायरी 2 वर जा.<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "जमीन खरेदी करताय? फेरफार तुमच्या दस्त नोंदणीशी जोडलेला असतो. तो \"सुरू करण्यासाठी\" कोणालाही पैसे देऊ नका."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रांसह अर्ज करा (वारसा / बक्षीस)", "body": "<ul><li>मृत्यू दाखला (वारसासाठी)<\/li><li><b>सर्व<\/b> वारसांची यादी आणि त्यांचे आधार<\/li><li>सध्याचा 7/12 व 8-अ उतारा<\/li><li>वारसांबाबत स्वयंघोषणापत्र / प्रतिज्ञापत्र<\/li><\/ul><b>तलाठी कार्यालयात<\/b> अर्ज करा, किंवा राज्याची ई-हक्क सेवा उपलब्ध असल्यास ऑनलाइन.", "note": {"kind": "stuck", "label": "अडचण?", "html": "प्रत्येक वारसाचे नाव असलेच पाहिजे. एखादा वारस सुटला तर तो नंतर हरकत घेऊन फेरफार थांबवू शकतो."}}, {"phase": "सरकारी प्रक्रिया", "kind": "gov", "who": "सरकार", "title": "फेरफार नोंद तयार होते", "body": "तलाठी <b>क्रमांकासह फेरफार नोंद<\/b> तयार करतात. खरेदीच्या बाबतीत माहिती दुय्यम निबंधक कार्यालयातून आपोआप येते.<br/>तुमचा <b>फेरफार क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "काही आठवड्यांनंतरही नोंद नाही? नोंदणीकृत दस्त क्रमांक घेऊन तलाठ्यांना भेटा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "संबंधितांना नोटीस", "body": "विक्रेता / सर्व वारस / बँक यांना नोटीस जाते. त्यांना हरकत घेण्यासाठी <b>15 दिवस<\/b> मिळतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "कोणी हरकत घेतली? हे वादाचे प्रकरण होते. मंडळ अधिकारी दोन्ही बाजू ऐकतात. कागदपत्रे तयार ठेवा. निर्णयाविरुद्ध उपविभागीय अधिकाऱ्यांकडे (SDO) अपील करता येते."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "मंडळ अधिकाऱ्यांची मंजुरी", "body": "नोटीस कालावधी संपल्यावर हरकत नसेल तर <b>मंडळ अधिकारी<\/b> फेरफार प्रमाणित करतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "नामंजूर झाला? कारण वाचा, कागदपत्रे दुरुस्त करून पुन्हा अर्ज करा किंवा अपील करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "७/१२ वर तुमचे नाव", "body": "आता 7/12 वर फेरफार क्रमांकासह तुमचे नाव दिसेल. <b>digitalsatbara.mahabhumi.gov.in<\/b> वरून <b>डिजिटल सही असलेला 7/12<\/b> डाउनलोड करा. तो <b>तलाठ्यांच्या शिक्क्याशिवाय वैध<\/b> आहे.", "note": null}], "rights_t": "नोटीस कालावधी संपला? आता वाट पाहण्याचे कारण नाही.", "rights": "15 दिवस होऊन कोणतीही हरकत नसताना फेरफार प्रमाणित झाला नसेल, तर फेरफार क्रमांकासह <b>तहसीलदारांना लेखी अर्ज<\/b> द्या आणि <b>पोच<\/b> घ्या.", "help": "<b>नोटीस व स्थिती तपासा:<\/b> bhulekh.mahabhumi.gov.in वर <b>आपली चावडी<\/b> / प्रलंबित फेरफार (फेरफार क्रमांक, हरकतीची शेवटची तारीख)<br/><b>\"लवकर करण्यासाठी\" पैसे देऊ नका<\/b>, 15 दिवसांची नोटीस हा कायदा आहे · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "mahadbt-scholarship", "title": "MahaDBT scholarship", "mr_name": "महाडीबीटी शिष्यवृत्ती", "audience": "College students", "cat": "edu", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}], "mermaid": "flowchart TD\n    A([Student needs scholarship]) --> B[1. Find eligible scheme<br/>category, income, course]\n    B --> C[2. Gather documents<br/>Aadhaar-bank seeding, current income cert,<br/>caste + validity, domicile, marksheet, fee receipt]\n    C --> R[3. Register on MahaDBT<br/>complete full profile]\n    R --> D[4. Apply before deadline<br/>Application ID]\n    D --> E[5. College scrutiny<br/>scholarship desk]\n    E -- Document issue --> F1[Sent back to applicant<br/>with remark]\n    F1 -- Fix + resubmit --> E\n    E -- Not acted --> F2[Pending at college]\n    E -- Forwarded --> G[6. Department scrutiny + sanction<br/>Social Justice / OBC / Tribal / Higher Ed]\n    G -- Rejected --> F3[Rejected with reason]\n    G -- Sanctioned --> P[7. DBT payment via PFMS<br/>student a/c + fee to college where applicable]\n    P -- Aadhaar not seeded / a/c inactive --> F4[Payment failed]\n    P --> I([Money received])\n    I --> N[Next academic year:<br/>renewal with pass result + new income cert]\n    F2 --> T[Grievance on MahaDBT /<br/>district department office]\n\n    S1[[Sathi: Scheme matcher<br/>best single scheme]]:::sathi -.-> B\n    S2[[Sathi: Readiness check<br/>income cert expiry, bank seeding]]:::sathi -.-> C\n    S3[[Sathi: Decode sent-back remark in Marathi]]:::sathi -.-> F1\n    S4[[Sathi: Deadline + pending-at-college clock<br/>draft grievance]]:::sathi -.-> T\n    S5[[Sathi: Renewal reminder]]:::sathi -.-> N\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3,F4 blocked", "sources": [{"label": "Tirpude College: Notice of Scholarship 2025", "url": "https://www.tirpude.edu.in/wp-content/uploads/2025/10/Notice-of-Scholarship-2025.pdf"}, {"label": "IndiaScholarships: MahaDBT post-matric", "url": "https://www.indiascholarships.in/bn/scholarships/mahadbt-post-matric-scholarship-maharashtra"}, {"label": "DJSCE: MahaDBT form filling", "url": "https://www.djsce.ac.in/docs/Process-of-MahaDBT-Scholarship-Form-Filling-1.pptx.pdf"}], "en": {"h1": "MahaDBT Scholarship: How to get it step by step", "benefit": "Fee and maintenance support for college students, paid into your bank account", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check which scheme fits you", "body": "Schemes depend on your <b>category<\/b>, <b>family income<\/b> and <b>course<\/b>. After you fill your profile, MahaDBT shows the schemes you are eligible for.", "note": {"kind": "tip", "label": "Tip:", "html": "You can get only <b>one scholarship<\/b> for the same course. Pick the one that gives you the most."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, linked to your <b>bank account<\/b><\/li><li><b>Income certificate of the current year<\/b><\/li><li>Caste certificate (and caste validity, if your course needs it)<\/li><li>Domicile certificate<\/li><li>Last exam marksheet, admission / fee receipt<\/li><li>Gap certificate, if you had a gap year<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Income certificate from last year? Get a new one first. Not sure your bank is Aadhaar-linked? Ask the bank for <b>\"Aadhaar seeding / NPCI mapping\"<\/b>."}}, {"phase": null, "kind": "you", "who": "You", "title": "Register and fill your profile", "body": "Go to <b>mahadbt.maharashtra.gov.in<\/b> → New Applicant Registration. Fill every section of the profile (personal, income, caste, course, past education, hostel) until it is <b>100% complete<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Note down your <b>username and password<\/b>. You need them every year for renewal."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply before the deadline", "body": "Choose your scheme, upload documents and submit. Note your <b>Application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Don't wait for the last week. The portal gets slow and deadlines are strict."}}, {"phase": "After you apply", "kind": "gov", "who": "College / Government", "title": "College checks your application", "body": "Your college's <b>scholarship desk<\/b> checks your documents and forwards the application.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Read the remark, fix it and resubmit. <b>Pending at college<\/b> for long? Visit the scholarship desk with your Application ID."}}, {"phase": null, "kind": "gov", "who": "College / Government", "title": "Department approves", "body": "The welfare department for your scheme (e.g. Social Justice, OBC, Tribal, Higher Education) checks and <b>sanctions<\/b> the scholarship.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Money in your bank account", "body": "The amount is paid by <b>DBT<\/b> into your Aadhaar-linked bank account. For some schemes, the fee part goes directly to the college.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Your bank account may not be Aadhaar-seeded or may be inactive. Fix it at the bank."}}], "rights_t": "Pending too long? Escalate.", "rights": "If the college or department has not acted for a long time, raise a <b>grievance on the MahaDBT portal<\/b> with your Application ID, or contact the <b>district office<\/b> of your scheme's department.", "help": "<b>Renew every year<\/b> on MahaDBT: you need last year's pass result and a fresh income certificate<br/><b>Check status:<\/b> MahaDBT login → My Applied Schemes · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "महाडीबीटी शिष्यवृत्ती: पायरी-पायरीने कशी मिळवायची", "benefit": "महाविद्यालयीन विद्यार्थ्यांना फी व निर्वाह भत्ता, थेट बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कोणती योजना लागू ते तपासा", "body": "योजना तुमचा <b>प्रवर्ग<\/b>, <b>कौटुंबिक उत्पन्न<\/b> आणि <b>अभ्यासक्रम<\/b> यावर अवलंबून असतात. प्रोफाइल भरल्यानंतर महाडीबीटी तुम्ही पात्र असलेल्या योजना दाखवते.", "note": {"kind": "tip", "label": "सूचना:", "html": "एकाच अभ्यासक्रमासाठी <b>एकच शिष्यवृत्ती<\/b> मिळते. सर्वात जास्त फायदा देणारी योजना निवडा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार, तुमच्या <b>बँक खात्याशी लिंक<\/b> असलेले<\/li><li><b>चालू वर्षाचा उत्पन्नाचा दाखला<\/b><\/li><li>जातीचा दाखला (आणि अभ्यासक्रमासाठी लागत असल्यास जात वैधता प्रमाणपत्र)<\/li><li>अधिवास प्रमाणपत्र (डोमिसाईल)<\/li><li>मागील परीक्षेची गुणपत्रिका, प्रवेश / फी पावती<\/li><li>शिक्षणात खंड असल्यास गॅप प्रमाणपत्र<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "मागील वर्षाचा उत्पन्नाचा दाखला आहे? आधी नवीन दाखला काढा. बँक खाते आधारशी लिंक आहे की नाही माहीत नाही? बँकेत <b>\"आधार सीडिंग / NPCI मॅपिंग\"<\/b> बद्दल विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "नोंदणी करून प्रोफाइल भरा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> → New Applicant Registration. प्रोफाइलचे सर्व भाग (वैयक्तिक, उत्पन्न, जात, अभ्यासक्रम, मागील शिक्षण, वसतिगृह) <b>100% पूर्ण<\/b> होईपर्यंत भरा.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमचे <b>युजरनेम आणि पासवर्ड<\/b> लिहून ठेवा. दरवर्षी नूतनीकरणासाठी ते लागतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अंतिम तारखेपूर्वी अर्ज करा", "body": "योजना निवडा, कागदपत्रे अपलोड करा आणि अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> (Application ID) लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "शेवटच्या आठवड्याची वाट पाहू नका. पोर्टल मंद होते आणि अंतिम तारीख कडक असते."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महाविद्यालय / सरकार", "title": "महाविद्यालयाकडून तपासणी", "body": "तुमच्या महाविद्यालयाचा <b>शिष्यवृत्ती विभाग<\/b> कागदपत्रे तपासून अर्ज पुढे पाठवतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? शेरा वाचा, दुरुस्ती करून पुन्हा सादर करा. <b>महाविद्यालयाकडे प्रलंबित<\/b> खूप दिवस? अर्ज क्रमांक घेऊन शिष्यवृत्ती विभागात भेटा."}}, {"phase": null, "kind": "gov", "who": "महाविद्यालय / सरकार", "title": "विभागाची मंजुरी", "body": "तुमच्या योजनेचा विभाग (उदा. सामाजिक न्याय, इतर मागास बहुजन कल्याण, आदिवासी विकास, उच्च शिक्षण) तपासणी करून शिष्यवृत्ती <b>मंजूर<\/b> करतो.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "पैसे बँक खात्यात जमा", "body": "रक्कम <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते. काही योजनांमध्ये फीची रक्कम थेट महाविद्यालयाला जाते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर झाले पण पैसे आले नाहीत? बँक खाते आधार-सीडेड नसेल किंवा बंद असेल. बँकेत दुरुस्त करा."}}], "rights_t": "खूप दिवस प्रलंबित? तक्रार करा.", "rights": "महाविद्यालय किंवा विभागाने बराच काळ कार्यवाही केली नसेल, तर अर्ज क्रमांकासह <b>महाडीबीटी पोर्टलवर तक्रार<\/b> नोंदवा, किंवा तुमच्या योजनेच्या विभागाच्या <b>जिल्हा कार्यालयाशी<\/b> संपर्क साधा.", "help": "<b>दरवर्षी नूतनीकरण करा:<\/b> मागील वर्षाचा उत्तीर्ण निकाल आणि नवीन उत्पन्नाचा दाखला लागतो<br/><b>स्थिती तपासा:<\/b> महाडीबीटी लॉगिन → My Applied Schemes · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "mjprf", "title": "Mahatma Jyotiba Phule Research Fellowship (MahaJyoti)", "mr_name": "महात्मा ज्योतिबा फुले संशोधन अधिछात्रवृत्ती", "audience": "OBC / VJ-NT / SBC PhD scholars", "cat": "edu", "links": [{"label": "MahaJyoti: notices and applications", "url": "https://mahajyoti.org.in", "gov": true}, {"label": "MahaJyoti: PhD scheme guidelines (PDF)", "url": "https://mahajyoti.org.in/wp-content/uploads/2023/06/Guidelines-for-PhD-Scheme-2023-23.06.2023-Final-Approved-1.pdf", "gov": true}], "mermaid": "flowchart TD\n    A([OBC / VJNT / SBC student]) --> R{1. Which MahaJyoti scheme?}\n    R -- 10th passed, Science --> TAB([Tab + coaching scheme: separate flow])\n    R -- UG / PG --> CF([Course fee support: separate flow])\n    R -- Full-time PhD --> E{2. MJPRF eligible?<br/>non-creamy layer, MH domicile,<br/>PG + full-time PhD, age limit,<br/>no NET-JRF / other fellowship}\n    E -- No --> X([Not eligible])\n    E -- Yes --> D[3. Documents<br/>caste cert, valid NCL, domicile,<br/>PG marks, PhD admission, guide consent,<br/>proposal, seeded bank a/c]\n    D --> AP[4. Apply online when notice opens<br/>mahajyoti.org.in / PhD portal<br/>registration ID]\n    AP --> SC[5. Scrutiny]\n    SC -- Error / pending list --> F1[Submit missing document by deadline]\n    SC --> SL[Selection list + document verification]\n    SL --> J[6. Joining report via university<br/>+ undertaking, resignation if employed]\n    J --> P[7. Fellowship paid about every 6 months<br/>JRF then SRF, up to 5 years]\n    P -- Progress report / UC missing --> F2[Payment delayed]\n    F2 -.-> T[Write to MahaJyoti Nagpur +<br/>university research cell]\n\n    S1[[Sathi: MahaJyoti scheme router]]:::sathi -.-> R\n    S2[[Sathi: Certificate chain check<br/>caste, NCL validity, domicile]]:::sathi -.-> D\n    S3[[Sathi: Notice alert + deadline countdown]]:::sathi -.-> AP\n    S4[[Sathi: Watch selection / error lists]]:::sathi -.-> SC\n    S5[[Sathi: Six-monthly report reminder]]:::sathi -.-> P\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "MahaJyoti: PhD scheme guidelines 2023", "url": "https://mahajyoti.org.in/wp-content/uploads/2023/06/Guidelines-for-PhD-Scheme-2023-23.06.2023-Final-Approved-1.pdf"}, {"label": "MahaJyoti: MJPRF undertaking", "url": "https://mahajyoti.org.in/wp-content/uploads/2024/10/undertaking-2023-2.pdf"}, {"label": "MahaJyoti: PhD financial assistance scheme (Marathi)", "url": "https://mahajyoti.org.in/en/%E0%A4%AA%E0%A5%80%E0%A4%8F%E0%A4%9A%E0%A4%A1%E0%A5%80-%E0%A4%95%E0%A4%B0%E0%A4%BF%E0%A4%A4%E0%A4%BE-%E0%A4%85%E0%A4%B0%E0%A5%8D%E0%A4%A5%E0%A4%B8%E0%A4%B9%E0%A4%BE%E0%A4%AF%E0%A5%8D%E0%A4%AF-2/"}, {"label": "MahaJyoti: utilisation certificate format", "url": "https://mahajyoti.org.in/wp-content/uploads/2023/01/Annexure-IV-utilization-certificate.pdf"}, {"label": "TheInternship: MahaJyoti scholarship 2026", "url": "https://theinternship.in/maha-jyoti-scholarship/"}, {"label": "ScholarshipsX: MahaJyoti 2026", "url": "https://scholarshipsx.com/mahajyoti-scholarship-2026/"}], "en": {"h1": "Mahatma Jyotiba Phule Research Fellowship: PhD support from MahaJyoti", "benefit": "Monthly fellowship for up to 5 years for full-time PhD scholars from OBC, VJ / NT and SBC", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Pick the right MahaJyoti scheme", "body": "MahaJyoti (Nagpur) runs several schemes for <b>OBC, VJ / NT and SBC<\/b> students:<ul><li><b>10th passed, Science<\/b> → free <b>tablet + internet + CET / JEE / NEET coaching<\/b><\/li><li><b>UG / PG students<\/b> → online course fee support<\/li><li><b>Full-time PhD<\/b> → <b>MJPRF fellowship<\/b>. This guide.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check MJPRF eligibility", "body": "<ul><li><b>OBC, VJ / NT or SBC<\/b>, <b>non-creamy layer<\/b>, Maharashtra domicile<\/li><li><b>Post-graduate<\/b> degree, admitted to a <b>full-time PhD<\/b> (not distance mode)<\/li><li>Within the <b>age limit<\/b> in the notice (about 45 in recent rounds)<\/li><li><b>Not<\/b> already holding UGC / CSIR NET-JRF or another fellowship<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Caste certificate<\/b> and <b>valid Non-Creamy Layer<\/b> certificate<\/li><li><b>Domicile<\/b> certificate<\/li><li>PG marksheets and degree<\/li><li><b>PhD registration / admission letter<\/b>, guide's consent, research proposal<\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b>, undertaking in the given format<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "NCL expired or no caste validity? Fix these first. See the <b>NCL<\/b> and <b>caste validity<\/b> guides."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply when the notice opens", "body": "Watch <b>mahajyoti.org.in<\/b> for the fellowship notice. Apply online on MahaJyoti's <b>PhD portal<\/b> within the dates. Note your <b>registration ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Deadlines are <b>strict<\/b> and rounds are once a year. Keep documents ready before the notice comes."}}, {"phase": "After you apply", "kind": "gov", "who": "MahaJyoti / University", "title": "Scrutiny and selection list", "body": "MahaJyoti checks applications and publishes <b>lists<\/b> (eligible / selected / errors) on its website. Document verification may follow.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Name in the <b>error / pending list<\/b>? Read the remark and submit the missing document within the given time."}}, {"phase": null, "kind": "you", "who": "You", "title": "Join and submit undertaking", "body": "Submit the <b>joining report<\/b> through your university / research centre and the signed <b>undertaking<\/b>. If you are employed, you may need to give a <b>resignation / relieving letter<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Fellowship paid, keep reporting", "body": "The fellowship (JRF level first, then SRF) is paid into your Aadhaar-linked bank account, usually <b>every six months<\/b>, based on your <b>progress report<\/b> and <b>utilisation certificate<\/b>, for up to <b>5 years<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Payment delayed? Usually a <b>progress report or utilisation certificate<\/b> was not sent through the university on time."}}], "rights_t": "Payment or selection stuck? Follow up.", "rights": "Write to <b>MahaJyoti, Nagpur<\/b> with your registration ID and copies of submitted reports, and take an acknowledgement. Ask your <b>university research cell<\/b> to forward pending reports.", "help": "<b>Notices and lists:<\/b> mahajyoti.org.in · Amounts and age limits change by notice; read the current one<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "mr": {"h1": "महात्मा ज्योतिबा फुले संशोधन अधिछात्रवृत्ती: महाज्योतीकडून पीएचडीसाठी मदत", "benefit": "इ.मा.व., वि.जा. / भ.ज. आणि वि.मा.प्र. पूर्णवेळ पीएचडी संशोधकांना 5 वर्षांपर्यंत मासिक अधिछात्रवृत्ती", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "योग्य महाज्योती योजना निवडा", "body": "महाज्योती (नागपूर) <b>इ.मा.व., वि.जा. / भ.ज. आणि वि.मा.प्र.<\/b> विद्यार्थ्यांसाठी अनेक योजना चालवते:<ul><li><b>10 वी उत्तीर्ण, विज्ञान<\/b> → मोफत <b>टॅब + इंटरनेट + CET / JEE / NEET प्रशिक्षण<\/b><\/li><li><b>पदवी / पदव्युत्तर विद्यार्थी<\/b> → ऑनलाइन अभ्यासक्रम शुल्क मदत<\/li><li><b>पूर्णवेळ पीएचडी<\/b> → <b>MJPRF अधिछात्रवृत्ती<\/b>. हे मार्गदर्शक त्यासाठी आहे.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "MJPRF पात्रता तपासा", "body": "<ul><li><b>इ.मा.व., वि.जा. / भ.ज. किंवा वि.मा.प्र.<\/b>, <b>नॉन-क्रिमीलेयर<\/b>, महाराष्ट्राचे अधिवासी<\/li><li><b>पदव्युत्तर<\/b> पदवी, <b>पूर्णवेळ पीएचडीला<\/b> प्रवेश (दूरस्थ शिक्षण नाही)<\/li><li>जाहिरातीतील <b>वयोमर्यादेत<\/b> (अलीकडील फेऱ्यांमध्ये सुमारे 45)<\/li><li>आधीच UGC / CSIR NET-JRF किंवा इतर अधिछात्रवृत्ती <b>नसावी<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>जातीचा दाखला<\/b> आणि <b>वैध नॉन-क्रिमीलेयर<\/b> प्रमाणपत्र<\/li><li><b>अधिवास<\/b> प्रमाणपत्र<\/li><li>पदव्युत्तर गुणपत्रिका व पदवी<\/li><li><b>पीएचडी नोंदणी / प्रवेश पत्र<\/b>, मार्गदर्शकांची संमती, संशोधन प्रस्ताव<\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b>, दिलेल्या नमुन्यातील हमीपत्र<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "नॉन-क्रिमीलेयरची मुदत संपली किंवा जात वैधता नाही? आधी हे पूर्ण करा. <b>नॉन-क्रिमीलेयर<\/b> आणि <b>जात वैधता<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जाहिरात आल्यावर अर्ज करा", "body": "अधिछात्रवृत्तीच्या जाहिरातीसाठी <b>mahajyoti.org.in<\/b> पाहत राहा. महाज्योतीच्या <b>पीएचडी पोर्टलवर<\/b> मुदतीत ऑनलाइन अर्ज करा. तुमचा <b>नोंदणी क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "मुदत <b>कडक<\/b> असते आणि फेरी वर्षातून एकदाच असते. जाहिरात येण्यापूर्वीच कागदपत्रे तयार ठेवा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महाज्योती / विद्यापीठ", "title": "छाननी व निवड यादी", "body": "महाज्योती अर्ज तपासून वेबसाइटवर <b>याद्या<\/b> (पात्र / निवड / त्रुटी) प्रसिद्ध करते. त्यानंतर कागदपत्र पडताळणी होऊ शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "नाव <b>त्रुटी / प्रलंबित यादीत<\/b>? शेरा वाचा आणि दिलेल्या मुदतीत राहिलेले कागदपत्र सादर करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "रुजू होऊन हमीपत्र द्या", "body": "विद्यापीठ / संशोधन केंद्रामार्फत <b>रुजू अहवाल<\/b> आणि सही केलेले <b>हमीपत्र<\/b> सादर करा. तुम्ही नोकरीत असाल तर <b>राजीनामा / कार्यमुक्ती पत्र<\/b> द्यावे लागू शकते.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अधिछात्रवृत्ती जमा, अहवाल देत राहा", "body": "अधिछात्रवृत्ती (आधी JRF दराने, नंतर SRF) तुमच्या <b>प्रगती अहवाल<\/b> आणि <b>उपयोगिता प्रमाणपत्रावर<\/b> आधारित, सहसा <b>दर सहा महिन्यांनी<\/b>, आधार-लिंक बँक खात्यात <b>5 वर्षांपर्यंत<\/b> जमा होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "रक्कम उशिरा? बहुतेक वेळा <b>प्रगती अहवाल किंवा उपयोगिता प्रमाणपत्र<\/b> विद्यापीठामार्फत वेळेवर गेलेले नसते."}}], "rights_t": "रक्कम किंवा निवड अडकली? पाठपुरावा करा.", "rights": "नोंदणी क्रमांक आणि सादर केलेल्या अहवालांच्या प्रतींसह <b>महाज्योती, नागपूर<\/b> यांना लिहा आणि पोच घ्या. प्रलंबित अहवाल पुढे पाठवण्यासाठी <b>विद्यापीठाच्या संशोधन कक्षाला<\/b> विनंती करा.", "help": "<b>जाहिराती व याद्या:<\/b> mahajyoti.org.in · रक्कम व वयोमर्यादा जाहिरातीनुसार बदलतात; चालू जाहिरात वाचा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त अधिकृत वेबसाइट वापरा<\/b>"}}, {"slug": "ladki-bahin", "title": "Ladki Bahin Yojana", "mr_name": "लाडकी बहीण योजना", "audience": "Women 21-65", "cat": "women", "links": [{"label": "Ladki Bahin portal: application, eKYC", "url": "https://ladakibahin.maharashtra.gov.in", "gov": false}, {"label": "Helpline: 181", "url": null, "gov":
