false}], "mermaid": "flowchart TD\n    A([Woman wants Ladki Bahin benefit]) --> B{1. Eligible?<br/>age 21-65, MH resident,<br/>family income up to 2.5 lakh}\n    B -- No --> X1([Not eligible])\n    B -- Yes --> EX{2. Any exclusion?<br/>tax payer, govt employee,<br/>four-wheeler, MP/MLA, other scheme}\n    EX -- Yes --> X2([Excluded])\n    EX -- No --> C[3. Gather documents<br/>Aadhaar, domicile proof, income cert<br/>or yellow/orange ration card,<br/>Aadhaar-seeded bank a/c, undertaking]\n    C --> D[4. Apply free<br/>portal / Anganwadi Sevika / help desk<br/>application number]\n    D --> E[5. Verification<br/>Women and Child Development officials]\n    E -- Doc issue --> F1[Sent back / rejected with reason]\n    F1 -- Correct + resubmit --> E\n    E -- OK --> AP[6. Approved list]\n    AP --> K{eKYC done?}\n    K -- No --> F2[Payment on hold]\n    F2 -- Complete eKYC --> K\n    K -- Yes --> P[DBT payment]\n    P -- Bank not seeded / inactive --> F3[Payment failed]\n    P --> M([7. Rs 1,500 every month])\n    M --> RV[Periodic re-verification<br/>by government]\n    F3 --> G[Grievance on portal /<br/>Anganwadi / district WCD office]\n\n    S1[[Sathi: Eligibility + exclusion check<br/>in plain Marathi]]:::sathi -.-> EX\n    S2[[Sathi: Readiness check<br/>ration card colour, domicile alternatives,<br/>bank seeding]]:::sathi -.-> C\n    S3[[Sathi: Decode rejection reason]]:::sathi -.-> F1\n    S4[[Sathi: eKYC + bank alerts]]:::sathi -.-> K\n    S5[[Sathi: Missed-payment tracker<br/>draft grievance]]:::sathi -.-> G\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Free Press Journal: 68 lakh accounts closed after eKYC", "url": "https://www.freepressjournal.in/mumbai/maharashtras-ladki-bahin-yojana-sees-68-lakh-accounts-closed-after-e-kyc-drive"}, {"label": "Outlook Money: 92 lakh names dropped", "url": "https://www.outlookmoney.com/news/maharashtra-drops-92-lakh-names-from-ladki-bahin-scheme-after-eligibility-checks"}, {"label": "The Hitavada: 80 lakh ineligible after eKYC deadline", "url": "https://www.thehitavada.com/Encyc/2026/6/2/80-lakh-women-become-ineligible-for-ladki-bahin-scheme-after-e-kyc-deadline.html"}, {"label": "The Hitavada: Won't scrap scheme, says Fadnavis", "url": "https://www.thehitavada.com/Encyc/2026/6/3/wont-scrap-ladki-bahin-scheme-says-fadnavis.html"}, {"label": "sarkariyojana.com: eKYC", "url": "https://sarkariyojana.com/ladki-bahin-yojana-ekyc/"}], "en": {"h1": "Ladki Bahin Yojana: How to get ₹1,500 a month", "benefit": "₹1,500 every month straight into your bank account", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Woman aged <b>21 to 65<\/b>, living in <b>Maharashtra<\/b><\/li><li>Married, widowed, divorced, abandoned or destitute, or <b>one unmarried woman<\/b> per family<\/li><li>Family income <b>up to ₹2.5 lakh a year<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check who cannot apply", "body": "You <b>cannot<\/b> apply if anyone in your family:<ul><li>Pays income tax, or is a government employee / pensioner<\/li><li>Owns a <b>four-wheeler<\/b> (tractor is allowed)<\/li><li>Is an MP / MLA or holds a board / corporation post<\/li><\/ul>Or if you already get ₹1,500 or more from another government scheme.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Applying when not eligible can mean the money is <b>stopped and recovered<\/b> later. Be honest."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar card<\/li><li><b>Domicile proof<\/b>: domicile certificate, or old ration card / voter ID / school leaving certificate / birth certificate<\/li><li><b>Income certificate<\/b><\/li><li>Ration card, photo<\/li><li>Bank account <b>linked to Aadhaar<\/b><\/li><li>Signed undertaking (हमीपत्र)<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Have a <b>yellow or orange ration card<\/b>? You usually <b>don't need<\/b> an income certificate. Born outside Maharashtra but married here? Your husband's domicile documents can be used."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li>Website <b>ladakibahin.maharashtra.gov.in<\/b><\/li><li>Your <b>Anganwadi Sevika<\/b>, or the ward / Gram Panchayat help desk<\/li><\/ul>Note your <b>application number<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>New registrations may be closed.<\/b> Check the portal or ask your Anganwadi Sevika before applying. Applying is always <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your application is checked", "body": "Women and Child Development officials check your form and documents.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Rejected<\/b> or <b>sent back<\/b>? Read the reason on the portal or ask your Anganwadi Sevika. Correct it and resubmit."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Approved: bank and eKYC", "body": "Your name goes on the approved list. Your bank account must be <b>Aadhaar-seeded with DBT on<\/b>. Complete <b>eKYC every year<\/b> on the portal when the window opens.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missed eKYC? You can be <b>removed from the scheme<\/b>. Lakhs of names were dropped this way. Wrongly removed (e.g. flagged as a government employee)? Raise a grievance with proof."}}, {"phase": null, "kind": "done", "who": "Done", "title": "₹1,500 in your account every month", "body": "The money comes by <b>DBT<\/b>. You get an SMS from your bank.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Your bank account may not be Aadhaar-seeded or may be inactive. Ask the bank for <b>\"Aadhaar seeding and DBT on\"<\/b>."}}], "rights_t": "Money not coming? Complain.", "rights": "Raise a <b>grievance on the Ladki Bahin portal<\/b> with your application number, or ask your <b>Anganwadi Sevika<\/b> / the district <b>Women and Child Development office<\/b>.", "help": "<b>Do eKYC every year<\/b> and keep your bank link and details correct, the government re-verifies beneficiaries<br/><b>Check status:<\/b> ladakibahin.maharashtra.gov.in · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "लाडकी बहीण योजना: दरमहा ₹1,500 कसे मिळवायचे", "benefit": "दर महिन्याला ₹1,500 थेट तुमच्या बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>21 ते 65<\/b> वयाची महिला, <b>महाराष्ट्राची रहिवासी<\/b><\/li><li>विवाहित, विधवा, घटस्फोटित, परित्यक्ता किंवा निराधार, किंवा कुटुंबातील <b>एक अविवाहित महिला<\/b><\/li><li>कौटुंबिक उत्पन्न <b>वर्षाला ₹2.5 लाखांपर्यंत<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कोण अर्ज करू शकत नाही", "body": "तुमच्या कुटुंबातील कोणी:<ul><li>आयकर भरत असेल, किंवा सरकारी कर्मचारी / निवृत्तीवेतनधारक असेल<\/li><li><b>चारचाकी वाहन<\/b> असेल (ट्रॅक्टर चालतो)<\/li><li>खासदार / आमदार असेल किंवा मंडळ / महामंडळावर पद असेल<\/li><\/ul>तर तुम्ही <b>अर्ज करू शकत नाही<\/b>. तसेच दुसऱ्या सरकारी योजनेतून आधीच ₹1,500 किंवा जास्त मिळत असतील तरीही नाही.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पात्र नसताना अर्ज केल्यास नंतर पैसे <b>बंद होऊन वसूल<\/b> केले जाऊ शकतात. खरी माहिती द्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार कार्ड<\/li><li><b>रहिवासाचा पुरावा<\/b>: अधिवास प्रमाणपत्र, किंवा जुने रेशन कार्ड / मतदार ओळखपत्र / शाळा सोडल्याचा दाखला / जन्म दाखला<\/li><li><b>उत्पन्नाचा दाखला<\/b><\/li><li>रेशन कार्ड, फोटो<\/li><li><b>आधारशी लिंक<\/b> असलेले बँक खाते<\/li><li>सही केलेले हमीपत्र<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>पिवळे किंवा केशरी रेशन कार्ड<\/b> आहे? मग सहसा उत्पन्नाच्या दाखल्याची <b>गरज नाही<\/b>. महाराष्ट्राबाहेर जन्म पण लग्न इथे झाले? पतीची रहिवासी कागदपत्रे वापरता येतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>ladakibahin.maharashtra.gov.in<\/b><\/li><li>तुमच्या <b>अंगणवाडी सेविका<\/b>, किंवा वॉर्ड / ग्रामपंचायत मदत कक्ष<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>नवीन नोंदणी बंद असू शकते.<\/b> अर्ज करण्यापूर्वी पोर्टल तपासा किंवा अंगणवाडी सेविकेला विचारा. अर्ज करणे नेहमी <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "अर्जाची तपासणी", "body": "महिला व बालविकास विभागाचे अधिकारी तुमचा अर्ज आणि कागदपत्रे तपासतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>नामंजूर<\/b> किंवा <b>परत पाठवला<\/b>? पोर्टलवर कारण वाचा किंवा अंगणवाडी सेविकेला विचारा. दुरुस्त करून पुन्हा सादर करा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "मंजुरी: बँक व ई-केवायसी", "body": "तुमचे नाव मंजूर यादीत येते. तुमचे बँक खाते <b>आधार-सीडेड आणि DBT सुरू<\/b> असले पाहिजे. खिडकी सुरू झाल्यावर पोर्टलवर <b>दरवर्षी ई-केवायसी<\/b> पूर्ण करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "ई-केवायसी चुकली? तुम्हाला <b>योजनेतून वगळले<\/b> जाऊ शकते. अशा प्रकारे लाखो नावे वगळली गेली. चुकीने वगळले (उदा. सरकारी कर्मचारी म्हणून)? पुराव्यासह तक्रार करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दरमहा ₹1,500 खात्यात जमा", "body": "पैसे <b>DBT<\/b> द्वारे येतात. बँकेकडून SMS येतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर झाले पण पैसे आले नाहीत? बँक खाते आधार-सीडेड नसेल किंवा बंद असेल. बँकेत <b>\"आधार सीडिंग करा आणि DBT सुरू करा\"<\/b> असे सांगा."}}], "rights_t": "पैसे येत नाहीत? तक्रार करा.", "rights": "अर्ज क्रमांकासह <b>लाडकी बहीण पोर्टलवर तक्रार<\/b> नोंदवा, किंवा तुमच्या <b>अंगणवाडी सेविका<\/b> / जिल्हा <b>महिला व बालविकास कार्यालयाशी<\/b> संपर्क साधा.", "help": "<b>दरवर्षी ई-केवायसी करा<\/b> आणि बँक लिंक व माहिती अचूक ठेवा, सरकार लाभार्थ्यांची पुन्हा पडताळणी करते<br/><b>स्थिती तपासा:<\/b> ladakibahin.maharashtra.gov.in · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "ujjwala", "title": "PM Ujjwala Yojana", "mr_name": "उज्ज्वला योजना", "audience": "Women of poor households (LPG)", "cat": "women", "links": [{"label": "PMUY: apply and scheme details", "url": "https://pmuy.gov.in", "gov": false}, {"label": "Rajya Sabha answer, Feb 2025 (PDF)", "url": "https://rsdebate.nic.in/bitstream/123456789/758543/1/PQ_267_10022025_U777_p406_p407.pdf", "gov": true}], "mermaid": "flowchart TD\n    A([Woman in poor household, no LPG]) --> E{1. Eligible?<br/>18+, no LPG in household,<br/>SC/ST, AAY, PMAY-G, forest dweller,<br/>or poor-household declaration}\n    E -- No --> X([Not eligible])\n    E -- Yes --> D[2. Documents<br/>Aadhaar, ration card + members' Aadhaar,<br/>seeded bank a/c, photo<br/>migrants: address self-declaration]\n    D --> AP[3. Apply free<br/>pmuy.gov.in: choose OMC + distributor<br/>or at distributor]\n    AP --> K[4. KYC by distributor]\n    K --> DD{Dedup check<br/>any LPG in family?}\n    DD -- Yes --> F1[Rejected: existing connection]\n    DD -- No --> R[5. Connection released<br/>cylinder, regulator, pipe, booklet<br/>installation + safety demo]\n    R --> EK{6. eKYC + bank seeded?}\n    EK -- No --> F2[Subsidy on hold]\n    EK -- Yes --> S([7. Refills with DBT subsidy])\n    F1 -. unresolved .-> T[Complaint: distributor, OMC portal, CPGRAMS]\n    F2 -. unresolved .-> T\n\n    S1[[Sathi: Eligibility check<br/>which category applies]]:::sathi -.-> E\n    S2[[Sathi: Readiness check<br/>ration card members, bank seeding]]:::sathi -.-> D\n    S3[[Sathi: Explain dedup rejection<br/>surrender old / fix ration card]]:::sathi -.-> F1\n    S4[[Sathi: eKYC + subsidy tracker]]:::sathi -.-> EK\n    S5[[Sathi: Link to state free-refill schemes]]:::sathi -.-> S\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "BankBazaar: PMUY scheme", "url": "https://www.bankbazaar.com/gas-connection/pradhan-mantri-ujjwala-yojana-scheme.html"}, {"label": "Drishti IAS note", "url": "https://www.drishtiias.com/pdf/1759320263.pdf"}, {"label": "Rajya Sabha question, Feb 2025", "url": "https://rsdebate.nic.in/bitstream/123456789/758543/1/PQ_267_10022025_U777_p406_p407.pdf"}, {"label": "Money9: Ujjwala 2.0 free stove and refill", "url": "https://www.money9.com/news/economy/prime-minister-narendra-modi-to-unveil-ujjwala-2-0-tomorrow-beneficiaries-will-get-stove-one-refill-free-66576.html"}], "en": {"h1": "PM Ujjwala Yojana: How to get a free LPG connection", "benefit": "Free LPG connection for women of poor households, plus subsidy on refills", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>A <b>woman aged 18 or more<\/b><\/li><li><b>No LPG connection<\/b> in anyone's name in the household<\/li><li>From a poor household, e.g. <b>SC / ST<\/b>, <b>Antyodaya (AAY) ration card<\/b>, <b>PMAY-Gramin<\/b> beneficiary, forest dweller, or poor family by self-declaration<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Your <b>Aadhaar<\/b><\/li><li><b>Ration card<\/b> showing family members, and Aadhaar of the adult members on it<\/li><li><b>Bank account<\/b> (passbook with IFSC), linked to Aadhaar<\/li><li>Photo<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Migrant family without a local ration card? A <b>self-declaration of address<\/b> is usually accepted."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li>Website <b>pmuy.gov.in<\/b> → choose company (Indane / Bharat Gas / HP Gas) → choose nearest distributor<\/li><li>Go directly to your nearest <b>gas distributor<\/b> with papers<\/li><\/ul>Note your <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "The connection is <b>free<\/b>. Never pay an agent or the distributor extra for \"quick\" approval."}}, {"phase": "After you apply", "kind": "gov", "who": "Gas agency", "title": "Papers and family are checked", "body": "The distributor completes your <b>KYC<\/b> and checks that <b>no one in your family<\/b> already has an LPG connection.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected for <b>\"existing connection\"<\/b>? Someone on your ration card may already have one. Surrender the old connection or correct the ration card, then reapply."}}, {"phase": null, "kind": "gov", "who": "Gas agency", "title": "Connection is installed", "body": "You get the <b>cylinder, regulator, pipe and booklet<\/b> without deposit. The distributor installs it and shows you <b>safety steps<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Ask for the <b>safety demonstration<\/b>. Check the pipe and regulator are fitted properly."}}, {"phase": null, "kind": "you", "who": "You", "title": "Complete eKYC and bank link", "body": "Do <b>Aadhaar eKYC<\/b> at the distributor or on the gas company's app when asked. Make sure your bank account is <b>Aadhaar-seeded<\/b> so the subsidy reaches you.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Subsidy not coming? Usually eKYC is pending or the bank isn't Aadhaar-seeded. Fix both."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Cook on LPG, get refill subsidy", "body": "Book refills by phone / app. A <b>subsidy of about ₹300 per cylinder<\/b> comes into your bank account (up to a set number of refills each year). Under Ujjwala 2.0 the <b>first refill and stove<\/b> are free.", "note": {"kind": "tip", "label": "Tip:", "html": "Ask your distributor about any <b>Maharashtra free-refill scheme<\/b> you may also be eligible for."}}], "rights_t": "Problem with the agency? Complain.", "rights": "First complain to the <b>distributor<\/b> in writing. If not solved, use the gas company's <b>customer grievance portal<\/b> or <b>CPGRAMS<\/b>. <b>Gas leak emergency: call 1906.<\/b>", "help": "<b>Check status:<\/b> pmuy.gov.in or your gas company's website / app (application number)<br/><b>Connection is free<\/b> · <b>Use only official websites and apps<\/b>"}, "mr": {"h1": "प्रधानमंत्री उज्ज्वला योजना: मोफत गॅस जोडणी कशी मिळवायची", "benefit": "गरीब कुटुंबातील महिलांना मोफत गॅस जोडणी, शिवाय रिफिलवर अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>18 वर्षे किंवा जास्त वयाची महिला<\/b><\/li><li>घरात कोणाच्याही नावावर <b>गॅस जोडणी नसावी<\/b><\/li><li>गरीब कुटुंबातील, उदा. <b>अनुसूचित जाती / जमाती<\/b>, <b>अंत्योदय (AAY) रेशन कार्ड<\/b>, <b>प्रधानमंत्री आवास योजना - ग्रामीण<\/b> लाभार्थी, वनवासी, किंवा स्वयंघोषणेनुसार गरीब कुटुंब<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमचे <b>आधार<\/b><\/li><li>कुटुंबातील सदस्य दाखवणारे <b>रेशन कार्ड<\/b>, आणि त्यावरील प्रौढ सदस्यांचे आधार<\/li><li>आधारशी लिंक असलेले <b>बँक खाते<\/b> (IFSC सह पासबुक)<\/li><li>फोटो<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "स्थलांतरित कुटुंब, स्थानिक रेशन कार्ड नाही? <b>पत्त्याचे स्वयंघोषणापत्र<\/b> सहसा चालते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>pmuy.gov.in<\/b> → कंपनी निवडा (इंडेन / भारत गॅस / एचपी गॅस) → जवळचा वितरक निवडा<\/li><li>कागदपत्रांसह थेट जवळच्या <b>गॅस वितरकाकडे<\/b> जा<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "जोडणी <b>मोफत<\/b> आहे. \"लवकर\" मंजुरीसाठी एजंट किंवा वितरकाला जास्त पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "गॅस एजन्सी", "title": "कागदपत्रे व कुटुंबाची तपासणी", "body": "वितरक तुमचे <b>KYC<\/b> पूर्ण करतो आणि तुमच्या <b>कुटुंबात कोणाकडेही<\/b> आधीच गॅस जोडणी नाही ना हे तपासतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>\"आधीच जोडणी आहे\"<\/b> म्हणून नामंजूर? रेशन कार्डवरील कोणाकडे आधीच जोडणी असू शकते. जुनी जोडणी परत करा किंवा रेशन कार्ड दुरुस्त करा, मग पुन्हा अर्ज करा."}}, {"phase": null, "kind": "gov", "who": "गॅस एजन्सी", "title": "गॅस जोडणी बसवली जाते", "body": "अनामत रकमेशिवाय <b>सिलिंडर, रेग्युलेटर, पाईप आणि पुस्तिका<\/b> मिळते. वितरक जोडणी बसवून <b>सुरक्षिततेचे नियम<\/b> दाखवतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>सुरक्षा प्रात्यक्षिक<\/b> मागा. पाईप आणि रेग्युलेटर नीट बसवले आहेत का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-केवायसी व बँक लिंक करा", "body": "सांगितल्यावर वितरकाकडे किंवा गॅस कंपनीच्या ॲपवर <b>आधार ई-केवायसी<\/b> करा. अनुदान मिळण्यासाठी तुमचे बँक खाते <b>आधार-सीडेड<\/b> आहे याची खात्री करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अनुदान येत नाही? बहुतेक वेळा ई-केवायसी बाकी असते किंवा बँक आधार-सीडेड नसते. दोन्ही दुरुस्त करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "गॅसवर स्वयंपाक, रिफिलवर अनुदान", "body": "फोन / ॲपवरून रिफिल बुक करा. प्रति सिलिंडर <b>सुमारे ₹300 अनुदान<\/b> तुमच्या बँक खात्यात येते (दरवर्षी ठराविक रिफिलपर्यंत). उज्ज्वला 2.0 मध्ये <b>पहिला रिफिल आणि शेगडी<\/b> मोफत.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुम्ही पात्र असू शकता अशा <b>महाराष्ट्राच्या मोफत रिफिल योजनेबद्दल<\/b> वितरकाकडे विचारा."}}], "rights_t": "एजन्सीबद्दल तक्रार? तक्रार करा.", "rights": "आधी <b>वितरकाकडे<\/b> लेखी तक्रार द्या. निराकरण न झाल्यास गॅस कंपनीचे <b>ग्राहक तक्रार पोर्टल<\/b> किंवा <b>CPGRAMS<\/b> वापरा. <b>गॅस गळती आपत्कालीन क्रमांक: 1906.<\/b>", "help": "<b>स्थिती तपासा:<\/b> pmuy.gov.in किंवा तुमच्या गॅस कंपनीची वेबसाइट / ॲप (अर्ज क्रमांक)<br/><b>जोडणी मोफत आहे<\/b> · <b>फक्त अधिकृत वेबसाइट व ॲप वापरा<\/b>"}}, {"slug": "pmay-gramin", "title": "PMAY-Gramin", "mr_name": "प्रधानमंत्री आवास योजना (ग्रामीण)", "audience": "Rural families without pucca house", "cat": "home", "links": [{"label": "PMAY-G: beneficiary search and reports", "url": "https://pmayg.nic.in", "gov": false}, {"label": "PIB: PMAY-G document (PDF)", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/nov/doc20241119437801.pdf", "gov": true}], "mermaid": "flowchart TD\n    A([Rural family without pucca house]) --> B{1. Village or city?}\n    B -- City / town --> U([PMAY-Urban 2.0: separate flow])\n    B -- Village --> C{2. Eligible?<br/>no pucca house, no exclusion}\n    C -- No --> X([Excluded])\n    C -- Yes --> S[3. Awaas+ survey<br/>surveyor or self-survey app]\n    S -- Not surveyed --> F0[Not on list:<br/>ask Gram Sevak,<br/>check state gharkul schemes]\n    S --> GS[4. Gram Sabha verifies<br/>Permanent Wait List + priority]\n    GS --> SA[5. Sanction by BDO / Panchayat Samiti<br/>Aadhaar, seeded bank a/c,<br/>MGNREGA job card, land proof]\n    SA -- No land in name --> F1[Blocked: land<br/>ferfar / land-purchase assistance]\n    SA --> I1[Instalment 1 via DBT]\n    I1 --> ST[6. Build stage by stage<br/>foundation, walls, roof<br/>repeat for each stage]\n    ST --> GT[Geo-tagged photo<br/>uploaded on AwaasApp]\n    GT -- Not uploaded / not inspected --> F2[Next instalment stuck]\n    F2 -. stuck long .-> T[Written complaint to BDO / CPGRAMS]\n    GT -- Verified --> IN[7. Next instalment via DBT<br/>+ MGNREGA wages + SBM toilet]\n    IN --> DONE([8. House complete<br/>final geo-tag])\n\n    S1[[Sathi: Eligibility + scheme router<br/>PMAY-G vs Urban vs state gharkul]]:::sathi -.-> C\n    S2[[Sathi: List checker<br/>am I on the wait list?]]:::sathi -.-> S\n    S3[[Sathi: Land readiness<br/>7/12 Health Report + Ferfar]]:::sathi -.-> F1\n    S4[[Sathi: Stage tracker<br/>photo uploaded? instalment due?]]:::sathi -.-> GT\n    S5[[Sathi: Stuck clock + draft complaint]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "PIB: PMAY-G document", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/nov/doc20241119437801.pdf"}, {"label": "Sansad: parliamentary reply", "url": "https://eparlib.sansad.in/bitstream/123456789/3006401/1/AU1336_CA4fLm.pdf"}, {"label": "Business Today: exclusion norms relaxed", "url": "https://www.businesstoday.in/amp/india/story/pmay-g-automatic-exclusion-norms-relaxed-details-on-centres-rural-housing-scheme-here-445380-2024-09-11"}, {"label": "Vajiram & Ravi: new eligibility norms", "url": "https://vajiramandravi.com/current-affairs/centre-eases-exclusion-criteria-for-pmay-gramin-new-eligibility-norms-explained/"}], "en": {"h1": "PM Awas Yojana (Gramin): How to get a pucca house", "benefit": "About ₹1.2 lakh in instalments to build your house, plus MGNREGA wages and toilet support", "steps": [{"phase": "Getting selected", "kind": "you", "who": "You", "title": "Know which scheme is yours", "body": "<ul><li>Live in a <b>village<\/b> → <b>PMAY-Gramin<\/b>. This guide.<\/li><li>Live in a <b>city / town<\/b> → PMAY-Urban 2.0. Different process.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You can get it if your family has <b>no pucca house<\/b> (you live in a kutcha or damaged house, or are homeless).<br/>You usually <b>cannot<\/b> if the family has a motorised three / four-wheeler or mechanised farm equipment, a Kisan Credit Card limit of ₹50,000+, pays income or professional tax, owns 2.5+ acres of irrigated land, or already has a pucca house. A two-wheeler, fridge or income up to ₹15,000 a month <b>no longer<\/b> excludes you.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Get your name on the list", "body": "Selection is from the <b>Awaas+ survey<\/b>. Ask your <b>Gram Sevak / Gram Panchayat<\/b> whether you are on the list, or whether a new survey or self-survey (Awaas+ app) is open.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Not on the list? Ask the Gram Sevak to include you in the survey. Also ask about the <b>state gharkul schemes<\/b> (e.g. Ramai, Shabari, Modi Awas) for your category."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Gram Sabha checks the list", "body": "The <b>Gram Sabha<\/b> verifies the waiting list and its priority order.", "note": {"kind": "tip", "label": "Tip:", "html": "<b>Attend the Gram Sabha.<\/b> This is where names are confirmed or objected to."}}, {"phase": "Building your house", "kind": "gov", "who": "Government", "title": "Your house is sanctioned", "body": "The <b>Panchayat Samiti / BDO<\/b> sanctions your house. Keep ready: Aadhaar, <b>Aadhaar-linked bank account<\/b>, <b>MGNREGA job card<\/b>, and land proof (7/12 or Namuna 8).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land not in your name? Get the <b>ferfar<\/b> done first. Landless? Ask about the state's land-purchase help for gharkul beneficiaries."}}, {"phase": null, "kind": "you", "who": "You", "title": "Build in stages, with photos", "body": "The first instalment comes after sanction. Build in stages: <b>foundation → walls → roof → finish<\/b>. At each stage, a <b>geo-tagged photo<\/b> of your house is uploaded (by the Gram Rozgar Sevak / technical assistant or on the AwaasApp).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Next instalment not coming? Usually the <b>stage photo was not uploaded<\/b> or not inspected. Ask the Gram Rozgar Sevak / Panchayat Samiti engineer."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Instalments are paid", "body": "Each instalment comes by <b>DBT<\/b> after the stage is verified. You can also get <b>MGNREGA wages<\/b> for working on your own house and <b>toilet support<\/b> under Swachh Bharat.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Instalment approved but not received? Check that your bank account is <b>Aadhaar-seeded with DBT on<\/b>."}}, {"phase": null, "kind": "done", "who": "Done", "title": "House complete", "body": "The final geo-tagged photo is uploaded and the house is marked <b>complete<\/b>. Try to finish within about a year.", "note": null}], "rights_t": "Stuck for long? Complain.", "rights": "Give a written complaint to the <b>BDO, Panchayat Samiti<\/b> with your PMAY-G registration number and take an <b>acknowledgement (पोच)<\/b>. You can also use the central grievance portal <b>CPGRAMS<\/b>.", "help": "<b>Check status:<\/b> pmayg.nic.in → beneficiary search (registration number)<br/>Selection and instalments are <b>free<\/b>, never pay anyone to \"get your name\" or \"release\" money · <b>Use only .gov.in / .nic.in websites<\/b>"}, "mr": {"h1": "प्रधानमंत्री आवास योजना (ग्रामीण): पक्के घर कसे मिळवायचे", "benefit": "घर बांधण्यासाठी हप्त्यांमध्ये सुमारे ₹1.2 लाख, शिवाय मनरेगा मजुरी आणि शौचालय अनुदान", "steps": [{"phase": "निवड होणे", "kind": "you", "who": "तुम्ही", "title": "तुमची योजना कोणती ते ओळखा", "body": "<ul><li><b>गावात<\/b> राहता → <b>प्रधानमंत्री आवास योजना - ग्रामीण<\/b>. हे मार्गदर्शक त्यासाठी आहे.<\/li><li><b>शहरात<\/b> राहता → प्रधानमंत्री आवास योजना - शहरी 2.0. प्रक्रिया वेगळी आहे.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "तुमच्या कुटुंबाकडे <b>पक्के घर नसेल<\/b> (कच्च्या किंवा मोडकळीस आलेल्या घरात राहता, किंवा बेघर आहात) तर लाभ मिळू शकतो.<br/>कुटुंबाकडे मोटार असलेले तीन / चारचाकी वाहन किंवा यांत्रिक शेती उपकरण, ₹50,000+ मर्यादेचे किसान क्रेडिट कार्ड, आयकर किंवा व्यवसाय कर भरणा, 2.5+ एकर बागायती जमीन, किंवा आधीच पक्के घर असेल तर सहसा <b>मिळत नाही<\/b>. दुचाकी, फ्रीज किंवा दरमहा ₹15,000 पर्यंत उत्पन्न असल्याने आता <b>अपात्र ठरत नाही<\/b>.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "यादीत नाव लावा", "body": "निवड <b>आवास+ सर्वेक्षणातून<\/b> होते. तुमचे नाव यादीत आहे का, किंवा नवीन सर्वेक्षण / स्व-सर्वेक्षण (आवास+ ॲप) सुरू आहे का, हे <b>ग्रामसेवक / ग्रामपंचायतीत<\/b> विचारा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "यादीत नाव नाही? सर्वेक्षणात नाव घेण्यासाठी ग्रामसेवकांना विनंती करा. तुमच्या प्रवर्गासाठी <b>राज्याच्या घरकुल योजना<\/b> (उदा. रमाई, शबरी, मोदी आवास) बद्दलही विचारा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "ग्रामसभेत यादी तपासणी", "body": "<b>ग्रामसभा<\/b> प्रतीक्षा यादी आणि तिचा प्राधान्यक्रम तपासते.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>ग्रामसभेला हजर राहा.<\/b> इथेच नावे निश्चित होतात किंवा त्यावर हरकत घेतली जाते."}}, {"phase": "घर बांधणे", "kind": "gov", "who": "सरकार", "title": "घरकुल मंजूर", "body": "<b>पंचायत समिती / गटविकास अधिकारी<\/b> तुमचे घरकुल मंजूर करतात. तयार ठेवा: आधार, <b>आधार-लिंक बँक खाते<\/b>, <b>मनरेगा जॉब कार्ड<\/b>, आणि जमिनीचा पुरावा (7/12 किंवा नमुना 8).", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन तुमच्या नावावर नाही? आधी <b>फेरफार<\/b> करून घ्या. भूमिहीन आहात? घरकुल लाभार्थ्यांसाठी राज्याच्या जागा खरेदी अर्थसहाय्याबद्दल विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "टप्प्याटप्प्याने बांधकाम, फोटोसह", "body": "मंजुरीनंतर पहिला हप्ता येतो. टप्प्याटप्प्याने बांधा: <b>पाया → भिंती → छत → पूर्णत्व<\/b>. प्रत्येक टप्प्यावर घराचा <b>जिओ-टॅग फोटो<\/b> अपलोड होतो (ग्राम रोजगार सेवक / तांत्रिक सहायक किंवा आवास ॲपवरून).", "note": {"kind": "stuck", "label": "अडचण?", "html": "पुढचा हप्ता येत नाही? बहुतेक वेळा <b>टप्प्याचा फोटो अपलोड झालेला नसतो<\/b> किंवा तपासणी झालेली नसते. ग्राम रोजगार सेवक / पंचायत समिती अभियंत्यांना विचारा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "हप्ते जमा होतात", "body": "टप्पा तपासल्यानंतर प्रत्येक हप्ता <b>DBT<\/b> द्वारे येतो. स्वतःच्या घरावर काम केल्याबद्दल <b>मनरेगा मजुरी<\/b> आणि स्वच्छ भारत अंतर्गत <b>शौचालय अनुदानही<\/b> मिळू शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "हप्ता मंजूर पण जमा नाही? बँक खाते <b>आधार-सीडेड आणि DBT सुरू<\/b> आहे का ते तपासा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "घर पूर्ण", "body": "शेवटचा जिओ-टॅग फोटो अपलोड होऊन घर <b>पूर्ण<\/b> म्हणून नोंदवले जाते. साधारण वर्षभरात पूर्ण करण्याचा प्रयत्न करा.", "note": null}], "rights_t": "खूप दिवस अडकले? तक्रार करा.", "rights": "तुमच्या PMAY-G नोंदणी क्रमांकासह <b>गटविकास अधिकारी, पंचायत समिती<\/b> यांना लेखी तक्रार द्या आणि <b>पोच<\/b> घ्या. केंद्राच्या <b>CPGRAMS<\/b> तक्रार पोर्टलचाही वापर करता येतो.", "help": "<b>स्थिती तपासा:<\/b> pmayg.nic.in → लाभार्थी शोध (नोंदणी क्रमांक)<br/>निवड आणि हप्ते <b>मोफत<\/b> आहेत, \"नाव लावण्यासाठी\" किंवा \"पैसे सोडवण्यासाठी\" कोणालाही पैसे देऊ नका · <b>फक्त .gov.in / .nic.in वेबसाइट वापरा<\/b>"}}, {"slug": "pmay-urban", "title": "PMAY-Urban 2.0", "mr_name": "प्रधानमंत्री आवास योजना (शहरी 2.0)", "audience": "Urban EWS / LIG / MIG families", "cat": "home", "links": [{"label": "PMAY-U 2.0: apply online", "url": "https://pmay-urban.gov.in", "gov": false}, {"label": "PMAY-U MIS: FAQ", "url": "https://pmaymis.gov.in/pmaymis2_2024/faq.html", "gov": true}], "mermaid": "flowchart TD\n    A([Urban family without pucca house]) --> E{1. Eligible?<br/>no pucca house in India,<br/>EWS / LIG / MIG income}\n    E -- No --> X([Not eligible])\n    E -- Yes --> V{2. Which vertical?}\n    V -- Own land --> BLC[BLC: build on own plot]\n    V -- Buy flat in project --> AHP[AHP: partner project]\n    V -- Home loan --> ISS[ISS: interest subsidy via lender]\n    V -- Rent --> ARH([ARH: affordable rental])\n    BLC --> D[3. Documents<br/>Aadhaar all members, income proof,<br/>seeded bank a/c, no-pucca-house declaration,<br/>land / property card for BLC]\n    AHP --> D\n    ISS --> D\n    D --> AP[4. Apply free<br/>pmay-urban.gov.in / ULB PMAY cell / lender<br/>application number]\n    AP --> VR[5. ULB verification<br/>site check for BLC]\n    VR -- Pucca house found / income mismatch --> F1[Rejected with reason]\n    VR -- OK --> S{6. Approved}\n    S -- BLC --> B1[Stage-wise instalments<br/>geo-tagged photos]\n    B1 -- Photo missing --> F2[Instalment stuck]\n    S -- AHP --> A1[Allotment, often by lottery<br/>beneficiary contribution]\n    S -- ISS --> I1[Subsidy credited to loan account<br/>yearly instalments]\n    B1 --> DONE([7. Home ready])\n    A1 --> DONE\n    I1 --> DONE\n    F2 -. stuck long .-> T[Complaint: ULB PMAY cell /<br/>bank / CPGRAMS]\n\n    S1[[Sathi: Eligibility + vertical chooser]]:::sathi -.-> V\n    S2[[Sathi: Readiness check<br/>income cert, property card, seeding]]:::sathi -.-> D\n    S3[[Sathi: Fake-site and agent warning]]:::sathi -.-> AP\n    S4[[Sathi: Stage tracker for BLC]]:::sathi -.-> B1\n    S5[[Sathi: Stuck clock + draft complaint]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "PM India: Cabinet approves PMAY-U 2.0", "url": "https://www.pmindia.gov.in/en/news_updates/cabinet-approves-pradhan-mantri-awas-yojana-urban-2-0-scheme/"}, {"label": "MoHUA PMAY-U FAQ", "url": "https://pmaymis.gov.in/pmaymis2_2024/faq.html"}, {"label": "Tata Capital: PMAY 2.0", "url": "https://www.tatacapital.com/home-loan/pmay.html"}, {"label": "IIFL Home Loans: PMAY-U 2.0", "url": "https://www.iiflhomeloans.com/pmay-urban"}], "en": {"h1": "PM Awas Yojana (Urban 2.0): How to get help for a home in the city", "benefit": "Help to build, buy or rent a pucca home in cities and towns", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>You live in a <b>city or town<\/b> (villages: see PMAY-Gramin)<\/li><li>No one in your family owns a <b>pucca house anywhere in India<\/b><\/li><li>Family income: <b>EWS<\/b> up to ₹3 lakh · <b>LIG<\/b> ₹3 to 6 lakh · <b>MIG<\/b> ₹6 to 9 lakh a year<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "The house is usually in the name of the <b>woman of the family<\/b>, or jointly."}}, {"phase": null, "kind": "you", "who": "You", "title": "Pick the option that fits you", "body": "<ul><li><b>Own land, want to build<\/b> → BLC: help to build on your own plot (EWS)<\/li><li><b>Want to buy a flat<\/b> in a government / partner project → AHP (EWS)<\/li><li><b>Taking a home loan<\/b> from a bank → ISS: interest subsidy (EWS / LIG / MIG)<\/li><li><b>Need to rent<\/b> (workers, migrants) → ARH: affordable rental<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "You can use <b>only one<\/b> of these options. ISS gives up to <b>₹1.80 lakh<\/b> interest subsidy on loans up to ₹25 lakh for houses worth up to ₹35 lakh."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar of <b>all family members<\/b><\/li><li>Income certificate / ITR<\/li><li>Bank account <b>linked to Aadhaar<\/b><\/li><li>Self-declaration that you own no pucca house<\/li><li>For BLC: <b>land / property card<\/b> in your name<\/li><li>Caste certificate, if applicable<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Plot not in your name? Get the property card / mutation updated first. BLC needs land in the family's name."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li>Website <b>pmay-urban.gov.in<\/b> (Aadhaar OTP)<\/li><li>Your <b>municipal corporation / council<\/b> PMAY cell<\/li><li>For ISS: also through your <b>bank / housing finance company<\/b><\/li><\/ul>Note your <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Beware of <b>fake PMAY websites and agents<\/b>. Applying is free. Never pay to \"get selected\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Government / Bank", "title": "Your application is checked", "body": "The <b>Urban Local Body<\/b> (municipal corporation / council) verifies your details. For BLC, they also check your plot.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Common reasons: a family member already owns a pucca house, or income doesn't match. Read the reason, correct it and reapply."}}, {"phase": null, "kind": "gov", "who": "Government / Bank", "title": "Approval and money", "body": "<ul><li><b>BLC<\/b>: money comes in instalments as you build, with <b>geo-tagged photos<\/b> at each stage<\/li><li><b>AHP<\/b>: flat allotted (often by lottery)<\/li><li><b>ISS<\/b>: subsidy credited to your <b>home loan account<\/b> in yearly instalments, reducing your EMI<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "BLC instalment stuck? Usually the stage photo was not uploaded or inspected. Ask the municipal PMAY cell."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Your home is ready", "body": "Your house is built, or you get possession of your flat, or your loan becomes cheaper with the subsidy.", "note": null}], "rights_t": "Stuck for long? Complain.", "rights": "Give a written complaint to your <b>municipal PMAY cell<\/b> with your application number and take an <b>acknowledgement (पोच)<\/b>. For ISS, complain to your <b>bank<\/b> first. You can also use <b>CPGRAMS<\/b>.", "help": "<b>Check status:<\/b> pmay-urban.gov.in → track application (application number)<br/><b>Use only .gov.in websites<\/b> · Never pay anyone to \"get selected\""}, "mr": {"h1": "प्रधानमंत्री आवास योजना (शहरी 2.0): शहरात घरासाठी मदत कशी मिळवायची", "benefit": "शहरात पक्के घर बांधणे, खरेदी करणे किंवा भाड्याने घेण्यासाठी मदत", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li>तुम्ही <b>शहरात<\/b> राहता (गावांसाठी: प्रधानमंत्री आवास योजना - ग्रामीण पाहा)<\/li><li>तुमच्या कुटुंबातील कोणाचेही <b>भारतात कुठेही पक्के घर<\/b> नाही<\/li><li>कौटुंबिक उत्पन्न: <b>EWS<\/b> ₹3 लाखांपर्यंत · <b>LIG<\/b> ₹3 ते 6 लाख · <b>MIG<\/b> ₹6 ते 9 लाख वार्षिक<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "घर सहसा <b>कुटुंबातील महिलेच्या नावावर<\/b> किंवा संयुक्त नावावर असते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "तुमच्यासाठी योग्य पर्याय निवडा", "body": "<ul><li><b>स्वतःची जागा आहे, घर बांधायचे<\/b> → BLC: स्वतःच्या जागेवर बांधकामासाठी मदत (EWS)<\/li><li>सरकारी / भागीदारी प्रकल्पात <b>फ्लॅट घ्यायचा<\/b> → AHP (EWS)<\/li><li>बँकेकडून <b>गृहकर्ज घेताय<\/b> → ISS: व्याज अनुदान (EWS / LIG / MIG)<\/li><li><b>भाड्याने घर हवे<\/b> (कामगार, स्थलांतरित) → ARH: परवडणारे भाडेघर<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "यापैकी <b>एकच<\/b> पर्याय वापरता येतो. ISS मध्ये ₹35 लाखांपर्यंतच्या घरासाठी ₹25 लाखांपर्यंतच्या कर्जावर <b>₹1.80 लाखांपर्यंत<\/b> व्याज अनुदान मिळते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>कुटुंबातील <b>सर्व सदस्यांचे<\/b> आधार<\/li><li>उत्पन्नाचा दाखला / ITR<\/li><li><b>आधारशी लिंक<\/b> असलेले बँक खाते<\/li><li>पक्के घर नसल्याचे स्वयंघोषणापत्र<\/li><li>BLC साठी: तुमच्या नावावरील <b>जागा / मालमत्ता पत्रक<\/b><\/li><li>लागू असल्यास जातीचा दाखला<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जागा तुमच्या नावावर नाही? आधी मालमत्ता पत्रक / फेरफार अद्ययावत करा. BLC साठी जागा कुटुंबाच्या नावावर असावी लागते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>pmay-urban.gov.in<\/b> (आधार OTP)<\/li><li>तुमच्या <b>महानगरपालिका / नगरपरिषदेतील<\/b> PMAY कक्ष<\/li><li>ISS साठी: तुमच्या <b>बँक / गृहवित्त कंपनीमार्फतही<\/b><\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>बनावट PMAY वेबसाइट आणि एजंटपासून<\/b> सावध राहा. अर्ज मोफत आहे. \"निवड करून देण्यासाठी\" कोणालाही पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार / बँक", "title": "अर्जाची तपासणी", "body": "<b>नागरी स्थानिक स्वराज्य संस्था<\/b> (महानगरपालिका / नगरपरिषद) तुमची माहिती तपासते. BLC साठी जागेचीही पाहणी होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? नेहमीची कारणे: कुटुंबातील कोणाचे आधीच पक्के घर आहे, किंवा उत्पन्न जुळत नाही. कारण वाचा, दुरुस्त करून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "gov", "who": "सरकार / बँक", "title": "मंजुरी आणि रक्कम", "body": "<ul><li><b>BLC<\/b>: बांधकामानुसार हप्त्यांमध्ये पैसे, प्रत्येक टप्प्यावर <b>जिओ-टॅग फोटो<\/b><\/li><li><b>AHP<\/b>: फ्लॅटचे वाटप (बहुतेक वेळा सोडतीने)<\/li><li><b>ISS<\/b>: अनुदान तुमच्या <b>गृहकर्ज खात्यात<\/b> वार्षिक हप्त्यांमध्ये जमा, त्यामुळे EMI कमी होतो<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "BLC हप्ता अडकला? बहुतेक वेळा टप्प्याचा फोटो अपलोड किंवा तपासणी झालेली नसते. महापालिकेच्या PMAY कक्षात विचारा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "तुमचे घर तयार", "body": "तुमचे घर बांधून पूर्ण होते, किंवा फ्लॅटचा ताबा मिळतो, किंवा अनुदानामुळे तुमचे कर्ज स्वस्त होते.", "note": null}], "rights_t": "खूप दिवस अडकले? तक्रार करा.", "rights": "अर्ज क्रमांकासह <b>महापालिकेच्या PMAY कक्षाकडे<\/b> लेखी तक्रार द्या आणि <b>पोच<\/b> घ्या. ISS साठी आधी तुमच्या <b>बँकेकडे<\/b> तक्रार करा. <b>CPGRAMS<\/b> चाही वापर करता येतो.", "help": "<b>स्थिती तपासा:<\/b> pmay-urban.gov.in → अर्ज ट्रॅक करा (अर्ज क्रमांक)<br/><b>फक्त .gov.in वेबसाइट वापरा<\/b> · \"निवड करून देण्यासाठी\" कोणालाही पैसे देऊ नका"}}, {"slug": "sanjay-gandhi", "title": "Sanjay Gandhi Niradhar Yojana", "mr_name": "संजय गांधी निराधार अनुदान योजना", "audience": "Destitute below 65 (widows, disabled, ill)", "cat": "pension", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "Thane Collectorate: SGNY / Shravanbal page", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/", "gov": true}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([Destitute person needs support]) --> AG{Age below 65?}\n    AG -- No --> OA([Shravanbal / old-age pension: separate flow])\n    AG -- Yes --> E{1. Eligible category?<br/>widow, disabled 40+, serious illness,<br/>orphan, other destitute; low income}\n    E -- No --> X([Not eligible])\n    E -- Yes --> D[2. Documents<br/>Aadhaar, age + residence proof,<br/>income cert, category proof,<br/>seeded bank a/c]\n    D --> AP[3. Apply free<br/>Aaple Sarkar / Tahsil SGY branch<br/>application number + acknowledgement]\n    AP --> SC[4. Tahsil scrutiny<br/>Talathi local inquiry]\n    SC --> CM{5. Taluka SGY committee}\n    CM -- Rejected --> F1[Rejected: ask reason in writing]\n    CM -- Approved --> P[6. Monthly DBT payment]\n    P -- Bank not seeded --> F2[Payment failed]\n    P --> K[7. Keep running<br/>annual life certificate,<br/>report changes]\n    K -- Life certificate missed --> F3[Payment stopped]\n    K -- Turns 65 --> OA\n    SC -. pending long .-> T[Written application to Tahsildar SGY /<br/>Aaple Sarkar grievance]\n\n    S1[[Sathi: Category + scheme router<br/>SGNY vs Shravanbal]]:::sathi -.-> E\n    S2[[Sathi: Readiness check<br/>income cert, UDID, death cert, seeding]]:::sathi -.-> D\n    S3[[Sathi: Committee date + pending clock]]:::sathi -.-> T\n    S4[[Sathi: Life-certificate reminder]]:::sathi -.-> K\n    S5[[Sathi: Missed-payment tracker]]:::sathi -.-> F3\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Thane district: Sanjay Gandhi Niradhar Yojana", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/"}, {"label": "Gadchiroli district: Sanjay Gandhi Yojana", "url": "https://gadchiroli.gov.in/sanjay-gandhi-yojana/"}, {"label": "Vikaspedia: SGNY", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/sanjay-gandhi-niradhar-anudan-yojana-of-maharashtra-govt?lgn=en"}], "en": {"h1": "Sanjay Gandhi Niradhar Yojana: Monthly support for those without support", "benefit": "₹1,500 a month (₹2,500 for persons with disability) paid into your bank account", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You may be eligible if you are <b>below 65<\/b>, have lived in Maharashtra for many years, your family income is <b>up to ₹21,000 a year<\/b> (₹50,000 for persons with disability) or you are on the BPL list, and you are:<ul><li>A <b>widow<\/b>, divorced or abandoned woman<\/li><li>A person with <b>disability<\/b> (40% or more)<\/li><li>Suffering from a <b>serious illness<\/b> (e.g. TB, cancer, HIV, leprosy)<\/li><li>An <b>orphan child<\/b>, transgender person, or another destitute category<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Aged <b>65 or more<\/b>? Ask about the <b>Shravanbal<\/b> / old-age pension schemes instead."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, photo, ration card<\/li><li><b>Age proof<\/b> and <b>residence proof<\/b><\/li><li><b>Income certificate<\/b> from the Tahsildar<\/li><li>Category proof: husband's <b>death certificate<\/b> (widow), <b>disability certificate / UDID<\/b>, or <b>medical certificate<\/b> from a government hospital<\/li><li>Bank passbook, account <b>linked to Aadhaar<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No income certificate? Get it first on Aaple Sarkar. No disability certificate? Get it from the government (civil) hospital."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li><b>Aaple Sarkar<\/b> portal / Seva Kendra<\/li><li><b>Sanjay Gandhi Yojana branch<\/b> at your <b>Tahsil office<\/b>, or ask your Talathi for help<\/li><\/ul>Note your <b>application number<\/b> and keep the <b>acknowledgement<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never pay an agent to \"get it sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Papers are checked", "body": "The Tahsil office checks your papers. The <b>Talathi<\/b> may do a local inquiry about your situation and income.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked for more papers? Submit them quickly with your application number and take an acknowledgement."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Taluka committee approves", "body": "The <b>taluka-level Sanjay Gandhi Yojana committee<\/b> meets regularly and approves eligible applications.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Ask for the <b>reason in writing<\/b>. Fix the missing proof and apply again."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Money every month", "body": "The amount comes by <b>DBT<\/b> into your Aadhaar-linked bank account every month.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Check the bank account is <b>Aadhaar-seeded with DBT on<\/b> and active."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep it running", "body": "<ul><li>Submit your <b>life certificate (हयातीचा दाखला)<\/b> every year when asked<\/li><li>Tell the office about changes (address, bank, remarriage, etc.)<\/li><li>At <b>65<\/b>, ask to shift to the old-age pension scheme<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Money suddenly stopped? Usually the <b>life certificate<\/b> was not submitted or the bank link changed."}}], "rights_t": "Pending too long? Follow up.", "rights": "Give a <b>written application to the Tahsildar / Naib Tahsildar (Sanjay Gandhi Yojana)<\/b> with your application number and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>Aaple Sarkar<\/b>.", "help": "<b>Check status:<\/b> Aaple Sarkar (application number) or Tahsil office<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "संजय गांधी निराधार अनुदान योजना: निराधारांना दरमहा अनुदान", "benefit": "दरमहा ₹1,500 (दिव्यांगांना ₹2,500) थेट तुमच्या बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "तुमचे वय <b>65 पेक्षा कमी<\/b> असेल, अनेक वर्षांपासून महाराष्ट्रात राहत असाल, कौटुंबिक उत्पन्न <b>वर्षाला ₹21,000 पर्यंत<\/b> (दिव्यांगांसाठी ₹50,000) असेल किंवा BPL यादीत असाल, आणि तुम्ही:<ul><li><b>विधवा<\/b>, घटस्फोटित किंवा परित्यक्ता महिला<\/li><li><b>दिव्यांग<\/b> व्यक्ती (40% किंवा जास्त)<\/li><li><b>गंभीर आजाराने<\/b> ग्रस्त (उदा. क्षयरोग, कर्करोग, एचआयव्ही, कुष्ठरोग)<\/li><li><b>अनाथ मूल<\/b>, तृतीयपंथी, किंवा इतर निराधार प्रवर्ग<\/li><\/ul>असाल तर पात्र ठरू शकता.", "note": {"kind": "tip", "label": "सूचना:", "html": "वय <b>65 किंवा जास्त<\/b>? त्याऐवजी <b>श्रावणबाळ<\/b> / वृद्धापकाळ निवृत्तिवेतन योजनेबद्दल विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार, फोटो, रेशन कार्ड<\/li><li><b>वयाचा पुरावा<\/b> आणि <b>रहिवासाचा पुरावा<\/b><\/li><li>तहसीलदारांचा <b>उत्पन्नाचा दाखला<\/b><\/li><li>प्रवर्गाचा पुरावा: पतीचा <b>मृत्यू दाखला<\/b> (विधवा), <b>दिव्यांग प्रमाणपत्र / UDID<\/b>, किंवा सरकारी रुग्णालयाचे <b>वैद्यकीय प्रमाणपत्र<\/b><\/li><li><b>आधारशी लिंक<\/b> असलेल्या बँक खात्याचे पासबुक<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "उत्पन्नाचा दाखला नाही? आधी आपले सरकार वरून काढा. दिव्यांग प्रमाणपत्र नाही? सरकारी (जिल्हा) रुग्णालयातून मिळवा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>आपले सरकार<\/b> पोर्टल / सेवा केंद्र<\/li><li>तुमच्या <b>तहसील कार्यालयातील संजय गांधी योजना शाखा<\/b>, किंवा तलाठ्यांची मदत घ्या<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा आणि <b>पोच<\/b> जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज करणे <b>मोफत<\/b> आहे. \"मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील कार्यालय तुमची कागदपत्रे तपासते. तुमची परिस्थिती आणि उत्पन्नाबाबत <b>तलाठी<\/b> स्थानिक चौकशी करू शकतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "आणखी कागदपत्रे मागितली? अर्ज क्रमांकासह लवकर सादर करा आणि पोच घ्या."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "तालुका समितीची मंजुरी", "body": "<b>तालुकास्तरीय संजय गांधी योजना समिती<\/b> नियमितपणे बैठक घेऊन पात्र अर्ज मंजूर करते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? <b>कारण लेखी<\/b> मागा. राहिलेला पुरावा जोडून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दरमहा अनुदान जमा", "body": "रक्कम दर महिन्याला <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात येते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर पण पैसे आले नाहीत? बँक खाते <b>आधार-सीडेड, DBT सुरू<\/b> आणि चालू आहे का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अनुदान चालू ठेवा", "body": "<ul><li>दरवर्षी सांगितल्यावर <b>हयातीचा दाखला<\/b> सादर करा<\/li><li>बदल कळवा (पत्ता, बँक, पुनर्विवाह इ.)<\/li><li><b>65<\/b> वर्षे पूर्ण झाल्यावर वृद्धापकाळ निवृत्तिवेतन योजनेत बदलासाठी विचारा<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "पैसे अचानक बंद झाले? बहुतेक वेळा <b>हयातीचा दाखला<\/b> दिलेला नसतो किंवा बँक लिंक बदललेली असते."}}], "rights_t": "खूप दिवस प्रलंबित? पाठपुरावा करा.", "rights": "अर्ज क्रमांकासह <b>तहसीलदार / नायब तहसीलदार (संजय गांधी योजना)<\/b> यांना लेखी अर्ज द्या आणि <b>पोच<\/b> घ्या. <b>आपले सरकार<\/b> वर तक्रारही नोंदवता येते.", "help": "<b>स्थिती तपासा:<\/b> आपले सरकार (अर्ज क्रमांक) किंवा तहसील कार्यालय<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "shravanbal", "title": "Shravanbal Yojana", "mr_name": "श्रावणबाळ योजना", "audience": "Seniors 65+", "cat": "pension", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "Thane Collectorate: SGNY / Shravanbal page", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/", "gov": true}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([Elderly person needs pension]) --> AG{Age 65 or more?}\n    AG -- No --> SG([Below 65: see Sanjay Gandhi Niradhar Yojana])\n    AG -- Yes --> E{1. Eligible?<br/>MH resident, very low income}\n    E -- No --> X([Not eligible])\n    E -- Yes --> G{BPL list?}\n    G -- Yes --> GB[Group B<br/>state + central IGNOAPS share]\n    G -- No --> GA[Group A<br/>state pension]\n    GA --> D[2. Documents<br/>age proof or govt doctor certificate,<br/>residence, income cert, BPL proof if any,<br/>Aadhaar, seeded bank a/c]\n    GB --> D\n    D --> AP[3. Apply free<br/>Aaple Sarkar / Tahsil SGY branch<br/>family can apply on behalf]\n    AP --> SC[4. Tahsil scrutiny<br/>Talathi local inquiry]\n    SC --> CM{5. Taluka SGY committee}\n    CM -- Rejected --> F1[Rejected: ask reason in writing]\n    CM -- Approved --> P[6. Monthly DBT pension]\n    P -- Bank not seeded / inactive --> F2[Payment failed]\n    P --> K[7. Keep running<br/>annual life certificate]\n    K -- Life certificate missed --> F3[Pension stopped]\n    SC -. pending long .-> T[Written application to Tahsildar SGY /<br/>Aaple Sarkar grievance]\n\n    S1[[Sathi: Age + scheme router<br/>Shravanbal vs SGNY, Group A vs B]]:::sathi -.-> G\n    S2[[Sathi: Readiness check<br/>age proof options, income cert, seeding]]:::sathi -.-> D\n    S3[[Sathi: Assisted mode<br/>family / e-Seva operator applies]]:::sathi -.-> AP\n    S4[[Sathi: Committee date + pending clock]]:::sathi -.-> T\n    S5[[Sathi: Life-certificate reminder<br/>to family members]]:::sathi -.-> K\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Thane district: Sanjay Gandhi / Shravanbal", "url": "https://thane.nic.in/en/sanjay-ghandhi-niradhar-yojana/"}, {"label": "Gadchiroli district: Sanjay Gandhi Yojana", "url": "https://gadchiroli.gov.in/sanjay-gandhi-yojana/"}, {"label": "Public Services Map: Maharashtra schemes", "url": "https://www.publicservicesmap.in/schemes/maharashtra"}], "en": {"h1": "Shravanbal Yojana: Monthly pension for senior citizens", "benefit": "₹1,500 monthly pension for elderly people aged 65+, paid into the bank", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You / family", "title": "Check if you can get it", "body": "<ul><li>Aged <b>65 or more<\/b><\/li><li>Living in <b>Maharashtra<\/b> for many years<\/li><li>Family income <b>up to ₹21,000 a year<\/b>, or on the BPL list<\/li><\/ul>There are two groups: families <b>on the BPL list<\/b> (state + central pension together) and families <b>not on the BPL list<\/b> (state pension).", "note": {"kind": "tip", "label": "Tip:", "html": "Below 65 and a widow, disabled or seriously ill? See <b>Sanjay Gandhi Niradhar Yojana<\/b> instead."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Keep these papers ready", "body": "<ul><li><b>Age proof<\/b>: school leaving certificate, birth certificate, voter ID, or age certificate from a government doctor<\/li><li><b>Residence proof<\/b><\/li><li><b>Income certificate<\/b> from the Tahsildar<\/li><li><b>BPL card / list extract<\/b>, if on the BPL list<\/li><li>Aadhaar, photo, bank passbook (account <b>linked to Aadhaar<\/b>)<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No birth or school record? A <b>government doctor's age certificate<\/b> is usually accepted."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Apply (it is free)", "body": "Choose any one:<ul><li><b>Aaple Sarkar<\/b> portal / Seva Kendra<\/li><li><b>Sanjay Gandhi Yojana branch<\/b> at your <b>Tahsil office<\/b>, or ask your Talathi for help<\/li><\/ul>A family member can apply on behalf of the elderly person. Note the <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never pay an agent to \"get it sanctioned\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Papers are checked", "body": "The Tahsil office checks age, residence and income. The <b>Talathi<\/b> may do a local inquiry.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked for more papers? Submit them quickly with the application number and take an acknowledgement."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Taluka committee approves", "body": "The <b>taluka-level Sanjay Gandhi Yojana committee<\/b> also approves Shravanbal applications at its regular meetings.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Ask for the <b>reason in writing<\/b>. Fix the missing proof and apply again."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Pension every month", "body": "The pension comes by <b>DBT<\/b> into the Aadhaar-linked bank account every month.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Check the bank account is <b>Aadhaar-seeded with DBT on<\/b> and active."}}, {"phase": null, "kind": "you", "who": "You / family", "title": "Keep it running", "body": "<ul><li>Submit the <b>life certificate (हयातीचा दाखला)<\/b> every year when asked<\/li><li>Keep the bank account active<\/li><li>Tell the office about any change of address or bank<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pension suddenly stopped? Usually the <b>life certificate<\/b> was not submitted. Family members: set a yearly reminder."}}], "rights_t": "Pending too long? Follow up.", "rights": "Give a <b>written application to the Tahsildar / Naib Tahsildar (Sanjay Gandhi Yojana)<\/b> with the application number and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>Aaple Sarkar<\/b>.", "help": "<b>Check status:<\/b> Aaple Sarkar (application number) or Tahsil office<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "mr": {"h1": "श्रावणबाळ योजना: ज्येष्ठ नागरिकांना दरमहा निवृत्तिवेतन", "benefit": "65 वर्षांवरील ज्येष्ठांना दरमहा ₹1,500 निवृत्तिवेतन, थेट बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "पात्रता तपासा", "body": "<ul><li>वय <b>65 किंवा जास्त<\/b><\/li><li>अनेक वर्षांपासून <b>महाराष्ट्रात<\/b> राहत असलेले<\/li><li>कौटुंबिक उत्पन्न <b>वर्षाला ₹21,000 पर्यंत<\/b>, किंवा BPL यादीत<\/li><\/ul>दोन गट आहेत: <b>दारिद्र्यरेषेखालील (BPL) यादीतील<\/b> कुटुंबे (राज्य + केंद्र निवृत्तिवेतन एकत्र) आणि <b>BPL यादीत नसलेली<\/b> कुटुंबे (राज्य निवृत्तिवेतन).", "note": {"kind": "tip", "label": "सूचना:", "html": "वय 65 पेक्षा कमी आणि विधवा, दिव्यांग किंवा गंभीर आजारी? त्याऐवजी <b>संजय गांधी निराधार अनुदान योजना<\/b> पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>वयाचा पुरावा<\/b>: शाळा सोडल्याचा दाखला, जन्म दाखला, मतदार ओळखपत्र, किंवा सरकारी डॉक्टरांचे वयाचे प्रमाणपत्र<\/li><li><b>रहिवासाचा पुरावा<\/b><\/li><li>तहसीलदारांचा <b>उत्पन्नाचा दाखला<\/b><\/li><li>BPL यादीत असल्यास <b>BPL कार्ड / यादीचा उतारा<\/b><\/li><li>आधार, फोटो, बँक पासबुक (खाते <b>आधारशी लिंक<\/b>)<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जन्म किंवा शाळेचा दाखला नाही? <b>सरकारी डॉक्टरांचे वयाचे प्रमाणपत्र<\/b> सहसा चालते."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>आपले सरकार<\/b> पोर्टल / सेवा केंद्र<\/li><li>तुमच्या <b>तहसील कार्यालयातील संजय गांधी योजना शाखा<\/b>, किंवा तलाठ्यांची मदत घ्या<\/li><\/ul>ज्येष्ठ व्यक्तीच्या वतीने कुटुंबीय अर्ज करू शकतात. <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज करणे <b>मोफत<\/b> आहे. \"मंजूर करून देण्यासाठी\" एजंटला पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील कार्यालय वय, रहिवास आणि उत्पन्न तपासते. <b>तलाठी<\/b> स्थानिक चौकशी करू शकतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "आणखी कागदपत्रे मागितली? अर्ज क्रमांकासह लवकर सादर करा आणि पोच घ्या."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "तालुका समितीची मंजुरी", "body": "<b>तालुकास्तरीय संजय गांधी योजना समिती<\/b> नियमित बैठकीत श्रावणबाळ अर्जही मंजूर करते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? <b>कारण लेखी<\/b> मागा. राहिलेला पुरावा जोडून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दरमहा निवृत्तिवेतन जमा", "body": "निवृत्तिवेतन दर महिन्याला <b>DBT<\/b> द्वारे आधार-लिंक बँक खात्यात येते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर पण पैसे आले नाहीत? बँक खाते <b>आधार-सीडेड, DBT सुरू<\/b> आणि चालू आहे का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही / कुटुंबीय", "title": "निवृत्तिवेतन चालू ठेवा", "body": "<ul><li>दरवर्षी सांगितल्यावर <b>हयातीचा दाखला<\/b> सादर करा<\/li><li>बँक खाते चालू ठेवा<\/li><li>पत्ता किंवा बँक बदलल्यास कार्यालयाला कळवा<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "निवृत्तिवेतन अचानक बंद झाले? बहुतेक वेळा <b>हयातीचा दाखला<\/b> दिलेला नसतो. कुटुंबीयांनो: दरवर्षीचे स्मरण ठेवा."}}], "rights_t": "खूप दिवस प्रलंबित? पाठपुरावा करा.", "rights": "अर्ज क्रमांकासह <b>तहसीलदार / नायब तहसीलदार (संजय गांधी योजना)<\/b> यांना लेखी अर्ज द्या आणि <b>पोच<\/b> घ्या. <b>आपले सरकार<\/b> वर तक्रारही नोंदवता येते.", "help": "<b>स्थिती तपासा:<\/b> आपले सरकार (अर्ज क्रमांक) किंवा तहसील कार्यालय<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "shiv-bhojan", "title": "Shiv Bhojan Thali", "mr_name": "शिवभोजन थाळी", "audience": "Anyone (₹10 meal); centre operators", "cat": "pension", "links": [{"label": "Food & Civil Supplies Dept: Shiv Bhojan page", "url": "https://mahafood.gov.in/en/shivbhojan/", "gov": true}], "mermaid": "flowchart TD\n    subgraph DINER [Citizen: eating a thali]\n    A([Needs an affordable meal]) --> F[1. Find a Shiv Bhojan centre<br/>near hospital, bus stand, market]\n    F --> O{Centre open +<br/>plates left?}\n    O -- No --> F0[Closed / plates over:<br/>try next
