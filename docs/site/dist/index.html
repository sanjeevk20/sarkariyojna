"Plan your business", "body": "Choose the activity and write a simple <b>project report<\/b>: what you will make or sell, machines or stock needed, and total cost.", "note": {"kind": "tip", "label": "Tip:", "html": "The district industries centre (DIC) can help you shape the project report for free."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, PAN, photo<\/li><li>Education and training certificates<\/li><li>Project report<\/li><li>Bank account details<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Apply online", "body": "Apply on the <b>UP MSME portal<\/b> (CM-YUVA, via msme1connect.up.gov.in) and choose a bank branch. Keep the <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. No agent can 'guarantee' a loan."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "DIC scrutiny", "body": "The <b>District Industries Centre<\/b> checks your application and forwards it to the bank.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Returned by DIC? Fix the project report or documents and resubmit."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Bank sanction", "body": "The bank appraises the project and sanctions the loan. No collateral should be asked for under the scheme.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Bank sitting on the file? Tell the DIC; banks have been told to speed up CM-YUVA loans."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Loan received", "body": "Money is released for your business. Repay <b>on time<\/b> to keep it interest-free and qualify for a larger second-phase loan.", "note": null}], "rights_t": "Stuck with the bank or DIC? Escalate.", "rights": "Contact the <b>General Manager, District Industries Centre<\/b>, use the MSME helpline shown on the portal, or complain on <b>IGRS Jansunwai<\/b> / <b>CM Helpline 1076<\/b>.", "help": "<b>Apply:<\/b> UP MSME portal (CM-YUVA) via msme1connect.up.gov.in · Loan terms as reported; check the current notice<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "सीएम-युवा: व्यवसाय शुरू करने के लिए ₹5 लाख तक ब्याज-मुक्त ऋण", "benefit": "₹5 लाख तक बिना ब्याज और बिना गारंटी ऋण, साथ में 10% मार्जिन मनी सब्सिडी (बताए अनुसार)", "steps": [{"phase": "आवेदन से पहले", "kind": "you", "who": "आप", "title": "पात्रता जांचें", "body": "<ul><li><b>21 से 40 वर्ष<\/b> के उत्तर प्रदेश निवासी<\/li><li>कम से कम <b>कक्षा 8<\/b> पास<\/li><li>किसी सरकारी योजना में कौशल प्रशिक्षण मददगार है (अक्सर प्राथमिकता)<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "आप", "title": "अपने व्यवसाय की योजना बनाएं", "body": "काम चुनें और सरल <b>परियोजना रिपोर्ट<\/b> लिखें: क्या बनाएंगे या बेचेंगे, कौन सी मशीन या माल चाहिए, और कुल लागत।", "note": {"kind": "tip", "label": "सुझाव:", "html": "ज़िला उद्योग केंद्र (डीआईसी) परियोजना रिपोर्ट बनाने में मुफ़्त मदद कर सकता है।"}}, {"phase": null, "kind": "you", "who": "आप", "title": "कागज़ तैयार रखें", "body": "<ul><li>आधार, पैन, फोटो<\/li><li>शिक्षा और प्रशिक्षण प्रमाण पत्र<\/li><li>परियोजना रिपोर्ट<\/li><li>बैंक खाते का विवरण<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "आप", "title": "ऑनलाइन आवेदन करें", "body": "<b>यूपी एमएसएमई पोर्टल<\/b> (सीएम-युवा, msme1connect.up.gov.in से) पर आवेदन करें और बैंक शाखा चुनें। <b>आवेदन आईडी<\/b> रखें।", "note": {"kind": "tip", "label": "सुझाव:", "html": "आवेदन <b>मुफ़्त<\/b> है। कोई एजेंट ऋण की 'गारंटी' नहीं दे सकता।"}}, {"phase": "आवेदन के बाद", "kind": "gov", "who": "सरकार", "title": "डीआईसी जांच", "body": "<b>ज़िला उद्योग केंद्र<\/b> आवेदन जांच कर बैंक को भेजता है।", "note": {"kind": "stuck", "label": "अटक गए?", "html": "डीआईसी ने लौटाया? परियोजना रिपोर्ट या दस्तावेज़ ठीक कर दोबारा जमा करें।"}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "बैंक स्वीकृति", "body": "बैंक परियोजना का आकलन कर ऋण स्वीकृत करता है। योजना में गारंटी (कोलैटरल) नहीं मांगी जानी चाहिए।", "note": {"kind": "stuck", "label": "अटक गए?", "html": "बैंक फाइल रोक रहा है? डीआईसी को बताएं; बैंकों को सीएम-युवा ऋण जल्दी देने के निर्देश हैं।"}}, {"phase": null, "kind": "done", "who": "पूरा", "title": "ऋण मिला", "body": "व्यवसाय के लिए राशि जारी होती है। ब्याज-मुक्त रखने और दूसरे चरण का बड़ा ऋण पाने के लिए <b>समय पर<\/b> किस्त चुकाएं।", "note": null}], "rights_t": "बैंक या डीआईसी में अटके? आगे बढ़ाएं।", "rights": "<b>महाप्रबंधक, ज़िला उद्योग केंद्र<\/b> से संपर्क करें, पोर्टल पर दी गई एमएसएमई हेल्पलाइन का उपयोग करें, या <b>आईजीआरएस जनसुनवाई<\/b> / <b>मुख्यमंत्री हेल्पलाइन 1076<\/b> पर शिकायत करें।", "help": "<b>आवेदन:<\/b> यूपी एमएसएमई पोर्टल (सीएम-युवा), msme1connect.up.gov.in से · ऋण की शर्तें बताए अनुसार; वर्तमान सूचना देखें<br/><b>आवेदन मुफ़्त है<\/b> · <b>केवल आधिकारिक वेबसाइट का उपयोग करें<\/b>"}}, {"slug": "ka-pm-kisan", "title": "PM-KISAN (Karnataka, FRUITS)", "local_name": "ಪಿಎಂ-ಕಿಸಾನ್ (ಕರ್ನಾಟಕ)", "audience": "Landholding farmers in Karnataka", "state": "ka", "local": "kn", "cat": "farm", "links": [{"label": "PM-KISAN: register, eKYC, Know Your Status", "url": "https://pmkisan.gov.in", "gov": true}, {"label": "FRUITS: Karnataka farmer registry", "url": "https://fruits.karnataka.gov.in", "gov": false}, {"label": "NeGD: FRUITS state directory entry", "url": "https://negd.gov.in/isl/Directory/statedata/408", "gov": true}, {"label": "PM-KISAN helpline: 155261 / 011-24300606", "url": null, "gov": true}], "mermaid": "flowchart TD\n    A([Karnataka farmer]) --> K{Name on RTC and not excluded?}\n    K -- Land in parent's name --> F0[Mutation first]\n    K -- Yes --> FR[FRUITS ID at Raitha Samparka Kendra]\n    FR --> REG[Register on PM-KISAN, Seva Sindhu or RSK]\n    REG --> V{FRUITS matches RTC owner name with Aadhaar}\n    V -- Mismatch --> F1[Correct Aadhaar or RTC, ask RSK to re-verify]\n    V -- OK --> EK[eKYC: OTP, face app or fingerprint]\n    EK --> RFT[State signs RFT, FTO generated]\n    RFT --> PAY([Rs 2,000 by DBT every four months])\n    PAY -. Instalment missing .-> F2[Check eKYC, land seeding, Aadhaar-bank link]\n\n    S1[[Sathi: Aadhaar vs RTC name match check]]:::sathi -.-> V\n    S2[[Sathi: status explainer for RFT and FTO]]:::sathi -.-> RFT\n    S3[[Sathi: missing-instalment diagnosis]]:::sathi -.-> F2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "NeGD: FRUITS", "url": "https://negd.gov.in/isl/Directory/statedata/408"}, {"label": "AgroSpectrum: Karnataka unifies farmers' land data in FRUITS", "url": "https://agrospectrumindia.com/news/8/24708/karnataka-unifies-farmers-land-data-in-unique-fruits-portal.html"}, {"label": "pmkisan.gov.in", "url": "https://pmkisan.gov.in/"}], "verified": "2026-10-27", "en": {"h1": "PM-KISAN in Karnataka: Register through FRUITS", "benefit": "₹2,000 into your bank account, three times a year", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "Your name must be on the <b>RTC (pahani)<\/b>. You <b>cannot<\/b> get it if someone in the family pays income tax, holds a government job, or is a practising doctor, lawyer, CA or engineer.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the mutation done first. See the <b>Land mutation (Karnataka)<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Get your FRUITS ID", "body": "Karnataka uses <b>FRUITS<\/b>, a farmer database linked to <b>Bhoomi<\/b>, to match your Aadhaar name with the RTC. Register at the <b>Raitha Samparka Kendra<\/b> or on fruits.karnataka.gov.in.", "note": {"kind": "tip", "label": "Tip:", "html": "Your FRUITS ID is also used for crop insurance, input subsidies and crop loans. Keep it handy."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>RTC (pahani)<\/li><li>Aadhaar<\/li><li>Bank passbook (account <b>linked to Aadhaar<\/b>)<\/li><li>Mobile linked to Aadhaar<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Register for PM-KISAN", "body": "Register on <b>pmkisan.gov.in<\/b>, through <b>Seva Sindhu<\/b>, or at the Raitha Samparka Kendra. Note your <b>registration number<\/b>.", "note": null}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Land and name verification", "body": "FRUITS compares the RTC owner name with your Aadhaar name; the state then approves you.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Name mismatch between Aadhaar and RTC? Correct one of them (Aadhaar centre or taluk office), then ask the Raitha Samparka Kendra to re-verify."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do eKYC", "body": "Complete eKYC by OTP on pmkisan.gov.in, face authentication in the PM-KISAN app, or fingerprint at a CSC.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Without eKYC, payments <b>stop<\/b>."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Payment processed", "body": "Status shows <span class=\"status\">RFT signed by State Govt<\/span>, then <span class=\"status\">FTO generated<\/span>. Just wait.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "₹2,000 in your account", "body": "You get an SMS. This repeats every four months while eKYC, land seeding and bank linking stay correct.", "note": null}], "rights_t": "Instalment missing? Complain.", "rights": "Check status on pmkisan.gov.in, then contact the <b>Raitha Samparka Kendra<\/b> / Assistant Director of Agriculture, or the PM-KISAN helpline <b>155261 / 011-24300606<\/b>.", "help": "<b>Register / status:<\/b> pmkisan.gov.in · <b>FRUITS:<\/b> fruits.karnataka.gov.in · <b>Helpline:<\/b> 155261 / 011-24300606<br/><b>Use only official websites<\/b> · <b>Never pay an agent<\/b>"}, "loc": {"h1": "ಕರ್ನಾಟಕದಲ್ಲಿ ಪಿಎಂ-ಕಿಸಾನ್: ಫ್ರೂಟ್ಸ್ ಮೂಲಕ ನೋಂದಣಿ", "benefit": "ವರ್ಷಕ್ಕೆ ಮೂರು ಬಾರಿ ₹2,000 ನೇರವಾಗಿ ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "ನಿಮ್ಮ ಹೆಸರು <b>ಪಹಣಿ (RTC)<\/b>ಯಲ್ಲಿ ಇರಬೇಕು. ಕುಟುಂಬದಲ್ಲಿ ಯಾರಾದರೂ ಆದಾಯ ತೆರಿಗೆ ಕಟ್ಟುತ್ತಿದ್ದರೆ, ಸರ್ಕಾರಿ ಉದ್ಯೋಗದಲ್ಲಿದ್ದರೆ, ಅಥವಾ ವೃತ್ತಿನಿರತ ವೈದ್ಯ, ವಕೀಲ, CA ಅಥವಾ ಎಂಜಿನಿಯರ್ ಆಗಿದ್ದರೆ ಸೌಲಭ್ಯ <b>ಸಿಗುವುದಿಲ್ಲ<\/b>.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಭೂಮಿ ಇನ್ನೂ ಪೋಷಕರ ಹೆಸರಿನಲ್ಲಿದೆಯೇ? ಮೊದಲು ಮ್ಯುಟೇಶನ್ ಮಾಡಿಸಿ. <b>ಭೂ ಮ್ಯುಟೇಶನ್ (ಕರ್ನಾಟಕ)<\/b> ಮಾರ್ಗದರ್ಶಿ ನೋಡಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಫ್ರೂಟ್ಸ್ ಐಡಿ ಪಡೆಯಿರಿ", "body": "ಕರ್ನಾಟಕವು ನಿಮ್ಮ ಆಧಾರ್ ಹೆಸರನ್ನು ಪಹಣಿಯೊಂದಿಗೆ ಹೋಲಿಸಲು <b>ಭೂಮಿ<\/b>ಗೆ ಜೋಡಿಸಿದ ರೈತ ದತ್ತಾಂಶ <b>ಫ್ರೂಟ್ಸ್ (FRUITS)<\/b> ಬಳಸುತ್ತದೆ. <b>ರೈತ ಸಂಪರ್ಕ ಕೇಂದ್ರ<\/b>ದಲ್ಲಿ ಅಥವಾ fruits.karnataka.gov.in ನಲ್ಲಿ ನೋಂದಾಯಿಸಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ನಿಮ್ಮ ಫ್ರೂಟ್ಸ್ ಐಡಿ ಬೆಳೆ ವಿಮೆ, ಸಹಾಯಧನ ಮತ್ತು ಬೆಳೆ ಸಾಲಕ್ಕೂ ಬಳಕೆಯಾಗುತ್ತದೆ. ಕೈಯಲ್ಲಿಡಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ದಾಖಲೆಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li>ಪಹಣಿ (RTC)<\/li><li>ಆಧಾರ್<\/li><li>ಬ್ಯಾಂಕ್ ಪಾಸ್‌ಬುಕ್ (ಖಾತೆ <b>ಆಧಾರ್‌ಗೆ ಜೋಡಣೆ<\/b>)<\/li><li>ಆಧಾರ್‌ಗೆ ಜೋಡಣೆಯಾದ ಮೊಬೈಲ್<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಪಿಎಂ-ಕಿಸಾನ್‌ಗೆ ನೋಂದಾಯಿಸಿ", "body": "<b>pmkisan.gov.in<\/b> ನಲ್ಲಿ, <b>ಸೇವಾ ಸಿಂಧು<\/b> ಮೂಲಕ, ಅಥವಾ ರೈತ ಸಂಪರ್ಕ ಕೇಂದ್ರದಲ್ಲಿ ನೋಂದಾಯಿಸಿ. <b>ನೋಂದಣಿ ಸಂಖ್ಯೆ<\/b> ಬರೆದಿಡಿ.", "note": null}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಭೂಮಿ ಮತ್ತು ಹೆಸರಿನ ಪರಿಶೀಲನೆ", "body": "ಫ್ರೂಟ್ಸ್ ಪಹಣಿಯ ಮಾಲೀಕರ ಹೆಸರನ್ನು ನಿಮ್ಮ ಆಧಾರ್ ಹೆಸರಿನೊಂದಿಗೆ ಹೋಲಿಸುತ್ತದೆ; ನಂತರ ರಾಜ್ಯ ಅನುಮೋದಿಸುತ್ತದೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಆಧಾರ್ ಮತ್ತು ಪಹಣಿಯಲ್ಲಿ ಹೆಸರು ಹೊಂದಿಕೆಯಿಲ್ಲವೇ? ಒಂದನ್ನು ಸರಿಪಡಿಸಿ (ಆಧಾರ್ ಕೇಂದ್ರ ಅಥವಾ ತಾಲೂಕು ಕಚೇರಿ), ನಂತರ ರೈತ ಸಂಪರ್ಕ ಕೇಂದ್ರದಲ್ಲಿ ಮರುಪರಿಶೀಲನೆ ಕೇಳಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಇ-ಕೆವೈಸಿ ಮಾಡಿ", "body": "pmkisan.gov.in ನಲ್ಲಿ OTP ಮೂಲಕ, ಪಿಎಂ-ಕಿಸಾನ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಮುಖ ದೃಢೀಕರಣದ ಮೂಲಕ, ಅಥವಾ CSC ಯಲ್ಲಿ ಬೆರಳಚ್ಚಿನ ಮೂಲಕ ಇ-ಕೆವೈಸಿ ಮಾಡಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಇ-ಕೆವೈಸಿ ಇಲ್ಲದೆ ಪಾವತಿ <b>ನಿಲ್ಲುತ್ತದೆ<\/b>."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಪಾವತಿ ಪ್ರಕ್ರಿಯೆ", "body": "ಸ್ಥಿತಿಯಲ್ಲಿ <span class=\"status\">RFT signed by State Govt<\/span>, ನಂತರ <span class=\"status\">FTO generated<\/span> ತೋರಿಸುತ್ತದೆ. ಕಾಯಿರಿ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಖಾತೆಗೆ ₹2,000", "body": "ನಿಮಗೆ SMS ಬರುತ್ತದೆ. ಇ-ಕೆವೈಸಿ, ಭೂಮಿ ಜೋಡಣೆ ಮತ್ತು ಬ್ಯಾಂಕ್ ಜೋಡಣೆ ಸರಿಯಾಗಿರುವವರೆಗೆ ಪ್ರತಿ ನಾಲ್ಕು ತಿಂಗಳಿಗೊಮ್ಮೆ ಬರುತ್ತದೆ.", "note": null}], "rights_t": "ಕಂತು ಬಂದಿಲ್ಲವೇ? ದೂರು ನೀಡಿ.", "rights": "pmkisan.gov.in ನಲ್ಲಿ ಸ್ಥಿತಿ ನೋಡಿ, ನಂತರ <b>ರೈತ ಸಂಪರ್ಕ ಕೇಂದ್ರ<\/b> / ಸಹಾಯಕ ಕೃಷಿ ನಿರ್ದೇಶಕರು, ಅಥವಾ ಪಿಎಂ-ಕಿಸಾನ್ ಸಹಾಯವಾಣಿ <b>155261 / 011-24300606<\/b> ಸಂಪರ್ಕಿಸಿ.", "help": "<b>ನೋಂದಣಿ / ಸ್ಥಿತಿ:<\/b> pmkisan.gov.in · <b>ಫ್ರೂಟ್ಸ್:<\/b> fruits.karnataka.gov.in · <b>ಸಹಾಯವಾಣಿ:<\/b> 155261 / 011-24300606<br/><b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b> · <b>ಏಜೆಂಟ್‌ಗೆ ಹಣ ಕೊಡಬೇಡಿ<\/b>"}}, {"slug": "ka-caste-income-certificate", "title": "Caste and income certificate (Karnataka)", "local_name": "ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ", "audience": "Students, job seekers, anyone applying to welfare schemes", "state": "ka", "local": "kn", "cat": "docs", "links": [{"label": "Nadakacheri (AJSK): certificates", "url": "https://nadakacheri.karnataka.gov.in", "gov": false}, {"label": "Tumkur district: Nadakacheri services page", "url": "https://tumkur.nic.in/?p=25892", "gov": true}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Citizen]) --> D[Papers: Aadhaar, ration card, income proof, family caste certificate]\n    D --> AP{Apply on Nadakacheri online, Grama One or Karnataka One}\n    AP --> N[Application number and fee receipt]\n    N --> V[Village Accountant and Revenue Inspector verify]\n    V -- Report OK --> T[Deputy Tahsildar or Tahsildar signs digitally]\n    V -- Details do not match --> F1[Correct papers and ask for re-verification]\n    T --> C([Certificate with RD number, verifiable online])\n    N -. Sakala time limit crossed .-> GR[Complain on IPGRS or at taluk office]\n\n    S1[[Sathi: document checklist and RD number store]]:::sathi -.-> D\n    S2[[Sathi: status tracker with Sakala time-limit alert]]:::sathi -.-> V\n    S3[[Sathi: complaint draft for IPGRS]]:::sathi -.-> GR\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1 blocked", "sources": [{"label": "Tumkur district: Nadakacheri", "url": "https://tumkur.nic.in/?p=25892"}, {"label": "LegalDev: Nadakacheri Karnataka 2026", "url": "https://legaldev.in/blog/nadakacheri-karnataka-caste-income-certificate"}, {"label": "Kanakkupillai: Nadakacheri income and caste certificate", "url": "https://kanakkupillai.com/learn/nadakacheri-income-caste-certificate-download-online-in-karnataka"}, {"label": "Corpseed: Nadakacheri certificate", "url": "https://www.corpseed.com/knowledge-centre/nadakacheri-income-caste-certificate-karnataka"}], "verified": "2026-10-27", "en": {"h1": "Caste and Income Certificate (Karnataka): Get it from Nadakacheri", "benefit": "Needed for scholarships, reservation, fee concessions and most welfare schemes", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Know where to apply", "body": "Apply through <b>Nadakacheri<\/b> (Atalji Janasnehi Kendra): online on <b>nadakacheri.karnataka.gov.in<\/b>, or at a Nadakacheri, <b>Grama One<\/b> or <b>Karnataka One<\/b> centre.", "note": {"kind": "tip", "label": "Tip:", "html": "Students usually need a combined <b>caste and income<\/b> certificate. Ask your college which form it needs."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar<\/li><li>Ration card or other address proof<\/li><li>Income proof (salary slip, or a self-declaration for farmers and daily-wage workers)<\/li><li>A family member's caste certificate, if any<\/li><li>Registered mobile number<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Submit and pay the fee", "body": "Submit the form and pay the small fee. Keep the <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Reported fee: about <b>₹15<\/b> for an income certificate. Do not pay agents more."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Village Accountant and Revenue Inspector check", "body": "The <b>Village Accountant<\/b> and <b>Revenue Inspector<\/b> verify your caste, residence and income and report to the taluk office.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Report stuck? Meet the Village Accountant with your application number. Income written wrongly? Ask for re-verification before it is signed."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Taluk office signs", "body": "The <b>Deputy Tahsildar / Tahsildar<\/b> approves and the certificate is <b>digitally signed<\/b> with an <b>RD number<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download or collect it", "body": "Download it with your application number, or collect it at the centre. Anyone can verify it online with the <b>RD number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Income certificates are reported to be valid for <b>12 months<\/b>. Scholarships ask for the RD number, so note it down."}}], "rights_t": "Taking too long? Complain.", "rights": "Certificates have time limits under <b>Sakala<\/b>. If yours is crossed, complain on <b>IPGRS<\/b> (ipgrs.karnataka.gov.in) or at the taluk office with your application number.", "help": "<b>Apply / status:<\/b> nadakacheri.karnataka.gov.in, Grama One, Karnataka One · <b>Complaints:<\/b> ipgrs.karnataka.gov.in<br/><b>Use only official websites<\/b> · <b>Never pay a tout<\/b>"}, "loc": {"h1": "ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ (ಕರ್ನಾಟಕ): ನಾಡಕಚೇರಿಯಿಂದ ಪಡೆಯಿರಿ", "benefit": "ವಿದ್ಯಾರ್ಥಿ ವೇತನ, ಮೀಸಲಾತಿ, ಶುಲ್ಕ ರಿಯಾಯಿತಿ ಮತ್ತು ಹೆಚ್ಚಿನ ಕಲ್ಯಾಣ ಯೋಜನೆಗಳಿಗೆ ಅಗತ್ಯ", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಎಲ್ಲಿ ಅರ್ಜಿ ಸಲ್ಲಿಸಬೇಕು", "body": "<b>ನಾಡಕಚೇರಿ<\/b> (ಅಟಲ್‌ಜೀ ಜನಸ್ನೇಹಿ ಕೇಂದ್ರ) ಮೂಲಕ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ: <b>nadakacheri.karnataka.gov.in<\/b> ನಲ್ಲಿ ಆನ್‌ಲೈನ್, ಅಥವಾ ನಾಡಕಚೇರಿ, <b>ಗ್ರಾಮ ಒನ್<\/b> ಅಥವಾ <b>ಕರ್ನಾಟಕ ಒನ್<\/b> ಕೇಂದ್ರದಲ್ಲಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ <b>ಜಾತಿ ಮತ್ತು ಆದಾಯ<\/b> ಸೇರಿದ ಪ್ರಮಾಣ ಪತ್ರ ಬೇಕು. ಯಾವ ನಮೂನೆ ಬೇಕು ಎಂದು ನಿಮ್ಮ ಕಾಲೇಜಿನಲ್ಲಿ ಕೇಳಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ದಾಖಲೆಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li>ಆಧಾರ್<\/li><li>ಪಡಿತರ ಚೀಟಿ ಅಥವಾ ಇತರ ವಿಳಾಸದ ಪುರಾವೆ<\/li><li>ಆದಾಯದ ಪುರಾವೆ (ಸಂಬಳ ಚೀಟಿ, ಅಥವಾ ರೈತರು ಮತ್ತು ದಿನಗೂಲಿ ಕಾರ್ಮಿಕರಿಗೆ ಸ್ವಯಂ ಘೋಷಣೆ)<\/li><li>ಕುಟುಂಬದ ಸದಸ್ಯರ ಜಾತಿ ಪ್ರಮಾಣ ಪತ್ರ, ಇದ್ದರೆ<\/li><li>ನೋಂದಾಯಿತ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿ ಶುಲ್ಕ ಪಾವತಿಸಿ", "body": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿ ಸಣ್ಣ ಶುಲ್ಕ ಪಾವತಿಸಿ. <b>ಅರ್ಜಿ ಸಂಖ್ಯೆಯನ್ನು<\/b> ಜೋಪಾನವಾಗಿಡಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ವರದಿಯಾದ ಶುಲ್ಕ: ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರಕ್ಕೆ ಸುಮಾರು <b>₹15<\/b>. ಮಧ್ಯವರ್ತಿಗಳಿಗೆ ಹೆಚ್ಚು ಹಣ ಕೊಡಬೇಡಿ."}}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಗ್ರಾಮ ಲೆಕ್ಕಾಧಿಕಾರಿ ಮತ್ತು ಕಂದಾಯ ನಿರೀಕ್ಷಕರ ಪರಿಶೀಲನೆ", "body": "<b>ಗ್ರಾಮ ಲೆಕ್ಕಾಧಿಕಾರಿ<\/b> ಮತ್ತು <b>ಕಂದಾಯ ನಿರೀಕ್ಷಕರು<\/b> ನಿಮ್ಮ ಜಾತಿ, ವಾಸ ಮತ್ತು ಆದಾಯವನ್ನು ಪರಿಶೀಲಿಸಿ ತಾಲೂಕು ಕಚೇರಿಗೆ ವರದಿ ನೀಡುತ್ತಾರೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ವರದಿ ತಡವಾಗಿದೆಯೇ? ಅರ್ಜಿ ಸಂಖ್ಯೆಯೊಂದಿಗೆ ಗ್ರಾಮ ಲೆಕ್ಕಾಧಿಕಾರಿಯನ್ನು ಭೇಟಿ ಮಾಡಿ. ಆದಾಯ ತಪ್ಪಾಗಿ ಬರೆದಿದೆಯೇ? ಸಹಿ ಆಗುವ ಮೊದಲು ಮರುಪರಿಶೀಲನೆ ಕೇಳಿ."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ತಾಲೂಕು ಕಚೇರಿಯಿಂದ ಸಹಿ", "body": "<b>ಉಪ ತಹಶೀಲ್ದಾರ್ / ತಹಶೀಲ್ದಾರ್<\/b> ಅನುಮೋದಿಸುತ್ತಾರೆ ಮತ್ತು ಪ್ರಮಾಣ ಪತ್ರಕ್ಕೆ <b>RD ಸಂಖ್ಯೆ<\/b>ಯೊಂದಿಗೆ <b>ಡಿಜಿಟಲ್ ಸಹಿ<\/b> ಆಗುತ್ತದೆ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ ಅಥವಾ ಪಡೆಯಿರಿ", "body": "ಅರ್ಜಿ ಸಂಖ್ಯೆಯಿಂದ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ, ಅಥವಾ ಕೇಂದ್ರದಲ್ಲಿ ಪಡೆಯಿರಿ. <b>RD ಸಂಖ್ಯೆ<\/b>ಯಿಂದ ಯಾರಾದರೂ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಪರಿಶೀಲಿಸಬಹುದು.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ <b>12 ತಿಂಗಳು<\/b> ಮಾನ್ಯ ಎಂದು ವರದಿಯಾಗಿದೆ. ವಿದ್ಯಾರ್ಥಿ ವೇತನಕ್ಕೆ RD ಸಂಖ್ಯೆ ಕೇಳುತ್ತಾರೆ, ಅದನ್ನು ಬರೆದಿಡಿ."}}], "rights_t": "ತುಂಬಾ ತಡವಾಗುತ್ತಿದೆಯೇ? ದೂರು ನೀಡಿ.", "rights": "<b>ಸಕಾಲ<\/b> ಅಡಿಯಲ್ಲಿ ಪ್ರಮಾಣ ಪತ್ರಗಳಿಗೆ ಸಮಯ ಮಿತಿ ಇದೆ. ಅದು ಮೀರಿದರೆ ಅರ್ಜಿ ಸಂಖ್ಯೆಯೊಂದಿಗೆ <b>IPGRS<\/b> (ipgrs.karnataka.gov.in) ನಲ್ಲಿ ಅಥವಾ ತಾಲೂಕು ಕಚೇರಿಯಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಅರ್ಜಿ / ಸ್ಥಿತಿ:<\/b> nadakacheri.karnataka.gov.in, ಗ್ರಾಮ ಒನ್, ಕರ್ನಾಟಕ ಒನ್ · <b>ದೂರು:<\/b> ipgrs.karnataka.gov.in<br/><b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b> · <b>ಮಧ್ಯವರ್ತಿಗೆ ಹಣ ಕೊಡಬೇಡಿ<\/b>"}}, {"slug": "ka-land-mutation", "title": "Land mutation and RTC update (Karnataka)", "local_name": "ಪಹಣಿ ಖಾತೆ ಬದಲಾವಣೆ (ಮ್ಯುಟೇಶನ್)", "audience": "Land buyers, gift receivers, heirs", "state": "ka", "local": "kn", "cat": "docs", "links": [{"label": "Bhoomi: View RTC and MR", "url": "https://landrecords.karnataka.gov.in", "gov": false}, {"label": "Kaveri 2.0: property registration", "url": "https://kaveri.karnataka.gov.in", "gov": false}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Buyer]) --> R[Deed registered at Sub-Registrar on Kaveri 2.0]\n    R --> J{J-slip reaches Bhoomi?}\n    J -- No, data mismatch --> F1[Visit taluk Bhoomi centre with deed]\n    J -- Yes --> MR[Mutation entry MR opened]\n    F1 --> MR\n    MR --> NT[Notice to parties, objection period]\n    NT -- No objection --> AP[Revenue officer certifies mutation]\n    NT -- Objection --> H[Disputed hearing before revenue officer]\n    H --> AP\n    AP --> RTC([Owner column updated on RTC])\n    AP -. Rejected .-> AC[Appeal, usually to Assistant Commissioner]\n\n    S1[[Sathi: deed vs RTC mismatch check before registration]]:::sathi -.-> R\n    S2[[Sathi: MR watcher, alerts if no entry in two weeks]]:::sathi -.-> J\n    S3[[Sathi: hearing checklist]]:::sathi -.-> H\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,H,AC blocked", "sources": [{"label": "KS&K: Karnataka automatic e-mutation", "url": "https://ksandk.com/newsletter/karnatakas-automatic-e-mutation-changes/"}, {"label": "Adda247: automatic property mutation system", "url": "https://currentaffairs.adda247.com/karnataka-introduces-automatic-property-mutation-system-to-speed-up-land-transactions/"}, {"label": "1acre: Bhoomi mutation", "url": "https://1acre.in/guides/karnataka/bhoomi-mutation"}, {"label": "The Realty Today: 98 percent of khata transfers automated", "url": "https://therealtytoday.com/news/news/karnataka-automates-98-of-khata-transfers-over-35-lakh-property-mutations-already-processed/"}, {"label": "Bajaj Finserv: Bhoomi RTC mutation status", "url": "https://www.bajajfinserv.in/bhoomi-rtc-mutation-status"}], "verified": "2026-10-27", "en": {"h1": "Land Mutation (Karnataka): Get your name on the RTC (pahani)", "benefit": "Your name in the land record, needed for crop loans, PM-KISAN, sale and compensation", "steps": [{"phase": "At registration", "kind": "you", "who": "You", "title": "Register the sale or gift deed", "body": "Register at the <b>Sub-Registrar office<\/b> (Kaveri 2.0). Make sure names and survey / hissa numbers match the RTC exactly.", "note": {"kind": "stuck", "label": "Stuck?", "html": "A spelling or survey-number mismatch can make automatic mutation <b>fail silently<\/b>. Check the deed against the RTC before you sign."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Mutation starts automatically", "body": "Registration sends a <b>J-slip<\/b> from Kaveri to <b>Bhoomi<\/b>, which opens a mutation entry (MR).", "note": {"kind": "tip", "label": "Tip:", "html": "For land you inherit, there is no deed. Ask the <b>Village Accountant<\/b> or Nadakacheri about mutation by succession."}}, {"phase": null, "kind": "you", "who": "You", "title": "Watch for the MR entry", "body": "On <b>landrecords.karnataka.gov.in<\/b> (View RTC and MR), search by district, taluk, hobli, village and survey number.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No MR entry two weeks after registration? Go to the <b>taluk Bhoomi centre<\/b> with the deed. The system does not alert you."}}, {"phase": "After registration", "kind": "gov", "who": "Government", "title": "Notice and objection period", "body": "Notice is issued to the parties. If nobody objects, the mutation is approved after the notice period.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Someone objected? The case becomes disputed and goes to the revenue officer for a hearing. Bring the deed and witnesses."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Mutation approved", "body": "The revenue officer certifies the mutation and Bhoomi updates the owner column.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Your name on the RTC", "body": "Download the updated RTC and mutation extract from Bhoomi.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Order wrong or rejected? An appeal usually lies with the <b>Assistant Commissioner<\/b>. Ask the taluk office for the time limit."}}], "rights_t": "Stuck for weeks? Escalate.", "rights": "Visit the <b>Tahsildar<\/b> with the registration number and RTC copy, or complain on <b>IPGRS<\/b>.", "help": "<b>RTC and MR:<\/b> landrecords.karnataka.gov.in · <b>Registration:<\/b> Kaveri 2.0 · Urban khata updates on a separate system<br/><b>Use only official websites<\/b> · <b>Never pay a tout<\/b>"}, "loc": {"h1": "ಭೂ ಮ್ಯುಟೇಶನ್ (ಕರ್ನಾಟಕ): ಪಹಣಿಯಲ್ಲಿ (RTC) ನಿಮ್ಮ ಹೆಸರು ದಾಖಲಿಸಿ", "benefit": "ಭೂ ದಾಖಲೆಯಲ್ಲಿ ನಿಮ್ಮ ಹೆಸರು; ಬೆಳೆ ಸಾಲ, ಪಿಎಂ-ಕಿಸಾನ್, ಮಾರಾಟ ಮತ್ತು ಪರಿಹಾರಕ್ಕೆ ಅಗತ್ಯ", "steps": [{"phase": "ನೋಂದಣಿ ಸಮಯದಲ್ಲಿ", "kind": "you", "who": "ನೀವು", "title": "ಕ್ರಯ ಅಥವಾ ದಾನ ಪತ್ರ ನೋಂದಾಯಿಸಿ", "body": "<b>ಉಪ ನೋಂದಣಾಧಿಕಾರಿ ಕಚೇರಿಯಲ್ಲಿ<\/b> (ಕಾವೇರಿ 2.0) ನೋಂದಾಯಿಸಿ. ಹೆಸರುಗಳು ಮತ್ತು ಸರ್ವೆ / ಹಿಸ್ಸಾ ಸಂಖ್ಯೆಗಳು ಪಹಣಿಯೊಂದಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಲಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಹೆಸರಿನ ಕಾಗುಣಿತ ಅಥವಾ ಸರ್ವೆ ಸಂಖ್ಯೆ ಹೊಂದಿಕೆಯಾಗದಿದ್ದರೆ ಸ್ವಯಂ ಮ್ಯುಟೇಶನ್ <b>ಸದ್ದಿಲ್ಲದೆ ವಿಫಲವಾಗಬಹುದು<\/b>. ಸಹಿ ಮಾಡುವ ಮೊದಲು ಪತ್ರವನ್ನು ಪಹಣಿಯೊಂದಿಗೆ ಹೋಲಿಸಿ."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಮ್ಯುಟೇಶನ್ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಆರಂಭ", "body": "ನೋಂದಣಿಯಾದಾಗ ಕಾವೇರಿಯಿಂದ <b>ಭೂಮಿ<\/b>ಗೆ <b>ಜೆ-ಸ್ಲಿಪ್<\/b> ಹೋಗುತ್ತದೆ, ಅದು ಮ್ಯುಟೇಶನ್ ನಮೂದು (MR) ತೆರೆಯುತ್ತದೆ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಪಿತ್ರಾರ್ಜಿತ ಭೂಮಿಗೆ ಪತ್ರ ಇರುವುದಿಲ್ಲ. ವಾರಸಾ ಮ್ಯುಟೇಶನ್ ಬಗ್ಗೆ <b>ಗ್ರಾಮ ಲೆಕ್ಕಾಧಿಕಾರಿ<\/b> ಅಥವಾ ನಾಡಕಚೇರಿಯಲ್ಲಿ ಕೇಳಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "MR ನಮೂದನ್ನು ಗಮನಿಸಿ", "body": "<b>landrecords.karnataka.gov.in<\/b> ನಲ್ಲಿ (View RTC and MR) ಜಿಲ್ಲೆ, ತಾಲೂಕು, ಹೋಬಳಿ, ಗ್ರಾಮ ಮತ್ತು ಸರ್ವೆ ಸಂಖ್ಯೆಯಿಂದ ಹುಡುಕಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ನೋಂದಣಿಯ ಎರಡು ವಾರಗಳ ನಂತರವೂ MR ನಮೂದು ಇಲ್ಲವೇ? ಪತ್ರದೊಂದಿಗೆ <b>ತಾಲೂಕು ಭೂಮಿ ಕೇಂದ್ರಕ್ಕೆ<\/b> ಹೋಗಿ. ವ್ಯವಸ್ಥೆ ನಿಮಗೆ ತಿಳಿಸುವುದಿಲ್ಲ."}}, {"phase": "ನೋಂದಣಿಯ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ನೋಟಿಸ್ ಮತ್ತು ಆಕ್ಷೇಪಣೆ ಅವಧಿ", "body": "ಸಂಬಂಧಿಸಿದವರಿಗೆ ನೋಟಿಸ್ ಹೋಗುತ್ತದೆ. ಯಾರೂ ಆಕ್ಷೇಪಿಸದಿದ್ದರೆ ನೋಟಿಸ್ ಅವಧಿಯ ನಂತರ ಮ್ಯುಟೇಶನ್ ಅನುಮೋದನೆಯಾಗುತ್ತದೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಯಾರಾದರೂ ಆಕ್ಷೇಪಿಸಿದರೆ? ಪ್ರಕರಣ ವಿವಾದಿತವಾಗಿ ಕಂದಾಯ ಅಧಿಕಾರಿಯ ಮುಂದೆ ವಿಚಾರಣೆಗೆ ಹೋಗುತ್ತದೆ. ಪತ್ರ ಮತ್ತು ಸಾಕ್ಷಿಗಳನ್ನು ತನ್ನಿ."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಮ್ಯುಟೇಶನ್ ಅನುಮೋದನೆ", "body": "ಕಂದಾಯ ಅಧಿಕಾರಿ ಮ್ಯುಟೇಶನ್ ದೃಢೀಕರಿಸುತ್ತಾರೆ ಮತ್ತು ಭೂಮಿಯಲ್ಲಿ ಮಾಲೀಕರ ಕಾಲಂ ನವೀಕರಣವಾಗುತ್ತದೆ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಪಹಣಿಯಲ್ಲಿ ನಿಮ್ಮ ಹೆಸರು", "body": "ನವೀಕೃತ ಪಹಣಿ ಮತ್ತು ಮ್ಯುಟೇಶನ್ ಉದ್ಧರಣೆಯನ್ನು ಭೂಮಿಯಿಂದ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಆದೇಶ ತಪ್ಪಾಗಿದೆಯೇ ಅಥವಾ ತಿರಸ್ಕೃತವೇ? ಸಾಮಾನ್ಯವಾಗಿ <b>ಸಹಾಯಕ ಆಯುಕ್ತರಿಗೆ<\/b> ಮೇಲ್ಮನವಿ ಸಲ್ಲಿಸಬಹುದು. ಸಮಯ ಮಿತಿಯನ್ನು ತಾಲೂಕು ಕಚೇರಿಯಲ್ಲಿ ಕೇಳಿ."}}], "rights_t": "ವಾರಗಳಿಂದ ಅಡಚಣೆಯೇ? ಮೇಲಕ್ಕೆ ಕೊಂಡೊಯ್ಯಿರಿ.", "rights": "ನೋಂದಣಿ ಸಂಖ್ಯೆ ಮತ್ತು ಪಹಣಿ ಪ್ರತಿಯೊಂದಿಗೆ <b>ತಹಶೀಲ್ದಾರ್<\/b> ಅವರನ್ನು ಭೇಟಿ ಮಾಡಿ, ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಪಹಣಿ ಮತ್ತು MR:<\/b> landrecords.karnataka.gov.in · <b>ನೋಂದಣಿ:<\/b> ಕಾವೇರಿ 2.0 · ನಗರದ ಖಾತೆ ಬೇರೆ ವ್ಯವಸ್ಥೆಯಲ್ಲಿ ನವೀಕರಣವಾಗುತ್ತದೆ<br/><b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b> · <b>ಮಧ್ಯವರ್ತಿಗೆ ಹಣ ಕೊಡಬೇಡಿ<\/b>"}}, {"slug": "ka-yuva-nidhi", "title": "Yuva Nidhi (unemployment allowance)", "local_name": "ಯುವನಿಧಿ", "audience": "Unemployed graduates and diploma holders", "state": "ka", "local": "kn", "cat": "edu", "links": [{"label": "Seva Sindhu guarantee schemes portal", "url": "https://sevasindhugs.karnataka.gov.in", "gov": false}, {"label": "Vikaspedia: Yuva Nidhi", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-karnataka/yuva-nidhi-scheme-karnataka?lgn=en", "gov": true}, {"label": "Guarantee schemes helpline: 1902", "url": null, "gov": false}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Graduate or diploma holder]) --> E{Unemployed six months after passing, not studying or on stipend?}\n    E -- No --> X1[Not eligible]\n    E -- Yes --> AP[Apply on Seva Sindhu with self-declaration]\n    AP --> V{Skill Development checks degree on NAD}\n    V -- Degree not on NAD --> F1[Ask university to upload, inform employment office]\n    V -- OK --> PAY([Rs 3,000 graduates or Rs 1,500 diploma by DBT])\n    PAY --> M[Confirm unemployment every month]\n    M --> PAY\n    PAY -. Job found or two years done .-> END[Allowance stops: inform department]\n\n    S1[[Sathi: eligibility and NAD check]]:::sathi -.-> V\n    S2[[Sathi: monthly confirmation reminder]]:::sathi -.-> M\n    S3[[Sathi: job alert integration]]:::sathi -.-> END\n\n    classDef sathi fill:#FFF3CD,stroke:# nd": "gov", "who": "Government", "title": "Verification", "body": "The Skill Development department checks your degree (including on the <b>NAD<\/b> academic database) and eligibility.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Degree not found on NAD? Ask your university to upload it, then inform the district employment office."}}, {"phase": null, "kind": "you", "who": "You", "title": "Confirm every month", "body": "Keep confirming that you are still unemployed, as the portal asks, so the allowance continues.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Allowance in your account", "body": "Paid by DBT until you get a job or for a <b>maximum of two years<\/b>.", "note": null}], "rights_t": "Not paid? Ask for help.", "rights": "Contact the <b>district employment exchange<\/b> / Skill Development office, call <b>1902<\/b>, or complain on <b>IPGRS<\/b>.", "help": "<b>Apply:<\/b> sevasindhugs.karnataka.gov.in · <b>Helpline:<\/b> 1902 · Rules as at launch; check the current notice<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "ಯುವನಿಧಿ: ನಿರುದ್ಯೋಗಿ ಪದವೀಧರರಿಗೆ ಮಾಸಿಕ ಭತ್ಯೆ", "benefit": "ಪದವೀಧರರಿಗೆ ತಿಂಗಳಿಗೆ ₹3,000, ಡಿಪ್ಲೊಮಾದವರಿಗೆ ₹1,500, ಗರಿಷ್ಠ ಎರಡು ವರ್ಷ", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "<ul><li>ಕರ್ನಾಟಕದ ನಿವಾಸಿ, ಪದವೀಧರ ಅಥವಾ ಡಿಪ್ಲೊಮಾ ಹೊಂದಿದವರು<\/li><li>ಉತ್ತೀರ್ಣರಾದ ನಂತರ <b>ಆರು ತಿಂಗಳು ನಿರುದ್ಯೋಗಿ<\/b><\/li><li>ಉನ್ನತ ವ್ಯಾಸಂಗದಲ್ಲಿ ಇರಬಾರದು, ಅಪ್ರೆಂಟಿಸ್ ಶಿಷ್ಯವೇತನ ಪಡೆಯಬಾರದು, ಸರ್ಕಾರಿ ಯೋಜನೆಯ ಸಾಲದೊಂದಿಗೆ ಸ್ವಯಂ ಉದ್ಯೋಗಿ ಆಗಿರಬಾರದು, ಸರ್ಕಾರಿ ಉದ್ಯೋಗ ಇರಬಾರದು<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಇವುಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li>ಆಧಾರ್ ಮತ್ತು <b>ಆಧಾರ್ ಜೋಡಣೆಯಾದ ಬ್ಯಾಂಕ್ ಖಾತೆ<\/b><\/li><li>ಪದವಿ ಅಥವಾ ಡಿಪ್ಲೊಮಾ ಪ್ರಮಾಣ ಪತ್ರ ಮತ್ತು ಅಂಕಪಟ್ಟಿಗಳು<\/li><li>ನಿವಾಸದ ಪುರಾವೆ (ಕರ್ನಾಟಕದಲ್ಲಿ ವ್ಯಾಸಂಗ ಅಥವಾ ವಾಸ)<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಸೇವಾ ಸಿಂಧುವಿನಲ್ಲಿ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ", "body": "<b>ಸೇವಾ ಸಿಂಧು<\/b>ವಿನಲ್ಲಿ (ಯುವನಿಧಿ) ನೋಂದಾಯಿಸಿ, ದಾಖಲೆಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿ ಮತ್ತು ನೀವು ನಿರುದ್ಯೋಗಿ ಎಂಬ <b>ಸ್ವಯಂ ಘೋಷಣೆ<\/b>ಗೆ ಸಹಿ ಮಾಡಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಸುಳ್ಳು ಘೋಷಣೆಗೆ ವಸೂಲಾತಿ ಮತ್ತು ದಂಡ ಆಗಬಹುದು. ಉದ್ಯೋಗ ಸಿಕ್ಕ ತಕ್ಷಣ ಇಲಾಖೆಗೆ ತಿಳಿಸಿ."}}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಪರಿಶೀಲನೆ", "body": "ಕೌಶಲ್ಯಾಭಿವೃದ್ಧಿ ಇಲಾಖೆ ನಿಮ್ಮ ಪದವಿಯನ್ನು (<b>NAD<\/b> ಶೈಕ್ಷಣಿಕ ದತ್ತಾಂಶದಲ್ಲೂ) ಮತ್ತು ಅರ್ಹತೆಯನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "NAD ನಲ್ಲಿ ಪದವಿ ಇಲ್ಲವೇ? ನಿಮ್ಮ ವಿಶ್ವವಿದ್ಯಾಲಯಕ್ಕೆ ಅಪ್‌ಲೋಡ್ ಮಾಡಲು ಕೇಳಿ, ನಂತರ ಜಿಲ್ಲಾ ಉದ್ಯೋಗ ಕಚೇರಿಗೆ ತಿಳಿಸಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಪ್ರತಿ ತಿಂಗಳು ದೃಢೀಕರಿಸಿ", "body": "ಪೋರ್ಟಲ್ ಕೇಳಿದಂತೆ ನೀವು ಇನ್ನೂ ನಿರುದ್ಯೋಗಿ ಎಂದು ದೃಢೀಕರಿಸುತ್ತಿರಿ, ಆಗ ಭತ್ಯೆ ಮುಂದುವರಿಯುತ್ತದೆ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಖಾತೆಗೆ ಭತ್ಯೆ", "body": "ಉದ್ಯೋಗ ಸಿಗುವವರೆಗೆ ಅಥವಾ <b>ಗರಿಷ್ಠ ಎರಡು ವರ್ಷ<\/b> DBT ಮೂಲಕ ಪಾವತಿಯಾಗುತ್ತದೆ.", "note": null}], "rights_t": "ಹಣ ಬಂದಿಲ್ಲವೇ? ಸಹಾಯ ಪಡೆಯಿರಿ.", "rights": "<b>ಜಿಲ್ಲಾ ಉದ್ಯೋಗ ವಿನಿಮಯ<\/b> / ಕೌಶಲ್ಯಾಭಿವೃದ್ಧಿ ಕಚೇರಿ ಸಂಪರ್ಕಿಸಿ, <b>1902<\/b> ಗೆ ಕರೆ ಮಾಡಿ, ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಅರ್ಜಿ:<\/b> sevasindhugs.karnataka.gov.in · <b>ಸಹಾಯವಾಣಿ:<\/b> 1902 · ಆರಂಭದ ನಿಯಮಗಳು; ಚಾಲ್ತಿ ಸೂಚನೆ ನೋಡಿ<br/><b>ಅರ್ಜಿ ಉಚಿತ<\/b> · <b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b>"}}, {"slug": "ka-ssp-scholarship", "title": "SSP scholarship (Karnataka)", "local_name": "ಎಸ್‌ಎಸ್‌ಪಿ ವಿದ್ಯಾರ್ಥಿ ವೇತನ", "audience": "Pre-matric and post-matric students", "state": "ka", "local": "kn", "cat": "edu", "links": [{"label": "SSP Karnataka: register, apply, status", "url": "https://ssp.karnataka.gov.in", "gov": false}, {"label": "SSP post-matric portal", "url": "https://ssp.postmatric.karnataka.gov.in", "gov": false}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Student]) --> E{Category and income within e portal is final<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these ready", "body": "<ul><li>Student's and parents' Aadhaar<\/li><li><b>Caste and income certificate RD number<\/b> (Nadakacheri)<\/li><li>SSLC register number<\/li><li><b>Aadhaar-seeded bank account<\/b> in the student's name<\/li><li><b>Kutumba family ID<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "No RD number? Get the caste and income certificate first. See the <b>Caste and income certificate (Karnataka)<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Register and apply", "body": "On <b>ssp.karnataka.gov.in<\/b>, create an account with Aadhaar <b>eKYC<\/b>, then apply for pre-matric or post-matric before your department's deadline.", "note": {"kind": "tip", "label": "Tip:", "html": "Deadlines differ by department (Social Welfare, Backward Classes, Minorities, Tribal Welfare). Check yours on the portal."}}, {"phase": null, "kind": "you", "who": "You", "title": "Give documents to your institution", "body": "Submit the printout and fee receipt to your school or college scholarship section if asked.", "note": null}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Institution verifies", "body": "Your institution checks bonafide status, fees and marks online.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Not verified by the college? Remind the scholarship clerk before the institution deadline."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Department approves", "body": "The department checks eligibility and approves the payment.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Money in your account", "body": "Paid by <b>DBT<\/b> to the Aadhaar-seeded account. Track status on the SSP portal.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Payment failed? Usually an Aadhaar-seeding or NPCI-mapping problem. Fix it at the bank."}}], "rights_t": "Not paid? Follow up.", "rights": "Contact your department's taluk / district office (Social Welfare, Backward Classes, Minorities or Tribal Welfare), or complain on <b>IPGRS<\/b>.", "help": "<b>Apply / status:<\/b> ssp.karnataka.gov.in · Income limits and dates change each year; the portal is final<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "ಎಸ್‌ಎಸ್‌ಪಿ ವಿದ್ಯಾರ್ಥಿ ವೇತನ: ಕರ್ನಾಟಕ ರಾಜ್ಯ ವಿದ್ಯಾರ್ಥಿ ವೇತನ ಪೋರ್ಟಲ್", "benefit": "ವಿದ್ಯಾರ್ಥಿ ವೇತನ ಮತ್ತು ಶುಲ್ಕ ರಿಯಾಯಿತಿ ವಿದ್ಯಾರ್ಥಿಯ ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "<ul><li>ಮಾನ್ಯತೆ ಪಡೆದ ಶಾಲೆ ಅಥವಾ ಕಾಲೇಜಿನ ಕರ್ನಾಟಕದ ವಿದ್ಯಾರ್ಥಿ<\/li><li>ಮುಖ್ಯವಾಗಿ <b>ಪರಿಶಿಷ್ಟ ಜಾತಿ, ಪರಿಶಿಷ್ಟ ಪಂಗಡ, ಹಿಂದುಳಿದ ವರ್ಗ ಮತ್ತು ಅಲ್ಪಸಂಖ್ಯಾತ<\/b> ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ; ಪ್ರತಿ ಇಲಾಖೆ ತನ್ನದೇ ಆದಾಯ ಮಿತಿ ನಿಗದಿಪಡಿಸುತ್ತದೆ<\/li><li>ವರ್ಗವಾರು ಆದಾಯ ಮಿತಿ ಸಾಮಾನ್ಯವಾಗಿ <b>₹1 ಲಕ್ಷದಿಂದ ₹2.5 ಲಕ್ಷ<\/b> ಎಂದು ವರದಿ; ಪೋರ್ಟಲ್ ಅಂತಿಮ<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಇವುಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li>ವಿದ್ಯಾರ್ಥಿ ಮತ್ತು ಪೋಷಕರ ಆಧಾರ್<\/li><li><b>ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರದ RD ಸಂಖ್ಯೆ<\/b> (ನಾಡಕಚೇರಿ)<\/li><li>ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿ ನೋಂದಣಿ ಸಂಖ್ಯೆ<\/li><li>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರಿನಲ್ಲಿ <b>ಆಧಾರ್ ಜೋಡಣೆಯಾದ ಬ್ಯಾಂಕ್ ಖಾತೆ<\/b><\/li><li><b>ಕುಟುಂಬ ಐಡಿ<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "RD ಸಂಖ್ಯೆ ಇಲ್ಲವೇ? ಮೊದಲು ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ ಪಡೆಯಿರಿ. <b>ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ (ಕರ್ನಾಟಕ)<\/b> ಮಾರ್ಗದರ್ಶಿ ನೋಡಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ನೋಂದಾಯಿಸಿ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ", "body": "<b>ssp.karnataka.gov.in<\/b> ನಲ್ಲಿ ಆಧಾರ್ <b>ಇ-ಕೆವೈಸಿ<\/b>ಯೊಂದಿಗೆ ಖಾತೆ ತೆರೆಯಿರಿ, ನಂತರ ನಿಮ್ಮ ಇಲಾಖೆಯ ಕೊನೆಯ ದಿನಾಂಕದೊಳಗೆ ಮೆಟ್ರಿಕ್ ಪೂರ್ವ ಅಥವಾ ಮೆಟ್ರಿಕ್ ನಂತರದ ವಿದ್ಯಾರ್ಥಿ ವೇತನಕ್ಕೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಕೊನೆಯ ದಿನಾಂಕಗಳು ಇಲಾಖೆವಾರು ಬೇರೆ (ಸಮಾಜ ಕಲ್ಯಾಣ, ಹಿಂದುಳಿದ ವರ್ಗಗಳು, ಅಲ್ಪಸಂಖ್ಯಾತರು, ಪರಿಶಿಷ್ಟ ಪಂಗಡ ಕಲ್ಯಾಣ). ನಿಮ್ಮದನ್ನು ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ನೋಡಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಸಂಸ್ಥೆಗೆ ದಾಖಲೆ ನೀಡಿ", "body": "ಕೇಳಿದರೆ ಪ್ರಿಂಟ್‌ಔಟ್ ಮತ್ತು ಶುಲ್ಕದ ರಸೀದಿಯನ್ನು ಶಾಲೆ ಅಥವಾ ಕಾಲೇಜಿನ ವಿದ್ಯಾರ್ಥಿ ವೇತನ ವಿಭಾಗಕ್ಕೆ ನೀಡಿ.", "note": null}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಸಂಸ್ಥೆ ಪರಿಶೀಲಿಸುತ್ತದೆ", "body": "ನಿಮ್ಮ ಸಂಸ್ಥೆ ವ್ಯಾಸಂಗ ದೃಢೀಕರಣ, ಶುಲ್ಕ ಮತ್ತು ಅಂಕಗಳನ್ನು ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಪರಿಶೀಲಿಸುತ್ತದೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಕಾಲೇಜು ಪರಿಶೀಲಿಸಿಲ್ಲವೇ? ಸಂಸ್ಥೆಯ ಕೊನೆಯ ದಿನಾಂಕದ ಮೊದಲು ವಿದ್ಯಾರ್ಥಿ ವೇತನ ಗುಮಾಸ್ತರಿಗೆ ನೆನಪಿಸಿ."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಇಲಾಖೆ ಅನುಮೋದನೆ", "body": "ಇಲಾಖೆ ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ ಪಾವತಿ ಅನುಮೋದಿಸುತ್ತದೆ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಖಾತೆಗೆ ಹಣ", "body": "ಆಧಾರ್ ಜೋಡಣೆಯಾದ ಖಾತೆಗೆ <b>DBT<\/b> ಮೂಲಕ ಪಾವತಿ. ಎಸ್‌ಎಸ್‌ಪಿ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಸ್ಥಿತಿ ನೋಡಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಪಾವತಿ ವಿಫಲವೇ? ಹೆಚ್ಚಾಗಿ ಆಧಾರ್ ಜೋಡಣೆ ಅಥವಾ NPCI ಮ್ಯಾಪಿಂಗ್ ಸಮಸ್ಯೆ. ಬ್ಯಾಂಕಿನಲ್ಲಿ ಸರಿಪಡಿಸಿ."}}], "rights_t": "ಹಣ ಬಂದಿಲ್ಲವೇ? ಮತ್ತೆ ವಿಚಾರಿಸಿ.", "rights": "ನಿಮ್ಮ ಇಲಾಖೆಯ ತಾಲೂಕು / ಜಿಲ್ಲಾ ಕಚೇರಿ (ಸಮಾಜ ಕಲ್ಯಾಣ, ಹಿಂದುಳಿದ ವರ್ಗಗಳು, ಅಲ್ಪಸಂಖ್ಯಾತರು ಅಥವಾ ಪರಿಶಿಷ್ಟ ಪಂಗಡ ಕಲ್ಯಾಣ) ಸಂಪರ್ಕಿಸಿ, ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಅರ್ಜಿ / ಸ್ಥಿತಿ:<\/b> ssp.karnataka.gov.in · ಆದಾಯ ಮಿತಿ ಮತ್ತು ದಿನಾಂಕಗಳು ಪ್ರತಿ ವರ್ಷ ಬದಲಾಗುತ್ತವೆ; ಪೋರ್ಟಲ್ ಅಂತಿಮ<br/><b>ಅರ್ಜಿ ಉಚಿತ<\/b> · <b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b>"}}, {"slug": "ka-gruha-lakshmi", "title": "Gruha Lakshmi", "local_name": "ಗೃಹಲಕ್ಷ್ಮಿ", "audience": "Woman head of the family on the ration card", "state": "ka", "local": "kn", "cat": "women", "links": [{"label": "Seva Sindhu guarantee schemes portal", "url": "https://sevasindhugs.karnataka.gov.in", "gov": false}, {"label": "Vikaspedia: Gruha Lakshmi scheme", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-karnataka/gruha-lakshmi-scheme-karnataka?lgn=en", "gov": true}, {"label": "Guarantee schemes helpline: 1902", "url": null, "gov": false}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Woman head of family on ration card]) --> E{Self or husband a government employee or income-tax or GST filer?}\n    E -- Yes --> X1[Not eligible]\n    E -- No --> AP[Apply on Seva Sindhu, Grama One, Karnataka One or Bapuji Kendra]\n    AP --> ACK[Acknowledgement number]\n    ACK --> V{Department checks ration card, Aadhaar, tax data}\n    V -- Re-verification asked --> F1[Biometric re-verification at centre or home visit]\n    V -- OK --> PAY([Rs 2,000 a month by DBT])\n    F1 --> PAY\n    PAY -. Not received .-> F2[Fix Aadhaar seeding or DBT at bank, call 1902]\n\n    S1[[Sathi: eligibility check incl. tax and GST exclusion]]:::sathi -.-> E\n    S2[[Sathi: monthly credit tracker]]:::sathi -.-> PAY\n    S3[[Sathi: bank seeding fix guide and 1902 script]]:::sathi -.-> F2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class X1,F1,F2 blocked", "sources": [{"label": "Vikaspedia: Gruha Lakshmi scheme", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-karnataka/gruha-lakshmi-scheme-karnataka?lgn=en"}, {"label": "schemesinindia: Gruha Lakshmi 2026 guide", "url": "https://schemesinindia.in/blog/gruha-lakshmi-karnataka-2026-guide"}, {"label": "Policybazaar: Gruha Lakshmi", "url": "https://www.policybazaar.com/investment-plans/government-schemes/gruhalakshmi-scheme/"}, {"label": "Gracker: Gruhalakshmi 2026 status guide", "url": "https://gracker.ai/news/gruhalakshmi-scheme-2026-online-application-and-status-guide"}], "verified": "2026-10-27", "en": {"h1": "Gruha Lakshmi: ₹2,000 a month for the woman head of the family", "benefit": "₹2,000 a month by DBT to one woman per family", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>You are the <b>woman head of the family<\/b> on an AAY, BPL or APL ration card<\/li><li>Neither you nor your husband is a <b>government employee<\/b> or pays <b>income tax / files GST returns<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these ready", "body": "<ul><li>Ration card number<\/li><li>Aadhaar of you and your husband<\/li><li>Bank account <b>linked to Aadhaar<\/b> with DBT on<\/li><li>Mobile linked to Aadhaar<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Apply on <b>Seva Sindhu<\/b> or at a <b>Grama One<\/b>, <b>Karnataka One<\/b> or <b>Bapuji Seva Kendra<\/b>. Keep the <b>acknowledgement number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Never share your OTP or bank details with anyone who says they can 'release' a payment."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Verification", "body": "The department checks the ration card, Aadhaar and tax records. A <b>biometric re-verification<\/b> drive was reported in 2026.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Asked to re-verify? Do it at the centre or during the door-to-door visit, or payments may stop."}}, {"phase": null, "kind": "done", "who": "Done", "title": "₹2,000 every month", "body": "Money arrives by DBT, often in the first half of the month. Check status on Seva Sindhu with your acknowledgement number.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Not received? Usually Aadhaar is not seeded to the active account or DBT is off. Fix it at the bank, then check status again."}}], "rights_t": "Still not paid? Ask for help.", "rights": "Call the guarantee schemes helpline <b>1902<\/b>, visit the taluk <b>Women and Child Development<\/b> office, or complain on <b>IPGRS<\/b>.", "help": "<b>Apply / status:<\/b> sevasindhugs.karnataka.gov.in, Grama One, Karnataka One · <b>Helpline:<\/b> 1902<br/><b>Applying is free<\/b> · <b>Never share your OTP<\/b>"}, "loc": {"h1": "ಗೃಹಲಕ್ಷ್ಮಿ: ಕುಟುಂಬದ ಯಜಮಾನಿಗೆ ತಿಂಗಳಿಗೆ ₹2,000", "benefit": "ಪ್ರತಿ ಕುಟುಂಬದ ಒಬ್ಬ ಮಹಿಳೆಗೆ ತಿಂಗಳಿಗೆ ₹2,000 ನೇರ ನಗದು ವರ್ಗಾವಣೆ (DBT)", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "<ul><li>ನೀವು AAY, BPL ಅಥವಾ APL ಪಡಿತರ ಚೀಟಿಯಲ್ಲಿ <b>ಕುಟುಂಬದ ಯಜಮಾನಿ<\/b> ಆಗಿರಬೇಕು<\/li><li>ನೀವು ಅಥವಾ ನಿಮ್ಮ ಪತಿ <b>ಸರ್ಕಾರಿ ನೌಕರರು<\/b> ಆಗಿರಬಾರದು ಅಥವಾ <b>ಆದಾಯ ತೆರಿಗೆ / GST ರಿಟರ್ನ್<\/b> ಸಲ್ಲಿಸುತ್ತಿರಬಾರದು<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಇವುಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li>ಪಡಿತರ ಚೀಟಿ ಸಂಖ್ಯೆ<\/li><li>ನಿಮ್ಮ ಮತ್ತು ನಿಮ್ಮ ಪತಿಯ ಆಧಾರ್<\/li><li><b>ಆಧಾರ್‌ಗೆ ಜೋಡಣೆಯಾದ<\/b>, DBT ಸಕ್ರಿಯ ಬ್ಯಾಂಕ್ ಖಾತೆ<\/li><li>ಆಧಾರ್‌ಗೆ ಜೋಡಣೆಯಾದ ಮೊಬೈಲ್<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿ", "body": "<b>ಸೇವಾ ಸಿಂಧು<\/b>ವಿನಲ್ಲಿ ಅಥವಾ <b>ಗ್ರಾಮ ಒನ್<\/b>, <b>ಕರ್ನಾಟಕ ಒನ್<\/b> ಅಥವಾ <b>ಬಾಪೂಜಿ ಸೇವಾ ಕೇಂದ್ರ<\/b>ದಲ್ಲಿ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ. <b>ಸ್ವೀಕೃತಿ ಸಂಖ್ಯೆಯನ್ನು<\/b> ಜೋಪಾನವಾಗಿಡಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಅರ್ಜಿ <b>ಉಚಿತ<\/b>. ಹಣ 'ಬಿಡುಗಡೆ ಮಾಡಿಸುತ್ತೇವೆ' ಎನ್ನುವವರಿಗೆ OTP ಅಥವಾ ಬ್ಯಾಂಕ್ ವಿವರ ಎಂದಿಗೂ ಕೊಡಬೇಡಿ."}}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಪರಿಶೀಲನೆ", "body": "ಇಲಾಖೆ ಪಡಿತರ ಚೀಟಿ, ಆಧಾರ್ ಮತ್ತು ತೆರಿಗೆ ದಾಖಲೆಗಳನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ. 2026ರಲ್ಲಿ <b>ಬಯೋಮೆಟ್ರಿಕ್ ಮರುಪರಿಶೀಲನೆ<\/b> ಅಭಿಯಾನ ವರದಿಯಾಗಿದೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಮರುಪರಿಶೀಲನೆ ಕೇಳಿದ್ದಾರೆಯೇ? ಕೇಂದ್ರದಲ್ಲಿ ಅಥವಾ ಮನೆ-ಮನೆ ಭೇಟಿಯ ವೇಳೆ ಮಾಡಿಸಿ, ಇಲ್ಲದಿದ್ದರೆ ಹಣ ನಿಲ್ಲಬಹುದು."}}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಪ್ರತಿ ತಿಂಗಳು ₹2,000", "body": "ಹಣ DBT ಮೂಲಕ ಬರುತ್ತದೆ, ಹೆಚ್ಚಾಗಿ ತಿಂಗಳ ಮೊದಲಾರ್ಧದಲ್ಲಿ. ಸ್ವೀಕೃತಿ ಸಂಖ್ಯೆಯಿಂದ ಸೇವಾ ಸಿಂಧುವಿನಲ್ಲಿ ಸ್ಥಿತಿ ನೋಡಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಹಣ ಬಂದಿಲ್ಲವೇ? ಹೆಚ್ಚಾಗಿ ಆಧಾರ್ ಸಕ್ರಿಯ ಖಾತೆಗೆ ಜೋಡಣೆಯಾಗಿಲ್ಲ ಅಥವಾ DBT ಆಫ್ ಆಗಿರುತ್ತದೆ. ಬ್ಯಾಂಕಿನಲ್ಲಿ ಸರಿಪಡಿಸಿ, ನಂತರ ಮತ್ತೆ ಸ್ಥಿತಿ ನೋಡಿ."}}], "rights_t": "ಇನ್ನೂ ಹಣ ಬಂದಿಲ್ಲವೇ? ಸಹಾಯ ಪಡೆಯಿರಿ.", "rights": "ಗ್ಯಾರಂಟಿ ಯೋಜನೆಗಳ ಸಹಾಯವಾಣಿ <b>1902<\/b> ಗೆ ಕರೆ ಮಾಡಿ, ತಾಲೂಕು <b>ಮಹಿಳಾ ಮತ್ತು ಮಕ್ಕಳ ಅಭಿವೃದ್ಧಿ<\/b> ಕಚೇರಿಗೆ ಭೇಟಿ ನೀಡಿ, ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಅರ್ಜಿ / ಸ್ಥಿತಿ:<\/b> sevasindhugs.karnataka.gov.in, ಗ್ರಾಮ ಒನ್, ಕರ್ನಾಟಕ ಒನ್ · <b>ಸಹಾಯವಾಣಿ:<\/b> 1902<br/><b>ಅರ್ಜಿ ಉಚಿತ<\/b> · <b>OTP ಯಾರಿಗೂ ಕೊಡಬೇಡಿ<\/b>"}}, {"slug": "ka-shakti", "title": "Shakti (free bus travel for women)", "local_name": "ಶಕ್ತಿ ಯೋಜನೆ", "audience": "Women and transgender persons living in Karnataka", "state": "ka", "local": "kn", "cat": "women", "links": [{"label": "Seva Sindhu: apply and track", "url": "https://sevasindhu.karnataka.gov.in", "gov": false}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Woman or transgender person living in Karnataka]) --> B{Non-AC government bus within Karnataka?}\n    B -- No, AC or interstate --> X1[Regular fare applies]\n    B -- Yes --> ID{Carrying original ID with Karnataka address or Shakti card?}\n    ID -- No --> F1[Fare charged: carry original ID next time]\n    ID -- Yes --> T[Conductor issues zero-value Shakti ticket]\n    T --> R([Free ride])\n    T -. Refused or money asked .-> F2[Note bus number and time, complain to depot or IPGRS]\n\n    S1[[Sathi: which buses are covered]]:::sathi -.-> B\n    S2[[Sathi: DigiLocker ID reminder]]:::sathi -.-> ID\n    S3[[Sathi: refusal complaint draft]]:::sathi -.-> F2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class X1,F1,F2 blocked", "sources": [{"label": "The News Minute: Shakti scheme launched", "url": "https://www.thenewsminute.com/karnataka/karnataka-govt-launches-shakti-scheme-free-bus-rides-women-178354"}, {"label": "Citizen Matters: how to access the five guarantees", "url": "https://citizenmatters.in/heres-how-you-can-access-the-five-guarantees-promised-by-the-new-karnataka-government-119111"}, {"label": "Deccan Herald: smart card may be waived", "url": "https://www.deccanherald.com/india/karnataka/govt-may-waive-smartcard-for-free-bus-travel-scheme-1225799.html"}], "verified": "2026-10-27", "en": {"h1": "Shakti: Free bus travel for women in Karnataka", "benefit": "Free travel in non-AC government buses within Karnataka", "steps": [{"phase": "Before you travel", "kind": "you", "who": "You", "title": "Check if you can use it", "body": "<ul><li><b>Women and transgender persons<\/b> living in Karnataka<\/li><li>Ordinary and express <b>non-AC<\/b> buses of KSRTC, BMTC, KKRTC and NWKRTC<\/li><li>Travel <b>within Karnataka<\/b> only; AC and luxury buses are not free<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Carry a valid ID", "body": "Carry a <b>government photo ID with a Karnataka address<\/b> (Aadhaar, voter ID and similar), or your <b>Shakti smart card<\/b> if one has been issued to you through Seva Sindhu.", "note": {"kind": "tip", "label": "Tip:", "html": "A photocopy or phone photo may be refused. Keep the original ID or DigiLocker copy handy."}}, {"phase": "On the bus", "kind": "you", "who": "You", "title": "Board and show your ID", "body": "Tell the conductor you are travelling under Shakti and show your ID or card.", "note": null}, {"phase": null, "kind": "gov", "who": "Government", "title": "Zero-value ticket", "body": "The conductor gives a <b>zero-value 'Shakti' ticket<\/b>. Keep it until you get off.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Conductor refuses or asks for money? Note the bus number, time and route."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Free ride", "body": "You travel free. Interstate and AC journeys are charged as usual.", "note": null}], "rights_t": "Refused a free ticket? Complain.", "rights": "Complain to the corporation's depot or helpline (numbers are printed in the bus), or on <b>IPGRS<\/b>, with the bus number and time.", "help": "<b>Smart card:<\/b> sevasindhu.karnataka.gov.in · Covered buses as reported; check the transport department notice<br/><b>The ride is free; never pay for a 'Shakti pass'<\/b>"}, "loc": {"h1": "ಶಕ್ತಿ: ಕರ್ನಾಟಕದಲ್ಲಿ ಮಹಿಳೆಯರಿಗೆ ಉಚಿತ ಬಸ್ ಪ್ರಯಾಣ", "benefit": "ಕರ್ನಾಟಕದೊಳಗೆ ಹವಾನಿಯಂತ್ರಿತವಲ್ಲದ ಸರ್ಕಾರಿ ಬಸ್‌ಗಳಲ್ಲಿ ಉಚಿತ ಪ್ರಯಾಣ", "steps": [{"phase": "ಪ್ರಯಾಣದ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "<ul><li>ಕರ್ನಾಟಕದಲ್ಲಿ ವಾಸಿಸುವ <b>ಮಹಿಳೆಯರು ಮತ್ತು ತೃತೀಯ ಲಿಂಗಿಗಳು<\/b><\/li><li>ಕೆಎಸ್‌ಆರ್‌ಟಿಸಿ, ಬಿಎಂಟಿಸಿ, ಕೆಕೆಆರ್‌ಟಿಸಿ ಮತ್ತು ಎನ್‌ಡಬ್ಲ್ಯೂಕೆಆರ್‌ಟಿಸಿಯ ಸಾಮಾನ್ಯ ಮತ್ತು ಎಕ್ಸ್‌ಪ್ರೆಸ್ <b>ಎಸಿ ಅಲ್ಲದ<\/b> ಬಸ್‌ಗಳು<\/li><li><b>ಕರ್ನಾಟಕದೊಳಗೆ<\/b> ಮಾತ್ರ; ಎಸಿ ಮತ್ತು ಐಷಾರಾಮಿ ಬಸ್‌ಗಳು ಉಚಿತವಲ್ಲ<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಮಾನ್ಯ ಗುರುತಿನ ಚೀಟಿ ಇಟ್ಟುಕೊಳ್ಳಿ", "body": "<b>ಕರ್ನಾಟಕದ ವಿಳಾಸವಿರುವ ಸರ್ಕಾರಿ ಫೋಟೋ ಗುರುತಿನ ಚೀಟಿ<\/b> (ಆಧಾರ್, ಮತದಾರರ ಚೀಟಿ ಇತ್ಯಾದಿ), ಅಥವಾ ಸೇವಾ ಸಿಂಧು ಮೂಲಕ ನಿಮಗೆ ನೀಡಿದ್ದರೆ <b>ಶಕ್ತಿ ಸ್ಮಾರ್ಟ್ ಕಾರ್ಡ್<\/b> ಇಟ್ಟುಕೊಳ್ಳಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಫೋಟೋಕಾಪಿ ಅಥವಾ ಫೋನ್ ಫೋಟೋ ನಿರಾಕರಿಸಬಹುದು. ಮೂಲ ಗುರುತಿನ ಚೀಟಿ ಅಥವಾ ಡಿಜಿಲಾಕರ್ ಪ್ರತಿ ಕೈಯಲ್ಲಿರಲಿ."}}, {"phase": "ಬಸ್‌ನಲ್ಲಿ", "kind": "you", "who": "ನೀವು", "title": "ಬಸ್ ಹತ್ತಿ ಗುರುತಿನ ಚೀಟಿ ತೋರಿಸಿ", "body": "ಶಕ್ತಿ ಯೋಜನೆಯಡಿ ಪ್ರಯಾಣಿಸುತ್ತಿದ್ದೀರಿ ಎಂದು ನಿರ್ವಾಹಕರಿಗೆ ತಿಳಿಸಿ ಮತ್ತು ಗುರುತಿನ ಚೀಟಿ ಅಥವಾ ಕಾರ್ಡ್ ತೋರಿಸಿ.", "note": null}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಶೂನ್ಯ ಮೌಲ್ಯದ ಟಿಕೆಟ್", "body": "ನಿರ್ವಾಹಕರು <b>ಶೂನ್ಯ ಮೌಲ್ಯದ 'ಶಕ್ತಿ' ಟಿಕೆಟ್<\/b> ನೀಡುತ್ತಾರೆ. ಇಳಿಯುವವರೆಗೆ ಅದನ್ನು ಇಟ್ಟುಕೊಳ್ಳಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ನಿರ್ವಾಹಕರು ನಿರಾಕರಿಸಿದರೆ ಅಥವಾ ಹಣ ಕೇಳಿದರೆ? ಬಸ್ ಸಂಖ್ಯೆ, ಸಮಯ ಮತ್ತು ಮಾರ್ಗ ಬರೆದುಕೊಳ್ಳಿ."}}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಉಚಿತ ಪ್ರಯಾಣ", "body": "ನೀವು ಉಚಿತವಾಗಿ ಪ್ರಯಾಣಿಸುತ್ತೀರಿ. ಅಂತರರಾಜ್ಯ ಮತ್ತು ಎಸಿ ಪ್ರಯಾಣಕ್ಕೆ ಎಂದಿನಂತೆ ಶುಲ್ಕವಿದೆ.", "note": null}], "rights_t": "ಉಚಿತ ಟಿಕೆಟ್ ನಿರಾಕರಿಸಿದರೆ? ದೂರು ನೀಡಿ.", "rights": "ಬಸ್ ಸಂಖ್ಯೆ ಮತ್ತು ಸಮಯದೊಂದಿಗೆ ನಿಗಮದ ಡಿಪೋ ಅಥವಾ ಸಹಾಯವಾಣಿಗೆ (ಸಂಖ್ಯೆಗಳು ಬಸ್‌ನಲ್ಲಿ ಮುದ್ರಿತ), ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಸ್ಮಾರ್ಟ್ done", "who": "Done", "title": "Zero bill", "body": "Your bill shows the Gruha Jyothi benefit and <b>₹0<\/b> when you stay within your limit.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Still getting a full bill? Check that the application is linked to the right account ID; ask the ESCOM sub-division office."}}], "rights_t": "Wrong bill? Complain.", "rights": "Complain to your <b>ESCOM<\/b> sub-division office or helpline <b>1912<\/b>, or on <b>IPGRS<\/b>.", "help": "<b>Apply:<\/b> sevasindhugs.karnataka.gov.in · Free-unit rule as reported; check your ESCOM notice<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "ಗೃಹಜ್ಯೋತಿ: ತಿಂಗಳಿಗೆ 200 ಯೂನಿಟ್‌ವರೆಗೆ ಉಚಿತ ವಿದ್ಯುತ್", "benefit": "ನಿಮ್ಮ ಅರ್ಹ ಮಿತಿಯೊಳಗಿನ ಯೂನಿಟ್‌ಗಳಿಗೆ ಶೂನ್ಯ ಬಿಲ್, ತಿಂಗಳಿಗೆ 200 ಯೂನಿಟ್‌ವರೆಗೆ", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "<ul><li>ಕರ್ನಾಟಕದಲ್ಲಿ <b>ಗೃಹ ಬಳಕೆ<\/b> ಸಂಪರ್ಕ; ವಾಣಿಜ್ಯ ಸಂಪರ್ಕಗಳಿಗೆ ಇಲ್ಲ<\/li><li>ಪ್ರತಿ ಮನೆಗೆ ಒಂದು ಮೀಟರ್<\/li><li>ನಿಮ್ಮ ಸರಾಸರಿ ಬಳಕೆ ತಿಂಗಳಿಗೆ <b>200 ಯೂನಿಟ್‌ಗಿಂತ ಕಡಿಮೆ<\/b> ಇರಬೇಕು<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ನಿಮ್ಮ ಉಚಿತ ಯೂನಿಟ್ ತಿಳಿಯಿರಿ", "body": "ನಿಮ್ಮ ಉಚಿತ ಮಿತಿ <b>ಕಳೆದ ವರ್ಷದ ಸರಾಸರಿ ಮಾಸಿಕ ಬಳಕೆ ಜೊತೆಗೆ ಸುಮಾರು 10%<\/b> ಆಧರಿಸಿದೆ. ತುಂಬಾ ಕಡಿಮೆ ಬಳಸುವವರಿಗೆ ನಿಗದಿತ ಹೆಚ್ಚುವರಿ ಯೂನಿಟ್ ನೀಡಲಾಗುತ್ತದೆ ಎಂದು ವರದಿಯಾಗಿದೆ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಮಿತಿಗಿಂತ ಹೆಚ್ಚಿನ ಯೂನಿಟ್‌ಗಳಿಗೆ ಬಿಲ್ ಬರುತ್ತದೆ. ಶೂನ್ಯ ಬಿಲ್‌ಗಾಗಿ ಬಳಕೆಯನ್ನು ಸರಾಸರಿಯ ಹತ್ತಿರ ಇಡಿ."}}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ನಿಮ್ಮ ಬಿಲ್ ಸಿದ್ಧವಾಗಿಡಿ", "body": "ವಿದ್ಯುತ್ ಬಿಲ್‌ನಲ್ಲಿರುವ <b>ಖಾತೆ ಐಡಿ / ಗ್ರಾಹಕ ಐಡಿ<\/b> ಮತ್ತು ಆಧಾರ್ ಬೇಕು. ಬಾಡಿಗೆದಾರರು ಬಾಡಿಗೆ ಒಪ್ಪಂದ ಅಥವಾ ವಿಳಾಸ ಪುರಾವೆಯೊಂದಿಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಬಹುದು.", "note": null}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿ", "body": "<b>ಸೇವಾ ಸಿಂಧು<\/b>ವಿನಲ್ಲಿ ಅಥವಾ ಗ್ರಾಮ ಒನ್ / ಕರ್ನಾಟಕ ಒನ್ / ಬೆಂಗಳೂರು ಒನ್ ಕೇಂದ್ರದಲ್ಲಿ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ. <b>ಸ್ವೀಕೃತಿ<\/b> ಜೋಪಾನವಾಗಿಡಿ.", " P[Apply via Ahara at Grama One, Karnataka One or Bapuji Kendra]\n    AP --> V{Food Inspector verification}\n    V -- Rejected --> F1[Reason in writing, appeal to Deputy Director Food]\n    V -- OK --> C[Card issued, linked to fair price shop]\n    C --> R\n    R -. Short supply or money demanded .-> F2[Receipt and call 1967]\n\n    S1[[Sathi: exclusion check and window alerts]]:::sathi -.-> W\n    S2[[Sathi: entitlement calculator per member]]:::sathi -.-> R\n    S3[[Sathi: shortage complaint draft]]:::sathi -.-> F2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class X1,F0,F1,F2 blocked", "sources": [{"label": "Chikkaballapur district: schemes", "url": "https://chikkaballapur.nic.in/schemes/"}, {"label": "schemesinindia: Anna Bhagya 2026", "url": "https://schemesinindia.in/blog/anna-bhagya-yojana-karnataka-10kg-free-rice-2026"}, {"label": "ClearTax: Anna Bhagya scheme", "url": "https://cleartax.in/s/anna-bhagya-scheme"}, {"label": "sarkariyojana.com: Ahara ration card", "url": "https://sarkariyojana.com/ahara-kar-nic-in-ration-card/"}], "verified": "2026-10-27", "en": {"h1": "Ration Card and Anna Bhagya: 10 kg rice per person", "benefit": "10 kg food grain per person a month for BPL (PHH) and Antyodaya families", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Already have a BPL or AAY card?", "body": "Then you need <b>no separate application<\/b> for Anna Bhagya. Collect rice at your fair price shop.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check if you can get a BPL card", "body": "<ul><li>Permanent Karnataka resident, with no ration card anywhere else<\/li><li>No government employee or income-tax payer in the family<\/li><li>No four-wheeler (livelihood vehicles like taxis and tractors are exceptions)<\/li><li>Village: not more than <b>3 hectares<\/b> of dry land; town: no pucca house over <b>1,000 sq ft<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar of <b>every family member<\/b><\/li><li>Income certificate (Nadakacheri)<\/li><li>Address proof, photo of the head of family<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Apply for a BPL / AAY card through the <b>Ahara<\/b> department at a <b>Grama One<\/b>, <b>Karnataka One<\/b> or <b>Bapuji Seva Kendra<\/b> when applications are open. Keep the acknowledgement.", "note": {"kind": "tip", "label": "Tip:", "html": "New-card windows open and close; ask the centre or the taluk food office whether applications are being accepted now."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Verification", "body": "The <b>Food Inspector<\/b> / taluk food office checks your family and income.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Ask for the reason in writing and appeal to the <b>Deputy Director, Food<\/b> of your district."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Card issued", "body": "The card is approved and the family is attached to a <b>fair price shop<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Collect rice every month", "body": "A member gives a <b>fingerprint<\/b> at the shop and collects grain for every person on the card.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Shop gives less or demands money? Ask for a receipt and call the food helpline <b>1967<\/b>."}}], "rights_t": "Shortage or card pending? Complain.", "rights": "Call the food helpline <b>1967<\/b>, contact the taluk food office, or complain on <b>IPGRS<\/b>.", "help": "<b>Card status and lists:<\/b> ahara.karnataka.gov.in · <b>Helpline:<\/b> 1967<br/><b>Ration is your right; never pay extra<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "ಪಡಿತರ ಚೀಟಿ ಮತ್ತು ಅನ್ನಭಾಗ್ಯ: ಪ್ರತಿ ವ್ಯಕ್ತಿಗೆ 10 ಕೆಜಿ ಅಕ್ಕಿ", "benefit": "BPL (PHH) ಮತ್ತು ಅಂತ್ಯೋದಯ ಕುಟುಂಬಗಳಿಗೆ ಪ್ರತಿ ವ್ಯಕ್ತಿಗೆ ತಿಂಗಳಿಗೆ 10 ಕೆಜಿ ಆಹಾರ ಧಾನ್ಯ", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ಈಗಾಗಲೇ BPL ಅಥವಾ AAY ಚೀಟಿ ಇದೆಯೇ?", "body": "ಹಾಗಿದ್ದರೆ ಅನ್ನಭಾಗ್ಯಕ್ಕೆ <b>ಪ್ರತ್ಯೇಕ ಅರ್ಜಿ ಬೇಕಿಲ್ಲ<\/b>. ನಿಮ್ಮ ನ್ಯಾಯಬೆಲೆ ಅಂಗಡಿಯಲ್ಲಿ ಅಕ್ಕಿ ಪಡೆಯಿರಿ.", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "BPL ಚೀಟಿಗೆ ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ", "body": "<ul><li>ಕರ್ನಾಟಕದ ಖಾಯಂ ನಿವಾಸಿ, ಬೇರೆಲ್ಲೂ ಪಡಿತರ ಚೀಟಿ ಇರಬಾರದು<\/li><li>ಕುಟುಂಬದಲ್ಲಿ ಸರ್ಕಾರಿ ನೌಕರರು ಅಥವಾ ಆದಾಯ ತೆರಿಗೆದಾರರು ಇರಬಾರದು<\/li><li>ನಾಲ್ಕು ಚಕ್ರದ ವಾಹನ ಇರಬಾರದು (ಟ್ಯಾಕ್ಸಿ, ಟ್ರ್ಯಾಕ್ಟರ್‌ನಂತಹ ಜೀವನೋಪಾಯ ವಾಹನಗಳಿಗೆ ವಿನಾಯಿತಿ)<\/li><li>ಗ್ರಾಮ: <b>3 ಹೆಕ್ಟೇರ್<\/b>ಗಿಂತ ಹೆಚ್ಚು ಒಣಭೂಮಿ ಇರಬಾರದು; ನಗರ: <b>1,000 ಚದರ ಅಡಿ<\/b>ಗಿಂತ ದೊಡ್ಡ ಪಕ್ಕಾ ಮನೆ ಇರಬಾರದು<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ದಾಖಲೆಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li><b>ಕುಟುಂಬದ ಪ್ರತಿಯೊಬ್ಬರ<\/b> ಆಧಾರ್<\/li><li>ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ (ನಾಡಕಚೇರಿ)<\/li><li>ವಿಳಾಸ ಪುರಾವೆ, ಕುಟುಂಬದ ಮುಖ್ಯಸ್ಥರ ಫೋಟೋ<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿ", "body": "ಅರ್ಜಿಗಳು ತೆರೆದಿರುವಾಗ <b>ಆಹಾರ<\/b> ಇಲಾಖೆಯ ಮೂಲಕ <b>ಗ್ರಾಮ ಒನ್<\/b>, <b>ಕರ್ನಾಟಕ ಒನ್<\/b> ಅಥವಾ <b>ಬಾಪೂಜಿ ಸೇವಾ ಕೇಂದ್ರ<\/b>ದಲ್ಲಿ BPL / AAY ಚೀಟಿಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ. ಸ್ವೀಕೃತಿ ಜೋಪಾನವಾಗಿಡಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಹೊಸ ಚೀಟಿಯ ಅರ್ಜಿ ಅವಧಿ ತೆರೆಯುತ್ತದೆ ಮತ್ತು ಮುಚ್ಚುತ್ತದೆ; ಈಗ ಅರ್ಜಿ ಸ್ವೀಕರಿಸುತ್ತಿದ್ದಾರೆಯೇ ಎಂದು ಕೇಂದ್ರ ಅಥವಾ ತಾಲೂಕು ಆಹಾರ ಕಚೇರಿಯಲ್ಲಿ ಕೇಳಿ."}}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಪರಿಶೀಲನೆ", "body": "<b>ಆಹಾರ ನಿರೀಕ್ಷಕರು<\/b> / ತಾಲೂಕು ಆಹಾರ ಕಚೇರಿ ನಿಮ್ಮ ಕುಟುಂಬ ಮತ್ತು ಆದಾಯ ಪರಿಶೀಲಿಸುತ್ತಾರೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ತಿರಸ್ಕೃತವಾಯಿತೇ? ಕಾರಣವನ್ನು ಲಿಖಿತವಾಗಿ ಕೇಳಿ ಮತ್ತು ನಿಮ್ಮ ಜಿಲ್ಲೆಯ <b>ಆಹಾರ ಉಪನಿರ್ದೇಶಕರಿಗೆ<\/b> ಮೇಲ್ಮನವಿ ಸಲ್ಲಿಸಿ."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಚೀಟಿ ವಿತರಣೆ", "body": "ಚೀಟಿ ಮಂಜೂರಾಗುತ್ತದೆ ಮತ್ತು ಕುಟುಂಬವನ್ನು ಒಂದು <b>ನ್ಯಾಯಬೆಲೆ ಅಂಗಡಿ<\/b>ಗೆ ಜೋಡಿಸಲಾಗುತ್ತದೆ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಪ್ರತಿ ತಿಂಗಳು ಅಕ್ಕಿ ಪಡೆಯಿರಿ", "body": "ಒಬ್ಬ ಸದಸ್ಯರು ಅಂಗಡಿಯಲ್ಲಿ <b>ಬೆರಳಚ್ಚು<\/b> ನೀಡಿ ಚೀಟಿಯಲ್ಲಿರುವ ಎಲ್ಲರ ಧಾನ್ಯ ಪಡೆಯುತ್ತಾರೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಅಂಗಡಿಯವರು ಕಡಿಮೆ ಕೊಡುತ್ತಾರೆಯೇ ಅಥವಾ ಹಣ ಕೇಳುತ್ತಾರೆಯೇ? ರಸೀದಿ ಕೇಳಿ ಮತ್ತು ಆಹಾರ ಸಹಾಯವಾಣಿ <b>1967<\/b> ಗೆ ಕರೆ ಮಾಡಿ."}}], "rights_t": "ಕೊರತೆ ಅಥವಾ ಚೀಟಿ ಬಾಕಿಯೇ? ದೂರು ನೀಡಿ.", "rights": "ಆಹಾರ ಸಹಾಯವಾಣಿ <b>1967<\/b> ಗೆ ಕರೆ ಮಾಡಿ, ತಾಲೂಕು ಆಹಾರ ಕಚೇರಿ ಸಂಪರ್ಕಿಸಿ, ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ.", "help": "<b>ಚೀಟಿ ಸ್ಥಿತಿ ಮತ್ತು ಪಟ್ಟಿ:<\/b> ahara.karnataka.gov.in · <b>ಸಹಾಯವಾಣಿ:<\/b> 1967<br/><b>ಪಡಿತರ ನಿಮ್ಮ ಹಕ್ಕು; ಹೆಚ್ಚುವರಿ ಹಣ ಕೊಡಬೇಡಿ<\/b> · <b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b>"}}, {"slug": "ka-social-pensions", "title": "Old-age and widow pensions (Karnataka)", "local_name": "ವೃದ್ಧಾಪ್ಯ ಮತ್ತು ವಿಧವಾ ವೇತನ", "audience": "Seniors and widows from low-income families", "state": "ka", "local": "kn", "cat": "pension", "links": [{"label": "Seva Sindhu: apply and track", "url": "https://sevasindhu.karnataka.gov.in", "gov": false}, {"label": "Nadakacheri (AJSK): certificates", "url": "https://nadakacheri.karnataka.gov.in", "gov": false}, {"label": "IPGRS: Karnataka grievance portal", "url": "https://ipgrs.karnataka.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Senior or widow]) --> W{Which pension fits age and income?}\n    W --> OAP[Old-age pension or Sandhya Suraksha]\n    W --> WP[Widow pension]\n    OAP --> P[Papers: Aadhaar, age proof, income certificate, Aadhaar-linked bank]\n    WP --> P2[Papers plus husband's death certificate]\n    P --> AP[Apply on Seva Sindhu, Nadakacheri or Grama One]\n    P2 --> AP\n    AP --> V{Village Accountant and Revenue Inspector verify}\n    V -- Mismatch --> F1[Update income or age proof, request re-verification]\n    V -- OK --> S[Tahsildar sanctions]\n    S --> PAY([Monthly pension to bank])\n    PAY -. Stopped after review .-> F2[Ask reason in writing, complain on IPGRS]\n\n    S1[[Sathi: which-pension finder]]:::sathi -.-> W\n    S2[[Sathi: annual document refresh reminder]]:::sathi -.-> V\n    S3[[Sathi: suspension appeal draft]]:::sathi -.-> F2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "GRAAM: social security pension amount raised", "url": "https://graam.org.in/graams-policy-engagement-brings-advancement-in-social-security-pension-amount/"}, {"label": "Deccan Herald: 23.19 lakh pensioners flagged", "url": "https://www.deccanherald.com/india/karnataka/revenue-dept-identifies-23-19l-ineligible-pensioners-3588887"}, {"label": "citizennest: Sandhya Suraksha (Kannada)", "url": "https://www.citizennest.com/kn/guide/karnataka-sandhya-suraksha-old-age-pension"}], "verified": "2026-10-27", "en": {"h1": "Social Security Pensions (Karnataka): Old-age and widow pension", "benefit": "Monthly pension into your bank account (Sandhya Suraksha reported at ₹1,200)", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Find your pension", "body": "<ul><li><b>Old-age pension<\/b> (with central share) for poor seniors<\/li><li><b>Sandhya Suraksha<\/b> for seniors from low-income working families<\/li><li><b>Widow pension<\/b> for widows from low-income families<\/li><\/ul>Ask the Nadakacheri which one fits your age and income.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar and <b>age proof<\/b><\/li><li><b>Income certificate<\/b> (Nadakacheri)<\/li><li>Widows: <b>husband's death certificate<\/b><\/li><li>Bank passbook (account <b>linked to Aadhaar<\/b>), photo<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Apply on <b>Seva Sindhu<\/b> or at a <b>Nadakacheri<\/b> / <b>Grama One<\/b> centre. Keep the <b>acknowledgement<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Do not pay anyone to 'sanction' a pension."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Verification", "body": "The <b>Village Accountant<\/b> and <b>Revenue Inspector<\/b> check age, income and family details.", "note": {"kind": "stuck", "label": "Stuck?", "html": "A 2025 review flagged many pensions as possibly ineligible. Keep your income certificate and age proof current so your pension is not stopped."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Tahsildar sanctions", "body": "The <b>Tahsildar<\/b> sanctions the pension.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Pension every month", "body": "The pension is paid into your account. Check that the amount matches the current rate.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Payment stopped? Check Aadhaar seeding at the bank, then ask the taluk office whether your pension was suspended after review."}}], "rights_t": "Stopped or not sanctioned? Complain.", "rights": "Write to the <b>Tahsildar<\/b> with your acknowledgement number, or complain on <b>IPGRS<\/b>. Ask for the reason in writing if it was stopped.", "help": "<b>Apply:<\/b> sevasindhu.karnataka.gov.in, Nadakacheri, Grama One · Amounts change; check the current rate at the taluk office<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "ಸಾಮಾಜಿಕ ಭದ್ರತಾ ಪಿಂಚಣಿ (ಕರ್ನಾಟಕ): ವೃದ್ಧಾಪ್ಯ ಮತ್ತು ವಿಧವಾ ವೇತನ", "benefit": "ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ ಮಾಸಿಕ ಪಿಂಚಣಿ (ಸಂಧ್ಯಾ ಸುರಕ್ಷಾ ₹1,200 ಎಂದು ವರದಿಯಾಗಿದೆ)", "steps": [{"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸುವ ಮೊದಲು", "kind": "you", "who": "ನೀವು", "title": "ನಿಮ್ಮ ಪಿಂಚಣಿ ಯಾವುದು", "body": "<ul><li>ಬಡ ಹಿರಿಯರಿಗೆ <b>ವೃದ್ಧಾಪ್ಯ ವೇತನ<\/b> (ಕೇಂದ್ರದ ಪಾಲಿನೊಂದಿಗೆ)<\/li><li>ಕಡಿಮೆ ಆದಾಯದ ದುಡಿಯುವ ಕುಟುಂಬಗಳ ಹಿರಿಯರಿಗೆ <b>ಸಂಧ್ಯಾ ಸುರಕ್ಷಾ<\/b><\/li><li>ಕಡಿಮೆ ಆದಾಯದ ಕುಟುಂಬಗಳ ವಿಧವೆಯರಿಗೆ <b>ವಿಧವಾ ವೇತನ<\/b><\/li><\/ul>ನಿಮ್ಮ ವಯಸ್ಸು ಮತ್ತು ಆದಾಯಕ್ಕೆ ಯಾವುದು ಸೂಕ್ತ ಎಂದು ನಾಡಕಚೇರಿಯಲ್ಲಿ ಕೇಳಿ.", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ದಾಖಲೆಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ", "body": "<ul><li>ಆಧಾರ್ ಮತ್ತು <b>ವಯಸ್ಸಿನ ಪುರಾವೆ<\/b><\/li><li><b>ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ<\/b> (ನಾಡಕಚೇರಿ)<\/li><li>ವಿಧವೆಯರಿಗೆ: <b>ಪತಿಯ ಮರಣ ಪ್ರಮಾಣ ಪತ್ರ<\/b><\/li><li>ಬ್ಯಾಂಕ್ ಪಾಸ್‌ಬುಕ್ (ಖಾತೆ <b>ಆಧಾರ್‌ಗೆ ಜೋಡಣೆ<\/b>), ಫೋಟೋ<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "ನೀವು", "title": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿ", "body": "<b>ಸೇವಾ ಸಿಂಧು<\/b>ವಿನಲ್ಲಿ ಅಥವಾ <b>ನಾಡಕಚೇರಿ<\/b> / <b>ಗ್ರಾಮ ಒನ್<\/b> ಕೇಂದ್ರದಲ್ಲಿ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ. <b>ಸ್ವೀಕೃತಿ<\/b> ಜೋಪಾನವಾಗಿಡಿ.", "note": {"kind": "tip", "label": "ಸಲಹೆ:", "html": "ಅರ್ಜಿ <b>ಉಚಿತ<\/b>. ಪಿಂಚಣಿ 'ಮಂಜೂರು ಮಾಡಿಸಲು' ಯಾರಿಗೂ ಹಣ ಕೊಡಬೇಡಿ."}}, {"phase": "ಅರ್ಜಿ ಸಲ್ಲಿಸಿದ ನಂತರ", "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ಪರಿಶೀಲನೆ", "body": "<b>ಗ್ರಾಮ ಲೆಕ್ಕಾಧಿಕಾರಿ<\/b> ಮತ್ತು <b>ಕಂದಾಯ ನಿರೀಕ್ಷಕರು<\/b> ವಯಸ್ಸು, ಆದಾಯ ಮತ್ತು ಕುಟುಂಬದ ವಿವರ ಪರಿಶೀಲಿಸುತ್ತಾರೆ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "2025ರ ಪರಿಶೀಲನೆಯಲ್ಲಿ ಅನೇಕ ಪಿಂಚಣಿಗಳನ್ನು ಅನರ್ಹವಾಗಿರಬಹುದು ಎಂದು ಗುರುತಿಸಲಾಗಿದೆ. ನಿಮ್ಮ ಪಿಂಚಣಿ ನಿಲ್ಲದಂತೆ ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ ಮತ್ತು ವಯಸ್ಸಿನ ಪುರಾವೆ ಚಾಲ್ತಿಯಲ್ಲಿಡಿ."}}, {"phase": null, "kind": "gov", "who": "ಸರ್ಕಾರ", "title": "ತಹಶೀಲ್ದಾರ್ ಮಂಜೂರಾತಿ", "body": "<b>ತಹಶೀಲ್ದಾರ್<\/b> ಪಿಂಚಣಿ ಮಂಜೂರು ಮಾಡುತ್ತಾರೆ.", "note": null}, {"phase": null, "kind": "done", "who": "ಪೂರ್ಣ", "title": "ಪ್ರತಿ ತಿಂಗಳು ಪಿಂಚಣಿ", "body": "ಪಿಂಚಣಿ ನಿಮ್ಮ ಖಾತೆಗೆ ಜಮೆಯಾಗುತ್ತದೆ. ಮೊತ್ತ ಚಾಲ್ತಿ ದರಕ್ಕೆ ಹೊಂದಿಕೆಯಾಗುತ್ತದೆಯೇ ನೋಡಿ.", "note": {"kind": "stuck", "label": "ತೊಂದರೆಯೇ?", "html": "ಪಾವತಿ ನಿಂತಿದೆಯೇ? ಬ್ಯಾಂಕಿನಲ್ಲಿ ಆಧಾರ್ ಜೋಡಣೆ ಪರಿಶೀಲಿಸಿ, ನಂತರ ಪರಿಶೀಲನೆಯ ಬಳಿಕ ನಿಮ್ಮ ಪಿಂಚಣಿ ತಡೆಹಿಡಿಯಲಾಗಿದೆಯೇ ಎಂದು ತಾಲೂಕು ಕಚೇರಿಯಲ್ಲಿ ಕೇಳಿ."}}], "rights_t": "ನಿಂತಿದೆಯೇ ಅಥವಾ ಮಂಜೂರಾಗಿಲ್ಲವೇ? ದೂರು ನೀಡಿ.", "rights": "ಸ್ವೀಕೃತಿ ಸಂಖ್ಯೆಯೊಂದಿಗೆ <b>ತಹಶೀಲ್ದಾರ್<\/b> ಅವರಿಗೆ ಬರೆಯಿರಿ, ಅಥವಾ <b>IPGRS<\/b> ನಲ್ಲಿ ದೂರು ನೀಡಿ. ನಿಲ್ಲಿಸಿದ್ದರೆ ಕಾರಣವನ್ನು ಲಿಖಿತವಾಗಿ ಕೇಳಿ.", "help": "<b>ಅರ್ಜಿ:<\/b> sevasindhu.karnataka.gov.in, ನಾಡಕಚೇರಿ, ಗ್ರಾಮ ಒನ್ · ಮೊತ್ತ ಬದಲಾಗುತ್ತದೆ; ಚಾಲ್ತಿ ದರ ತಾಲೂಕು ಕಚೇರಿಯಲ್ಲಿ ನೋಡಿ<br/><b>ಅರ್ಜಿ ಉಚಿತ<\/b> · <b>ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್ ಮಾತ್ರ ಬಳಸಿ<\/b>"}}, {"slug": "mp-kisan-kalyan", "title": "PM-KISAN + CM Kisan Kalyan (MP)", "local_name": "पीएम-किसान + मुख्यमंत्री किसान कल्याण", "audience": "Landholding farmers in Madhya Pradesh", "state": "mp", "local": "hi", "cat": "farm", "links": [{"label": "PM-KISAN: register, eKYC, status", "url": "https://pmkisan.gov.in", "gov": true}, {"label": "SAARA portal: state instalments", "url": "https://saara.mp.gov.in", "gov": false}, {"label": "PM-KISAN helpline: 155261 / 011-24300606", "url": null, "gov": true}, {"label": "CM Helpline: 181", "url": null, "gov": false}], "mermaid": "flowchart TD\n    A([MP farmer]) --> K{Name in khasra and not excluded?}\n    K -- Land in parent's name --> F0[Naamantaran first]\n    K -- Yes --> REG[Register on PM-KISAN or CSC]\n    REG --> LV{Patwari and tehsil land verification}\n    LV -- Name mismatch --> F1[Correct spelling, request re-verification]\n    LV -- OK --> EK[eKYC: OTP, face app or fingerprint]\n    EK --> P1([PM-KISAN Rs 2,000 three times a year])\n    EK --> P2([CM Kisan Kalyan Rs 4,000 a year, automatic])\n    P2 -. State amount missing .-> F2[Check saara.mp.gov.in, then tehsil or agriculture office]\n\n    S1[[Sathi: land and name match check]]:::sathi -.-> LV\n    S2[[Sathi: both-scheme payment tracker]]:::sathi -.-> P2\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "eGovtSchemes: Mukhyamantri Kisan Kalyan 2026", "url": "https://www.egovtschemes.com/mukhyamantri-kisaan-kalyaan-yojana/"}, {"label": "sarkariyojana.com: Kisan Kalyan Yojana", "url": "https://sarkariyojana.com/kisan-kalyan-yojana/"}, {"label": "pmkisan.gov.in", "url": "https://pmkisan.gov.in/"}], "verified": "2026-10-28", "en": {"h1": "PM-KISAN + CM Kisan Kalyan: ₹10,000 a year for MP farmers", "benefit": "₹6,000 a year from PM-KISAN plus ₹4,000 a year from the state (as reported)", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "Your name must be in the <b>khasra / B-1<\/b> as a landholder. You <b>cannot<\/b> get it if someone in the family pays income tax, holds a government job, or is a practising doctor, lawyer, CA or engineer.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get <b>naamantaran<\/b> done first. See the <b>Land mutation (MP)<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Register for PM-KISAN", "body": "Register on <b>pmkisan.gov.in<\/b> or at a CSC with khasra, Aadhaar, bank passbook and mobile. <b>No separate form<\/b> is needed for CM Kisan Kalyan: approved PM-KISAN farmers are included automatically.", "note": null}, {"phase": null, "kind": "gov", "who": "Government", "title": "Land verification", "body": "The Patwari / tehsil checks your name against the land record and the state approves you.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Name spelling differs between Aadhaar, khasra and bank? Correct it, then ask the Patwari to re-verify."}}, {"phase": "After you apply", "kind": "you", "who": "You", "title": "Do eKYC", "body": "Complete eKYC by OTP on pmkisan.gov.in, face authentication in the PM-KISAN app, or fingerprint at a CSC.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Without eKYC, <b>both<\/b> the central and state payments stop."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Payments released", "body": "PM-KISAN pays ₹2,000 three times a year; the state pays its ₹4,000 a year in instalments into the same account.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Money in your account", "body": "Check PM-KISAN on pmkisan.gov.in and the state instalments on <b>saara.mp.gov.in<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "PM-KISAN received but not the state amount? Check saara.mp.gov.in, then contact the tehsil / agriculture office."}}], "rights_t": "Instalment missing? Complain.", "rights": "Use the PM-KISAN helpline <b>155261 / 011-24300606<\/b>, the district <b>agriculture office<\/b>, or the <b>CM Helpline 181<\/b>.", "help": "<b>PM-KISAN:<\/b> pmkisan.gov.in · <b>State instalments:<\/b> saara.mp.gov.in · <b>Helpline:<\/b> 155261 / 011-24300606<br/><b>Use only official websites<\/b> · <b>Never pay an agent<\/b>"}, "loc": {"h1": "पीएम-किसान + मुख्यमंत्री किसान कल्याण: मप्र के किसानों को वर्ष में ₹10,000", "benefit": "पीएम-किसान से वर्ष में ₹6,000 और राज्य से वर्ष में ₹4,000 (बताए अनुसार)", "steps": [{"phase": "आवेदन से पहले", "kind": "you", "who": "आप", "title": "पात्रता जांचें", "body": "<b>खसरा / बी-1<\/b> में भूमिस्वामी के रूप में आपका नाम होना चाहिए। परिवार में कोई आयकर देता हो, सरकारी नौकरी में हो, या प्रैक्टिस करने वाला डॉक्टर, वकील, सीए या इंजीनियर हो तो लाभ <b>नहीं<\/b> मिलेगा।", "note": {"kind": "stuck", "label": "अटक गए?", "html": "ज़मीन अभी माता-पिता के नाम? पहले <b>नामांतरण<\/b> कराएं। <b>नामांतरण (मप्र)<\/b> मार्गदर्शिका देखें।"}}, {"phase": null, "kind": "you", "who": "आप", "title": "पीएम-किसान में पंजीकरण करें", "body": "खसरा, आधार, बैंक पासबुक और मोबाइल के साथ <b>pmkisan.gov.in<\/b> पर या सीएससी पर पंजीकरण करें। मुख्यमंत्री किसान कल्याण के लिए <b>अलग फॉर्म नहीं<\/b> लगता: स्वीकृत पीएम-किसान किसान अपने आप शामिल होते हैं।", "note": null}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "भूमि सत्यापन", "body": "पटवारी / तहसील भू-अभिलेख से आपका नाम मिलाते हैं और राज्य स्वीकृति देता है।", "note": {"kind": "stuck", "label": "अटक गए?", "html": "आधार, खसरा और बैंक में नाम की वर्तनी अलग है? सुधार कराएं, फिर पटवारी से दोबारा सत्यापन कराएं।"}}, {"phase": "आवेदन के बाद", "kind": "you", "who": "आप", "title": "ई-केवाईसी करें", "body": "pmkisan.gov.in पर ओटीपी से, पीएम-किसान ऐप में चेहरा प्रमाणीकरण से, या सीएससी पर अंगूठे से ई-केवाईसी करें।", "note": {"kind": "stuck", "label": "अटक गए?", "html": "ई-केवाईसी के बिना केंद्र और राज्य <b>दोनों<\/b> के भुगतान रुक जाते हैं।"}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "भुगतान जारी", "body": "पीएम-किसान वर्ष में तीन बार ₹2,000 देता है; र const svgCache = {};
let mermaidReady = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (!mermaidReady) mermaidReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" }); res(window.mermaid); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return mermaidReady;
}
async function drawDiagram(p) {
  const show = html => { const b = document.getElementById("diagram"); if (b && location.hash.slice(1) === p.slug) b.innerHTML = html; };
  if (svgCache[p.slug]) return show(svgCache[p.slug]);
  try {
    const m = await loadMermaid();
    const { svg } = await m.render("flow-" + p.slug.replace(/[^a-z0-9]/g, ""), p.mermaid);
    svgCache[p.slug] = svg; show(svg);
  } catch (e) {
    show(`<p class="small">${UI[state.lang].flowFail}</p><pre>${esc(p.mermaid)}</pre>`);
  }
}
