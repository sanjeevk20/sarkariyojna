<style>
/* Layout: a field-notebook blog. Sticky masthead, filterable card index, and long-form guide posts with a numbered step rail. */
:root {
  --bg: #f5f7f2; --surface: #ffffff; --raised: #eef2ea; --fg: #1c281e; --muted: #56675a; --line: #d3dccf;
  --leaf: #2d6a39; --leaf-soft: #e1eee0; --on-leaf: #ffffff;
  --you: #2357a6; --you-soft: #e7eef9; --gov: #67479f; --gov-soft: #efe9f8; --done: #2d6a39; --done-soft: #e1eee0;
  --haldi: #9a6512; --haldi-soft: #faf0dc; --stop: #b42318; --stop-soft: #fcebe9;
  --display: "Martel", "Noto Serif Devanagari", "Noto Sans Kannada", Georgia, serif;
  --body: "Mukta", "Noto Sans Devanagari", "Noto Sans Kannada", "Noto Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111712; --surface: #19211a; --raised: #202a21; --fg: #e3eae2; --muted: #9db09f; --line: #2d3a2f;
  --leaf: #82c48e; --leaf-soft: #1e3122; --on-leaf: #0f1a11;
  --you: #91b5f0; --you-soft: #1a2537; --gov: #bba4ea; --gov-soft: #251e35; --done: #82c48e; --done-soft: #1e3122;
  --haldi: #e6b65c; --haldi-soft: #2e2514; --stop: #f29b90; --stop-soft: #351b18; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111712; --surface: #19211a; --raised: #202a21; --fg: #e3eae2; --muted: #9db09f; --line: #2d3a2f;
  --leaf: #82c48e; --leaf-soft: #1e3122; --on-leaf: #0f1a11;
  --you: #91b5f0; --you-soft: #1a2537; --gov: #bba4ea; --gov-soft: #251e35; --done: #82c48e; --done-soft: #1e3122;
  --haldi: #e6b65c; --haldi-soft: #2e2514; --stop: #f29b90; --stop-soft: #351b18; color-scheme: dark; }
/* Black & white: no hue, maximum contrast, for low vision and bright sunlight. Differences carry in text, borders and grey levels. */
:root[data-theme="contrast"] {
  --bg: #ffffff; --surface: #ffffff; --raised: #f0f0f0; --fg: #000000; --muted: #222222; --line: #000000;
  --leaf: #000000; --leaf-soft: #ffffff; --on-leaf: #ffffff;
  --you: #000000; --you-soft: #ffffff; --gov: #000000; --gov-soft: #f0f0f0; --done: #000000; --done-soft: #ffffff;
  --haldi: #5a5a5a; --haldi-soft: #f0f0f0; --stop: #000000; --stop-soft: #e6e6e6; color-scheme: light; }
:root[data-theme="contrast"] a { text-decoration-thickness: 2px; }
:root[data-theme="contrast"] .map .s1, :root[data-theme="contrast"] .map .r1 { fill: #c8c8c8; fill-opacity: 1; }
:root[data-theme="contrast"] .sw.s1, :root[data-theme="contrast"] .sw.r1 { background: #c8c8c8; }
:root[data-theme="contrast"] .map .s2, :root[data-theme="contrast"] .map .s3, :root[data-theme="contrast"] .map .r3 { fill: #000; fill-opacity: 1; }
:root[data-theme="contrast"] .map path.sel { stroke: #fff; stroke-width: 3; stroke-dasharray: 5 3; }
:root[data-theme="contrast"] .map .r2 { fill: #6e6e6e; } :root[data-theme="contrast"] .sw.r2 { background: #6e6e6e; }
:root[data-theme="contrast"] .note, :root[data-theme="contrast"] .verdict, :root[data-theme="contrast"] .benefit, :root[data-theme="contrast"] .tag { border: 2px solid #000; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--leaf); }
:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; border-radius: 6px; }
.gutter { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--leaf); color: var(--on-leaf); padding: 10px 14px; border-radius: 8px; z-index: 20; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }
h1, h2 { font-family: var(--display); text-wrap: balance; line-height: 1.3; }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .gutter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand b { font-family: var(--display); font-size: 20px; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mast-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.theme-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; flex: none; }
.theme-btn:hover { background: var(--raised); }
.toggle { display: flex; gap: 4px; background: var(--raised); padding: 4px; border-radius: 999px; flex: none; }
.toggle button { font: 500 15px var(--body); min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }

/* Home */
.intro { padding-block: 28px 8px; }
.intro .eyebrow, .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); margin: 0; }
.intro h1 { font-size: clamp(28px, 5vw, 42px); margin: 6px 0 8px; max-width: 22ch; }
.intro p.lead { color: var(--muted); font-size: 18px; max-width: 62ch; margin: 0; }
.tools { display: grid; gap: 12px; padding-block: 18px 6px; }
.search { position: relative; max-width: 520px; }
.search input { width: 100%; font: 17px var(--body); min-height: 48px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { color: inherit; opacity: .7; font-variant-numeric: tabular-nums; margin-left: 4px; }
.count { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
.filter { display: grid; gap: 6px; }
.flabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rhead { font-size: 15px; margin: 10px 0 6px; } .rhead:first-child { margin-top: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 16px 56px; }
@media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; } }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
.card-link { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s; }
.card-link:hover { border-color: var(--leaf); transform: translateY(-2px); }
.card-link h2 { font-size: 19px; margin: 2px 0 0; }
.card-link .mrn { color: var(--muted); font-size: 15px; }
.card-link .for { font-size: 15px; margin-top: 6px; }
.card-link .meta { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.side { display: grid; gap: 16px; align-content: start; }
.side section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.side h2 { font-size: 17px; margin: 0 0 8px; }
.side ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 15px; }
.legend-list { list-style: none; padding: 0 !important; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.dot.you { background: var(--you); } .dot.gov { background: var(--gov); } .dot.done { background: var(--done); }

/* Post */
.post { max-width: 760px; padding-block: 20px 56px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 500; text-decoration: none; }
.post h1 { font-size: clamp(26px, 4.6vw, 38px); margin: 6px 0 4px; }
.post .mrn { color: var(--muted); margin: 0; font-size: 17px; }
.benefit { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--leaf-soft); font-size: 18px; font-weight: 500; }
.post-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); margin-top: 12px; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; padding: 0; list-style: none; }
.toc button { font: 500 15px var(--body); min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.post h2 { font-size: 23px; margin: 36px 0 12px; scroll-margin-top: 80px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); margin-bottom: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.phase { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 0 0 52px; }
.step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start; }
.num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: var(--on-leaf); font-variant-numeric: tabular-nums; }
.you .num { background: var(--you); } .gov .num { background: var(--gov); } .done .num { background: var(--done); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.gov .scard { background: var(--gov-soft); } .done .scard { background: var(--done-soft); }
.who { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scard h3 { font-size: 19px; margin: 0 0 4px; line-height: 1.35; }
.sbody ul { margin: 4px 0 0; padding-left: 20px; }
.status { font-family: ui-monospace, monospace; font-size: 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.note { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 16px; }
.note.stuck { background: var(--stop-soft); } .note.stuck b.nl { color: var(--stop); }
.note.tip { background: var(--haldi-soft); } .note.tip b.nl { color: var(--haldi); }
.box { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.box h3 { margin: 0 0 4px; font-size: 18px; color: var(--stop); }
.box.help { background: var(--haldi-soft); }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.links li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.links .what { min-width: 0; flex: 1 1 240px; }
.links a { font-weight: 700; overflow-wrap: anywhere; }
.links .lbl { display: block; font-size: 15px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.tag.g { background: var(--leaf-soft); color: var(--leaf); } .tag.x { background: var(--haldi-soft); color: var(--haldi); }
.small { font-size: 14px; color: var(--muted); }
.diagram { overflow-x: auto; background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: #1c281e; }
.diagram svg { display: block; margin: 0 auto; height: auto; min-width: 560px; max-width: 100%; }
.diagram pre { white-space: pre; font-size: 13px; margin: 0; }
.sources { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 15px; }
.sources a { overflow-wrap: anywhere; }
.cta.alt { background: var(--surface); color: var(--leaf); border: 1px solid var(--leaf); margin-top: 10px; }
.mapwrap { max-width: 1100px; padding-block: 20px 56px; }
.mapwrap h1 { font-size: clamp(26px, 4.6vw, 38px); margin: 6px 0 4px; }
.map-tools { display: grid; gap: 10px; margin: 16px 0; }
.map-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 860px) { .map-grid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }
.map { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }
.map svg { display: block; width: 100%; height: auto; max-height: 70vh; }
.map path { stroke: var(--surface); stroke-width: 1.4; cursor: pointer; vector-effect: non-scaling-stroke; }
.map path:hover, .map path:focus-visible { stroke: var(--fg); stroke-width: 2; outline: none; }
.map path.sel { stroke: var(--fg); stroke-width: 2.5; }
.s0, .sw.s0, .r0, .sw.r0 { fill: var(--raised); background: var(--raised); }
.s1, .sw.s1 { fill: var(--haldi); background: var(--haldi); fill-opacity: .55; }
.s2, .sw.s2 { fill: var(--stop); background: var(--stop); fill-opacity: .6; } .s3 { fill: var(--stop); fill-opacity: .85; }
.rf, .sw.rf { fill: var(--line); background: var(--line); }
.r1, .sw.r1 { fill: var(--haldi-soft); background: var(--haldi-soft); } .r2, .sw.r2 { fill: var(--haldi); background: var(--haldi); }
.r3, .sw.r3 { fill: var(--stop); background: var(--stop); }
.legend-map { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
.map-panel { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }
.map-panel h2 { margin: 0 0 8px; font-size: 21px; }
.rep-stats { margin: 0 0 10px; }
.sig-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 15px; }
.sig-list li { padding: 10px 12px; border-radius: 10px; background: var(--raised); overflow-wrap: anywhere; }
.sig-list .tag { margin: 0 6px 4px 0; display: inline-block; }
.tag.bad { background: var(--stop-soft); color: var(--stop); } .tag.warn { background: var(--haldi-soft); color: var(--haldi); }
.all-sigs { margin-top: 20px; } .all-sigs summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.share { margin-top: 20px; padding: 16px; border: 1px dashed var(--leaf); border-radius: 14px; }
.share h2 { margin: 0 0 6px; font-size: 19px; }
.share select { font: 16px var(--body); min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); max-width: 100%; }
.share .report[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.cta { display: grid; gap: 2px; margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: var(--leaf); color: var(--on-leaf); text-decoration: none; max-width: 560px; }
.cta.big { margin-top: 20px; padding: 14px 18px; } .cta.big b { font-size: 18px; } .cta span { font-size: 15px; opacity: .9; }
.check fieldset { border: 0; padding: 0; margin: 22px 0 0; min-width: 0; }
.check legend { font-family: var(--display); font-weight: 700; font-size: 19px; margin-bottom: 10px; padding: 0; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--leaf); flex: none; }
.opt span { display: grid; min-width: 0; } .opt small { color: var(--muted); font-size: 13px; }
.opt:has(input:checked) { border-color: var(--leaf); background: var(--leaf-soft); }
.when { display: grid; gap: 6px; margin-top: 22px; font-family: var(--display); font-weight: 700; font-size: 19px; }
.when input, .ck-fields input { font: 17px var(--body); min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); max-width: 100%; }
.paste { display: grid; gap: 6px; margin-top: 22px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px; }
.paste label { font-family: var(--display); font-weight: 700; font-size: 17px; }
.paste p { margin: 0; }
.paste textarea { width: 100%; font: 15px/1.5 var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); resize: vertical; }
.paste button { justify-self: start; font: 700 15px var(--body); min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--leaf); background: var(--surface); color: var(--leaf); cursor: pointer; }
.verdict { margin: 24px 0 0; padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 18px; }
.verdict.ok { background: var(--done-soft); color: var(--done); } .verdict.info { background: var(--you-soft); color: var(--you); }
.verdict.warn { background: var(--haldi-soft); color: var(--haldi); } .verdict.bad { background: var(--stop-soft); color: var(--stop); }
.ck-card { margin-top: 12px; padding: 4px 16px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ck-card h3, .ck-complaint h3 { font-size: 16px; margin: 12px 0 2px; color: var(--muted); }
.ck-card p { margin: 0; }
.ck-complaint { margin-top: 20px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); }
.ck-complaint h2 { margin: 0 0 12px; font-size: 20px; }
.ck-fields { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 12px; }
.ck-fields label { display: grid; gap: 4px; font-size: 15px; font-weight: 500; min-width: 0; }
.ck-complaint textarea { width: 100%; font: 15px/1.5 var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); resize: vertical; }
.ck-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.ck-actions button { font: 700 16px var(--body); min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--leaf); color: var(--on-leaf); cursor: pointer; }
.trust { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 10px 0 0; }
.feedback { margin-top: 36px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); }
.feedback h2 { margin: 0 0 10px; font-size: 19px; }
.vote { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.vote button { font: 500 16px var(--body); min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.vote button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.report { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.report.emph { background: var(--stop-soft); color: var(--stop); padding: 0 14px; border-radius: 10px; text-decoration: none; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
