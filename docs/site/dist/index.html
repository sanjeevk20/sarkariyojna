u can file a <b>First Appeal<\/b> on Aaple Sarkar with your Application ID, under the <b>Maharashtra Right to Public Services Act, 2015<\/b>.", "help": "<b>Renew before it expires<\/b> · State and central formats are different<br/><b>Check status:<\/b> Aaple Sarkar → Track your application · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "नॉन-क्रिमीलेयर प्रमाणपत्र: आपले सरकार वरून कसे मिळवायचे", "benefit": "इ.मा.व., वि.जा. / भ.ज. आणि वि.मा.प्र. विद्यार्थी व उमेदवारांना आरक्षणासाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "तुम्ही अर्ज करू शकता जर:<ul><li>तुम्ही <b>इ.मा.व., वि.जा. / भ.ज. किंवा वि.मा.प्र.<\/b> प्रवर्गातील असाल<\/li><li>तुमचे <b>कौटुंबिक उत्पन्न वर्षाला ₹8 लाखांपेक्षा कमी<\/b> असेल<\/li><li>तुमचे पालक उच्च पदावर नसतील (उदा. वर्ग-1 अधिकारी)<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "कोणते उत्पन्न मोजले जाते ते तपासा. नियमांनुसार पगार किंवा शेती उत्पन्न वगळले जाऊ शकते. आपण अपात्र आहोत असे स्वतःच ठरवू नका."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "आधी जातीचा दाखला मिळवा", "body": "<b>जातीचा दाखला असेल तरच<\/b> नॉन-क्रिमीलेयर प्रमाणपत्र मिळते. तो नसेल तर आधी तो काढा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अजून जातीचा दाखला नाही? <b>जातीचा दाखला मार्गदर्शक<\/b> पाहा. जुना पुरावा शोधायला वेळ लागतो, म्हणून लवकर सुरुवात करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमचा <b>जातीचा दाखला<\/b><\/li><li>पालकांचा <b>मागील 3 वर्षांचा उत्पन्नाचा पुरावा<\/b>: उत्पन्नाचा दाखला / ITR / फॉर्म 16<\/li><li>पालकांच्या नोकरी किंवा व्यवसायाची माहिती<\/li><li>आधार, रेशन कार्ड / पत्त्याचा पुरावा<\/li><li>स्वयंघोषणापत्र, फोटो<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → महसूल विभाग → नॉन-क्रिमीलेयर प्रमाणपत्र<\/li><li>जवळचे <b>आपले सरकार सेवा केंद्र<\/b>, किंवा महाविद्यालयातील शिबिर<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> आणि दाखवलेली <b>कालमर्यादा (दिवस)<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>केंद्र<\/b> सरकारी नोकरी किंवा प्रवेशासाठी <b>केंद्राच्या नमुन्यातील<\/b> प्रमाणपत्र लागते. तुम्हाला कोणते हवे ते कार्यालयाला सांगा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "कागदपत्रांची तपासणी", "body": "तहसील / उपविभागीय कार्यालय तुमचा जातीचा दाखला आणि 3 वर्षांचे कौटुंबिक उत्पन्न तपासते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? बहुतेक वेळा एखाद्या वर्षाचा उत्पन्नाचा पुरावा नसतो किंवा अस्पष्ट असतो. तो अपलोड करून पुन्हा सादर करा. <b>कार्यालयात जाण्याची गरज नाही.<\/b>"}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "उपविभागीय अधिकाऱ्यांची मंजुरी", "body": "<b>उपविभागीय अधिकारी (SDO)<\/b> किंवा तुमच्या तालुक्यातील सक्षम अधिकारी मंजुरी देऊन <b>डिजिटल सही<\/b> करतात.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "प्रमाणपत्र डाउनलोड करा", "body": "आपले सरकार वर लॉगिन करून डाउनलोड करा. त्यावर छापलेली <b>वैधता तारीख<\/b> तपासा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "जातीच्या दाखल्याप्रमाणे नाही, नॉन-क्रिमीलेयरची <b>मुदत संपते<\/b>. तारीख लिहून ठेवा आणि प्रवेश किंवा नोकरीच्या अर्जा<b>पूर्वी<\/b> नूतनीकरण करा."}}], "rights_t": "उशीर झाला? हा तुमचा हक्क आहे.", "rights": "कालमर्यादा संपली असेल तर <b>महाराष्ट्र लोकसेवा हक्क अधिनियम, 2015<\/b> नुसार अर्ज क्रमांक वापरून आपले सरकार वर <b>प्रथम अपील<\/b> करता येते.", "help": "<b>मुदत संपण्यापूर्वी नूतनीकरण करा<\/b> · राज्य आणि केंद्राचे नमुने वेगळे आहेत<br/><b>स्थिती तपासा:<\/b> आपले सरकार → Track your application · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "caste-validity", "title": "Caste validity certificate", "local_name": "जात वैधता प्रमाणपत्र", "audience": "Professional admissions, reserved jobs, elections", "state": "mh", "local": "mr", "cat": "docs", "links": [{"label": "CCVIS (BARTI): SC / OBC / VJNT / SBC validity", "url": "https://ccvis.barti.in/home_menu.php", "gov": true}, {"label": "e-Tribe Validity (TRTI): ST validity", "url": "https://etribevalidity.trti-maha.in/", "gov": true}, {"label": "BARTI: caste certificate verification", "url": "https://www.barti.in/department/cast-certificate-verification", "gov": true}], "mermaid": "flowchart TD\n    A([Needs caste validity<br/>admission / reserved job / election]) --> CC{1. Has caste certificate?}\n    CC -- No --> CG[Get caste certificate first<br/>see caste certificate workflow,<br/>then continue]\n    CG -.-> C\n    CC -- Yes --> C[2. Gather documents<br/>caste cert, LC, pre-cut-off proof,<br/>family tree, prescribed affidavit, college form]\n    C --> BR{Blood relative already has validity?}\n    BR -- Yes --> BRY[Attach relative's validity<br/>strongest proof, fast track]\n    BR -- No --> D\n    BRY --> D[3. Apply online: cvc.barti.in for SC, VJNT, OBC, SBC, SEBC<br/>or eTribe Validity for ST, then submit to<br/>District Caste Certificate Scrutiny Committee]\n    D --> K[Acknowledgement / token<br/>used for provisional admission]\n    K --> E[4. Committee scrutiny]\n    E -- Proof weak --> V[Vigilance cell inquiry<br/>local / village visit]\n    E -- Needs clarification --> HN[Hearing notice<br/>attend with originals]\n    V --> DEC\n    HN --> DEC\n    E -- Proof clear --> DEC{5. Committee decision}\n    DEC -- Valid --> I([6. Caste validity certificate<br/>lifetime, proof for family])\n    DEC -- Invalid --> F1[Claim invalidated]\n    F1 --> HC[Challenge in High Court]\n    E -. pending long .-> T[Written reminder to Member Secretary<br/>with token no. + deadline]\n\n    S1[[Sathi: Start-early alert<br/>11th / 12th students]]:::sathi -.-> A\n    S2[[Sathi: Family validity finder<br/>does any blood relative have one?]]:::sathi -.-> BR\n    S3[[Sathi: Hearing reminder<br/>originals checklist]]:::sathi -.-> HN\n    S4[[Sathi: Pending clock + draft reminder]]:::sathi -.-> T\n    S5[[Sathi: Family vault<br/>reuse validity for siblings, children]]:::sathi -.-> I\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1 blocked", "sources": [{"label": "CCVIS (BARTI) home with new-portal notice", "url": "https://ccvis.barti.in/home_menu.php"}, {"label": "CVC BARTI: About", "url": "https://cvc.barti.in/home/pages/about"}, {"label": "e-Tribe Validity Portal (TRTI)", "url": "https://etribevalidity.trti-maha.in/"}, {"label": "BARTI: Caste Certificate Verification", "url": "https://www.barti.in/department/cast-certificate-verification"}], "verified": "2026-10-27", "en": {"h1": "Caste Validity Certificate: How to get it", "benefit": "Needed for reserved seats in professional courses, reserved government jobs and elections", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Know when you need it", "body": "<ul><li><b>Admission<\/b> on a reserved seat in engineering, medical, pharmacy and other professional courses<\/li><li><b>Government job<\/b> on a reserved post<\/li><li><b>Election<\/b> from a reserved seat<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Students: apply in <b>11th or 12th<\/b>, not after the CET result. It can take months."}}, {"phase": null, "kind": "you", "who": "You", "title": "Have your caste certificate first", "body": "The committee checks whether your <b>caste certificate<\/b> is genuine. You must already have it.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No caste certificate yet? See the <b>Caste Certificate guide<\/b> first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Your caste certificate and school leaving certificate<\/li><li>The <b>old proof of caste<\/b> before the cut-off date (same as for the caste certificate)<\/li><li><b>Family tree (वंशावळ)<\/b> and affidavit in the prescribed format<\/li><li>College bonafide / form (for students)<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Does your <b>father, brother, sister or uncle (father's side)<\/b> already have a caste validity? Attach it. It is the <b>strongest proof<\/b> and makes the process much faster."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply and submit", "body": "Apply online: <b>SC, VJ/NT, OBC, SBC, SEBC<\/b> on BARTI's <b>cvc.barti.in<\/b> (new portal, replaces CCVIS); <b>ST<\/b> on the <b>eTribe Validity<\/b> portal. Print and submit it with your documents to the <b>District Caste Certificate Scrutiny Committee<\/b> (students often submit through their college).<br/>Keep the <b>acknowledgement / token number<\/b> safe.", "note": {"kind": "tip", "label": "Tip:", "html": "For admissions, colleges usually accept the <b>acknowledgement of your validity application<\/b> for provisional admission. Ask your college."}}, {"phase": "After you apply", "kind": "gov", "who": "Scrutiny Committee", "title": "Committee checks your case", "body": "The committee examines your documents. If the old proof is weak, it may send a <b>vigilance team (दक्षता पथक)<\/b> to inquire locally, or call you for a <b>hearing<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Got a <b>hearing notice<\/b>? Attend on the date with all <b>original documents<\/b>. Missing a hearing delays your case."}}, {"phase": null, "kind": "gov", "who": "Scrutiny Committee", "title": "Committee decides", "body": "If satisfied, the committee issues the <b>caste validity certificate<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Caste claim <b>invalidated<\/b>? This decision can be challenged in the <b>High Court<\/b>. Get legal advice quickly."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Collect your validity certificate", "body": "Download or collect it. It is valid <b>for life<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Your validity becomes the <b>strongest proof<\/b> for your brothers, sisters and children when they apply."}}], "rights_t": "Pending too long? Escalate.", "rights": "Give a <b>written reminder to the Member Secretary<\/b> of the District Caste Certificate Scrutiny Committee with your token number and take an <b>acknowledgement (पोच)<\/b>. The committee should normally decide within <b>about 3 months<\/b>. If an admission or job deadline is near, mention it in writing.", "help": "<b>Start early<\/b>, this is the slowest certificate in the chain: caste certificate → caste validity → admission / job<br/><b>Use only official government websites<\/b> · Never pay anyone to \"manage\" the committee"}, "loc": {"h1": "जात वैधता प्रमाणपत्र: कसे मिळवायचे", "benefit": "व्यावसायिक अभ्यासक्रमातील राखीव जागा, राखीव सरकारी नोकरी आणि निवडणुकीसाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कधी लागते ते ओळखा", "body": "<ul><li>अभियांत्रिकी, वैद्यकीय, औषधनिर्माणशास्त्र व इतर व्यावसायिक अभ्यासक्रमात राखीव जागेवर <b>प्रवेश<\/b><\/li><li>राखीव पदावर <b>सरकारी नोकरी<\/b><\/li><li>राखीव जागेवरून <b>निवडणूक<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "विद्यार्थ्यांनो: <b>11 वी किंवा 12 वीत<\/b> असतानाच अर्ज करा, CET निकालानंतर नाही. याला काही महिने लागू शकतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "आधी जातीचा दाखला हवा", "body": "तुमचा <b>जातीचा दाखला<\/b> खरा आहे का हे समिती तपासते. तो आधी तुमच्याकडे असला पाहिजे.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अजून जातीचा दाखला नाही? आधी <b>जातीचा दाखला मार्गदर्शक<\/b> पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमचा जातीचा दाखला आणि शाळा सोडल्याचा दाखला<\/li><li>मानीव दिनांकापूर्वीचा <b>जुना जातीचा पुरावा<\/b> (जातीच्या दाखल्यासाठी वापरलेलाच)<\/li><li><b>वंशावळ<\/b> आणि विहित नमुन्यातील प्रतिज्ञापत्र<\/li><li>महाविद्यालयाचे बोनाफाईड / अर्ज (विद्यार्थ्यांसाठी)<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमच्या <b>वडिलांकडे, भावाकडे, बहिणीकडे किंवा काकांकडे<\/b> आधीच जात वैधता प्रमाणपत्र आहे का? ते जोडा. हा <b>सर्वात भक्कम पुरावा<\/b> आहे आणि प्रक्रिया खूप लवकर होते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा आणि सादर करा", "body": "ऑनलाइन अर्ज करा: <b>अनुसूचित जाती, वि.जा./भ.ज., इ.मा.व., वि.मा.प्र., SEBC<\/b> साठी BARTI चे <b>cvc.barti.in<\/b> (नवीन पोर्टल, CCVIS ऐवजी); <b>अनुसूचित जमाती<\/b> साठी <b>ई-ट्राइब व्हॅलिडिटी<\/b> पोर्टल. त्याची प्रिंट काढा आणि कागदपत्रांसह <b>जिल्हा जात प्रमाणपत्र पडताळणी समितीकडे<\/b> सादर करा (विद्यार्थी बहुतेक वेळा महाविद्यालयामार्फत सादर करतात).<br/><b>पोच पावती / टोकन क्रमांक<\/b> जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "प्रवेशासाठी महाविद्यालये सहसा <b>वैधता अर्जाची पोच पावती<\/b> पाहून तात्पुरता प्रवेश देतात. तुमच्या महाविद्यालयात विचारा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "पडताळणी समिती", "title": "समितीकडून तपासणी", "body": "समिती तुमची कागदपत्रे तपासते. जुना पुरावा कमकुवत असेल तर स्थानिक चौकशीसाठी <b>दक्षता पथक<\/b> पाठवू शकते, किंवा <b>सुनावणीसाठी<\/b> बोलावू शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>सुनावणीची नोटीस<\/b> आली? ठरलेल्या तारखेला सर्व <b>मूळ कागदपत्रांसह<\/b> हजर राहा. सुनावणी चुकल्यास प्रकरण लांबते."}}, {"phase": null, "kind": "gov", "who": "पडताळणी समिती", "title": "समितीचा निर्णय", "body": "समितीचे समाधान झाल्यास ती <b>जात वैधता प्रमाणपत्र<\/b> देते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "जातीचा दावा <b>अवैध<\/b> ठरला? या निर्णयाला <b>उच्च न्यायालयात<\/b> आव्हान देता येते. लवकर कायदेशीर सल्ला घ्या."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "वैधता प्रमाणपत्र मिळवा", "body": "ते डाउनलोड करा किंवा घ्या. ते <b>आयुष्यभर<\/b> वैध असते.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमचे वैधता प्रमाणपत्र पुढे तुमच्या भाऊ, बहिणी आणि मुलांना अर्ज करताना <b>सर्वात भक्कम पुरावा<\/b> ठरते."}}], "rights_t": "खूप दिवस प्रलंबित? पाठपुरावा करा.", "rights": "टोकन क्रमांकासह जिल्हा जात प्रमाणपत्र पडताळणी समितीच्या <b>सदस्य सचिवांना लेखी स्मरणपत्र<\/b> द्या आणि <b>पोच<\/b> घ्या. समितीने साधारण <b>3 महिन्यांत<\/b> निर्णय घ्यायला हवा. प्रवेश किंवा नोकरीची अंतिम तारीख जवळ असेल तर ते लेखी नमूद करा.", "help": "<b>लवकर सुरुवात करा<\/b>, साखळीतील हे सर्वात वेळखाऊ प्रमाणपत्र आहे: जातीचा दाखला → जात वैधता → प्रवेश / नोकरी<br/><b>फक्त अधिकृत सरकारी वेबसाइट वापरा<\/b> · समिती \"मॅनेज\" करण्यासाठी कोणालाही पैसे देऊ नका"}}, {"slug": "ferfar", "title": "7/12 Ferfar (mutation)", "local_name": "७/१२ फेरफार", "audience": "Land buyers, heirs", "state": "mh", "local": "mr", "cat": "docs", "links": [{"label": "Mahabhumi: land records home", "url": "https://mahabhumi.gov.in", "gov": false}, {"label": "Mahabhulekh: view 7/12 and 8A", "url": "https://bhulekh.mahabhumi.gov.in", "gov": false}, {"label": "Digital 7/12 and Aapli Chawadi notices", "url": "https://digitalsatbara.mahabhumi.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Land changes hands]) --> B{1. Ferfar type?}\n    B -- Sale --> R[Sale deed registered<br/>at Sub-Registrar - IGR]\n    R -- Auto data transfer --> E\n    B -- Inheritance / gift / partition --> C[2. Apply with documents<br/>e-Hakk online or Talathi office<br/>death cert, all heirs, 7/12, 8A, declaration]\n    C --> E[3. Talathi creates ferfar entry<br/>ferfar number assigned]\n    E -- Entry not created --> F1[Blocked: no entry]\n    E --> N[4. Notice to all interested parties<br/>seller, heirs, bank]\n    N --> W{15-day objection window}\n    W -- Objection --> D[Dispute case<br/>Circle Officer hearing]\n    D -- Decision --> P{Approved?}\n    W -- No objection --> P\n    P -- No --> F2[Rejected with reason]\n    F2 --> AP[Appeal to SDO / reapply]\n    P -- Yes --> H[5. Circle Officer certifies ferfar]\n    H --> I([6. 7/12 updated with new name<br/>Digital signed 7/12 download])\n    W -. window over, still pending .-> T[Written application to Tahsildar<br/>with ferfar no., take acknowledgement]\n\n    S1[[Sathi: Ferfar Predictor<br/>auto-entry check after registration]]:::sathi -.-> R\n    S2[[Sathi: Heir checklist<br/>no missing heir]]:::sathi -.-> C\n    S3[[Sathi: 15-day countdown<br/>+ draft application to Tahsildar]]:::sathi -.-> T\n    S4[[Sathi: 7/12 Health Report<br/>verify name, loan, stay]]:::sathi -.-> I\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,D blocked", "sources": [{"label": "bhume.in: Ferfar status", "url": "https://www.bhume.in/maharashtra/ferfar"}, {"label": "bhume.in: Aapli Chawadi", "url": "https://www.bhume.in/maharashtra/e-chawadi"}, {"label": "1acre: Mutation Ferfar Maharashtra", "url": "https://1acre.in/guides/maharashtra/mutation-ferfar-maharashtra"}, {"label": "Landeed: Ferfar Maharashtra", "url": "https://web.landeed.com/maharashtra/ferfar"}, {"label": "RTI wiki: 7/12 and ferfar correction", "url": "https://righttoinformation.wiki/practical-guides/maharashtra-712-extract-ferfar-mutation-correction-talathi"}], "verified": "2026-10-27", "en": {"h1": "7/12 Ferfar: How to get your name on the land record", "benefit": "Needed after you buy, inherit or get land as a gift", "steps": [{"phase": "Start", "kind": "you", "who": "You", "title": "Know your ferfar type", "body": "<ul><li><b>Bought land<\/b> with a registered sale deed → ferfar starts <b>automatically<\/b>. Go to step 3.<\/li><li><b>Inherited<\/b> (वारस), <b>gift<\/b> or <b>family partition<\/b> → <b>you must apply<\/b>. Go to step 2.<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Buying land? The ferfar is linked to your registration. You do not need to pay anyone to \"start\" it."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply with papers (inheritance / gift)", "body": "<ul><li>Death certificate (for inheritance)<\/li><li>List of <b>all<\/b> legal heirs with their Aadhaar<\/li><li>Current 7/12 and 8A extract<\/li><li>Self-declaration / affidavit about the heirs<\/li><\/ul>Apply at the <b>Talathi office<\/b>, or online where the state's e-Hakk service is available.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Every heir's name must be included. A missing heir can object later and stop the ferfar."}}, {"phase": "Government process", "kind": "gov", "who": "Government", "title": "Ferfar entry is created", "body": "The Talathi creates a <b>ferfar entry with a number<\/b>. For a sale, the details come automatically from the Sub-Registrar's office.<br/>Note down your <b>ferfar number<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No entry after a few weeks? Visit the Talathi with your registered document number."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Notice to everyone concerned", "body": "A notice goes to the seller / all heirs / bank. They get <b>15 days<\/b> to raise an objection (हरकत).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Someone objected? It becomes a dispute case. The Circle Officer hears both sides. Keep your papers ready. You can appeal the decision to the SDO."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Circle Officer approves", "body": "After the notice period, if there is no objection, the <b>Circle Officer (मंडळ अधिकारी)<\/b> certifies the ferfar.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Read the reason, fix the papers and apply again, or appeal."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Your name is on the 7/12", "body": "The 7/12 now shows your name with the ferfar number. Download the <b>digitally signed 7/12<\/b> from <b>digitalsatbara.mahabhumi.gov.in<\/b>. It is valid <b>without a Talathi stamp<\/b>.", "note": null}], "rights_t": "Notice period over? No reason to wait.", "rights": "If 15 days have passed with no objection and the ferfar is still not certified, give a <b>written application to the Tahsildar<\/b> with your ferfar number and take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Check notice and status:<\/b> <b>Aapli Chawadi<\/b> / pending ferfar on bhulekh.mahabhumi.gov.in (ferfar number, objection last date)<br/><b>Never pay to \"speed up\"<\/b>, the 15-day notice is the law · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "७/१२ फेरफार: जमिनीच्या उताऱ्यावर तुमचे नाव कसे लावायचे", "benefit": "जमीन खरेदी, वारसा किंवा बक्षीसपत्रानंतर आवश्यक", "steps": [{"phase": "सुरुवात", "kind": "you", "who": "तुम्ही", "title": "फेरफाराचा प्रकार ओळखा", "body": "<ul><li>नोंदणीकृत खरेदीखताने <b>जमीन खरेदी केली<\/b> → फेरफार <b>आपोआप<\/b> सुरू होतो. पायरी 3 वर जा.<\/li><li><b>वारसा<\/b>, <b>बक्षीसपत्र<\/b> किंवा <b>कौटुंबिक वाटणी<\/b> → <b>तुम्हाला अर्ज करावा लागेल<\/b>. पायरी 2 वर जा.<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "जमीन खरेदी करताय? फेरफार तुमच्या दस्त नोंदणीशी जोडलेला असतो. तो \"सुरू करण्यासाठी\" कोणालाही पैसे देऊ नका."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रांसह अर्ज करा (वारसा / बक्षीस)", "body": "<ul><li>मृत्यू दाखला (वारसासाठी)<\/li><li><b>सर्व<\/b> वारसांची यादी आणि त्यांचे आधार<\/li><li>सध्याचा 7/12 व 8-अ उतारा<\/li><li>वारसांबाबत स्वयंघोषणापत्र / प्रतिज्ञापत्र<\/li><\/ul><b>तलाठी कार्यालयात<\/b> अर्ज करा, किंवा राज्याची ई-हक्क सेवा उपलब्ध असल्यास ऑनलाइन.", "note": {"kind": "stuck", "label": "अडचण?", "html": "प्रत्येक वारसाचे नाव असलेच पाहिजे. एखादा वारस सुटला तर तो नंतर हरकत घेऊन फेरफार थांबवू शकतो."}}, {"phase": "सरकारी प्रक्रिया", "kind": "gov", "who": "सरकार", "title": "फेरफार नोंद तयार होते", "body": "तलाठी <b>क्रमांकासह फेरफार नोंद<\/b> तयार करतात. खरेदीच्या बाबतीत माहिती दुय्यम निबंधक कार्यालयातून आपोआप येते.<br/>तुमचा <b>फेरफार क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "काही आठवड्यांनंतरही नोंद नाही? नोंदणीकृत दस्त क्रमांक घेऊन तलाठ्यांना भेटा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "संबंधितांना नोटीस", "body": "विक्रेता / सर्व वारस / बँक यांना नोटीस जाते. त्यांना हरकत घेण्यासाठी <b>15 दिवस<\/b> मिळतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "कोणी हरकत घेतली? हे वादाचे प्रकरण होते. मंडळ अधिकारी दोन्ही बाजू ऐकतात. कागदपत्रे तयार ठेवा. निर्णयाविरुद्ध उपविभागीय अधिकाऱ्यांकडे (SDO) अपील करता येते."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "मंडळ अधिकाऱ्यांची मंजुरी", "body": "नोटीस कालावधी संपल्यावर हरकत नसेल तर <b>मंडळ अधिकारी<\/b> फेरफार प्रमाणित करतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "नामंजूर झाला? कारण वाचा, कागदपत्रे दुरुस्त करून पुन्हा अर्ज करा किंवा अपील करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "७/१२ वर तुमचे नाव", "body": "आता 7/12 वर फेरफार क्रमांकासह तुमचे नाव दिसेल. <b>digitalsatbara.mahabhumi.gov.in<\/b> वरून <b>डिजिटल सही असलेला 7/12<\/b> डाउनलोड करा. तो <b>तलाठ्यांच्या शिक्क्याशिवाय वैध<\/b> आहे.", "note": null}], "rights_t": "नोटीस कालावधी संपला? आता वाट पाहण्याचे कारण नाही.", "rights": "15 दिवस होऊन कोणतीही हरकत नसताना फेरफार प्रमाणित झाला नसेल, तर फेरफार क्रमांकासह <b>तहसीलदारांना लेखी अर्ज<\/b> द्या आणि <b>पोच<\/b> घ्या.", "help": "<b>नोटीस व स्थिती तपासा:<\/b> bhulekh.mahabhumi.gov.in वर <b>आपली चावडी<\/b> / प्रलंबित फेरफार (फेरफार क्रमांक, हरकतीची शेवटची तारीख)<br/><b>\"लवकर करण्यासाठी\" पैसे देऊ नका<\/b>, 15 दिवसांची नोटीस हा कायदा आहे · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "mahadbt-scholarship", "title": "MahaDBT scholarship", "local_name": "महाडीबीटी शिष्यवृत्ती", "audience": "College students", "state": "mh", "local": "mr", "cat": "edu", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}], "mermaid": "flowchart TD\n    A([Student needs scholarship]) --> B[1. Find eligible scheme<br/>category, income, course]\n    B --> C[2. Gather documents<br/>Aadhaar-bank seeding, current income cert,<br/>caste + validity, domicile, marksheet, fee receipt]\n    C --> R[3. Register on MahaDBT<br/>complete full profile]\n    R --> D[4. Apply before deadline<br/>Application ID]\n    D --> E[5. College scrutiny<br/>scholarship desk]\n    E -- Document issue --> F1[Sent back to applicant<br/>with remark]\n    F1 -- Fix + resubmit --> E\n    E -- Not acted --> F2[Pending at college]\n    E -- Forwarded --> G[6. Department scrutiny + sanction<br/>Social Justice / OBC / Tribal / Higher Ed]\n    G -- Rejected --> F3[Rejected with reason]\n    G -- Sanctioned --> P[7. DBT payment via PFMS<br/>student a/c + fee to college where applicable]\n    P -- Aadhaar not seeded / a/c inactive --> F4[Payment failed]\n    P --> I([Money received])\n    I --> N[Next academic year:<br/>renewal with pass result + new income cert]\n    F2 --> T[Grievance on MahaDBT /<br/>district department office]\n\n    S1[[Sathi: Scheme matcher<br/>best single scheme]]:::sathi -.-> B\n    S2[[Sathi: Readiness check<br/>income cert expiry, bank seeding]]:::sathi -.-> C\n    S3[[Sathi: Decode sent-back remark in Marathi]]:::sathi -.-> F1\n    S4[[Sathi: Deadline + pending-at-college clock<br/>draft grievance]]:::sathi -.-> T\n    S5[[Sathi: Renewal reminder]]:::sathi -.-> N\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3,F4 blocked", "sources": [{"label": "Tirpude College: Notice of Scholarship 2025", "url": "https://www.tirpude.edu.in/wp-content/uploads/2025/10/Notice-of-Scholarship-2025.pdf"}, {"label": "IndiaScholarships: MahaDBT post-matric", "url": "https://www.indiascholarships.in/bn/scholarships/mahadbt-post-matric-scholarship-maharashtra"}, {"label": "DJSCE: MahaDBT form filling", "url": "https://www.djsce.ac.in/docs/Process-of-MahaDBT-Scholarship-Form-Filling-1.pptx.pdf"}], "verified": "2026-10-27", "en": {"h1": "MahaDBT Scholarship: How to get it step by step", "benefit": "Fee and maintenance support for college students, paid into your bank account", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check which scheme fits you", "body": "Schemes depend on your <b>category<\/b>, <b>family income<\/b> and <b>course<\/b>. After you fill your profile, MahaDBT shows the schemes you are eligible for.", "note": {"kind": "tip", "label": "Tip:", "html": "You can get only <b>one scholarship<\/b> for the same course. Pick the one that gives you the most."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar, linked to your <b>bank account<\/b><\/li><li><b>Income certificate of the current year<\/b><\/li><li>Caste certificate (and caste validity, if your course needs it)<\/li><li>Domicile certificate<\/li><li>Last exam marksheet, admission / fee receipt<\/li><li>Gap certificate, if you had a gap year<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Income certificate from last year? Get a new one first. Not sure your bank is Aadhaar-linked? Ask the bank for <b>\"Aadhaar seeding / NPCI mapping\"<\/b>."}}, {"phase": null, "kind": "you", "who": "You", "title": "Register and fill your profile", "body": "Go to <b>mahadbt.maharashtra.gov.in<\/b> → New Applicant Registration. Fill every section of the profile (personal, income, caste, course, past education, hostel) until it is <b>100% complete<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Note down your <b>username and password<\/b>. You need them every year for renewal."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply before the deadline", "body": "Choose your scheme, upload documents and submit. Note your <b>Application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Don't wait for the last week. The portal gets slow and deadlines are strict."}}, {"phase": "After you apply", "kind": "gov", "who": "College / Government", "title": "College checks your application", "body": "Your college's <b>scholarship desk<\/b> checks your documents and forwards the application.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Read the remark, fix it and resubmit. <b>Pending at college<\/b> for long? Visit the scholarship desk with your Application ID."}}, {"phase": null, "kind": "gov", "who": "College / Government", "title": "Department approves", "body": "The welfare department for your scheme (e.g. Social Justice, OBC, Tribal, Higher Education) checks and <b>sanctions<\/b> the scholarship.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Money in your bank account", "body": "The amount is paid by <b>DBT<\/b> into your Aadhaar-linked bank account. For some schemes, the fee part goes directly to the college.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Your bank account may not be Aadhaar-seeded or may be inactive. Fix it at the bank."}}], "rights_t": "Pending too long? Escalate.", "rights": "If the college or department has not acted for a long time, raise a <b>grievance on the MahaDBT portal<\/b> with your Application ID, or contact the <b>district office<\/b> of your scheme's department.", "help": "<b>Renew every year<\/b> on MahaDBT: you need last year's pass result and a fresh income certificate<br/><b>Check status:<\/b> MahaDBT login → My Applied Schemes · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "महाडीबीटी शिष्यवृत्ती: पायरी-पायरीने कशी मिळवायची", "benefit": "महाविद्यालयीन विद्यार्थ्यांना फी व निर्वाह भत्ता, थेट बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कोणती योजना लागू ते तपासा", "body": "योजना तुमचा <b>प्रवर्ग<\/b>, <b>कौटुंबिक उत्पन्न<\/b> आणि <b>अभ्यासक्रम<\/b> यावर अवलंबून असतात. प्रोफाइल भरल्यानंतर महाडीबीटी तुम्ही पात्र असलेल्या योजना दाखवते.", "note": {"kind": "tip", "label": "सूचना:", "html": "एकाच अभ्यासक्रमासाठी <b>एकच शिष्यवृत्ती<\/b> मिळते. सर्वात जास्त फायदा देणारी योजना निवडा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार, तुमच्या <b>बँक खात्याशी लिंक<\/b> असलेले<\/li><li><b>चालू वर्षाचा उत्पन्नाचा दाखला<\/b><\/li><li>जातीचा दाखला (आणि अभ्यासक्रमासाठी लागत असल्यास जात वैधता प्रमाणपत्र)<\/li><li>अधिवास प्रमाणपत्र (डोमिसाईल)<\/li><li>मागील परीक्षेची गुणपत्रिका, प्रवेश / फी पावती<\/li><li>शिक्षणात खंड असल्यास गॅप प्रमाणपत्र<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "मागील वर्षाचा उत्पन्नाचा दाखला आहे? आधी नवीन दाखला काढा. बँक खाते आधारशी लिंक आहे की नाही माहीत नाही? बँकेत <b>\"आधार सीडिंग / NPCI मॅपिंग\"<\/b> बद्दल विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "नोंदणी करून प्रोफाइल भरा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> → New Applicant Registration. प्रोफाइलचे सर्व भाग (वैयक्तिक, उत्पन्न, जात, अभ्यासक्रम, मागील शिक्षण, वसतिगृह) <b>100% पूर्ण<\/b> होईपर्यंत भरा.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमचे <b>युजरनेम आणि पासवर्ड<\/b> लिहून ठेवा. दरवर्षी नूतनीकरणासाठी ते लागतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अंतिम तारखेपूर्वी अर्ज करा", "body": "योजना निवडा, कागदपत्रे अपलोड करा आणि अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> (Application ID) लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "शेवटच्या आठवड्याची वाट पाहू नका. पोर्टल मंद होते आणि अंतिम तारीख कडक असते."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महाविद्यालय / सरकार", "title": "महाविद्यालयाकडून तपासणी", "body": "तुमच्या महाविद्यालयाचा <b>शिष्यवृत्ती विभाग<\/b> कागदपत्रे तपासून अर्ज पुढे पाठवतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>परत पाठवला<\/b> (Sent back) असे दिसले? शेरा वाचा, दुरुस्ती करून पुन्हा सादर करा. <b>महाविद्यालयाकडे प्रलंबित<\/b> खूप दिवस? अर्ज क्रमांक घेऊन शिष्यवृत्ती विभागात भेटा."}}, {"phase": null, "kind": "gov", "who": "महाविद्यालय / सरकार", "title": "विभागाची मंजुरी", "body": "तुमच्या योजनेचा विभाग (उदा. सामाजिक न्याय, इतर मागास बहुजन कल्याण, आदिवासी विकास, उच्च शिक्षण) तपासणी करून शिष्यवृत्ती <b>मंजूर<\/b> करतो.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "पैसे बँक खात्यात जमा", "body": "रक्कम <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते. काही योजनांमध्ये फीची रक्कम थेट महाविद्यालयाला जाते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर झाले पण पैसे आले नाहीत? बँक खाते आधार-सीडेड नसेल किंवा बंद असेल. बँकेत दुरुस्त करा."}}], "rights_t": "खूप दिवस प्रलंबित? तक्रार करा.", "rights": "महाविद्यालय किंवा विभागाने बराच काळ कार्यवाही केली नसेल, तर अर्ज क्रमांकासह <b>महाडीबीटी पोर्टलवर तक्रार<\/b> नोंदवा, किंवा तुमच्या योजनेच्या विभागाच्या <b>जिल्हा कार्यालयाशी<\/b> संपर्क साधा.", "help": "<b>दरवर्षी नूतनीकरण करा:<\/b> मागील वर्षाचा उत्तीर्ण निकाल आणि नवीन उत्पन्नाचा दाखला लागतो<br/><b>स्थिती तपासा:<\/b> महाडीबीटी लॉगिन → My Applied Schemes · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "mjprf", "title": "Mahatma Jyotiba Phule Research Fellowship (MahaJyoti)", "local_name": "महात्मा ज्योतिबा फुले संशोधन अधिछात्रवृत्ती", "audience": "OBC / VJ-NT / SBC PhD scholars", "state": "mh", "local": "mr", "cat": "edu", "links": [{"label": "MahaJyoti: notices and applications", "url": "https://mahajyoti.org.in", "gov": true}, {"label": "MahaJyoti: PhD scheme guidelines (PDF)", "url": "https://mahajyoti.org.in/wp-content/uploads/2023/06/Guidelines-for-PhD-Scheme-2023-23.06.2023-Final-Approved-1.pdf", "gov": true}], "mermaid": "flowchart TD\n    A([OBC / VJNT / SBC student]) --> R{1. Which MahaJyoti scheme?}\n    R -- 10th passed, Science --> TAB([Tab + coaching scheme: separate flow])\n    R -- UG / PG --> CF([Course fee support: separate flow])\n    R -- Full-time PhD --> E{2. MJPRF eligible?<br/>non-creamy layer, MH domicile,<br/>PG + full-time PhD, age limit,<br/>no NET-JRF / other fellowship}\n    E -- No --> X([Not eligible])\n    E -- Yes --> D[3. Documents<br/>caste cert, valid NCL, domicile,<br/>PG marks, PhD admission, guide consent,<br/>proposal, seeded bank a/c]\n    D --> AP[4. Apply online when notice opens<br/>mahajyoti.org.in / PhD portal<br/>registration ID]\n    AP --> SC[5. Scrutiny]\n    SC -- Error / pending list --> F1[Submit missing document by deadline]\n    SC --> SL[Selection list + document verification]\n    SL --> J[6. Joining report via university<br/>+ undertaking, resignation if employed]\n    J --> P[7. Fellowship paid about every 6 months<br/>JRF then SRF, up to 5 years]\n    P -- Progress report / UC missing --> F2[Payment delayed]\n    F2 -.-> T[Write to MahaJyoti Nagpur +<br/>university research cell]\n\n    S1[[Sathi: MahaJyoti scheme router]]:::sathi -.-> R\n    S2[[Sathi: Certificate chain check<br/>caste, NCL validity, domicile]]:::sathi -.-> D\n    S3[[Sathi: Notice alert + deadline countdown]]:::sathi -.-> AP\n    S4[[Sathi: Watch selection / error lists]]:::sathi -.-> SC\n    S5[[Sathi: Six-monthly report reminder]]:::sathi -.-> P\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "MahaJyoti: PhD scheme guidelines 2023", "url": "https://mahajyoti.org.in/wp-content/uploads/2023/06/Guidelines-for-PhD-Scheme-2023-23.06.2023-Final-Approved-1.pdf"}, {"label": "MahaJyoti: MJPRF undertaking", "url": "https://mahajyoti.org.in/wp-content/uploads/2024/10/undertaking-2023-2.pdf"}, {"label": "MahaJyoti: PhD financial assistance scheme (Marathi)", "url": "https://mahajyoti.org.in/en/%E0%A4%AA%E0%A5%80%E0%A4%8F%E0%A4%9A%E0%A4%A1%E0%A5%80-%E0%A4%95%E0%A4%B0%E0%A4%BF%E0%A4%A4%E0%A4%BE-%E0%A4%85%E0%A4%B0%E0%A5%8D%E0%A4%A5%E0%A4%B8%E0%A4%B9%E0%A4%BE%E0%A4%AF%E0%A5%8D%E0%A4%AF-2/"}, {"label": "MahaJyoti: utilisation certificate format", "url": "https://mahajyoti.org.in/wp-content/uploads/2023/01/Annexure-IV-utilization-certificate.pdf"}, {"label": "TheInternship: MahaJyoti scholarship 2026", "url": "https://theinternship.in/maha-jyoti-scholarship/"}, {"label": "ScholarshipsX: MahaJyoti 2026", "url": "https://scholarshipsx.com/mahajyoti-scholarship-2026/"}], "verified": "2026-10-27", "en": {"h1": "Mahatma Jyotiba Phule Research Fellowship: PhD support from MahaJyoti", "benefit": "Monthly fellowship for up to 5 years for full-time PhD scholars from OBC, VJ / NT and SBC", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Pick the right MahaJyoti scheme", "body": "MahaJyoti (Nagpur) runs several schemes for <b>OBC, VJ / NT and SBC<\/b> students:<ul><li><b>10th passed, Science<\/b> → free <b>tablet + internet + CET / JEE / NEET coaching<\/b><\/li><li><b>UG / PG students<\/b> → online course fee support<\/li><li><b>Full-time PhD<\/b> → <b>MJPRF fellowship<\/b>. This guide.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check MJPRF eligibility", "body": "<ul><li><b>OBC, VJ / NT or SBC<\/b>, <b>non-creamy layer<\/b>, Maharashtra domicile<\/li><li><b>Post-graduate<\/b> degree, admitted to a <b>full-time PhD<\/b> (not distance mode)<\/li><li>Within the <b>age limit<\/b> in the notice (about 45 in recent rounds)<\/li><li><b>Not<\/b> already holding UGC / CSIR NET-JRF or another fellowship<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Caste certificate<\/b> and <b>valid Non-Creamy Layer<\/b> certificate<\/li><li><b>Domicile<\/b> certificate<\/li><li>PG marksheets and degree<\/li><li><b>PhD registration / admission letter<\/b>, guide's consent, research proposal<\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b>, undertaking in the given format<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "NCL expired or no caste validity? Fix these first. See the <b>NCL<\/b> and <b>caste validity<\/b> guides."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply when the notice opens", "body": "Watch <b>mahajyoti.org.in<\/b> for the fellowship notice. Apply online on MahaJyoti's <b>PhD portal<\/b> within the dates. Note your <b>registration ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Deadlines are <b>strict<\/b> and rounds are once a year. Keep documents ready before the notice comes."}}, {"phase": "After you apply", "kind": "gov", "who": "MahaJyoti / University", "title": "Scrutiny and selection list", "body": "MahaJyoti checks applications and publishes <b>lists<\/b> (eligible / selected / errors) on its website. Document verification may follow.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Name in the <b>error / pending list<\/b>? Read the remark and submit the missing document within the given time."}}, {"phase": null, "kind": "you", "who": "You", "title": "Join and submit undertaking", "body": "Submit the <b>joining report<\/b> through your university / research centre and the signed <b>undertaking<\/b>. If you are employed, you may need to give a <b>resignation / relieving letter<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Fellowship paid, keep reporting", "body": "The fellowship (JRF level first, then SRF) is paid into your Aadhaar-linked bank account, usually <b>every six months<\/b>, based on your <b>progress report<\/b> and <b>utilisation certificate<\/b>, for up to <b>5 years<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Payment delayed? Usually a <b>progress report or utilisation certificate<\/b> was not sent through the university on time."}}], "rights_t": "Payment or selection stuck? Follow up.", "rights": "Write to <b>MahaJyoti, Nagpur<\/b> with your registration ID and copies of submitted reports, and take an acknowledgement. Ask your <b>university research cell<\/b> to forward pending reports.", "help": "<b>Notices and lists:<\/b> mahajyoti.org.in · Amounts and age limits change by notice; read the current one<br/><b>Applying is free<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "महात्मा ज्योतिबा फुले संशोधन अधिछात्रवृत्ती: महाज्योतीकडून पीएचडीसाठी मदत", "benefit": "इ.मा.व., वि.जा. / भ.ज. आणि वि.मा.प्र. पूर्णवेळ पीएचडी संशोधकांना 5 वर्षांपर्यंत मासिक अधिछात्रवृत्ती", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "योग्य महाज्योती योजना निवडा", "body": "महाज्योती (नागपूर) <b>इ.मा.व., वि.जा. / भ.ज. आणि वि.मा.प्र.<\/b> विद्यार्थ्यांसाठी अनेक योजना चालवते:<ul><li><b>10 वी उत्तीर्ण, विज्ञान<\/b> → मोफत <b>टॅब + इंटरनेट + CET / JEE / NEET प्रशिक्षण<\/b><\/li><li><b>पदवी / पदव्युत्तर विद्यार्थी<\/b> → ऑनलाइन अभ्यासक्रम शुल्क मदत<\/li><li><b>पूर्णवेळ पीएचडी<\/b> → <b>MJPRF अधिछात्रवृत्ती<\/b>. हे मार्गदर्शक त्यासाठी आहे.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "MJPRF पात्रता तपासा", "body": "<ul><li><b>इ.मा.व., वि.जा. / भ.ज. किंवा वि.मा.प्र.<\/b>, <b>नॉन-क्रिमीलेयर<\/b>, महाराष्ट्राचे अधिवासी<\/li><li><b>पदव्युत्तर<\/b> पदवी, <b>पूर्णवेळ पीएचडीला<\/b> प्रवेश (दूरस्थ शिक्षण नाही)<\/li><li>जाहिरातीतील <b>वयोमर्यादेत<\/b> (अलीकडील फेऱ्यांमध्ये सुमारे 45)<\/li><li>आधीच UGC / CSIR NET-JRF किंवा इतर अधिछात्रवृत्ती <b>नसावी<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>जातीचा दाखला<\/b> आणि <b>वैध नॉन-क्रिमीलेयर<\/b> प्रमाणपत्र<\/li><li><b>अधिवास<\/b> प्रमाणपत्र<\/li><li>पदव्युत्तर गुणपत्रिका व पदवी<\/li><li><b>पीएचडी नोंदणी / प्रवेश पत्र<\/b>, मार्गदर्शकांची संमती, संशोधन प्रस्ताव<\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b>, दिलेल्या नमुन्यातील हमीपत्र<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "नॉन-क्रिमीलेयरची मुदत संपली किंवा जात वैधता नाही? आधी हे पूर्ण करा. <b>नॉन-क्रिमीलेयर<\/b> आणि <b>जात वैधता<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जाहिरात आल्यावर अर्ज करा", "body": "अधिछात्रवृत्तीच्या जाहिरातीसाठी <b>mahajyoti.org.in<\/b> पाहत राहा. महाज्योतीच्या <b>पीएचडी पोर्टलवर<\/b> मुदतीत ऑनलाइन अर्ज करा. तुमचा <b>नोंदणी क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "मुदत <b>कडक<\/b> असते आणि फेरी वर्षातून एकदाच असते. जाहिरात येण्यापूर्वीच कागदपत्रे तयार ठेवा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महाज्योती / विद्यापीठ", "title": "छाननी व निवड यादी", "body": "महाज्योती अर्ज तपासून वेबसाइटवर <b>याद्या<\/b> (पात्र / निवड / त्रुटी) प्रसिद्ध करते. त्यानंतर कागदपत्र पडताळणी होऊ शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "नाव <b>त्रुटी / प्रलंबित यादीत<\/b>? शेरा वाचा आणि दिलेल्या मुदतीत राहिलेले कागदपत्र सादर करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "रुजू होऊन हमीपत्र द्या", "body": "विद्यापीठ / संशोधन केंद्रामार्फत <b>रुजू अहवाल<\/b> आणि सही केलेले <b>हमीपत्र<\/b> सादर करा. तुम्ही नोकरीत असाल तर <b>राजीनामा / कार्यमुक्ती पत्र<\/b> द्यावे लागू शकते.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अधिछात्रवृत्ती जमा, अहवाल देत राहा", "body": "अधिछात्रवृत्ती (आधी JRF दराने, नंतर SRF) तुमच्या <b>प्रगती अहवाल<\/b> आणि <b>उपयोगिता प्रमाणपत्रावर<\/b> आधारित, सहसा <b>दर सहा महिन्यांनी<\/b>, आधार-लिंक बँक खात्यात <b>5 वर्षांपर्यंत<\/b> जमा होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "रक्कम उशिरा? बहुतेक वेळा <b>प्रगती अहवाल किंवा उपयोगिता प्रमाणपत्र<\/b> विद्यापीठामार्फत वेळेवर गेलेले नसते."}}], "rights_t": "रक्कम किंवा निवड अडकली? पाठपुरावा करा.", "rights": "नोंदणी क्रमांक आणि सादर केलेल्या अहवालांच्या प्रतींसह <b>महाज्योती, नागपूर<\/b> यांना लिहा आणि पोच घ्या. प्रलंबित अहवाल पुढे पाठवण्यासाठी <b>विद्यापीठाच्या संशोधन कक्षाला<\/b> विनंती करा.", "help": "<b>जाहिराती व याद्या:<\/b> mahajyoti.org.in · रक्कम व वयोमर्यादा जाहिरातीनुसार बदलतात; चालू जाहिरात वाचा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त अधिकृत वेबसाइट वापरा<\/b>"}}, {"slug": "ladki-bahin", "title": "Ladki Bahin Yojana", "local_name": "लाडकी बहीण योजना", "audience": "Women 21-65", "state": "mh", "local": "mr", "cat": "women", "links": [{"label": "Ladki Bahin portal: application, eKYC", "url": "https://ladakibahin.maharashtra.gov.in", "gov": false}, {"label": "Helpline: 181", "url": null, "gov": false}], "mermaid": "flowchart TD\n    A([Woman wants Ladki Bahin benefit]) --> B{1. Eligible?<br/>age 21-65, MH resident,<br/>family income up to 2.5 lakh}\n    B -- No --> X1([Not eligible])\n    B -- Yes --> EX{2. Any exclusion?<br/>tax payer, govt employee,<br/>four-wheeler, MP/MLA, other scheme}\n    EX -- Yes --> X2([Excluded])\n    EX -- No --> C[3. Gather documents<br/>Aadhaar, domicile proof, income cert<br/>or yellow/orange ration card,<br/>Aadhaar-seeded bank a/c, undertaking]\n    C --> D[4. Apply free<br/>portal / Anganwadi Sevika / help desk<br/>application number]\n    D --> E[5. Verification<br/>Women and Child Development officials]\n    E -- Doc issue --> F1[Sent back / rejected with reason]\n    F1 -- Correct + resubmit --> E\n    E -- OK --> AP[6. Approved list]\n    AP --> K{eKYC done?}\n    K -- No --> F2[Payment on hold]\n    F2 -- Complete eKYC --> K\n    K -- Yes --> P[DBT payment]\n    P -- Bank not seeded / inactive --> F3[Payment failed]\n    P --> M([7. Rs 1,500 every month])\n    M --> RV[Periodic re-verification<br/>by government]\n    F3 --> G[Grievance on portal /<br/>Anganwadi / district WCD office]\n\n    S1[[Sathi: Eligibility + exclusion check<br/>in plain Marathi]]:::sathi -.-> EX\n    S2[[Sathi: Readiness check<br/>ration card colour, domicile alternatives,<br/>bank seeding]]:::sathi -.-> C\n    S3[[Sathi: Decode rejection reason]]:::sathi -.-> F1\n    S4[[Sathi: eKYC + bank alerts]]:::sathi -.-> K\n    S5[[Sathi: Missed-payment tracker<br/>draft grievance]]:::sathi -.-> G\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Free Press Journal: 68 lakh accounts closed after eKYC", "url": "https://www.freepressjournal.in/mumbai/maharashtras-ladki-bahin-yojana-sees-68-lakh-accounts-closed-after-e-kyc-drive"}, {"label": "Outlook Money: 92 lakh names dropped", "url": "https://www.outlookmoney.com/news/maharashtra-drops-92-lakh-names-from-ladki-bahin-scheme-after-eligibility-checks"}, {"label": "The Hitavada: 80 lakh ineligible after eKYC deadline", "url": "https://www.thehitavada.com/Encyc/2026/6/2/80-lakh-women-become-ineligible-for-ladki-bahin-scheme-after-e-kyc-deadline.html"}, {"label": "The Hitavada: Won't scrap scheme, says Fadnavis", "url": "https://www.thehitavada.com/Encyc/2026/6/3/wont-scrap-ladki-bahin-scheme-says-fadnavis.html"}, {"label": "sarkariyojana.com: eKYC", "url": "https://sarkariyojana.com/ladki-bahin-yojana-ekyc/"}], "verified": "2026-10-27", "en": {"h1": "Ladki Bahin Yojana: How to get ₹1,500 a month", "benefit": "₹1,500 every month straight into your bank account", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Woman aged <b>21 to 65<\/b>, living in <b>Maharashtra<\/b><\/li><li>Married, widowed, divorced, abandoned or destitute, or <b>one unmarried woman<\/b> per family<\/li><li>Family income <b>up to ₹2.5 lakh a year<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check who cannot apply", "body": "You <b>cannot<\/b> apply if anyone in your family:<ul><li>Pays income tax, or is a government employee / pensioner<\/li><li>Owns a <b>four-wheeler<\/b> (tractor is allowed)<\/li><li>Is an MP / MLA or holds a board / corporation post<\/li><\/ul>Or if you already get ₹1,500 or more from another government scheme.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Applying when not eligible can mean the money is <b>stopped and recovered<\/b> later. Be honest."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar card<\/li><li><b>Domicile proof<\/b>: domicile certificate, or old ration card / voter ID / school leaving certificate / birth certificate<\/li><li><b>Income certificate<\/b><\/li><li>Ration card, photo<\/li><li>Bank account <b>linked to Aadhaar<\/b><\/li><li>Signed undertaking (हमीपत्र)<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Have a <b>yellow or orange ration card<\/b>? You usually <b>don't need<\/b> an income certificate. Born outside Maharashtra but married here? Your husband's domicile documents can be used."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li>Website <b>ladakibahin.maharashtra.gov.in<\/b><\/li><li>Your <b>Anganwadi Sevika<\/b>, or the ward / Gram Panchayat help desk<\/li><\/ul>Note your <b>application number<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>New registrations may be closed.<\/b> Check the portal or ask your Anganwadi Sevika before applying. Applying is always <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your application is checked", "body": "Women and Child Development officials check your form and documents.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Rejected<\/b> or <b>sent back<\/b>? Read the reason on the portal or ask your Anganwadi Sevika. Correct it and resubmit."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Approved: bank and eKYC", "body": "Your name goes on the approved list. Your bank account must be <b>Aadhaar-seeded with DBT on<\/b>. Complete <b>eKYC every year<\/b> on the portal when the window opens.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Missed eKYC? You can be <b>removed from the scheme<\/b>. Lakhs of names were dropped this way. Wrongly removed (e.g. flagged as a government employee)? Raise a grievance with proof."}}, {"phase": null, "kind": "done", "who": "Done", "title": "₹1,500 in your account every month", "body": "The money comes by <b>DBT<\/b>. You get an SMS from your bank.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Approved but no money? Your bank account may not be Aadhaar-seeded or may be inactive. Ask the bank for <b>\"Aadhaar seeding and DBT on\"<\/b>."}}], "rights_t": "Money not coming? Complain.", "rights": "Raise a <b>grievance on the Ladki Bahin portal<\/b> with your application number, or ask your <b>Anganwadi Sevika<\/b> / the district <b>Women and Child Development office<\/b>.", "help": "<b>Do eKYC every year<\/b> and keep your bank link and details correct, the government re-verifies beneficiaries<br/><b>Check status:<\/b> ladakibahin.maharashtra.gov.in · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "लाडकी बहीण योजना: दरमहा ₹1,500 कसे मिळवायचे", "benefit": "दर महिन्याला ₹1,500 थेट तुमच्या बँक खात्यात", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>21 ते 65<\/b> वयाची महिला, <b>महाराष्ट्राची रहिवासी<\/b><\/li><li>विवाहित, विधवा, घटस्फोटित, परित्यक्ता किंवा निराधार, किंवा कुटुंबातील <b>एक अविवाहित महिला<\/b><\/li><li>कौटुंबिक उत्पन्न <b>वर्षाला ₹2.5 लाखांपर्यंत<\/b><\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कोण अर्ज करू शकत नाही", "body": "तुमच्या कुटुंबातील कोणी:<ul><li>आयकर भरत असेल, किंवा सरकारी कर्मचारी / निवृत्तीवेतनधारक असेल<\/li><li><b>चारचाकी वाहन<\/b> असेल (ट्रॅक्टर चालतो)<\/li><li>खासदार / आमदार असेल किंवा मंडळ / महामंडळावर पद असेल<\/li><\/ul>तर तुम्ही <b>अर्ज करू शकत नाही<\/b>. तसेच दुसऱ्या सरकारी योजनेतून आधीच ₹1,500 किंवा जास्त मिळत असतील तरीही नाही.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पात्र नसताना अर्ज केल्यास नंतर पैसे <b>बंद होऊन वसूल<\/b> केले जाऊ शकतात. खरी माहिती द्या."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>आधार कार्ड<\/li><li><b>रहिवासाचा पुरावा<\/b>: अधिवास प्रमाणपत्र, किंवा जुने रेशन कार्ड / मतदार ओळखपत्र / शाळा सोडल्याचा दाखला / जन्म दाखला<\/li><li><b>उत्पन्नाचा दाखला<\/b><\/li><li>रेशन कार्ड, फोटो<\/li><li><b>आधारशी लिंक<\/b> असलेले बँक खाते<\/li><li>सही केलेले हमीपत्र<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>पिवळे किंवा केशरी रेशन कार्ड<\/b> आहे? मग सहसा उत्पन्नाच्या दाखल्याची <b>गरज नाही<\/b>. महाराष्ट्राबाहेर जन्म पण लग्न इथे झाले? पतीची रहिवासी कागदपत्रे वापरता येतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>ladakibahin.maharashtra.gov.in<\/b><\/li><li>तुमच्या <b>अंगणवाडी सेविका<\/b>, किंवा वॉर्ड / ग्रामपंचायत मदत कक्ष<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>नवीन नोंदणी बंद असू शकते.<\/b> अर्ज करण्यापूर्वी पोर्टल तपासा किंवा अंगणवाडी सेविकेला विचारा. अर्ज करणे नेहमी <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "सरकार", "title": "अर्जाची तपासणी", "body": "महिला व बालविकास विभागाचे अधिकारी तुमचा अर्ज आणि कागदपत्रे तपासतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज <b>नामंजूर<\/b> किंवा <b>परत पाठवला<\/b>? पोर्टलवर कारण वाचा किंवा अंगणवाडी सेविकेला विचारा. दुरुस्त करून पुन्हा सादर करा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "मंजुरी: बँक व ई-केवायसी", "body": "तुमचे नाव मंजूर यादीत येते. तुमचे बँक खाते <b>आधार-सीडेड आणि DBT सुरू<\/b> असले पाहिजे. खिडकी सुरू झाल्यावर पोर्टलवर <b>दरवर्षी ई-केवायसी<\/b> पूर्ण करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "ई-केवायसी चुकली? तुम्हाला <b>योजनेतून वगळले<\/b> जाऊ शकते. अशा प्रकारे लाखो नावे वगळली गेली. चुकीने वगळले (उदा. सरकारी कर्मचारी म्हणून)? पुराव्यासह तक्रार करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दरमहा ₹1,500 खात्यात जमा", "body": "पैसे <b>DBT<\/b> द्वारे येतात. बँकेकडून SMS येतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मंजूर झाले पण पैसे आले नाहीत? बँक खाते आधार-सीडेड नसेल किंवा बंद असेल. बँकेत <b>\"आधार सीडिंग करा आणि DBT सुरू करा\"<\/b> असे सांगा."}}], "rights_t": "पैसे येत नाहीत? तक्रार करा.", "rights": "अर्ज क्रमांकासह <b>लाडकी बहीण पोर्टलवर तक्रार<\/b> नोंदवा, किंवा तुमच्या <b>अंगणवाडी सेविका<\/b> / जिल्हा <b>महिला व बालविकास कार्यालयाशी<\/b> संपर्क साधा.", "help": "<b>दरवर्षी ई-केवायसी करा<\/b> आणि बँक लिंक व माहिती अचूक ठेवा, सरकार लाभार्थ्यांची पुन्हा पडताळणी करते<br/><b>स्थिती तपासा:<\/b> ladakibahin.maharashtra.gov.in · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "ujjwala", "title": "PM Ujjwala Yojana", "local_name": "उज्ज्वला योजना", "audience": "Women of poor households (LPG)", "state": "mh", "local": "mr", "cat": "women", "links": [{"label": "PMUY: apply and scheme details", "url": "https://pmuy.gov.in", "gov": false}, {"label": "Rajya Sabha answer, Feb 2025 (PDF)", "url": "https://rsdebate.nic.in/bitstream/123456789/758543/1/PQ_267_10022025_U777_p406_p407.pdf", "gov": true}], "mermaid": "flowchart TD\n    A([Woman in poor household, no LPG]) --> E{1. Eligible?<br/>18+, no LPG in household,<br/>SC/ST, AAY, PMAY-G, forest dweller,<br/>or poor-household declaration}\n    E -- No --> X([Not eligible])\n    E -- Yes --> D[2. Documents<br/>Aadhaar, ration card + members' Aadhaar,<br/>seeded bank a/c, photo<br/>migrants: address self-declaration]\n    D --> AP[3. Apply free<br/>pmuy.gov.in: choose OMC + distributor<br/>or at distributor]\n    AP --> K[4. KYC by distributor]\n    K --> DD{Dedup check<br/>any LPG in family?}\n    DD -- Yes --> F1[Rejected: existing connection]\n    DD -- No --> R[5. Connection released<br/>cylinder, regulator, pipe, booklet<br/>installation + safety demo]\n    R --> EK{6. eKYC + bank seeded?}\n    EK -- No --> F2[Subsidy on hold]\n    EK -- Yes --> S([7. Refills with DBT subsidy])\n    F1 -. unresolved .-> T[Complaint: distributor, OMC portal, CPGRAMS]\n    F2 -. unresolved .-> T\n\n    S1[[Sathi: Eligibility check<br/>which category applies]]:::sathi -.-> E\n    S2[[Sathi: Readiness check<br/>ration card members, bank seeding]]:::sathi -.-> D\n    S3[[Sathi: Explain dedup rejection<br/>surrender old / fix ration card]]:::sathi -.-> F1\n    S4[[Sathi: eKYC + subsidy tracker]]:::sathi -.-> EK\n    S5[[Sathi: Link to state free-refill schemes]]:::sathi -.-> S\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "BankBazaar: PMUY scheme", "url": "https://www.bankbazaar.com/gas-connection/pradhan-mantri-ujjwala-yojana-scheme.html"}, {"label": "Drishti IAS note", "url": "https://www.drishtiias.com/pdf/1759320263.pdf"}, {"label": "Rajya Sabha question, Feb 2025", "url": "https://rsdebate.nic.in/bitstream/123456789/758543/1/PQ_267_10022025_U777_p406_p407.pdf"}, {"label": "Money9: Ujjwala 2.0 free stove and refill", "url": "https://www.money9.com/news/economy/prime-minister-narendra-modi-to-unveil-ujjwala-2-0-tomorrow-beneficiaries-will-get-stove-one-refill-free-66576.html"}], "verified": "2026-10-27", "en": {"h1": "PM Ujjwala Yojana: How to get a free LPG connection", "benefit": "Free LPG connection for women of poor households, plus subsidy on refills", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>A <b>woman aged 18 or more<\/b><\/li><li><b>No LPG connection<\/b> in anyone's name in the household<\/li><li>From a poor household, e.g. <b>SC / ST<\/b>, <b>Antyodaya (AAY) ration card<\/b>, <b>PMAY-Gramin<\/b> beneficiary, forest dweller, or poor family by self-declaration<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Your <b>Aadhaar<\/b><\/li><li><b>Ration card<\/b> showing family members, and Aadhaar of the adult members on it<\/li><li><b>Bank account<\/b> (passbook with IFSC), linked to Aadhaar<\/li><li>Photo<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Migrant family without a local ration card? A <b>self-declaration of address<\/b> is usually accepted."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li>Website <b>pmuy.gov.in<\/b> → choose company (Indane / Bharat Gas / HP Gas) → choose nearest distributor<\/li><li>Go directly to your nearest <b>gas distributor<\/b> with papers<\/li><\/ul>Note your <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "The connection is <b>free<\/b>. Never pay an agent or the distributor extra for \"quick\" approval."}}, {"phase": "After you apply", "kind": "gov", "who": "Gas agency", "title": "Papers and family are checked", "body": "The distributor completes your <b>KYC<\/b> and checks that <b>no one in your family<\/b> already has an LPG connection.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected for <b>\"existing connection\"<\/b>? Someone on your ration card may already have one. Surrender the old connection or correct the ration card, then reapply."}}, {"phase": null, "kind": "gov", "who": "Gas agency", "title": "Connection is installed", "body": "You get the <b>cylinder, regulator, pipe and booklet<\/b> without deposit. The distributor installs it and shows you <b>safety steps<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Ask for the <b>safety demonstration<\/b>. Check the pipe and regulator are fitted properly."}}, {"phase": null, "kind": "you", "who": "You", "title": "Complete eKYC and bank link", "body": "Do <b>Aadhaar eKYC<\/b> at the distributor or on the gas company's app when asked. Make sure your bank account is <b>Aadhaar-seeded<\/b> so the subsidy reaches you.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Subsidy not coming? Usually eKYC is pending or the bank isn't Aadhaar-seeded. Fix both."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Cook on LPG, get refill subsidy", "body": "Book refills by phone / app. A <b>subsidy of about ₹300 per cylinder<\/b> comes into your bank account (up to a set number of refills each year). Under Ujjwala 2.0 the <b>first refill and stove<\/b> are free.", "note": {"kind": "tip", "label": "Tip:", "html": "Ask your distributor about any <b>Maharashtra free-refill scheme<\/b> you may also be eligible for."}}], "rights_t": "Problem with the agency? Complain.", "rights": "First complain to the <b>distributor<\/b> in writing. If not solved, use the gas company's <b>customer grievance portal<\/b> or <b>CPGRAMS<\/b>. <b>Gas leak emergency: call 1906.<\/b>", "help": "<b>Check status:<\/b> pmuy.gov.in or your gas company's website / app (application number)<br/><b>Connection is free<\/b> · <b>Use only official websites and apps<\/b>"}, "loc": {"h1": "प्रधानमंत्री उज्ज्वला योजना: मोफत गॅस जोडणी कशी मिळवायची", "benefit": "गरीब कुटुंबातील महिलांना मोफत गॅस जोडणी, शिवाय रिफिलवर अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>18 वर्षे किंवा जास्त वयाची महिला<\/b><\/li><li>घरात कोणाच्याही नावावर <b>गॅस जोडणी नसावी<\/b><\/li><li>गरीब कुटुंबातील, उदा. <b>अनुसूचित जाती / जमाती<\/b>, <b>अंत्योदय (AAY) रेशन कार्ड<\/b>, <b>प्रधानमंत्री आवास योजना - ग्रामीण<\/b> लाभार्थी, वनवासी, किंवा स्वयंघोषणेनुसार गरीब कुटुंब<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमचे <b>आधार<\/b><\/li><li>कुटुंबातील सदस्य दाखवणारे <b>रेशन कार्ड<\/b>, आणि त्यावरील प्रौढ सदस्यांचे आधार<\/li><li>आधारशी लिंक असलेले <b>बँक खाते<\/b> (IFSC सह पासबुक)<\/li><li>फोटो<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "स्थलांतरित कुटुंब, स्थानिक रेशन कार्ड नाही? <b>पत्त्याचे स्वयंघोषणापत्र<\/b> सहसा चालते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा (मोफत)", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>pmuy.gov.in<\/b> → कंपनी निवडा (इंडेन / भारत गॅस / एचपी गॅस) → जवळचा वितरक निवडा<\/li><li>कागदपत्रांसह थेट जवळच्या <b>गॅस वितरकाकडे<\/b> जा<\/li><\/ul>तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "जोडणी <b>मोफत<\/b> आहे. \"लवकर\" मंजुरीसाठी एजंट किंवा वितरकाला जास्त पैसे देऊ नका."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "गॅस एजन्सी", "title": "कागदपत्रे व कुटुंबाची तपासणी", "body": "वितरक तुमचे <b>KYC<\/b> पूर्ण करतो आणि तुमच्या <b>कुटुंबात कोणाकडेही<\/b> आधीच गॅस जोडणी नाही ना हे तपासतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>\"आधीच जोडणी आहे\"<\/b> म्हणून नामंजूर? रेशन कार्डवरील कोणाकडे आधीच जोडणी असू शकते. जुनी जोडणी परत करा किंवा रेशन कार्ड दुरुस्त करा, मग पुन्हा अर्ज करा."}}, {"phase": null, "kind": "gov", "who": "गॅस एजन्सी", "title": "गॅस जोडणी बसवली जाते", "body": "अनामत रकमेशिवाय <b>सिलिंडर, रेग्युलेटर, पाईप आणि पुस्तिका<\/b> मिळते. वितरक जोडणी बसवून <b>सुरक्षिततेचे नियम<\/b> दाखवतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>सुरक्षा प्रात्यक्षिक<\/b> मागा. पाईप आणि रेग्युलेटर नीट बसवले आहेत का ते तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-केवायसी व बँक लिंक करा", "body": "सांगितल्यावर वितरकाकडे किंवा गॅस कंपनीच्या ॲपवर <b>आधार ई-केवायसी<\/b> करा. अनुदान मिळण्यासाठी तुमचे बँक खाते <b>आधार-सीडेड<\/b> आहे याची खात्री करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "अनुदान येत नाही? बहुतेक वेळा ई-केवायसी बाकी असते किंवा बँक आधार-सीडेड नसते. दोन्ही दुरुस्त करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "गॅसवर स्वयंपाक, रिफिलवर अनुदान", "body": "फोन / ॲपवरून रिफिल बुक करा. प्रति सिलिंडर <b>सुमारे ₹300 अनुदान<\/b> तुमच्या बँक खात्यात येते (दरवर्षी ठराविक रिफिलपर्यंत). उज्ज्वला 2.0 मध्ये <b>पहिला रिफिल आणि शेगडी<\/b> मोफत.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुम्ही पात्र असू शकता अशा <b>महाराष्ट्राच्या मोफत रिफिल योजनेबद्दल<\/b> वितरकाकडे विचारा."}}], "rights_t": "एजन्सीबद्दल तक्रार? तक्रार करा.", "rights": "आधी <b>वितरकाकडे<\/b> लेखी तक्रार द्या. निराकरण न झाल्यास गॅस कंपनीचे <b>ग्राहक तक्रार पोर्टल<\/b> किंवा <b>CPGRAMS<\/b> वापरा. <b>गॅस गळती आपत्कालीन क्रमांक: 1906.<\/b>", "help": "<b>स्थिती तपासा:<\/b> pmuy.gov.in किंवा तुमच्या गॅस कंपनीची वेबसाइट / ॲप (अर्ज क्रमांक)<br/><b>जोडणी मोफत आहे<\/b> · <b>फक्त अधिकृत वेबसाइट व ॲप वापरा<\/b>"}}, {"slug": "pmay-gramin", "title": "PMAY-Gramin", "local_name": "प्रधानमंत्री आवास योजना (ग्रामीण)", "audience": "Rural families without pucca house", "state": "mh", "local": "mr", "cat": "home", "links": [{"label": "PMAY-G: beneficiary search and reports", "url": "https://pmayg.nic.in", "gov": false}, {"label": "PIB: PMAY-G document (PDF)", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/nov/doc20241119437801.pdf", "gov": true}], "mermaid": "flowchart TD\n    A([Rural family without pucca house]) --> B{1. Village or city?}\n    B -- City / town --> U([PMAY-Urban 2.0: separate flow])\n    B -- Village --> C{2. Eligible?<br/>no pucca house, no exclusion}\n    C -- No --> X([Excluded])\n    C -- Yes --> S[3. Awaas+ survey<br/>surveyor or self-survey app]\n    S -- Not surveyed --> F0[Not on list:<br/>ask Gram Sevak,<br/>check state gharkul schemes]\n    S --> GS[4. Gram Sabha verifies<br/>Permanent Wait List + priority]\n    GS --> SA[5. Sanction by BDO / Panchayat Samiti<br/>Aadhaar, seeded bank a/c,<br/>MGNREGA job card, land proof]\n    SA -- No land in name --> F1[Blocked: land<br/>ferfar / land-purchase assistance]\n    SA --> I1[Instalment 1 via DBT]\n    I1 --> ST[6. Build stage by stage<br/>foundation, walls, roof<br/>repeat for each stage]\n    ST --> GT[Geo-tagged photo<br/>uploaded on AwaasApp]\n    GT -- Not uploaded / not inspected --> F2[Next instalment stuck]\n    F2 -. stuck long .-> T[Written complaint to BDO / CPGRAMS]\n    GT -- Verified --> IN[7. Next instalment via DBT<br/>+ MGNREGA wages + SBM toilet]\n    IN --> DONE([8. House complete<br/>final geo-tag])\n\n    S1[[Sathi: Eligibility + scheme router<br/>PMAY-G vs Urban vs state gharkul]]:::sathi -.-> C\n    S2[[Sathi: List checker<br/>am I on the wait list?]]:::sathi -.-> S\n    S3[[Sathi: Land readiness<br/>7/12 Health Report + Ferfar]]:::sathi -.-> F1\n    S4[[Sathi: Stage tracker<br/>photo uploaded? instalment due?]]:::sathi -.-> GT\n    S5[[Sathi: Stuck clock + draft complaint]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "PIB: PMAY-G document", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/nov/doc20241119437801.pdf"}, {"label": "Sansad: parliamentary reply", "url": "https://eparlib.sansad.in/bitstream/123456789/3006401/1/AU1336_CA4fLm.pdf"}, {"label": "Business Today: exclusion norms relaxed", "url": "https://www.businesstoday.in/amp/india/story/pmay-g-automatic-exclusion-norms-relaxed-details-on-centres-rural-housing-scheme-here-445380-2024-09-11"}, {"label": "Vajiram & Ravi: new eligibility norms", "url": "https://vajiramandravi.com/current-affairs/centre-eases-exclusion-criteria-for-pmay-gramin-new-eligibility-norms-explained/"}], "verified": "2026-10-27", "en": {"h1": "PM Awas Yojana (Gramin): How to get a pucca house", "benefit": "About ₹1.2 lakh in instalments to build your house, plus MGNREGA wages and toilet support", "steps": [{"phase": "Getting selected", "kind": "you", "who": "You", "title": "Know which scheme is yours", "body": "<ul><li>Live in a <b>village<\/b> → <b>PMAY-Gramin<\/b>. This guide.<\/li><li>Live in a <b>city / town<\/b> → PMAY-Urban 2.0. Different process.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You can get it if your family has <b>no pucca house<\/b> (you live in a kutcha or damaged house, or are homeless).<br/>You usually <b>cannot<\/b> if the family has a motorised three / four-wheeler or mechanised farm equipment, a Kisan Credit Card limit of ₹50,000+, pays income or professional tax, owns 2.5+ acres of irrigated land, or already has a pucca house. A two-wheeler, fridge or income up to ₹15,000 a month <b>no longer<\/b> excludes you.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Get your name on the list", "body": "Selection is from the <b>Awaas+ survey<\/b>. Ask your <b>Gram Sevak / Gram Panchayat<\/b> whether you are on the list, or whether a new survey or self-survey (Awaas+ app) is open.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Not on the list? Ask the Gram Sevak to include you in the survey. Also ask about the <b>state gharkul schemes<\/b> (e.g. Ramai, Shabari, Modi Awas) for your category."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Gram Sabha checks the list", "body": "The <b>Gram Sabha<\/b> verifies the waiting list and its priority order.", "note": {"kind": "tip", "label": "Tip:", "html": "<b>Attend the Gram Sabha.<\/b> This is where names are confirmed or objected to."}}, {"phase": "Building your house", "kind": "gov", "who": "Government", "title": "Your house is sanctioned", "body": "The <b>Panchayat Samiti / BDO<\/b> sanctions your house. Keep ready: Aadhaar, <b>Aadhaar-linked bank account<\/b>, <b>MGNREGA job card<\/b>, and land proof (7/12 or Namuna 8).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land not in your name? Get the <b>ferfar<\/b> done first. Landless? Ask about the state's land-purchase help for gharkul beneficiaries."}}, {"phase": null, "kind": "you", "who": "You", "title": "Build in stages, with photos", "body": "The first instalment comes after sanction. Build in stages: <b>foundation → walls → roof → finish<\/b>. At each stage, a <b>geo-tagged photo<\/b> of your house is uploaded (by the Gram Rozgar Sevak / technical assistant or on the AwaasApp).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Next instalment not coming? Usually the <b>stage photo was not uploaded<\/b> or not inspected. Ask the Gram Rozgar Sevak / Panchayat Samiti engineer."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Instalments are paid", "body": "Each instalment comes by <b>DBT<\/b> after the stage is verified. You can also get <b>MGNREGA wages<\/b> for working on your own house and <b>toilet support<\/b> under Swachh Bharat.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Instalment approved but not received? Check that your bank account is <b>Aadhaar-seeded with DBT on<\/b>."}}, {"phase": null, "kind": "done", "who": "Done", "title": "House complete", "body": "The final geo-tagged photo is uploaded and the house is marked <b>complete<\/b>. Try to finish within about a year.", "note": null}], "rights_t": "Stuck for long? Complain.", "rights": "Give a written complaint to the <b>BDO, Panchayat Samiti<\/b> with your PMAY-G registration number and take an <b>acknowledgement (पोच)<\/b>. You can also use the central grievance portal <b>CPGRAMS<\/b>.", "help": "<b>Check status:<\/b> pmayg.nic.in → beneficiary search (registration number)<br/>Selection and instalments are <b>free<\/b>, never pay anyone to \"get your name\" or \"release\" money · <b>Use only .gov.in / .nic.in websites<\/b>"}, "loc": {"h1": "प्रधानमंत्री आवास योजना (ग्रामीण): पक्के घर कसे मिळवायचे", "benefit": "घर बांधण्यासाठी हप्त्यांमध्ये सुमारे ₹1.2 लाख, शिवाय मनरेगा मजुरी आणि शौचालय अनुदान", "steps": [{"phase": "निवड होणे", "kind": "you", "who": "तुम्ही", "title": "तुमची योजना कोणती ते ओळखा", "body": "<ul><li><b>गावात<\/b> राहता → <b>प्रधानमंत्री आवास योजना - ग्रामीण<\/b>. हे मार्गदर्शक त्यासाठी आहे.<\/li><li><b>शहरात<\/b> राहता → प्रधानमंत्री आवास योजना - शहरी 2.0. प्रक्रिया वेगळी आहे.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "तुमच्या कुटुंबाकडे <b>पक्के घर नसेल<\/b> (कच्च्या किंवा मोडकळीस आलेल्या घरात राहता, किंवा बेघर आहात) तर लाभ मिळू शकतो.<br/>कुटुंबाकडे मोटार असलेले तीन / चारचाकी वाहन किंवा यांत्रिक शेती उपकरण, ₹50,000+ मर्यादेचे किसान क्रेडिट कार्ड, आयकर किंवा व्यवसाय कर भरणा, 2.5+ एकर बागायती जमीन, किंवा आधीच पक्के घर असेल तर सहसा <b>मिळत नाही<\/b>. दुचाकी, फ्रीज किंवा दरमहा ₹15,000 पर्यंत उत्पन्न असल्याने आता <b>अपात्र ठरत नाही<\/b>.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "यादीत नाव लावा", "body": "निवड <b>आवास+ सर्वेक्षणातून<\/b> होते. तुमचे नाव यादीत आहे का, किंवा नवीन सर्वेक्षण / स्व-सर्वेक्षण (आवास+ ॲप) सुरू आहे का, हे <b>ग्रामसेवक / ग्रामपंचायतीत<\/b> विचारा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "यादीत नाव नाही? सर्वेक्षणात नाव घेण्यासाठी ग्रामसेवकांना विनंती करा. तुमच्या प्रवर्गासाठी <b>राज्याच्या घरकुल योजना<\/b> (उदा. रमाई, शबरी, मोदी आवास) बद्दलही विचारा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "ग्रामसभेत यादी तपासणी", "body": "<b>ग्रामसभा<\/b> प्रतीक्षा यादी आणि तिचा प्राधान्यक्रम तपासते.", "note": {"kind": "tip", "label": "सूचना:", "html": "<b>ग्रामसभेला हजर राहा.<\/b> इथेच नावे निश्चित होतात किंवा त्यावर हरकत घेतली जाते."}}, {"phase": "घर बांधणे", "kind": "gov", "who": "सरकार", "title": "घरकुल मंजूर", "body": "<b>पंचायत समिती / गटविकास अधिकारी<\/b> तुमचे घरकुल मंजूर करतात. तयार ठेवा: आधार, <b>आधार-लिंक बँक खाते<\/b>, <b>मनरेगा जॉब कार्ड<\/b>, आणि जमिनीचा पुरावा (7/12 किंवा नमुना 8).", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन तुमच्या नावावर नाही? आधी <b>फेरफार<\/b> करून घ्या. भूमिहीन आहात? घरकुल लाभार्थ्यांसाठी राज्याच्या जागा खरेदी अर्थसहाय्याबद्दल विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "टप्प्याटप्प्याने बांधकाम, फोटोसह", "body": "मंजुरीनंतर पहिला हप्ता येतो. टप्प्याटप्प्याने बांधा: <b>पाया → भिंती → छत → पूर्णत्व<\/b>. प्रत्येक टप्प्यावर घराचा <b>जिओ-टॅग फोटो<\/b> अपलोड होतो (ग्राम रोजगार सेवक / तांत्रिक सहायक किंवा आवास ॲपवरून).", "note": {"kind": "stuck", "label": "अडचण?", "html": "पुढचा हप्ता येत नाही? बहुतेक वेळा <b>टप्प्याचा फोटो अपलोड झालेला नसतो<\/b> किंवा तपासणी झालेली नसते. ग्राम रोजगार सेवक / पंचायत समिती अभियंत्यांना विचारा."}}, {"phase": null, "kind": "gov", "who": "सरकार", "title": "हप्ते जमा होतात", "body": "टप्पा तपासल्यानंतर प्रत्येक हप्ता <b>DBT<\/b> द्वारे येतो. स्वतःच्या घरावर काम केल्याबद्दल <b>मनरेगा मजुरी<\/b> आणि स्वच्छ भारत अंतर्गत <b>शौचालय अनुदानही<\/b> मिळू शकते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "हप्ता मंजूर पण जमा नाही? बँक खाते <b>आधार-सीडेड आणि DBT सुरू<\/b> आहे का ते तपासा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "घर पूर्ण", "body": "शेवटचा जिओ-टॅग फोटो अपलोड होऊन घर <b>पूर्ण<\/b> म्हणून नोंदवले जाते. साधारण वर्षभरात पूर्ण करण्याचा प्रयत्न करा.", "note": null}], "rights_t": "खूप दिवस अडकले? तक्रार करा.", "rights": "तुमच्या PMAY-G नोंदणी क्रमांकासह <b>गटविकास अधिकारी, पंचायत समिती<\/b> यांना लेखी तक्रार द्या आणि <b>पोच<\/b> घ्या. केंद्राच्या <b>CPGRAMS<\/b> तक्रार पोर्टलचाही वापर करता येतो.", "help": "<b>स्थिती तपासा:<\/b> pmayg.nic.in → लाभार्थी शोध (नोंदणी क्रमांक)<br/>निवड आणि हप्ते <b>मोफत<\/b> आहेत, \"नाव लावण्यासाठी\" किंवा \"पैसे सोडवण्यासाठी\" कोणालाही पैसे देऊ नका · <b>फक्त .gov.in / .nic.in वेबसाइट वापरा<\/b>"}}, {"slug": "pmay-urban", "title": "PMAY-Urban 2.0", "local_name": "प्रधानमंत्री आवास योजना (शहरी 2.0)", "audience": "Urban EWS / LIG / MIG families", "state": "mh", "local": "mr", "cat": "home", "links": [{"label": "PMAY-U 2.0: apply online", "url": "https://pmay-urban.gov.in", "gov": false}, {"label": "PMAY-U MIS: FAQ", "url": "https://pmaymis.gov.in/pmaymis2_2024/faq.html", "gov": true}], "mermaid": "flowchart TD\n    A([Urban family without pucca house]) --> E{1. Eligible?<br/>no pucca house in India,<br/>EWS / LIG / MIG income}\n    E -- No --> X([Not eligible])\n    E -- Yes --> V{2. Which vertical?}\n    V -- Own land --> BLC[BLC: build on own plot]\n    V -- Buy flat in project --> AHP[AHP: partner project]\n    V -- Home loan --> ISS[ISS: interest subsidy via lender]\n    V -- Rent --> ARH([ARH: affordable rental])\n    BLC --> D[3. Documents<br/>Aadhaar all members, income proof,<br/>seeded bank a/c, no-pucca-house declaration,<br/>land / property card for BLC]\n    AHP --> D\n    ISS --> D\n    D --> AP[4. Apply free<br/>pmay-urban.gov.in / ULB PMAY cell / lender<br/>application number]\n    AP --> VR[5. ULB verification<br/>site check for BLC]\n    VR -- Pucca house found / income mismatch --> F1[Rejected with reason]\n    VR -- OK --> S{6. Approved}\n    S -- BLC --> B1[Stage-wise instalments<br/>geo-tagged photos]\n    B1 -- Photo missing --> F2[Instalment stuck]\n    S -- AHP --> A1[Allotment, often by lottery<br/>beneficiary contribution]\n    S -- ISS --> I1[Subsidy credited to loan account<br/>yearly instalments]\n    B1 --> DONE([7. Home ready])\n    A1 --> DONE\n    I1 --> DONE\n    F2 -. stuck long .-> T[Complaint: ULB PMAY cell /<br/>bank / CPGRAMS]\n\n    S1[[Sathi: Eligibility + vertical chooser]]:::sathi -.-> V\n    S2[[Sathi: Readiness check<br/>income cert, property card, seeding]]:::sathi -.-> D\n    S3[[Sathi: Fake-site and agent warning]]:::sathi -.-> AP\n    S4[[Sathi: Stage tracker for BLC]]:::sathi -.-> B1\n    S5[[Sathi: Stuck clock + draft complaint]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "PM India: Cabinet approves PMAY-U 2.0", "url": "https://www.pmindia.gov.in/en/news_updates/cabinet-approves-pradhan-mantri-awas-yojana-urban-2-0-scheme/"}, {"label": "MoHUA PMAY-U FAQ", "url": "https://pmaymis.gov.in/pmaymis2_2024/faq.html"}, {"label": "Tata Capital: PMAY 2.0", "url": "https://www.tatacapital.com/home-loan/pmay.html"}, {"label": "IIFL Home Loans: PMAY-U 2.0", "url": "https://www.iiflhomeloans.com/pmay-urban"}], "verified": "2026-10-27", "en": {"h1": "PM Awas Yojana (Urban 2.0): How to get help for a home in the city", "benefit": "Help to build, buy or rent a pucca home in cities and towns", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>You live in a <b>city or town<\/b> (villages: see PMAY-Gramin)<\/li><li>No one in your family owns a <b>pucca house anywhere in India<\/b><\/li><li>Family income: <b>EWS<\/b> up to ₹3 lakh · <b>LIG<\/b> ₹3 to 6 lakh · <b>MIG<\/b> ₹6 to 9 lakh a year<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "The house is usually in the name of the <b>woman of the family<\/b>, or jointly."}}, {"phase": null, "kind": "you", "who": "You", "title": "Pick the option that fits you", "body": "<ul><li><b>Own land, want to build<\/b> → BLC: help to build on your own plot (EWS)<\/li><li><b>Want to buy a flat<\/b> in a government / partner project → AHP (EWS)<\/li><li><b>Taking a home loan<\/b> from a bank → ISS: interest subsidy (EWS / LIG / MIG)<\/li><li><b>Need to rent<\/b> (workers, migrants) → ARH: affordable rental<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "You can use <b>only one<\/b> of these options. ISS gives up to <b>₹1.80 lakh<\/b> interest subsidy on loans up to ₹25 lakh for houses worth up to ₹35 lakh."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Aadhaar of <b>all family members<\/b><\/li><li>Income certificate / ITR<\/li><li>Bank account <b>linked to Aadhaar<\/b><\/li><li>Self-declaration that you own no pucca house<\/li><li>For BLC: <b>land / property card<\/b> in your name<\/li><li>Caste certificate, if applicable<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Plot not in your name? Get the property card / mutation updated first. BLC needs land in the family's name."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply (it is free)", "body": "Choose any one:<ul><li>Website <b>pmay-urban.gov.in<\/b> (Aadhaar OTP)<\/li><li>Your <b>municipal corporation / council<\/b> PMAY cell<\/li><li>For ISS: also through your <b>bank / housing finance company<\/b><\/li><\/ul>Note your <b>application number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Beware of <b>fake PMAY websites and agents<\/b>. Applying is free. Never pay to \"get selected\"."}}, {"phase": "After you apply", "kind": "gov", "who": "Government / Bank", "title": "Your application is checked", "body": "The <b>Urban Local Body<\/b> (municipal corporation / council) verifies your details. For BLC, they also check your plot.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Rejected? Common reasons: a family member already owns a pucca house, or income doesn't match. Read the reason, correct it and reapply."}}, {"phase": null, "kind": "gov", "who": "Government / Bank", "title": "Approval and money", "body": "<ul><li><b>BLC<\/b>: money comes
