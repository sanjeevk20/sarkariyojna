hetkari is cheating you."}}, {"phase": null, "kind": "you", "who": "You", "title": "Be active in PM-KISAN", "body": "Your PM-KISAN registration must be <b>approved and active<\/b>, with land in your name. See the <b>PM-KISAN<\/b> guide if you are not registered.", "note": {"kind": "stuck", "label": "Stuck?", "html": "PM-KISAN stopped? Namo Shetkari stops too. Fix PM-KISAN first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep eKYC done", "body": "Complete <b>eKYC<\/b> on pmkisan.gov.in (OTP) or by face authentication in the app.", "note": {"kind": "stuck", "label": "Stuck?", "html": "eKYC pending is the most common reason both payments stop."}}, {"phase": null, "kind": "you", "who": "You", "title": "Link Aadhaar to your bank", "body": "Your bank account must be <b>Aadhaar-seeded with DBT on<\/b>. Ask your bank to confirm.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Check land seeding", "body": "Your <b>7/12 land details<\/b> must be verified and linked to your record. Check \"land seeding\" in your status.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land seeding shows <b>No<\/b>? Contact the <b>Talathi / Krushi Sahayak<\/b> with your 7/12. Land still in a parent's name? See the <b>Ferfar<\/b> guide."}}, {"phase": "Payment", "kind": "gov", "who": "Government", "title": "State releases the instalment", "body": "The state prepares the list from PM-KISAN data (after eKYC, land and bank checks) and releases each instalment by DBT.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "₹2,000 in your account", "body": "You get an SMS. Together with PM-KISAN you receive <b>₹12,000 a year<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Getting PM-KISAN but <b>not<\/b> Namo Shetkari? Check your status on the <b>Namo Shetkari portal<\/b>, then contact the <b>Taluka Agriculture Officer<\/b>."}}], "rights_t": "Instalment missing? Follow up.", "rights": "Check status on the official <b>Namo Shetkari (NSMNY) portal<\/b> and pmkisan.gov.in. Then write to the <b>Taluka Agriculture Officer<\/b> with your PM-KISAN registration number and take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Status:<\/b> NSMNY portal (Maharashtra) and pmkisan.gov.in · Fix eKYC, bank and land seeding in PM-KISAN; Namo follows automatically<br/><b>No registration fee<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "नमो शेतकरी महासन्मान निधी: पीएम-किसानसोबत वर्षाला अतिरिक्त ₹6,000", "benefit": "महाराष्ट्राकडून वर्षातून 3 वेळा ₹2,000, म्हणजे पीएम-किसानसह वर्षाला ₹12,000", "steps": [{"phase": "पात्र असल्याची खात्री करा", "kind": "you", "who": "तुम्ही", "title": "वेगळा अर्ज लागत नाही", "body": "तुम्ही <b>महाराष्ट्रातील मंजूर पीएम-किसान लाभार्थी<\/b> असाल, तर तुमचा नमो शेतकरी योजनेत <b>आपोआप<\/b> समावेश होतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "नमो शेतकरीसाठी \"नोंदणी करून देण्यासाठी\" पैसे मागणारा तुमची फसवणूक करत आहे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "पीएम-किसानमध्ये सक्रिय राहा", "body": "तुमची पीएम-किसान नोंदणी <b>मंजूर व सक्रिय<\/b> असावी आणि जमीन तुमच्या नावावर असावी. नोंदणी नसल्यास <b>पीएम-किसान<\/b> मार्गदर्शक पाहा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पीएम-किसान बंद झाले? मग नमो शेतकरीही बंद होते. आधी पीएम-किसान दुरुस्त करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-केवायसी पूर्ण ठेवा", "body": "pmkisan.gov.in वर (OTP) किंवा ॲपमध्ये चेहरा प्रमाणीकरणाने <b>ई-केवायसी<\/b> पूर्ण करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "ई-केवायसी बाकी असणे हे दोन्ही हप्ते थांबण्याचे सर्वात सामान्य कारण आहे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "आधार बँकेशी लिंक करा", "body": "तुमचे बँक खाते <b>आधार-सीडेड आणि DBT सुरू<\/b> असले पाहिजे. बँकेकडून खात्री करा.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "जमीन नोंद (लँड सीडिंग) तपासा", "body": "तुमच्या <b>7/12 जमिनीची माहिती<\/b> पडताळून तुमच्या नोंदीशी जोडलेली असावी. स्थितीमध्ये \"land seeding\" तपासा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "लँड सीडिंग <b>No<\/b> दाखवते? 7/12 घेऊन <b>तलाठी / कृषी सहायक<\/b> यांच्याशी संपर्क करा. जमीन अजून पालकांच्या नावावर? <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": "हप्ता", "kind": "gov", "who": "सरकार", "title": "राज्य हप्ता वितरित करते", "body": "राज्य पीएम-किसान माहितीवरून (ई-केवायसी, जमीन व बँक तपासणीनंतर) यादी तयार करून प्रत्येक हप्ता DBT द्वारे वितरित करते.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "₹2,000 खात्यात जमा", "body": "तुम्हाला SMS येतो. पीएम-किसानसह तुम्हाला <b>वर्षाला ₹12,000<\/b> मिळतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पीएम-किसान मिळते पण नमो शेतकरी <b>नाही<\/b>? <b>नमो शेतकरी पोर्टलवर<\/b> स्थिती तपासा, नंतर <b>तालुका कृषी अधिकाऱ्यांशी<\/b> संपर्क करा."}}], "rights_t": "हप्ता मिळाला नाही? पाठपुरावा करा.", "rights": "अधिकृत <b>नमो शेतकरी (NSMNY) पोर्टल<\/b> आणि pmkisan.gov.in वर स्थिती तपासा. नंतर पीएम-किसान नोंदणी क्रमांकासह <b>तालुका कृषी अधिकाऱ्यांना<\/b> लिहा आणि <b>पोच<\/b> घ्या.", "help": "<b>स्थिती:<\/b> NSMNY पोर्टल (महाराष्ट्र) आणि pmkisan.gov.in · पीएम-किसानमध्ये ई-केवायसी, बँक व लँड सीडिंग दुरुस्त करा; नमो आपोआप मिळते<br/><b>नोंदणी शुल्क नाही<\/b> · <b>फक्त अधिकृत वेबसाइट वापरा<\/b>"}}, {"slug": "pik-vima", "title": "Crop insurance (PM Fasal Bima)", "local_name": "पीक विमा", "audience": "Farmers growing notified crops (AgriStack ID + e-Pik Pahani)", "state": "mh", "local": "mr", "cat": "farm", "links": [{"label": "PMFBY: enrol, policy, claim status", "url": "https://pmfby.gov.in", "gov": true}, {"label": "AgriStack Farmer ID (Maharashtra)", "url": "https://mhfr.agristack.gov.in", "gov": false}, {"label": "PIB: PMFBY press release", "url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2304549&reg=48&lang=2", "gov": true}], "mermaid": "flowchart TD\n    A([Farmer growing a notified crop]) --> ID{1. AgriStack Farmer ID?}\n    ID -- No --> RID[Register on mhfr.agristack.gov.in / CSC]\n    RID --> EP\n    ID -- Yes --> EP[2. e-Pik Pahani: record sown crop<br/>on survey / Gat number]\n    EP --> D[3. Documents<br/>7/12, 8A or tenancy agreement,<br/>Aadhaar, seeded bank, sowing declaration]\n    D --> EN[4. Enrol before deadline<br/>pmfby.gov.in / app / CSC / bank<br/>pay premium: Kharif 2, Rabi 1.5,<br/>commercial 5 percent of sum insured]\n    EN -- Missed deadline --> X([Not insured this season])\n    EN --> PC[5. Check policy on pmfby.gov.in<br/>crop, area, survey no., bank]\n    PC -- Mismatch with e-Pik Pahani --> F1[Policy cancelled, premium lost]\n    PC -- Wrong details --> FX[Correct before correction deadline]\n    FX --> PC\n    PC -- OK --> SE[Season: crop-cutting experiments<br/>in revenue circle]\n    SE --> Y{Average yield below<br/>threshold yield?}\n    Y -- No --> NC([No claim this season])\n    Y -- Yes --> CL[6. Claim calculated by insurer]\n    CL --> P([7. Claim paid to Aadhaar-linked bank])\n    CL -. delayed / wrong .-> T[Complaint: pmfby.gov.in / helpline,<br/>Taluka Agriculture Officer]\n\n    S1[[Sathi: Farmer ID + e-Pik Pahani readiness]]:::sathi -.-> ID\n    S2[[Sathi GIS: crop on e-Pik Pahani vs<br/>policy crop vs satellite crop map]]:::sathi -.-> PC\n    S3[[Sathi: Season deadline countdown]]:::sathi -.-> EN\n    S4[[Sathi: Revenue-circle yield + claim tracker]]:::sathi -.-> Y\n    S5[[Sathi: Complaint draft with policy no.]]:::sathi -.-> T\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1 blocked", "sources": [{"label": "Free Press Journal: PMFBY Kharif-Rabi 2025 open, e-survey and AgriStack mandatory", "url": "https://www.freepressjournal.in/mumbai/raigad-pmfby-kharif-rabi-2025-crop-insurance-now-open-e-survey-agristack-id-mandatory"}, {"label": "PIB press release", "url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2304549&reg=48&lang=2"}, {"label": "MahaBharti: Maharashtra revised crop insurance scheme", "url": "https://mahabharti.in/maharashtra-sudharit-pik-vima-yojana/"}, {"label": "Kshema: PMFBY 2026", "url": "https://kshema.co/blogs/pmfby-crop-insurance-india-2026/"}, {"label": "AgriStack Farmer ID registration", "url": "https://www.egovtschemes.com/agristack-registration/"}, {"label": "Agrijob: PMFBY benefits 2016-2025", "url": "https://www.agrijob.in/pmfby-farmer-benefits-claims-data-2016-2025/"}, {"label": "Zee News: crop insurance fraud report", "url": "https://zeenews.india.com/marathi/video/fraud-in-peek-vima-yojna/899329"}], "verified": "2026-10-27", "en": {"h1": "Crop Insurance (PM Fasal Bima): How to insure your crop", "benefit": "Compensation when natural calamity, pests or disease cut your crop yield", "steps": [{"phase": "Before the deadline", "kind": "you", "who": "You", "title": "Know what has changed", "body": "<ul><li>The <b>₹1 crop insurance ended in 2025<\/b>. You now pay a small premium: about <b>2%<\/b> of sum insured for <b>Kharif<\/b>, <b>1.5%<\/b> for <b>Rabi<\/b>, <b>5%<\/b> for commercial / horticulture crops<\/li><li>Owner, tenant and sharecropper farmers growing a <b>notified crop<\/b> in a <b>notified area<\/b> can join<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Get your AgriStack Farmer ID", "body": "A <b>Farmer ID<\/b> is <b>mandatory<\/b>. Register on <b>mhfr.agristack.gov.in<\/b> or at a CSC with Aadhaar and your 7/12.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No Farmer ID? You cannot enrol. Do this <b>weeks before<\/b> the deadline."}}, {"phase": null, "kind": "you", "who": "You", "title": "Record your crop in e-Pik Pahani", "body": "Register the crop you sowed on the <b>e-Pik Pahani<\/b> app for your survey / Gat number.", "note": {"kind": "stuck", "label": "Stuck?", "html": "If the crop in your insurance form <b>does not match<\/b> e-Pik Pahani, the policy can be <b>cancelled<\/b> and the premium lost."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>7/12 and 8A<\/b> (tenants: lease / sharecropping agreement)<\/li><li>Aadhaar, <b>bank passbook<\/b> (account linked to Aadhaar)<\/li><li>Sowing declaration (crop, area)<\/li><li>Farmer ID<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Enrol and pay premium before the deadline", "body": "Enrol on <b>pmfby.gov.in<\/b> (Farmer Corner), the <b>Crop Insurance app<\/b>, at a <b>CSC<\/b> or at your <b>bank<\/b>. Pay your premium share. Keep the <b>policy / receipt number<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Kharif enrolment usually closes around <b>end of July<\/b>. Check the current season's date. Loanee farmers: ask your bank whether you are enrolled."}}, {"phase": "After you enrol", "kind": "you", "who": "You", "title": "Check your policy", "body": "Check the policy on <b>pmfby.gov.in<\/b> with your receipt number: <b>crop, area, survey number and bank<\/b> must be correct.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Wrong crop or area? Ask the CSC / bank / insurer to correct it <b>before the correction deadline<\/b>."}}, {"phase": null, "kind": "gov", "who": "Govt / Insurer", "title": "Crop loss is assessed", "body": "Under the revised scheme, compensation is mainly based on <b>crop-cutting experiments<\/b> in your <b>revenue circle<\/b>: if the average yield is below the threshold yield, insured farmers get a claim.", "note": {"kind": "tip", "label": "Tip:", "html": "Damage on your own field? Inform the <b>insurer / agriculture office quickly<\/b> with photos and ask if an individual claim is allowed this season."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Claim paid to your bank", "body": "Approved claims are paid directly into your <b>Aadhaar-linked bank account<\/b>. Check claim status on pmfby.gov.in.", "note": null}], "rights_t": "Claim missing or wrong? Complain.", "rights": "Raise a complaint on <b>pmfby.gov.in<\/b> or the official helpline listed there, and write to the <b>Taluka Agriculture Officer<\/b> / district agriculture office with your policy number. Take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Enrol / status:<\/b> pmfby.gov.in · <b>Farmer ID:<\/b> mhfr.agristack.gov.in · Rates and dates change by season; check the current notification<br/><b>Use only official websites and apps<\/b>"}, "loc": {"h1": "पीक विमा (प्रधानमंत्री पीक विमा योजना): तुमच्या पिकाचा विमा कसा काढायचा", "benefit": "नैसर्गिक आपत्ती, कीड किंवा रोगामुळे उत्पादन घटल्यास नुकसान भरपाई", "steps": [{"phase": "मुदतीपूर्वी", "kind": "you", "who": "तुम्ही", "title": "काय बदलले ते जाणा", "body": "<ul><li><b>₹1 पीक विमा 2025 मध्ये बंद झाला<\/b>. आता थोडा हप्ता भरावा लागतो: विमा संरक्षित रकमेच्या सुमारे <b>खरीपसाठी 2%<\/b>, <b>रब्बीसाठी 1.5%<\/b>, नगदी / फळपिकांसाठी <b>5%<\/b><\/li><li><b>अधिसूचित क्षेत्रात अधिसूचित पीक<\/b> घेणारे मालक, कुळ आणि बटाईदार शेतकरी सहभागी होऊ शकतात<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ॲग्रीस्टॅक शेतकरी ओळखपत्र मिळवा", "body": "<b>शेतकरी ओळखपत्र (Farmer ID) बंधनकारक<\/b> आहे. आधार व 7/12 सह <b>mhfr.agristack.gov.in<\/b> वर किंवा CSC मध्ये नोंदणी करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "Farmer ID नाही? मग नोंदणी करता येत नाही. हे मुदतीच्या <b>काही आठवडे आधीच<\/b> करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "ई-पीक पाहणीत पिकाची नोंद करा", "body": "तुमच्या सर्वे / गट क्रमांकावर पेरलेल्या पिकाची <b>ई-पीक पाहणी<\/b> ॲपवर नोंद करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "विमा अर्जातील पीक ई-पीक पाहणीशी <b>जुळले नाही<\/b> तर पॉलिसी <b>रद्द<\/b> होऊन हप्ता बुडू शकतो."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>7/12 व 8-अ<\/b> (कुळांसाठी: भाडेपट्टा / बटाई करार)<\/li><li>आधार, <b>बँक पासबुक<\/b> (खाते आधारशी लिंक)<\/li><li>पेरणी घोषणापत्र (पीक, क्षेत्र)<\/li><li>शेतकरी ओळखपत्र (Farmer ID)<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "मुदतीपूर्वी नोंदणी करून हप्ता भरा", "body": "<b>pmfby.gov.in<\/b> (Farmer Corner), <b>Crop Insurance ॲप<\/b>, <b>CSC<\/b> किंवा तुमच्या <b>बँकेत<\/b> नोंदणी करा. तुमचा हप्ता भरा. <b>पॉलिसी / पावती क्रमांक<\/b> जपून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "खरीप नोंदणी सहसा <b>जुलैअखेर<\/b> बंद होते. चालू हंगामाची तारीख तपासा. कर्जदार शेतकऱ्यांनी आपली नोंदणी झाली आहे का ते बँकेत विचारावे."}}, {"phase": "नोंदणीनंतर", "kind": "you", "who": "तुम्ही", "title": "पॉलिसी तपासा", "body": "पावती क्रमांकाने <b>pmfby.gov.in<\/b> वर पॉलिसी तपासा: <b>पीक, क्षेत्र, सर्वे क्रमांक आणि बँक<\/b> बरोबर असले पाहिजे.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पीक किंवा क्षेत्र चुकीचे? <b>दुरुस्तीच्या मुदतीपूर्वी<\/b> CSC / बँक / विमा कंपनीकडून दुरुस्त करून घ्या."}}, {"phase": null, "kind": "gov", "who": "सरकार / विमा कंपनी", "title": "पीक नुकसानीचे मूल्यमापन", "body": "सुधारित योजनेत नुकसान भरपाई मुख्यतः तुमच्या <b>महसूल मंडळातील पीक कापणी प्रयोगांवर<\/b> आधारित असते: सरासरी उत्पादन उंबरठा उत्पादनापेक्षा कमी आल्यास विमाधारक शेतकऱ्यांना दावा मिळतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "तुमच्या शेतात नुकसान झाले? फोटोसह <b>विमा कंपनी / कृषी कार्यालयाला लवकर कळवा<\/b> आणि या हंगामात वैयक्तिक दावा चालतो का ते विचारा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दावा रक्कम बँक खात्यात", "body": "मंजूर दावा थेट तुमच्या <b>आधार-लिंक बँक खात्यात<\/b> जमा होतो. दाव्याची स्थिती pmfby.gov.in वर तपासा.", "note": null}], "rights_t": "दावा मिळाला नाही किंवा चुकीचा? तक्रार करा.", "rights": "<b>pmfby.gov.in<\/b> वर किंवा तिथे दिलेल्या अधिकृत हेल्पलाइनवर तक्रार नोंदवा, आणि पॉलिसी क्रमांकासह <b>तालुका कृषी अधिकारी<\/b> / जिल्हा कृषी कार्यालयाला लिहा. <b>पोच<\/b> घ्या.", "help": "<b>नोंदणी / स्थिती:<\/b> pmfby.gov.in · <b>Farmer ID:<\/b> mhfr.agristack.gov.in · दर व तारखा हंगामानुसार बदलतात; चालू अधिसूचना तपासा<br/><b>फक्त अधिकृत वेबसाइट व ॲप वापरा<\/b>"}}, {"slug": "krushi-swavalamban", "title": "Krushi Swavalamban Yojana", "local_name": "डॉ. बाबासाहेब आंबेडकर कृषी स्वावलंबन योजना", "audience": "SC / Nav-Bauddha farmers (wells, irrigation)", "state": "mh", "local": "mr", "cat": "farm", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}, {"label": "ZP Palghar: scheme page", "url": "https://www.zppalghar.gov.in/en/dr-babasaheb-ambedkar-krishi-swalamban-yojana/", "gov": true}], "mermaid": "flowchart TD\n    A([SC / Nav-Bauddha farmer]) --> E{1. Eligible?<br/>MH, land 0.40 to 6 ha in own name}\n    E -- Land not in name --> F0[Blocked: get ferfar done first]\n    E -- Yes --> C{2. Component}\n    C -- New well --> W{Public drinking well<br/>within 500 m?}\n    W -- Yes --> X([New well not allowed])\n    W -- No --> D\n    C -- Repair / boring / pump / power /<br/>pond lining / drip / sprinkler --> D\n    D[3. Documents<br/>caste cert, 7/12, 8A, Aadhaar, seeded bank,<br/>affidavit; for well: Talathi cert,<br/>GSDA groundwater cert, Gram Sabha resolution]\n    D --> AP[4. Apply on MahaDBT farmer login<br/>application ID]\n    AP --> SEL{Selected?}\n    SEL -- Not this round --> RE[Wait / reapply next round]\n    SEL -- Yes --> PA[5. Document check + pre-approval<br/>Panchayat Samiti agriculture office]\n    PA --> WK[6. Do the work after pre-approval<br/>bills, photos, upload]\n    WK -- Started before pre-approval --> F1[Not payable]\n    WK --> IN[7. Inspection + measurement<br/>Agriculture Officer]\n    IN -- Delay --> F2[Inspection pending]\n    IN --> P([8. Grant by DBT<br/>well paid in stages])\n    F2 -.-> T[Escalate: Agriculture Officer PS,<br/>then Agri Development Officer ZP,<br/>MahaDBT grievance]\n\n    S1[[Sathi: Eligibility + land readiness<br/>7/12 Health Report + Ferfar]]:::sathi -.-> E\n    S2[[Sathi GIS check: distance to public wells,<br/>groundwater zone, parcel boundary]]:::sathi -.-> W\n    S3[[Sathi: Document checklist per component]]:::sathi -.-> D\n    S4[[Sathi: Window alert + selection tracker]]:::sathi -.-> SEL\n    S5[[Sathi: No-work-before-approval alert,<br/>geo-tagged stage photos]]:::sathi -.-> WK\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "ZP Palghar: Dr. Babasaheb Ambedkar Krishi Swalamban Yojana", "url": "https://www.zppalghar.gov.in/en/dr-babasaheb-ambedkar-krishi-swalamban-yojana/"}, {"label": "ZP Satara: scheme 2024-25", "url": "https://www.zpsatara.gov.in/scheme/%E0%A4%A1%E0%A5%89-%E0%A4%AC%E0%A4%BE%E0%A4%AC%E0%A4%BE%E0%A4%B8%E0%A4%BE%E0%A4%B9%E0%A5%87%E0%A4%AC-%E0%A4%86%E0%A4%82%E0%A4%AC%E0%A5%87%E0%A4%A1%E0%A4%95%E0%A4%B0-%E0%A4%95%E0%A5%83%E0%A4%B7/"}, {"label": "Mahasamvad: financial criteria increased", "url": "https://mahasamvad.in/146716/"}, {"label": "Agrowon: ₹4 lakh for new wells", "url": "https://agrowon.esakal.com/agro-special/state-government-will-provide-rs-4-lakh-subsidy-for-new-wells-state-governments-scheme-for-farmers-rat16"}, {"label": "Lokmat: new well documents", "url": "https://www.lokmat.com/agriculture/smart-farming/latest-news-vihir-yojana-what-documents-are-required-for-new-well-scheme-see-list-of-documents-a-a993/"}, {"label": "Saam TV: ₹4 lakh well subsidy", "url": "https://saamtv.esakal.com/image-story/maharashtra-government-schemes-offer-financial-aid-for-wells-drip-irrigation-and-pumps-beed-farmers-can-get-subsidies-up-to-rs-4-lakh-bbj88"}, {"label": "Krushi Kranti: document list", "url": "https://www.krushikranti.com/blogs/babasaheb-krushi-swavalamban-yojana-navin-vihir-kagdptra"}, {"label": "Mahiti A1: changes and GR", "url": "https://mahitia1.in/babasaheb-ambedkar-khrushi-swavlamban-yojna-big-changes/"}], "verified": "2026-10-27", "en": {"h1": "Krushi Swavalamban Yojana: Grants for wells and irrigation for SC farmers", "benefit": "Up to ₹4 lakh for a new well, plus grants for pumps, drip / sprinkler and farm-pond lining", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer from a <b>Scheduled Caste or Nav-Bauddha<\/b> family in Maharashtra<\/li><li><b>Farmland in your name<\/b>: about <b>0.40 to 6 hectares<\/b> (7/12 and 8A)<\/li><li>The old ₹1.5 lakh income limit has been <b>removed<\/b> under the 2024 GR<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "ST farmers: ask about the separate <b>Birsa Munda Krushi Kranti Yojana<\/b>."}}, {"phase": null, "kind": "you", "who": "You", "title": "Choose what you need", "body": "<ul><li><b>New well<\/b>: up to ₹4 lakh<\/li><li><b>Old well repair<\/b>: up to ₹1 lakh<\/li><li><b>In-well boring<\/b>: ₹40,000 · <b>Pump set<\/b>: ₹40,000 · <b>Electric connection<\/b>: ₹20,000<\/li><li><b>Farm-pond plastic lining<\/b>: 90% of cost, up to ₹2 lakh<\/li><li><b>Drip<\/b>: up to ₹97,000 · <b>Sprinkler<\/b>: up to ₹47,000<\/li><li>Solar pump, farm machinery: about ₹50,000<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>New well<\/b> is not allowed within <b>500 metres of a village public drinking-water well<\/b>. Check before you apply."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Caste certificate<\/b><\/li><li><b>7/12 and 8A<\/b> extracts in your name<\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b><\/li><li>Self-declaration / affidavit<\/li><li><b>For a new well<\/b>: Talathi certificate (no existing well), <b>groundwater (GSDA) certificate<\/b>, <b>Gram Sabha resolution<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the <b>ferfar<\/b> done first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on MahaDBT", "body": "Log in on <b>mahadbt.maharashtra.gov.in<\/b> as a <b>Farmer<\/b> (Aadhaar-based), fill your profile, choose this scheme and the component, upload documents and submit. Note your <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Apply <b>early<\/b> when the window opens. Selection is limited and may be first-come or by draw. Applying is <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Agriculture office", "title": "Selection and pre-approval", "body": "If selected, the Panchayat Samiti agriculture office checks your documents and gives <b>pre-approval (पूर्वसंमती)<\/b> for the work.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Do not start work before pre-approval.<\/b> Work done earlier is usually not paid."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do the work, keep proof", "body": "Complete the work within the time given. Keep <b>bills, quotations and photos<\/b> of each stage (geo-tagged where asked). Upload them on MahaDBT.", "note": null}, {"phase": null, "kind": "gov", "who": "Agriculture office", "title": "Inspection", "body": "The <b>Agriculture Officer<\/b> inspects and measures the completed work.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Inspection delayed? Ask the Panchayat Samiti agriculture office in writing with your application ID."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Grant paid to your bank", "body": "The grant is paid by <b>DBT<\/b> into your Aadhaar-linked bank account. For a new well it may come in <b>stages<\/b> as work progresses.", "note": null}], "rights_t": "Stuck for long? Escalate.", "rights": "Write to the <b>Agriculture Officer, Panchayat Samiti<\/b>, then the <b>Agriculture Development Officer, Zilla Parishad<\/b>, with your MahaDBT application ID, and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>MahaDBT<\/b>.", "help": "<b>Apply:<\/b> mahadbt.maharashtra.gov.in → Farmer login · Amounts as per the 2024 GR; check the current notice<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "कृषी स्वावलंबन योजना: अनुसूचित जातीतील शेतकऱ्यांना विहीर व सिंचनासाठी अनुदान", "benefit": "नवीन विहिरीसाठी ₹4 लाखांपर्यंत, शिवाय पंप, ठिबक / तुषार आणि शेततळे अस्तरीकरणासाठी अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li>महाराष्ट्रातील <b>अनुसूचित जाती किंवा नवबौद्ध<\/b> कुटुंबातील शेतकरी<\/li><li><b>तुमच्या नावावर शेतजमीन<\/b>: सुमारे <b>0.40 ते 6 हेक्टर<\/b> (7/12 व 8-अ)<\/li><li>2024 च्या शासन निर्णयानुसार जुनी ₹1.5 लाख उत्पन्न मर्यादा <b>रद्द<\/b> झाली आहे<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "अनुसूचित जमातीतील शेतकऱ्यांनी स्वतंत्र <b>बिरसा मुंडा कृषी क्रांती योजनेबद्दल<\/b> विचारावे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काय हवे ते निवडा", "body": "<ul><li><b>नवीन विहीर<\/b>: ₹4 लाखांपर्यंत<\/li><li><b>जुनी विहीर दुरुस्ती<\/b>: ₹1 लाखापर्यंत<\/li><li><b>इनवेल बोअरिंग<\/b>: ₹40,000 · <b>पंप संच<\/b>: ₹40,000 · <b>वीज जोडणी<\/b>: ₹20,000<\/li><li><b>शेततळे प्लास्टिक अस्तरीकरण<\/b>: खर्चाच्या 90%, ₹2 लाखांपर्यंत<\/li><li><b>ठिबक<\/b>: ₹97,000 पर्यंत · <b>तुषार<\/b>: ₹47,000 पर्यंत<\/li><li>सौर पंप, शेती अवजारे: सुमारे ₹50,000<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "गावाच्या <b>सार्वजनिक पिण्याच्या पाण्याच्या विहिरीपासून 500 मीटरच्या आत<\/b> <b>नवीन विहीर<\/b> मंजूर होत नाही. अर्ज करण्यापूर्वी तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>जातीचा दाखला<\/b><\/li><li>तुमच्या नावाचे <b>7/12 व 8-अ<\/b> उतारे<\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b><\/li><li>स्वयंघोषणापत्र / प्रतिज्ञापत्र<\/li><li><b>नवीन विहिरीसाठी<\/b>: तलाठी दाखला (विहीर नसल्याचा), <b>भूजल (GSDA) दाखला<\/b>, <b>ग्रामसभा ठराव<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून पालकांच्या नावावर? आधी <b>फेरफार<\/b> करून घ्या. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महाडीबीटीवर अर्ज करा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> वर <b>शेतकरी<\/b> म्हणून (आधार आधारित) लॉगिन करा, प्रोफाइल भरा, ही योजना व घटक निवडा, कागदपत्रे अपलोड करून अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज खिडकी उघडताच <b>लवकर<\/b> अर्ज करा. निवड मर्यादित असते आणि प्रथम येणाऱ्यास प्राधान्य किंवा सोडतीने होऊ शकते. अर्ज <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "कृषी कार्यालय", "title": "निवड व पूर्वसंमती", "body": "निवड झाल्यास पंचायत समितीचे कृषी कार्यालय कागदपत्रे तपासून कामासाठी <b>पूर्वसंमती<\/b> देते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>पूर्वसंमतीपूर्वी काम सुरू करू नका.<\/b> आधी केलेल्या कामाचे अनुदान सहसा मिळत नाही."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काम करा, पुरावे ठेवा", "body": "दिलेल्या मुदतीत काम पूर्ण करा. प्रत्येक टप्प्याची <b>बिले, कोटेशन आणि फोटो<\/b> (सांगितल्यास जिओ-टॅग) ठेवा. ते महाडीबीटीवर अपलोड करा.", "note": null}, {"phase": null, "kind": "gov", "who": "कृषी कार्यालय", "title": "तपासणी", "body": "<b>कृषी अधिकारी<\/b> पूर्ण झालेल्या कामाची तपासणी व मोजमाप करतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "तपासणीला उशीर? अर्ज क्रमांकासह पंचायत समिती कृषी कार्यालयाकडे लेखी विचारणा करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अनुदान बँक खात्यात", "body": "अनुदान <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते. नवीन विहिरीसाठी कामाच्या प्रगतीनुसार <b>टप्प्याटप्प्याने<\/b> मिळू शकते.", "note": null}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "महाडीबीटी अर्ज क्रमांकासह आधी <b>कृषी अधिकारी, पंचायत समिती<\/b>, नंतर <b>कृषी विकास अधिकारी, जिल्हा परिषद<\/b> यांना लिहा आणि <b>पोच<\/b> घ्या. <b>महाडीबीटीवर<\/b> तक्रारही नोंदवता येते.", "help": "<b>अर्ज:<\/b> mahadbt.maharashtra.gov.in → शेतकरी लॉगिन · रक्कम 2024 च्या शासन निर्णयानुसार; चालू सूचना तपासा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "birsa-munda", "title": "Birsa Munda Krushi Kranti Yojana", "local_name": "बिरसा मुंडा कृषी क्रांती योजना", "audience": "ST farmers incl. forest-rights holders (wells, irrigation)", "state": "mh", "local": "mr", "cat": "farm", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}, {"label": "ZP Satara: scheme page 2024-25", "url": "https://www.zpsatara.gov.in/en/scheme/birsa-munda-agricultural-revolution-scheme-for-the-year-2024-25/", "gov": true}], "mermaid": "flowchart TD\n    A([Scheduled Tribe farmer]) --> E{1. Eligible?<br/>MH, land 0.20 to 6 ha in own name<br/>or forest-rights title}\n    E -- Land not in name --> F0[Blocked: get ferfar done first]\n    E -- Yes --> C{2. Component}\n    C -- New well --> L{Own land 0.40 ha or more?}\n    L -- No --> J[Joint application with<br/>neighbouring tribal farmers]\n    L -- Yes --> D\n    J --> D\n    C -- Borewell --> FR{Forest-rights holder?}\n    FR -- No --> X([Borewell not available])\n    FR -- Yes --> D\n    C -- Repair / boring / pump / power /<br/>pond lining / drip / sprinkler --> D\n    D[3. Documents<br/>ST caste cert, 7/12 + 8A or forest title,<br/>Aadhaar, seeded bank, affidavit;<br/>for well: Talathi cert, GSDA cert, Gram Sabha resolution]\n    D --> AP[4. Apply on MahaDBT farmer login<br/>application ID]\n    AP --> LOT{Lottery<br/>priority: BPL, primitive tribal groups}\n    LOT -- Not selected --> RE[Reapply next round]\n    LOT -- Selected --> PA[5. Document check + pre-approval<br/>Panchayat Samiti agriculture office]\n    PA --> WK[6. Work after pre-approval<br/>bills, photos, upload]\n    WK -- Started before pre-approval --> F1[Not payable]\n    WK --> IN[7. Inspection + measurement]\n    IN -- Delay --> F2[Inspection pending]\n    IN --> P([8. Grant by DBT<br/>well paid in stages])\n    F2 -.-> T[Escalate: Agriculture Officer PS,<br/>then Agri Development Officer ZP,<br/>MahaDBT grievance]\n\n    S1[[Sathi: Scheme router<br/>ST to Birsa Munda, SC to Krushi Swavalamban]]:::sathi -.-> E\n    S2[[Sathi GIS: parcel or forest-rights plot,<br/>groundwater zone, joint-holding match]]:::sathi -.-> L\n    S3[[Sathi: Document checklist per component]]:::sathi -.-> D\n    S4[[Sathi: Lottery result tracker]]:::sathi -.-> LOT\n    S5[[Sathi: No-work-before-approval alert,<br/>geo-tagged stage photos]]:::sathi -.-> WK\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "Mahasamvad: Birsa Munda criteria revised", "url": "https://mahasamvad.in/144994/"}, {"label": "Mahasamvad: Agriculture Minister's appeal on both schemes", "url": "https://www.mahasamvad.in/146971/"}, {"label": "Agrowon: subsidy increase under Birsa Munda", "url": "https://agrowon.esakal.com/agro-special/increase-in-the-subsidy-under-the-birsa-munda-kranti-scheme"}, {"label": "Agrowon: up to ₹4 lakh for wells", "url": "https://agrowon.esakal.com/agro-special/subsidy-up-to-rs-4-lakh-will-now-be-available-for-wells-start-the-application-process"}, {"label": "ZP Satara: Birsa Munda 2024-25", "url": "https://www.zpsatara.gov.in/en/scheme/birsa-munda-agricultural-revolution-scheme-for-the-year-2024-25/"}, {"label": "MahaDBT: scheme data", "url": "https://mahadbt.maharashtra.gov.in/Farmer/SchemeData/SchemeData?str=E9DDFA703C38E51ACA98B76653871714"}, {"label": "MS Dhulap: criteria update", "url": "https://www.msdhulap.com/birsa-munda-krishi-kranti-yojana-update/"}, {"label": "Bayer FarmRise: Birsa Munda", "url": "https://farmrise.bayer.com/en/govt-scheme/birsa-munda-krushi-kranti-yojana"}], "verified": "2026-10-27", "en": {"h1": "Birsa Munda Krushi Kranti Yojana: Grants for wells and irrigation for tribal farmers", "benefit": "Up to ₹4 lakh for a new well, plus grants for pumps, drip / sprinkler and farm-pond lining", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer from a <b>Scheduled Tribe<\/b> family in Maharashtra, inside or outside tribal areas<\/li><li>Farmland in your name: <b>0.20 to 6 hectares<\/b> (at least <b>0.40 ha for a new well<\/b>)<\/li><li><b>Forest-rights (वनपट्टा) holders<\/b> can also apply<\/li><li>The old ₹1.5 lakh income limit has been <b>removed<\/b> under the 2024 GR<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Land below 0.40 ha? Neighbouring tribal farmers can <b>apply jointly<\/b> for a new well. BPL families are not limited by the 6 ha cap. SC farmers: see the <b>Krushi Swavalamban<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Choose what you need", "body": "<ul><li><b>New well<\/b>: up to ₹4 lakh<\/li><li><b>Old well repair<\/b>: up to ₹1 lakh<\/li><li><b>Borewell<\/b> (forest-rights holders only): up to ₹50,000<\/li><li><b>In-well boring<\/b>, <b>pump set<\/b>, <b>electric connection<\/b><\/li><li><b>Farm-pond plastic lining<\/b><\/li><li><b>Drip / sprinkler<\/b> irrigation<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "The 12-metre depth condition for new wells has been <b>removed<\/b>. Check the current notice for each component's limit."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Scheduled Tribe caste certificate<\/b><\/li><li><b>7/12 and 8A<\/b> in your name, or <b>forest-rights title (वनपट्टा)<\/b><\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b><\/li><li>Self-declaration / affidavit<\/li><li><b>For a new well<\/b>: Talathi certificate, <b>groundwater (GSDA) certificate<\/b>, <b>Gram Sabha resolution<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the <b>ferfar<\/b> done first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on MahaDBT", "body": "Log in on <b>mahadbt.maharashtra.gov.in<\/b> as a <b>Farmer<\/b> (Aadhaar-based), choose <b>Birsa Munda Krushi Kranti Yojana<\/b> and the component, upload documents and submit. Note your <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Selection is by <b>lottery<\/b>, with priority for BPL and primitive tribal group families. Applying is <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Agriculture office", "title": "Selection and pre-approval", "body": "If selected in the lottery, the Panchayat Samiti agriculture office checks your documents and gives <b>pre-approval (पूर्वसंमती)<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Do not start work before pre-approval.<\/b> Work done earlier is usually not paid."}}, {"phase": null, "kind": "you", "who": "You", "title": "Do the work, keep proof", "body": "Complete the work within the time given. Keep <b>bills and photos<\/b> of each stage (geo-tagged where asked) and upload them on MahaDBT.", "note": null}, {"phase": null, "kind": "gov", "who": "Agriculture office", "title": "Inspection", "body": "The <b>Agriculture Officer<\/b> inspects and measures the completed work.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Inspection delayed? Ask the Panchayat Samiti agriculture office in writing with your application ID."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Grant paid to your bank", "body": "The grant is paid by <b>DBT<\/b> into your Aadhaar-linked bank account. For a new well it may come in <b>stages<\/b>.", "note": null}], "rights_t": "Stuck for long? Escalate.", "rights": "Write to the <b>Agriculture Officer, Panchayat Samiti<\/b>, then the <b>Agriculture Development Officer, Zilla Parishad<\/b>, with your MahaDBT application ID, and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>MahaDBT<\/b>.", "help": "<b>Apply:<\/b> mahadbt.maharashtra.gov.in → Farmer login · Amounts as per the 1 Oct 2024 GR; check the current notice<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "बिरसा मुंडा कृषी क्रांती योजना: आदिवासी शेतकऱ्यांना विहीर व सिंचनासाठी अनुदान", "benefit": "नवीन विहिरीसाठी ₹4 लाखांपर्यंत, शिवाय पंप, ठिबक / तुषार आणि शेततळे अस्तरीकरणासाठी अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li>महाराष्ट्रातील <b>अनुसूचित जमाती<\/b> कुटुंबातील शेतकरी, आदिवासी क्षेत्रांतर्गत किंवा क्षेत्राबाहेरील<\/li><li>तुमच्या नावावर शेतजमीन: <b>0.20 ते 6 हेक्टर<\/b> (<b>नवीन विहिरीसाठी किमान 0.40 हेक्टर<\/b>)<\/li><li><b>वनपट्टेधारक<\/b> शेतकरीही अर्ज करू शकतात<\/li><li>2024 च्या शासन निर्णयानुसार जुनी ₹1.5 लाख उत्पन्न मर्यादा <b>रद्द<\/b> झाली आहे<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "जमीन 0.40 हेक्टरपेक्षा कमी? शेजारील आदिवासी शेतकरी नवीन विहिरीसाठी <b>एकत्रित अर्ज<\/b> करू शकतात. दारिद्र्यरेषेखालील कुटुंबांना 6 हेक्टरची मर्यादा लागू नाही. अनुसूचित जातीतील शेतकऱ्यांनी <b>कृषी स्वावलंबन<\/b> मार्गदर्शक पाहावे."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काय हवे ते निवडा", "body": "<ul><li><b>नवीन विहीर<\/b>: ₹4 लाखांपर्यंत<\/li><li><b>जुनी विहीर दुरुस्ती<\/b>: ₹1 लाखापर्यंत<\/li><li><b>विंधन विहीर<\/b> (फक्त वनपट्टेधारकांसाठी): ₹50,000 पर्यंत<\/li><li><b>इनवेल बोअरिंग<\/b>, <b>पंप संच<\/b>, <b>वीज जोडणी<\/b><\/li><li><b>शेततळे प्लास्टिक अस्तरीकरण<\/b><\/li><li><b>ठिबक / तुषार<\/b> सिंचन<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "नवीन विहिरीसाठी 12 मीटर खोलीची अट <b>रद्द<\/b> झाली आहे. प्रत्येक घटकाची मर्यादा चालू सूचनेत तपासा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>अनुसूचित जमातीचा जातीचा दाखला<\/b><\/li><li>तुमच्या नावाचे <b>7/12 व 8-अ<\/b>, किंवा <b>वनपट्टा<\/b><\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b><\/li><li>स्वयंघोषणापत्र / प्रतिज्ञापत्र<\/li><li><b>नवीन विहिरीसाठी<\/b>: तलाठी दाखला, <b>भूजल (GSDA) दाखला<\/b>, <b>ग्रामसभा ठराव<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून पालकांच्या नावावर? आधी <b>फेरफार<\/b> करून घ्या. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महाडीबीटीवर अर्ज करा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> वर <b>शेतकरी<\/b> म्हणून (आधार आधारित) लॉगिन करा, <b>बिरसा मुंडा कृषी क्रांती योजना<\/b> व घटक निवडा, कागदपत्रे अपलोड करून अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "निवड <b>सोडतीने<\/b> होते; दारिद्र्यरेषेखालील आणि आदिम जमाती कुटुंबांना प्राधान्य. अर्ज <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "कृषी कार्यालय", "title": "निवड व पूर्वसंमती", "body": "सोडतीत निवड झाल्यास पंचायत समितीचे कृषी कार्यालय कागदपत्रे तपासून <b>पूर्वसंमती<\/b> देते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>पूर्वसंमतीपूर्वी काम सुरू करू नका.<\/b> आधी केलेल्या कामाचे अनुदान सहसा मिळत नाही."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "काम करा, पुरावे ठेवा", "body": "दिलेल्या मुदतीत काम पूर्ण करा. प्रत्येक टप्प्याची <b>बिले आणि फोटो<\/b> (सांगितल्यास जिओ-टॅग) ठेवा आणि महाडीबीटीवर अपलोड करा.", "note": null}, {"phase": null, "kind": "gov", "who": "कृषी कार्यालय", "title": "तपासणी", "body": "<b>कृषी अधिकारी<\/b> पूर्ण झालेल्या कामाची तपासणी व मोजमाप करतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "तपासणीला उशीर? अर्ज क्रमांकासह पंचायत समिती कृषी कार्यालयाकडे लेखी विचारणा करा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अनुदान बँक खात्यात", "body": "अनुदान <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते. नवीन विहिरीसाठी <b>टप्प्याटप्प्याने<\/b> मिळू शकते.", "note": null}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "महाडीबीटी अर्ज क्रमांकासह आधी <b>कृषी अधिकारी, पंचायत समिती<\/b>, नंतर <b>कृषी विकास अधिकारी, जिल्हा परिषद<\/b> यांना लिहा आणि <b>पोच<\/b> घ्या. <b>महाडीबीटीवर<\/b> तक्रारही नोंदवता येते.", "help": "<b>अर्ज:<\/b> mahadbt.maharashtra.gov.in → शेतकरी लॉगिन · रक्कम 1 ऑक्टोबर 2024 च्या शासन निर्णयानुसार; चालू सूचना तपासा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "magel-tyala-shettale", "title": "Magel Tyala Shettale", "local_name": "मागेल त्याला शेततळे", "audience": "All farmers with 0.60 ha+ (farm pond)", "state": "mh", "local": "mr", "cat": "farm", "links": [{"label": "MahaDBT: apply, track, grievance", "url": "https://mahadbt.maharashtra.gov.in", "gov": true}, {"label": "Agriculture Department, Maharashtra", "url": "https://krishi.maharashtra.gov.in", "gov": false}], "mermaid": "flowchart TD\n    A([Farmer wants a farm pond]) --> E{1. Eligible?<br/>0.60 ha or more in own name,<br/>no earlier farm-pond grant}\n    E -- Land not in name --> F0[Blocked: get ferfar done first]\n    E -- Earlier grant taken --> X([Not eligible])\n    E -- Yes --> S[2. Choose pond size<br/>about 15x15 m to 34x34 m, 3 m deep<br/>grant about Rs 14,000 to Rs 75,000]\n    S --> D[3. Documents<br/>7/12, 8A, Aadhaar, seeded bank,<br/>no-earlier-grant declaration]\n    D --> AP[4. Apply on MahaDBT farmer login<br/>Mukhyamantri Shashwat Krushi Sinchan Yojana<br/>first come, first served]\n    AP --> SEL{Selected?}\n    SEL -- No --> RE[Reapply next window]\n    SEL -- Yes --> PA[5. Pre-approval + site marking<br/>by Krushi Sahayak]\n    PA --> DG[6. Dig to approved size<br/>geo-tagged photos before / during / after]\n    DG -- Dug before approval --> F1[Not payable]\n    DG -- Smaller than approved --> F2[Grant reduced to actual size]\n    DG --> M[7. Measurement + photo check]\n    M --> P([8. Grant by DBT])\n    P --> LN[Optional: plastic lining via<br/>Krushi Swavalamban / Birsa Munda / horticulture scheme]\n    M -. delay .-> T[Escalate: Taluka Agriculture Officer,<br/>MahaDBT grievance]\n\n    S1[[Sathi: Eligibility + land readiness<br/>7/12 Health Report]]:::sathi -.-> E\n    S2[[Sathi GIS: best low-lying spot on the parcel<br/>from slope / flow accumulation]]:::sathi -.-> S\n    S3[[Sathi: Window alert, apply on day one]]:::sathi -.-> AP\n    S4[[Sathi: Photo check - pond inside parcel,<br/>size from image vs approved size]]:::sathi -.-> DG\n    S5[[Sathi: Lining scheme router]]:::sathi -.-> LN\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "MS Dhulap: farm pond subsidy under MahaDBT", "url": "https://www.msdhulap.com/shettale-subsidy-scheme-under-mahadbt/"}, {"label": "Krushi Davandi: farm pond schemes 2026", "url": "https://krushidavandi.in/shet-tale-anudan-yojana-maharashtra-mahiti/"}, {"label": "MH Shasan: Magel Tyala Shettale 2026", "url": "https://mhshasan.com/magel-tyala-shettale/"}, {"label": "Yojana Parichay: Magel Tyala Shettale 2025", "url": "https://yojanaparichay.com/magel-tyala-shettale-yojana/"}, {"label": "Maha Portal Yojna: Magel Tyala Shettale", "url": "https://mahaportalyojna.in/magel-tyala-shettale-yojana/"}, {"label": "Kisan Suvidha: MahaDBT farmer schemes 2025", "url": "https://kisansuvidha.in/mahadbt-farmer-scheme-2025/"}, {"label": "Sarkari Yojnaye: farm pond scheme", "url": "https://sarkariyojnaye.com/magel-tyala-shettale-farm-pond-subsidy-scheme-online-application/"}], "verified": "2026-10-27", "en": {"h1": "Magel Tyala Shettale: Grant to dig a farm pond", "benefit": "Up to ₹75,000 (by pond size) to store rainwater for protective irrigation", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer in Maharashtra with at least <b>0.60 hectare<\/b> of land <b>in your own name<\/b><\/li><li>You have <b>not received a farm-pond grant before<\/b> under any scheme (including group farm ponds)<\/li><li>Open to farmers of all categories<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "It now runs as the farm-pond part of the <b>Mukhyamantri Shashwat Krushi Sinchan Yojana<\/b> on MahaDBT."}}, {"phase": null, "kind": "you", "who": "You", "title": "Choose the pond size", "body": "Pond sizes range from about <b>15 × 15 m<\/b> to <b>34 × 34 m<\/b>, around <b>3 m deep<\/b>, with or without inlet / outlet. The grant depends on the size: from about <b>₹14,000<\/b> up to <b>₹75,000<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Choose a <b>low-lying spot<\/b> where rainwater collects. The Krushi Sahayak checks if the site is suitable."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>7/12 and 8A<\/b> extracts in your name<\/li><li>Aadhaar, <b>Aadhaar-linked bank account<\/b><\/li><li>Self-declaration that you have not taken a farm-pond grant before<\/li><li>Caste certificate, if applying in a reserved category<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Land still in a parent's name? Get the <b>ferfar<\/b> done first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on MahaDBT", "body": "Log in on <b>mahadbt.maharashtra.gov.in<\/b> as a <b>Farmer<\/b>, choose <b>farm pond (शेततळे)<\/b> under the agriculture schemes, select the size, upload documents and submit. Note your <b>application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "From 2025-26 selection is <b>first come, first served<\/b>. Apply as soon as the window opens. Applying is <b>free<\/b>."}}, {"phase": "After you apply", "kind": "gov", "who": "Agriculture office", "title": "Pre-approval and site marking", "body": "If selected, you get <b>pre-approval (पूर्वसंमती)<\/b>. The <b>Krushi Sahayak<\/b> checks the site and marks the pond layout.", "note": {"kind": "stuck", "label": "Stuck?", "html": "<b>Do not start digging before pre-approval and marking.<\/b> Ponds dug earlier are usually not paid."}}, {"phase": null, "kind": "you", "who": "You", "title": "Dig the pond, keep proof", "body": "Dig to the <b>approved size<\/b> within the time given. Take <b>geo-tagged photos<\/b> before, during and after digging and upload them on MahaDBT.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pond smaller than approved? The grant is cut to the size actually dug. Measure before you finish."}}, {"phase": null, "kind": "gov", "who": "Agriculture office", "title": "Measurement and inspection", "body": "The agriculture office <b>measures the pond<\/b> and checks the photos.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Grant paid to your bank", "body": "The grant is paid by <b>DBT<\/b> into your Aadhaar-linked bank account.", "note": {"kind": "tip", "label": "Tip:", "html": "Want <b>plastic lining<\/b> for the pond? It is a separate grant. SC / ST farmers: see <b>Krushi Swavalamban<\/b> / <b>Birsa Munda<\/b>; others ask about the horticulture / lining scheme."}}], "rights_t": "Stuck for long? Escalate.", "rights": "Write to the <b>Taluka Agriculture Officer<\/b> with your MahaDBT application ID and take an <b>acknowledgement (पोच)<\/b>. You can also raise a grievance on <b>MahaDBT<\/b>.", "help": "<b>Apply:<\/b> mahadbt.maharashtra.gov.in → Farmer login → farm pond · Amounts by pond size; check the current notice<br/><b>Applying is free<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "मागेल त्याला शेततळे: शेततळे खोदण्यासाठी अनुदान", "benefit": "संरक्षित सिंचनासाठी पावसाचे पाणी साठवण्याकरिता ₹75,000 पर्यंत (आकारानुसार) अनुदान", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>स्वतःच्या नावावर<\/b> किमान <b>0.60 हेक्टर<\/b> जमीन असलेला महाराष्ट्रातील शेतकरी<\/li><li>यापूर्वी कोणत्याही योजनेतून (सामूहिक शेततळ्यासह) <b>शेततळे अनुदान घेतलेले नसावे<\/b><\/li><li>सर्व प्रवर्गांतील शेतकऱ्यांसाठी खुली<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "ही योजना आता महाडीबीटीवरील <b>मुख्यमंत्री शाश्वत कृषी सिंचन योजनेचा<\/b> शेततळे घटक म्हणून चालते."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "शेततळ्याचा आकार निवडा", "body": "शेततळ्याचे आकार सुमारे <b>15 × 15 मीटर<\/b> ते <b>34 × 34 मीटर<\/b>, सुमारे <b>3 मीटर खोल<\/b>, इनलेट / आउटलेटसह किंवा शिवाय. अनुदान आकारानुसार: सुमारे <b>₹14,000<\/b> ते <b>₹75,000<\/b>.", "note": {"kind": "tip", "label": "सूचना:", "html": "पावसाचे पाणी जमा होईल अशी <b>सखल जागा<\/b> निवडा. जागा योग्य आहे का हे कृषी सहायक तपासतात."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमच्या नावाचे <b>7/12 व 8-अ<\/b> उतारे<\/li><li>आधार, <b>आधार-लिंक बँक खाते<\/b><\/li><li>यापूर्वी शेततळे अनुदान घेतले नसल्याचे स्वयंघोषणापत्र<\/li><li>राखीव प्रवर्गातून अर्ज करत असल्यास जातीचा दाखला<\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "जमीन अजून पालकांच्या नावावर? आधी <b>फेरफार<\/b> करून घ्या. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महाडीबीटीवर अर्ज करा", "body": "<b>mahadbt.maharashtra.gov.in<\/b> वर <b>शेतकरी<\/b> म्हणून लॉगिन करा, कृषी योजनांमध्ये <b>शेततळे<\/b> निवडा, आकार निवडा, कागदपत्रे अपलोड करून अर्ज सादर करा. तुमचा <b>अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "2025-26 पासून निवड <b>प्रथम येणाऱ्यास प्रथम प्राधान्य<\/b> पद्धतीने. खिडकी उघडताच अर्ज करा. अर्ज <b>मोफत<\/b> आहे."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "कृषी कार्यालय", "title": "पूर्वसंमती व आखणी", "body": "निवड झाल्यास <b>पूर्वसंमती<\/b> मिळते. <b>कृषी सहायक<\/b> जागा तपासून शेततळ्याची आखणी करून देतात.", "note": {"kind": "stuck", "label": "अडचण?", "html": "<b>पूर्वसंमती व आखणीपूर्वी खोदकाम सुरू करू नका.<\/b> आधी खोदलेल्या शेततळ्याचे अनुदान सहसा मिळत नाही."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "शेततळे खोदा, पुरावे ठेवा", "body": "दिलेल्या मुदतीत <b>मंजूर आकाराचे<\/b> शेततळे खोदा. खोदकामापूर्वी, दरम्यान आणि नंतर <b>जिओ-टॅग फोटो<\/b> काढून महाडीबीटीवर अपलोड करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "शेततळे मंजूर आकारापेक्षा लहान? प्रत्यक्ष खोदलेल्या आकारानुसार अनुदान कमी होते. काम संपवण्यापूर्वी मोजमाप करा."}}, {"phase": null, "kind": "gov", "who": "कृषी कार्यालय", "title": "मोजमाप व तपासणी", "body": "कृषी कार्यालय <b>शेततळ्याचे मोजमाप<\/b> करून फोटो तपासते.", "note": null}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "अनुदान बँक खात्यात", "body": "अनुदान <b>DBT<\/b> द्वारे तुमच्या आधार-लिंक बँक खात्यात जमा होते.", "note": {"kind": "tip", "label": "सूचना:", "html": "शेततळ्यासाठी <b>प्लास्टिक अस्तरीकरण<\/b> हवे? ते स्वतंत्र अनुदान आहे. अनुसूचित जाती / जमाती शेतकऱ्यांनी <b>कृषी स्वावलंबन<\/b> / <b>बिरसा मुंडा<\/b> पाहावे; इतरांनी फलोत्पादन / अस्तरीकरण योजनेबद्दल विचारावे."}}], "rights_t": "खूप दिवस अडकले? पाठपुरावा करा.", "rights": "महाडीबीटी अर्ज क्रमांकासह <b>तालुका कृषी अधिकाऱ्यांना<\/b> लिहा आणि <b>पोच<\/b> घ्या. <b>महाडीबीटीवर<\/b> तक्रारही नोंदवता येते.", "help": "<b>अर्ज:<\/b> mahadbt.maharashtra.gov.in → शेतकरी लॉगिन → शेततळे · रक्कम आकारानुसार; चालू सूचना तपासा<br/><b>अर्ज मोफत आहे<\/b> · <b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "saur-krushi-pump", "title": "Magel Tyala Saur Krushi Pump", "local_name": "मागेल त्याला सौर कृषी पंप", "audience": "Farmers with a water source, no farm power connection (solar pump)", "state": "mh", "local": "mr", "cat": "farm", "links": [{"label": "MSEDCL solar pump portal: apply, pay, complain", "url": "https://www.mahadiscom.in/solar_MTSKPY/", "gov": true}, {"label": "MSEDCL: FAQ", "url": "https://www.mahadiscom.in/solar_MTSKPY/faq.php", "gov": true}], "mermaid": "flowchart TD\n    A([Farmer wants a solar pump]) --> E{1. Eligible?<br/>land in own name, reliable water source,<br/>no farm power connection,<br/>no earlier solar pump subsidy}\n    E -- No water source --> WS[Get a source first:<br/>Magel Tyala Shettale / well schemes]\n    E -- Already has pump subsidy / connection --> X([Not eligible])\n    E -- Yes --> SZ{2. Pump size by land}\n    SZ -- up to 2.5 acres --> P3[3 HP]\n    SZ -- 2.51 to 5 acres --> P5[5 HP]\n    SZ -- above 5 acres --> P7[7.5 HP]\n    P3 --> D\n    P5 --> D\n    P7 --> D\n    D[3. Documents<br/>7/12 with water source, Aadhaar, bank,<br/>caste cert for SC/ST, co-owner consent]\n    D --> AP[4. Apply on MSEDCL portal<br/>beneficiary ID]\n    AP --> SC{5. MSEDCL scrutiny}\n    SC -- Land / source mismatch --> F1[Rejected: correct 7/12, reapply]\n    SC -- OK --> DM[Pay share: about 10 percent,<br/>5 percent for SC/ST]\n    DM --> PAY[6. Pay online on portal only<br/>choose / confirm empanelled supplier]\n    PAY -- Cash to agent --> F2[Fraud risk: not counted]\n    PAY --> INS[7. Supplier survey + installation<br/>about 60 days from work order<br/>joint inspection]\n    INS -- Delay --> F3[Installation pending]\n    INS --> RUN([8. Daytime irrigation, no power bill<br/>5-year warranty with repair])\n    F3 -.-> T[Complaint on MSEDCL portal /<br/>sub-division office]\n\n    S1[[Sathi: Eligibility + water-source check<br/>7/12 Health Report]]:::sathi -.-> E\n    S2[[Sathi: Pump-size calculator<br/>from land area]]:::sathi -.-> SZ\n    S3[[Sathi: Fake-portal and agent warning]]:::sathi -.-> PAY\n    S4[[Sathi: Installation tracker + complaint draft]]:::sathi -.-> T\n    S5[[Sathi: Warranty tracker, 5-year expiry alert]]:::sathi -.-> RUN\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "MSEDCL: Magel Tyala Saur Krushi Pump FAQ", "url": "https://www.mahadiscom.in/solar_MTSKPY/faq.php"}, {"label": "MSEDCL: off-grid solar pump guidelines", "url": "https://mahadiscom.in/solar_MTSKPY/media/Guidelines%20and%20Clarifications%20for%20offgrid%20Solar%20Pump%20Installations.pdf"}, {"label": "Vikaspedia: Magel Tyala Saur Krushi Pump Yojana", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/magel-tyala-saur-krushi-pump-yojana?lgn=en"}, {"label": "PV Magazine: KLK Ventures tender", "url": "https://www.pv-magazine-india.com/press-releases/klk-ventures-secures-tender-for-solar-water-pumping-systems-under-magel-tyala-saur-krushi-pump-scheme-in-maharashtra"}, {"label": "Renewable Watch: Shakti and Oswal orders", "url": "https://renewablewatch.in/2026/07/07/shakti-pumps-and-oswal-pumps-secure-solar-pump-orders-from-msedcl/"}, {"label": "The Machine Maker: Shakti Pumps order", "url": "https://themachinemaker.com/news/shakti-pumps-secures-order-for-6580-off-grid-solar-water-pumping-systems-in-maharashtra/"}, {"label": "Powerline: Jupiter International LoE", "url": "https://powerline.net.in/2026/01/20/jupiter-international-secures-loe-for-rs-650-million-solar-pump-project-from-msedcl/"}, {"label": "sarkariyojana.com: Magel Tyala Solar Pump", "url": "https://sarkariyojana.com/magel-tyala-solar-pump-yojana/"}, {"label": "govtschemes.in: Magel Tyala Saur Krushi Pump", "url": "https://www.govtschemes.in/maharashtra-magel-tyala-saur-krushi-pump-yojana"}], "verified": "2026-10-27", "en": {"h1": "Magel Tyala Saur Krushi Pump: Solar pump for daytime irrigation", "benefit": "Off-grid solar pump for just 10% of the cost (5% for SC / ST), with a 5-year warranty", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "<ul><li>Farmer in Maharashtra with land <b>in your name<\/b><\/li><li>A <b>reliable water source<\/b>: well, borewell, farm pond, or perennial river / stream (own or shared)<\/li><li><b>No existing farm electricity connection<\/b><\/li><li>Have <b>not<\/b> received a solar pump under Atal / Mukhyamantri Saur Krushi Pump or KUSUM before<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "No water source yet? See the <b>Magel Tyala Shettale<\/b> (farm pond) or well schemes first."}}, {"phase": null, "kind": "you", "who": "You", "title": "Know your pump size", "body": "<ul><li>Land up to <b>2.5 acres<\/b> → <b>3 HP<\/b><\/li><li><b>2.51 to 5 acres<\/b> → <b>5 HP<\/b><\/li><li>Above <b>5 acres<\/b> → <b>7.5 HP<\/b><\/li><\/ul>You may ask for a <b>smaller<\/b> pump than your tier.", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>7/12<\/b> showing your land and the <b>water source<\/b><\/li><li>Aadhaar, bank details<\/li><li><b>Caste certificate<\/b>, if SC / ST (for the 5% share)<\/li><li><b>Consent of co-owners<\/b>, if the land or water source is joint<\/li><\/ul>", "note": {"kind": "stuck", "label": "Stuck?", "html": "Water source not recorded on 7/12, or land not in your name? Fix it at the Talathi office first. See the <b>Ferfar<\/b> guide."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply on the MSEDCL portal", "body": "Apply online on <b>Mahavitaran (MSEDCL)<\/b>'s Magel Tyala Saur Krushi Pump portal (<b>portal.mahadiscom.in/solar_MTSKPY<\/b>). Note your <b>beneficiary / application ID<\/b>.", "note": {"kind": "tip", "label": "Tip:", "html": "Applying is <b>free<\/b>. Beware of fake websites and agents asking for money to \"register\" you."}}, {"phase": "After you apply", "kind": "gov", "who": "MSEDCL / Supplier", "title": "Scrutiny and payment demand", "body": "MSEDCL checks your application and documents, then asks you to pay your <b>share<\/b>: about <b>10%<\/b> of the pump cost (<b>5%<\/b> for SC / ST).", "note": {"kind": "stuck", "label": "Stuck?", "html": "Application rejected? Usually the water source or land record does not match. Correct the 7/12 and reapply."}}, {"phase": null, "kind": "you", "who": "You", "title": "Pay your share", "body": "Pay <b>online through the portal only<\/b> and keep the receipt. Choose or confirm the <b>empanelled supplier<\/b> as shown on the portal.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Never pay a supplier or agent in cash. Only payments on the official portal count."}}, {"phase": null, "kind": "gov", "who": "MSEDCL / Supplier", "title": "Survey and installation", "body": "The supplier surveys your site and installs the <b>solar panels and pump<\/b>, usually within about two months of the work order. A joint inspection confirms it works.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Installation delayed? Raise a complaint on the MSEDCL portal with your beneficiary ID."}}, {"phase": null, "kind": "done", "who": "Done", "title": "Free daytime irrigation", "body": "Irrigate in the <b>daytime<\/b> with <b>no electricity bill<\/b>. The supplier gives a <b>5-year warranty<\/b> with repair and maintenance.", "note": {"kind": "tip", "label": "Tip:", "html": "Pump not working? Contact the <b>supplier<\/b> first (under warranty), then MSEDCL. Keep panels clean and the site secure."}}], "rights_t": "Stuck for long? Complain.", "rights": "Use the <b>complaint option on the MSEDCL solar pump portal<\/b> with your beneficiary ID, or write to your <b>MSEDCL sub-division office<\/b> and take an <b>acknowledgement (पोच)<\/b>.", "help": "<b>Apply:<\/b> portal.mahadiscom.in/solar_MTSKPY · Share and pump sizes as per MSEDCL FAQ; check the current notice<br/><b>Pay only on the official portal<\/b> · <b>Use only official websites<\/b>"}, "loc": {"h1": "मागेल त्याला सौर कृषी पंप: दिवसा सिंचनासाठी सौर पंप", "benefit": "फक्त 10% (अनुसूचित जाती / जमातीसाठी 5%) खर्चात ऑफ-ग्रिड सौर पंप, 5 वर्षांच्या हमीसह", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "पात्रता तपासा", "body": "<ul><li><b>स्वतःच्या नावावर<\/b> जमीन असलेला महाराष्ट्रातील शेतकरी<\/li><li><b>खात्रीशीर पाण्याचा स्रोत<\/b>: विहीर, बोअरवेल, शेततळे, किंवा बारमाही नदी / ओढा (स्वतःचा किंवा सामायिक)<\/li><li><b>सध्या शेतीसाठी वीज जोडणी नसावी<\/b><\/li><li>यापूर्वी अटल / मुख्यमंत्री सौर कृषी पंप किंवा कुसुम योजनेतून सौर पंप <b>घेतलेला नसावा<\/b><\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "अजून पाण्याचा स्रोत नाही? आधी <b>मागेल त्याला शेततळे<\/b> किंवा विहीर योजना पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "पंपाची क्षमता ओळखा", "body": "<ul><li><b>2.5 एकरपर्यंत<\/b> जमीन → <b>3 HP<\/b><\/li><li><b>2.51 ते 5 एकर<\/b> → <b>5 HP<\/b><\/li><li><b>5 एकरपेक्षा जास्त<\/b> → <b>7.5 HP<\/b><\/li><\/ul>तुमच्या गटापेक्षा <b>कमी<\/b> क्षमतेचा पंप मागता येतो.", "note": null}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li>तुमची जमीन आणि <b>पाण्याचा स्रोत<\/b> दाखवणारा <b>7/12<\/b><\/li><li>आधार, बँक तपशील<\/li><li>अनुसूचित जाती / जमाती असल्यास <b>जातीचा दाखला<\/b> (5% हिश्श्यासाठी)<\/li><li>जमीन किंवा पाण्याचा स्रोत सामायिक असल्यास <b>सहहिस्सेदारांची संमती<\/b><\/li><\/ul>", "note": {"kind": "stuck", "label": "अडचण?", "html": "7/12 वर पाण्याच्या स्रोताची नोंद नाही, किंवा जमीन तुमच्या नावावर नाही? आधी तलाठी कार्यालयात दुरुस्त करा. <b>फेरफार<\/b> मार्गदर्शक पाहा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "महावितरण पोर्टलवर अर्ज करा", "body": "<b>महावितरणच्या<\/b> मागेल त्याला सौर कृषी पंप पोर्टलवर (<b>portal.mahadiscom.in/solar_MTSKPY<\/b>) ऑनलाइन अर्ज करा. तुमचा <b>लाभार्थी / अर्ज क्रमांक<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "अर्ज <b>मोफत<\/b> आहे. \"नोंदणी करून देण्यासाठी\" पैसे मागणाऱ्या बनावट वेबसाइट व एजंटपासून सावध राहा."}}, {"phase": "अर्ज केल्यानंतर", "kind": "gov", "who": "महावितरण / पुरवठादार", "title": "छाननी व हिस्सा भरणा सूचना", "body": "महावितरण अर्ज व कागदपत्रे तपासून तुमचा <b>हिस्सा<\/b> भरण्यास सांगते: पंपाच्या किमतीच्या सुमारे <b>10%<\/b> (अनुसूचित जाती / जमातीसाठी <b>5%<\/b>).", "note": {"kind": "stuck", "label": "अडचण?", "html": "अर्ज नामंजूर? बहुतेक वेळा पाण्याचा स्रोत किंवा जमिनीची नोंद जुळत नाही. 7/12 दुरुस्त करून पुन्हा अर्ज करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "तुमचा हिस्सा भरा", "body": "<b>फक्त पोर्टलवरूनच ऑनलाइन<\/b> भरा आणि पावती जपून ठेवा. पोर्टलवर दाखवलेला <b>अधिकृत पुरवठादार<\/b> निवडा किंवा निश्चित करा.", "note": {"kind": "stuck", "label": "अडचण?", "html": "पुरवठादार किंवा एजंटला कधीही रोख पैसे देऊ नका. फक्त अधिकृत पोर्टलवरील भरणाच ग्राह्य."}}, {"phase": null, "kind": "gov", "who": "महावितरण / पुरवठादार", "title": "सर्वेक्षण व बसवणी", "body": "पुरवठादार जागेचे सर्वेक्षण करून <b>सौर पॅनेल व पंप<\/b> बसवतो, साधारण कार्यादेशानंतर दोन महिन्यांत. संयुक्त तपासणीत पंप चालतो याची खात्री होते.", "note": {"kind": "stuck", "label": "अडचण?", "html": "बसवणीला उशीर? लाभार्थी क्रमांकासह महावितरण पोर्टलवर तक्रार नोंदवा."}}, {"phase": null, "kind": "done", "who": "पूर्ण", "title": "दिवसा मोफत सिंचन", "body": "<b>दिवसा<\/b> सिंचन करा, <b>वीज बिल नाही<\/b>. पुरवठादार दुरुस्ती व देखभालीसह <b>5 वर्षांची हमी<\/b> देतो.", "note": {"kind": "tip", "label": "सूचना:", "html": "पंप बंद? आधी <b>पुरवठादाराशी<\/b> (हमीअंतर्गत), नंतर महावितरणशी संपर्क करा. पॅनेल स्वच्छ ठेवा आणि जागा सुरक्षित ठेवा."}}], "rights_t": "खूप दिवस अडकले? तक्रार करा.", "rights": "लाभार्थी क्रमांकासह <b>महावितरण सौर पंप पोर्टलवरील तक्रार<\/b> सुविधा वापरा, किंवा <b>महावितरण उपविभागीय कार्यालयाला<\/b> लिहा आणि <b>पोच<\/b> घ्या.", "help": "<b>अर्ज:<\/b> portal.mahadiscom.in/solar_MTSKPY · हिस्सा व पंप क्षमता महावितरण FAQ नुसार; चालू सूचना तपासा<br/><b>फक्त अधिकृत पोर्टलवरच पैसे भरा<\/b> · <b>फक्त अधिकृत वेबसाइट वापरा<\/b>"}}, {"slug": "income-certificate", "title": "Income certificate", "local_name": "उत्पन्नाचा दाखला", "audience": "Everyone applying to income-based schemes", "state": "mh", "local": "mr", "cat": "docs", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "India.gov.in: Maharashtra income certificate service", "url": "https://services.india.gov.in/service/detail/maharashtra-income-certificate-with-affidavit", "gov": true}], "mermaid": "flowchart TD\n    A([Citizen needs income certificate]) --> B[1. Identify need<br/>Which year, whose name, which scheme]\n    B --> C[2. Gather documents<br/>ID, address, income proof, self-declaration, photo]\n    C --> D[3. Apply on Aaple Sarkar<br/>Portal or Seva Kendra, pay fee<br/>Get Application ID + RTS time limit]\n    D --> E[4. Scrutiny at Tahsil office]\n    E -- Document missing / wrong --> F1[Sent back to applicant<br/>with remark]\n    F1 -- Upload + resubmit --> E\n    E -- Farm / business income --> G[5. Talathi / Circle field report]\n    G -- Pending long --> F2[Blocked at Talathi]\n    G --> H\n    E -- OK --> H[6. Tahsildar / Naib Tahsildar<br/>approves + digital signature]\n    H -- Rejected --> F3[Rejected with reason]\n    H --> I([7. Download digitally signed certificate])\n    I --> L[Next financial year:<br/>renew from step 1]\n    F2 --> T{RTS time limit crossed?}\n    E -. any delay .-> T\n    T -- Yes --> J[First Appeal on Aaple Sarkar<br/>MH Right to Public Services Act 2015]\n    J --> K[Second Appeal / State RTS Commission]\n\n    S1[[Sathi: Which certificate + document readiness check]]:::sathi -.-> B\n    S2[[Sathi: Decode sent-back remark in Marathi<br/>what to upload, no visit needed]]:::sathi -.-> F1\n    S3[[Sathi: Rights clock countdown<br/>auto-draft First Appeal]]:::sathi -.-> T\n    S4[[Sathi: Expiry alert before scheme deadlines]]:::sathi -.-> L\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2,F3 blocked", "sources": [{"label": "Chanda district: notified services list", "url": "https://chanda.nic.in/?p=30380"}, {"label": "India.gov.in: Maharashtra income certificate with affidavit", "url": "https://services.india.gov.in/service/detail/maharashtra-income-certificate-with-affidavit"}, {"label": "Wikiprocedure: Maharashtra income certificate", "url": "https://wikiprocedure.com/index.php/Maharashtra_-_Apply_for_Income_Certificate"}], "verified": "2026-10-27", "en": {"h1": "Income Certificate: How to get it on Aaple Sarkar", "benefit": "Needed for scholarships, fee concession, EWS and many schemes", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check which certificate you need", "body": "Ask the scheme or office: <b>which year's income<\/b> (1 year or 3 years) and <b>in whose name<\/b> (yours or your parent's). Most schemes want a certificate from the <b>current financial year<\/b>.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Have last year's certificate? Most schemes reject it. Apply fresh, early."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li><b>Identity:<\/b> Aadhaar / PAN / Voter ID<\/li><li><b>Address:<\/b> Ration card / Electricity bill<\/li><li><b>Income:<\/b> Job → Form 16 or salary slip · Farmer → 7/12 and 8A · Others → self-declaration<\/li><li>Passport-size photo<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Ask at the Seva Kendra whether a signed <b>self-declaration<\/b> is accepted, so you can avoid paying for a stamp-paper affidavit."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li>Website <b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Income Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b> / Maha e-Seva Kendra<\/li><\/ul>Pay the small fee. Note down your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "At a Seva Kendra pay only the fixed fee and take a receipt. Never pay an agent extra."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil office checks your form and documents.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Read the remark, upload the missing paper and resubmit online. <b>No visit needed.<\/b>"}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Income is verified (if needed)", "body": "For farm or business income, the Talathi may be asked for a report.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Pending at Talathi for long? Visit the Talathi office with your Application ID."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "Tahsildar approves", "body": "Tahsildar / Naib Tahsildar approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and download it. It is <b>digitally signed<\/b>, so it is valid <b>without any stamp<\/b>.", "note": null}], "rights_t": "Late? It's your right.", "rights": "If the time limit has passed, you can file a <b>First Appeal<\/b> on Aaple Sarkar with your Application ID, under the <b>Maharashtra Right to Public Services Act, 2015<\/b>.", "help": "<b>Check status anytime:<\/b> Aaple Sarkar → Track your application (Application ID)<br/><b>Renew every year<\/b> · <b>Use only .gov.in websites<\/b>"}, "loc": {"h1": "उत्पन्नाचा दाखला: आपले सरकार वरून कसा मिळवायचा", "benefit": "शिष्यवृत्ती, फी सवलत, EWS आणि अनेक योजनांसाठी आवश्यक", "steps": [{"phase": "अर्ज करण्यापूर्वी", "kind": "you", "who": "तुम्ही", "title": "कोणता दाखला हवा ते तपासा", "body": "ज्या योजनेसाठी किंवा कार्यालयासाठी दाखला हवा आहे तिथे विचारा: <b>किती वर्षांचे उत्पन्न<\/b> (1 वर्ष की 3 वर्षे) आणि <b>कोणाच्या नावाने<\/b> (तुमच्या की पालकांच्या). बहुतेक योजनांना <b>चालू आर्थिक वर्षाचा<\/b> दाखला लागतो.", "note": {"kind": "stuck", "label": "अडचण?", "html": "मागील वर्षाचा दाखला आहे? बहुतेक योजना तो स्वीकारत नाहीत. लवकर नवीन अर्ज करा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "कागदपत्रे तयार ठेवा", "body": "<ul><li><b>ओळखीचा पुरावा:<\/b> आधार / पॅन / मतदार ओळखपत्र<\/li><li><b>पत्त्याचा पुरावा:<\/b> रेशन कार्ड / वीज बिल<\/li><li><b>उत्पन्नाचा पुरावा:<\/b> नोकरी → फॉर्म 16 किंवा पगार पत्रक · शेतकरी → 7/12 व 8-अ उतारा · इतर → स्वयंघोषणापत्र<\/li><li>पासपोर्ट आकाराचा फोटो<\/li><\/ul>", "note": {"kind": "tip", "label": "सूचना:", "html": "स्टॅम्प पेपरवरील प्रतिज्ञापत्राचा खर्च टाळण्यासाठी सही केलेले <b>स्वयंघोषणापत्र<\/b> चालते का ते सेवा केंद्रात विचारा."}}, {"phase": null, "kind": "you", "who": "तुम्ही", "title": "अर्ज करा", "body": "यापैकी कोणताही एक मार्ग:<ul><li>वेबसाइट <b>aaplesarkar.mahaonline.gov.in<\/b> → महसूल विभाग → उत्पन्नाचा दाखला<\/li><li>जवळचे <b>आपले सरकार सेवा केंद्र<\/b> / महा ई-सेवा केंद्र<\/li><\/ul>थोडी फी भरा. तुमचा <b>अर्ज क्रमांक<\/b> (Application ID) आणि दाखवलेली <b>कालमर्यादा (दिवस)<\/b> लिहून ठेवा.", "note": {"kind": "tip", "label": "सूचना:", "html": "सेवा केंद्रात फक्त ठरलेली फी भरा आणि पावती घ्या. एजंटला जास्त "<b>स्थिती कधीही तपासा:<\/b> आपले सरकार → Track your application (अर्ज क्रमांक)<br/><b>फक्त .gov.in वेबसाइट वापरा<\/b>"}}, {"slug": "caste-certificate", "title": "Caste certificate", "local_name": "जातीचा दाखला", "audience": "Reserved-category citizens", "state": "mh", "local": "mr", "cat": "docs", "links": [{"label": "Aaple Sarkar: apply and track", "url": "https://aaplesarkar.mahaonline.gov.in", "gov": false}, {"label": "BARTI: caste certificate verification", "url": "https://www.barti.in/department/cast-certificate-verification", "gov": true}, {"label": "Social Justice Dept: Acts, rules, GRs", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/", "gov": true}], "mermaid": "flowchart TD\n    A([Citizen needs caste certificate]) --> B[1. Identify need<br/>Caste cert vs Non-Creamy Layer vs Caste Validity]\n    B --> C[2. Find pre-cut-off proof<br/>self / father / grandfather, paternal side<br/>SC 1950, ST 1950, VJNT 1961, OBC/SBC 1967]\n    C -- No document found --> F0[Blocked: no old proof]\n    F0 -- Search relatives, school + GP registers --> C\n    C --> D[3. Supporting papers<br/>Aadhaar, own LC, family tree, affidavit, photo]\n    D --> E[4. Apply on Aaple Sarkar<br/>Portal / Seva Kendra / school camp<br/>Application ID + RTS time limit]\n    E --> S[5. Scrutiny at Tahsil / SDO office<br/>local inquiry if needed]\n    S -- Proof or family tree unclear --> F1[Sent back with remark]\n    F1 -- Upload clearer proof --> S\n    S --> H[6. SDO approves + digital signature]\n    H -- Rejected --> F2[Rejected with reason]\n    F2 --> AP[Appeal]\n    H --> I([7. Download certificate<br/>lifetime validity])\n    I --> V[Next: Caste Validity<br/>District Caste Scrutiny Committee]\n    I --> N[Next: Non-Creamy Layer<br/>for OBC / VJNT / SBC]\n    S -. time limit crossed .-> T[First Appeal on Aaple Sarkar<br/>MH Right to Public Services Act 2015]\n\n    S1[[Sathi: Which certificate do I need?]]:::sathi -.-> B\n    S2[[Sathi: Old-proof finder<br/>cut-off date by category, where to search]]:::sathi -.-> C\n    S3[[Sathi: Family tree builder<br/>links applicant to old proof]]:::sathi -.-> D\n    S4[[Sathi: Rights clock + draft First Appeal]]:::sathi -.-> T\n    S5[[Sathi: Validity + NCL reminders]]:::sathi -.-> V\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F0,F1,F2 blocked", "sources": [{"label": "Indian Kanoon: Caste Certificate Act, 2000", "url": "https://indiankanoon.org/doc/95388956/"}, {"label": "SJSA Maharashtra: Acts & Rules", "url": "https://sjsa.maharashtra.gov.in/en/document-category/acts-rules/"}, {"label": "BARTI: Caste Certificate Verification", "url": "https://www.barti.in/department/cast-certificate-verification"}, {"label": "mahadocguide: caste certificate documents", "url": "https://mahadocguide.in/documents-required-caste-certificate-maharashtra/"}], "verified": "2026-10-27", "en": {"h1": "Caste Certificate: How to get it on Aaple Sarkar", "benefit": "Needed for reservation in education, jobs, scholarships and elections", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Know which certificate you need", "body": "<ul><li><b>Caste certificate<\/b>: issued by the SDO. This guide.<\/li><li><b>Non-Creamy Layer<\/b>: also needed for OBC / VJNT / SBC benefits, renewed regularly.<\/li><li><b>Caste validity<\/b>: needed for professional courses, many jobs and elections. Apply after you get the caste certificate.<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Find an old proof of caste", "body": "This is the <b>most important step<\/b>. You need a document of <b>you, your father or grandfather (father's side)<\/b> showing the caste and living in Maharashtra <b>before<\/b>:<ul><li>SC: 10 Aug 1950 · ST: 6 Sep 1950<\/li><li>VJ / NT: 21 Nov 1961 · OBC / SBC: 13 Oct 1967<\/li><\/ul>Examples: father's or grandfather's <b>school leaving certificate<\/b>, birth / death register extract, old land record.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No old document at home? Ask relatives: an uncle's (father's brother's) school record also works. Check the old village school register and Gram Panchayat birth register."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep other papers ready", "body": "<ul><li>Aadhaar and address proof<\/li><li>Your school leaving certificate showing caste<\/li><li><b>Family tree (वंशावळ)<\/b> showing how you are related to the person in the old document<\/li><li>Self-declaration / affidavit, photo<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Documents from your mother's side usually do not count. Caste follows the father's side."}}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Caste Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b>, or a special camp at your school / college<\/li><\/ul>Note your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "Pay only the fixed fee and take a receipt. Never pay an agent to \"arrange\" old documents."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil / SDO office checks your old proof and family tree. A local inquiry may be done.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Usually the old proof or family tree is unclear. Upload a clearer copy or an extra document and resubmit."}}, {"phase": null, "kind": "gov", "who": "Government", "title": "SDO approves", "body": "The <b>Sub-Divisional Officer (SDO)<\/b>, or the competent officer in your taluka, approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and >which income counts]]:::sathi -.-> B\n    S2[[Sathi: Dependency check<br/>caste cert + income certs ready]]:::sathi -.-> CC\n    S3[[Sathi: State vs central format advisor]]:::sathi -.-> D\n    S4[[Sathi: Rights clock + draft First Appeal]]:::sathi -.-> T\n    S5[[Sathi: Expiry alert before deadlines]]:::sathi -.-> R\n\n    classDef sathi fill:#FFF3CD,stroke:#E0A800,color:#000\n    classDef blocked fill:#F8D7DA,stroke:#C82333,color:#000\n    class F1,F2 blocked", "sources": [{"label": "mahadocguide: NCL Maharashtra", "url": "https://mahadocguide.in/non-creamy-layer-certificate-maharashtra/"}, {"label": "navimumbai.com: NCL", "url": "https://navimumbai.com/non-creamy-layer-certificate-maharashtra/"}, {"label": "LegalRaasta: NCL Maharashtra", "url": "https://www.legalraasta.com/blog/maharashtra-non-creamy-layer-certificate/"}, {"label": "IndiaFilings: NCL Maharashtra", "url": "https://www.indiafilings.com/learn/maharashtra-non-creamy-layer-certificate"}], "verified": "2026-10-27", "en": {"h1": "Non-Creamy Layer Certificate: How to get it on Aaple Sarkar", "benefit": "Needed by OBC, VJ / NT and SBC students and job seekers to use reservation", "steps": [{"phase": "Before you apply", "kind": "you", "who": "You", "title": "Check if you can get it", "body": "You can apply if:<ul><li>You belong to <b>OBC, VJ / NT or SBC<\/b><\/li><li>Your <b>family income is below ₹8 lakh a year<\/b><\/li><li>Your parents do not hold high posts (e.g. Class-I officers)<\/li><\/ul>", "note": {"kind": "tip", "label": "Tip:", "html": "Check which income counts. Rules may exclude salary or farm income. Ask before you assume you are not eligible."}}, {"phase": null, "kind": "you", "who": "You", "title": "Get your caste certificate first", "body": "The NCL certificate is issued <b>only if you already have a caste certificate<\/b>. If you don't have one, get it first.", "note": {"kind": "stuck", "label": "Stuck?", "html": "No caste certificate yet? See the <b>Caste Certificate guide<\/b>. Finding old proof takes time, so start early."}}, {"phase": null, "kind": "you", "who": "You", "title": "Keep these papers ready", "body": "<ul><li>Your <b>caste certificate<\/b><\/li><li>Parents' <b>income proof for the last 3 years<\/b>: income certificate / ITR / Form 16<\/li><li>Parents' job or occupation details<\/li><li>Aadhaar, ration card / address proof<\/li><li>Self-declaration, photo<\/li><\/ul>", "note": null}, {"phase": null, "kind": "you", "who": "You", "title": "Apply", "body": "Choose any one:<ul><li><b>aaplesarkar.mahaonline.gov.in<\/b> → Revenue Department → Non-Creamy Layer Certificate<\/li><li>Nearest <b>Aaple Sarkar Seva Kendra<\/b>, or a camp at your college<\/li><\/ul>Note your <b>Application ID<\/b> and the <b>time limit (days)<\/b> shown.", "note": {"kind": "tip", "label": "Tip:", "html": "For <b>central<\/b> government jobs or admissions you need the <b>central-format<\/b> NCL. Tell the office which one you need."}}, {"phase": "After you apply", "kind": "gov", "who": "Government", "title": "Your papers are checked", "body": "The Tahsil / SDO office checks your caste certificate and 3 years of family income.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Status says <b>sent back<\/b>? Usually one year's income proof is missing or unclear. Upload it and resubmit. <b>No visit needed.<\/b>"}}, {"phase": null, "kind": "gov", "who": "Government", "title": "SDO approves", "body": "The <b>Sub-Divisional Officer (SDO)<\/b>, or the competent officer in your taluka, approves and <b>signs digitally<\/b>.", "note": null}, {"phase": null, "kind": "done", "who": "Done", "title": "Download your certificate", "body": "Log in to Aaple Sarkar and download it. Check the <b>validity date<\/b> printed on it.", "note": {"kind": "stuck", "label": "Stuck?", "html": "Unlike the caste certificate, NCL <b>expires<\/b>. Note the date and renew <b>before<\/b> admission or job forms."}}], "rights_t": "Late? It's your right.", "rights": "If the time limit has passed, yo
